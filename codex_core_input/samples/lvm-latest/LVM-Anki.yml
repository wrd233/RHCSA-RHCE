  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P1
- id: RHCSA-LVM-K04-QA-006
  type: qa
  question: 只看到 `pvcreate`、`vgcreate`、`lvcreate` 都成功，仍缺少哪些关键状态？
  answer: 文件系统、当前挂载、持久挂载与最终数据状态。
  extra: 创建 LVM 对象不等于任务闭环。
  source:
  - RH134
  - RHEL9-LVM
  tags:
