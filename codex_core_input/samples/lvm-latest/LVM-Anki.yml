notes:
- id: RHCSA-LVM-K01-QA-001
  type: qa
  question: 从空闲设备到应用可用目录，完整层级顺序是什么？
  answer: 设备/分区 → PV → VG → LV → 文件系统 → 挂载点。
  extra: 用于定位命令作用层，不要求背长定义。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::process
  - priority::P0
- id: RHCSA-LVM-K01-QA-002
  type: qa
  question: '`pvs`、`vgs`、`lvs` 分别读取哪一层？'
  answer: 分别读取 PV、VG、LV 元数据。
  extra: 文件系统与挂载状态要用 `df`、`findmnt` 等命令。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::comparison
  - priority::P0
- id: RHCSA-LVM-K01-QA-003
  type: qa
  question: LVM 查询命令中的 `-o` 用来做什么？
  answer: 指定输出字段。
  extra: 例如 `vgs -o vg_name,vg_free,vg_free_count`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K01-QA-004
  type: qa
  question: '`lvs` 显示 LV 存在，是否足以证明目录可用？'
  answer: 不足。还要确认文件系统、当前挂载和持久挂载。
  extra: LV 只属于块设备层。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K01-QA-005
  type: qa
  question: '`lvs` 变大而 `df -hT` 不变，优先判断哪一层未完成？'
  answer: 文件系统层未扩展。
  extra: 先确认文件系统类型，再使用对应扩容工具。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K01-QA-006
  type: qa
  question: 目录存在但 `findmnt <目录>` 没有结果，说明什么？
  answer: 该目录当前没有作为挂载点生效。
  extra: 继续写入可能实际占用根文件系统。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O01-QA-001
  type: qa
  question: 查看块设备、文件系统类型和挂载点的高频命令是什么？
  answer: '```bash

    lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

    ```'
  extra: 先确认设备身份，再执行写操作。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-002
  type: qa
  question: 查看 PV 名称、所属 VG、大小和空闲容量的命令是什么？
  answer: '```bash

    pvs -o pv_name,vg_name,pv_size,pv_free

    ```'
  extra: 用于确认候选设备是否已经属于某个 VG。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-003
  type: qa
  question: 查看 VG 的 PE 大小和空闲 extent 数量，推荐什么命令？
  answer: '```bash

    vgs <VG> -o vg_name,vg_free,vg_extent_size,vg_free_count

    ```'
  extra: extent 题优先看 `vg_free_count`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-004
  type: qa
  question: 查看 LV 路径与底层设备映射，推荐什么命令？
  answer: '```bash

    lvs <VG/LV> -o lv_name,vg_name,lv_size,lv_path,devices

    ```'
  extra: 优先查询 `lv_path`，不要凭记忆拼路径。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-005
  type: qa
  question: 确认 `/srv/project` 当前挂载源的命令是什么？
  answer: '```bash

    findmnt /srv/project

    ```'
  extra: 它验证当前挂载，不证明 fstab 一定正确。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-006
  type: qa
  question: 查看 `/srv/project` 文件系统类型、容量与使用率的命令是什么？
  answer: '```bash

    df -hT /srv/project

    ```'
  extra: '`-h` 可读单位，`-T` 显示文件系统类型。'
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O01-QA-007
  type: qa
  question: 只检查一个目录是否为挂载点，可使用什么命令？
  answer: '```bash

    mountpoint /srv/project

    ```'
  extra: 需要知道挂载源时仍优先用 `findmnt`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-K02-QA-001
  type: qa
  question: PE 大小属于 PV、VG 还是 LV？
  answer: VG。
  extra: 通过 `vgcreate -s` 设置。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K02-QA-002
  type: qa
  question: VG 的 PE 为 16 MiB，50 个 extent 对应多少标称容量？
  answer: 800 MiB。
  extra: '`50 × 16 MiB`。'
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::calculation
  - priority::P0
- id: RHCSA-LVM-K02-QA-003
  type: qa
  question: '`lvcreate -l` 与 `lvcreate -L` 的区别是什么？'
  answer: '`-l` 按 extent 数量/百分比；`-L` 按容量。'
  extra: 小写 l 与大写 L 不能混淆。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K02-QA-004
  type: qa
  question: 在扩容命令中，`-l 70` 与 `-l +20` 分别是什么语义？
  answer: 前者把目标总量设为 70 PE；后者在当前基础上增加 20 PE。
  extra: 加号表示增量。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K02-QA-005
  type: qa
  question: 让新 LV 使用 VG 的全部剩余 extent，典型参数是什么？
  answer: '```bash

    -l 100%FREE

    ```'
  extra: 只在题目明确要求使用全部剩余空间时使用。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P1
- id: RHCSA-LVM-K02-QA-006
  type: qa
  question: 让现有 LV 增加 VG 的全部剩余 extent，典型参数是什么？
  answer: '```bash

    -l +100%FREE

    ```'
  extra: '`+` 表示在现有大小上增加。'
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P1
- id: RHCSA-LVM-K02-QA-007
  type: qa
  question: '`vgcreate -s 16M` 中的 `-s` 表示什么？'
  answer: 设置 VG 的 PE 大小为 16 MiB。
  extra: 不是设置 VG 总大小。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-O02-QA-001
  type: qa
  question: 把确认空闲的 `/dev/vdb1` 初始化为 PV，命令是什么？
  answer: '```bash

    pvcreate /dev/vdb1

    ```'
  extra: 会写入 LVM 元数据。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O02-QA-002
  type: qa
  question: 用 `/dev/vdb1` 创建 PE 为 16 MiB 的 `projectvg`，命令是什么？
  answer: '```bash

    vgcreate -s 16M projectvg /dev/vdb1

    ```'
  extra: 参数顺序：选项、VG 名、PV。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O02-QA-003
  type: qa
  question: 在 `projectvg` 中创建 50 个 extent 的 `projectlv`，命令是什么？
  answer: '```bash

    lvcreate -l 50 -n projectlv projectvg

    ```'
  extra: '`-l` 是 extent，`-n` 是 LV 名。'
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O02-QA-004
  type: qa
  question: 在 `projectvg` 中创建 800 MiB 的 `projectlv`，命令是什么？
  answer: '```bash

    lvcreate -L 800M -n projectlv projectvg

    ```'
  extra: 容量题用大写 `-L`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-O02-QA-005
  type: qa
  question: '`lvcreate -n projectlv ...` 中的 `-n` 表示什么？'
  answer: 指定 LV 名称。
  extra: VG 名通常放在命令最后。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-O02-QA-006
  type: qa
  question: 怎样查询新 LV 的真实设备路径？
  answer: '```bash

    lvs projectvg/projectlv -o lv_path

    ```'
  extra: 典型结果是 `/dev/projectvg/projectlv`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-O02-QA-007
  type: qa
  question: '`pvcreate` 会自动创建 VG 或 LV 吗？'
  answer: 不会。
  extra: 需要继续执行 `vgcreate` 和 `lvcreate`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O02-QA-008
  type: qa
  question: 发现 `/dev/vdb1` 已有文件系统或挂载点，应继续 `pvcreate` 吗？
  answer: 不应。先停止并核对设备用途。
  extra: 不要用强制参数覆盖证据。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O02-QA-009
  type: qa
  question: VG 已按错误 PE 创建，能否通过 `lvcreate` 修正 PE？
  answer: 不能。
  extra: PE 是 VG 属性。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O02-QA-010
  type: qa
  question: 创建 PV、VG、LV 后，最小验证组合是什么？
  answer: 分别运行 `pvs`、`vgs`、`lvs`。
  extra: 重点核对 PV 归属、PE/余量、LV 路径与容量。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-O03-QA-001
  type: qa
  question: 在 `/dev/projectvg/projectlv` 上新建 XFS，命令是什么？
  answer: '```bash

    mkfs.xfs /dev/projectvg/projectlv

    ```'
  extra: 仅对无需保留数据的新 LV 使用。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O03-QA-002
  type: qa
  question: 创建挂载点 `/srv/project`，命令是什么？
  answer: '```bash

    mkdir -p /srv/project

    ```'
  extra: 目录存在仍不代表已经挂载。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-O03-QA-003
  type: qa
  question: 读取 LV 上文件系统 UUID，命令是什么？
  answer: '```bash

    blkid /dev/projectvg/projectlv

    ```'
  extra: 也可用 `lsblk -f` 交叉检查。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O03-QA-004
  type: qa
  question: 按 UUID 持久挂载 XFS 到 `/srv/project` 的 fstab 骨架是什么？
  answer: '```fstab

    UUID=<UUID> /srv/project xfs defaults 0 0

    ```'
  extra: UUID 必须替换为本机真实值。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O03-QA-005
  type: qa
  question: '`/etc/fstab` 前四个核心字段是什么？'
  answer: 设备标识、挂载点、文件系统类型、挂载选项。
  extra: 最后两个字段常见为 `0 0`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::syntax
  - priority::P1
- id: RHCSA-LVM-O03-QA-006
  type: qa
  question: 修改 fstab 后，为什么执行 `systemctl daemon-reload`？
  answer: 重新加载由 fstab 生成的 mount units。
  extra: 仍需继续验证和实际挂载。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-O03-QA-007
  type: qa
  question: 重启前检查 fstab 明显问题的命令是什么？
  answer: '```bash

    findmnt --verify

    ```'
  extra: 它不能替代实际挂载测试。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O03-QA-008
  type: qa
  question: 在当前会话中尝试挂载所有尚未挂载的 fstab 条目，命令是什么？
  answer: '```bash

    mount -a

    ```'
  extra: 报错时先修复，不要直接重启。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O03-QA-009
  type: qa
  question: 怎样证明 `/srv/project` 当前由目标 LV 提供？
  answer: '```bash

    findmnt /srv/project

    ```'
  extra: 同时可用 `df -hT` 验证类型与容量。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-O03-QA-010
  type: qa
  question: 为什么扩容现有 XFS 时不能再次执行 `mkfs.xfs`？
  answer: 因为它会重新创建文件系统并破坏数据。
  extra: 扩容使用 `lvextend -r` 或 `xfs_growfs`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O03-QA-011
  type: qa
  question: 使用 UUID 挂载相对 `/dev/vdX` 路径的主要价值是什么？
  answer: 不依赖可能变化的设备枚举顺序。
  extra: UUID 必须来自目标文件系统。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::comparison
  - priority::P1
- id: RHCSA-LVM-O03-QA-012
  type: qa
  question: '`findmnt --verify` 通过且 `mount -a` 无报错，是否足以证明整道 LVM 题完成？'
  answer: 不足。还要核对 PV/VG/LV、文件系统容量、挂载源和题目参数。
  extra: 挂载只是一层。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K03-QA-001
  type: qa
  question: '`lvextend --extents +20` 中的 `--extents` 等价短选项是什么？'
  answer: '`-l`。'
  extra: 小写 l。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K03-QA-002
  type: qa
  question: '`lvextend --size +320M` 中的 `--size` 等价短选项是什么？'
  answer: '`-L`。'
  extra: 大写 L。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P1
- id: RHCSA-LVM-K03-QA-003
  type: qa
  question: '`lvextend --resizefs` 的短选项是什么？'
  answer: '`-r`。'
  extra: 同步扩展受支持的文件系统。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::parameter
  - priority::P0
- id: RHCSA-LVM-K03-QA-004
  type: qa
  question: 给 `projectlv` 增加 20 PE 并同步扩展文件系统，命令是什么？
  answer: '```bash

    lvextend -l +20 -r projectvg/projectlv

    ```'
  extra: 长选项写法也正确。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-K03-QA-005
  type: qa
  question: 给 `projectlv` 增加 320 MiB 并同步扩展文件系统，命令是什么？
  answer: '```bash

    lvextend -L +320M -r projectvg/projectlv

    ```'
  extra: '`+` 表示增量。'
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-K03-QA-006
  type: qa
  question: 让 LV 使用 VG 全部剩余空间并扩展文件系统，命令骨架是什么？
  answer: '```bash

    lvextend -l +100%FREE -r <VG/LV>

    ```'
  extra: 会消耗全部空闲 extent。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P1
- id: RHCSA-LVM-K03-QA-007
  type: qa
  question: 已单独扩大 LV，扩展已挂载 XFS 的命令骨架是什么？
  answer: '```bash

    xfs_growfs <MOUNT_POINT>

    ```'
  extra: 参数是挂载点，例如 `/srv/project`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-K03-QA-008
  type: qa
  question: XFS 文件系统能否原地缩小？
  answer: 不能。
  extra: XFS 支持增长，不支持缩小。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K03-QA-009
  type: qa
  question: 为什么不能先执行 `lvreduce` 再处理 XFS？
  answer: 会截断文件系统仍在使用的块，导致数据损坏。
  extra: XFS 没有原地缩容路径。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O04-QA-001
  type: qa
  question: 扩容前确认 VG 是否至少还有 20 个空闲 PE，应看哪个字段？
  answer: '`vg_free_count`。'
  extra: 使用 `vgs ... -o vg_free_count`。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::output
  - priority::P0
- id: RHCSA-LVM-O04-QA-002
  type: qa
  question: 扩容前确认挂载点对应哪个 LV，首选什么命令？
  answer: '```bash

    findmnt /srv/project

    ```'
  extra: 不要从目录名猜 LV 名。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O04-QA-003
  type: qa
  question: 为了验证扩容保留数据，扩容前后可使用什么轻量证据？
  answer: 对标记文件计算并比较 `sha256sum`。
  extra: 容量正确不能单独证明数据保留。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P1
- id: RHCSA-LVM-O04-QA-004
  type: qa
  question: 扩容后至少用哪两条命令证明 LV 和文件系统都增长？
  answer: '`lvs <VG/LV>` 与 `df -hT <MOUNT_POINT>`。'
  extra: 分别验证块设备层与文件系统层。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-O04-QA-005
  type: qa
  question: 扩容后为什么还要运行 `findmnt <MOUNT_POINT>`？
  answer: 确认目录仍挂载到目标文件系统。
  extra: 防止数据落入未挂载的普通目录。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-O05-QA-001
  type: qa
  question: VG 空间不足时，把 `/dev/vdc1` 加入 `projectvg` 的命令序列是什么？
  answer: '```bash

    pvcreate /dev/vdc1

    vgextend projectvg /dev/vdc1

    ```'
  extra: 先 PV，后加入 VG。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::command
  - priority::P0
- id: RHCSA-LVM-O05-QA-002
  type: qa
  question: '`vgextend` 的典型参数顺序是什么？'
  answer: '`vgextend <VG> <PV>`。'
  extra: 目标 VG 在前，新 PV 在后。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::syntax
  - priority::P0
- id: RHCSA-LVM-O05-QA-003
  type: qa
  question: 能否把尚未加入 VG 的新设备直接交给 `lvextend`？
  answer: 不能。
  extra: LV 只能使用所属 VG 的空闲 extent。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-O05-QA-004
  type: qa
  question: '`vgextend` 后，如何验证新设备已进入目标 VG？'
  answer: 用 `pvs` 看 PV 归属，再用 `vgs` 看 VG 总量和空闲 PE。
  extra: 两层都要确认。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-O05-QA-005
  type: qa
  question: 候选设备已经属于其他 VG，应使用强制参数重建吗？
  answer: 不应。
  extra: 停止并核对设备用途。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K04-QA-001
  type: qa
  question: 症状：`lvextend` 报 insufficient free space。第一条查询应指向哪一层？
  answer: VG 层：查询 `vg_free`/`vg_free_count`。
  extra: 不要继续重复扩容。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K04-QA-002
  type: qa
  question: 症状：`mount -a` 报 UUID 不存在。优先核对什么？
  answer: 用 `blkid`/`lsblk -f` 核对 fstab 中的 UUID。
  extra: 不要重建文件系统来获得新 UUID。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K04-QA-003
  type: qa
  question: 症状：`/srv/project` 有数据，但 `findmnt` 无结果。最可能的数据落在哪里？
  answer: 根文件系统中的普通目录 `/srv/project`。
  extra: 先停止写入并恢复正确挂载。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K04-QA-004
  type: qa
  question: 症状：`lvs` 为 1120 MiB，`df` 仍约 800 MiB。下一步是什么？
  answer: 扩展文件系统；XFS 可运行 `xfs_growfs <挂载点>`。
  extra: 先确认文件系统类型。
  source:
  - RH134
  - RHEL9-LVM
  tags:
  - exam::rhcsa
  - chapter::lvm
  - card::diagnosis
  - priority::P0
- id: RHCSA-LVM-K04-QA-005
  type: qa
  question: '`lvremove`、`vgremove`、`pvremove` 应当被视为什么类型的操作？'
  answer: 破坏性删除操作。
  extra: 不是通用排错手段。
  source:
