  - chapter::lvm
  - card::verification
  - priority::P0
- id: RHCSA-LVM-K05-QA-001
  type: qa
  question: 一项 LVM 任务的最小分层验收顺序是什么？
  answer: '`pvs/vgs/lvs` → `findmnt/df` → `fstab` 验证 → 数据检查。'
  extra: 先验收容量对象，再验收文件系统与持久关系。
  source:
