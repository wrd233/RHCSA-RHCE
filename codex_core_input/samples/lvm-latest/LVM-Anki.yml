  type: qa
  question: 任务：创建并持久挂载新 LVM 文件系统，流程骨架是什么？
  answer: 调查设备 → PV → VG → LV → mkfs → UUID/fstab → verify/mount → 分层验收。
  extra: 每一步都应有对应查询。
