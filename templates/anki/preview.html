<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} - Anki 预览</title>
  <link rel="stylesheet" href="{{ css_uri }}">
</head>
<body>
  <main class="preview-shell">
    <h1>{{ title }} - Anki 预览</h1>
    <p class="preview-meta">共 {{ notes | length }} 条有效 Note；本页面不显示来源、稳定 ID 与标签。</p>
    {% for note in notes %}
    <article class="note-preview">
      <section class="card-face front"><div class="face-name">正面</div>{{ note.front | safe }}</section>
      <section class="card-face back"><div class="face-name">背面</div>{{ note.back | safe }}</section>
    </article>
    {% endfor %}
  </main>
</body>
</html>
