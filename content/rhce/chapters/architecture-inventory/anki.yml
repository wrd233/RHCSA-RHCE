notes:
- id: RHCE-INVENTORY-QA-001
  type: qa
  question: 查看 Ansible 当前使用的配置文件，最直接看什么？
  answer: '`ansible --version` 输出中的 config file。'
  extra: 再用 config dump 看有效差异。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::ansible
  - priority::P0
- id: RHCE-INVENTORY-QA-002
  type: qa
  question: 显示非默认有效配置的命令是什么？
  answer: '`ansible-config dump --only-changed`'
  extra: 用于发现配置漂移。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::ansible
  - priority::P0
- id: RHCE-INVENTORY-QA-003
  type: qa
  question: 以树形展示 Inventory 组关系用什么？
  answer: '`ansible-inventory --graph`'
  extra: 不能证明连接。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::ansible
  - priority::P0
- id: RHCE-INVENTORY-QA-004
  type: qa
  question: 展开某主机最终 Inventory 变量用什么？
  answer: '`ansible-inventory --host <HOST>`'
  extra: 观察 hostvars 合并。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::ansible
  - priority::P0
- id: RHCE-INVENTORY-QA-005
  type: qa
  question: Inventory 名称与 ansible_host 的区别是什么？
  answer: 前者是逻辑 inventory_hostname，后者是连接地址。
  extra: 模板中常需区分。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::comparison
  - priority::P0
- id: RHCE-INVENTORY-QA-006
  type: qa
  question: children 组的 ini 标题骨架是什么？
  answer: '`[parent:children]`'
  extra: 下面列子组名。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::syntax
  - priority::P0
- id: RHCE-INVENTORY-QA-007
  type: qa
  question: 验证 pattern 实际匹配主机用什么？
  answer: '`ansible <PATTERN> --list-hosts`'
  extra: 在执行前使用。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::verification
  - priority::P0
- id: RHCE-INVENTORY-QA-008
  type: qa
  question: ansible.builtin.ping 证明什么？
  answer: 控制端能通过连接执行 Python 模块并返回 pong。
  extra: 不证明 ICMP 或 become。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::verification
  - priority::P0
- id: RHCE-INVENTORY-QA-009
  type: qa
  question: 验证 become 到 root 的最小 ad hoc 命令骨架是什么？
  answer: '`ansible <PATTERN> -b -m ansible.builtin.command -a ''id -u''`'
  extra: 预期输出 0。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::ansible
  - priority::P0
- id: RHCE-INVENTORY-QA-010
  type: qa
  question: pattern 匹配 0 主机首先查什么？
  answer: Inventory 路径、graph、组名和 --list-hosts。
  extra: 不先查 SSH。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::diagnosis
  - priority::P0
- id: RHCE-INVENTORY-QA-011
  type: qa
  question: UNREACHABLE 首先查哪一层？
  answer: SSH 地址、用户、密钥、主机密钥和网络。
  extra: 用 -vvv 与同身份 ssh。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::diagnosis
  - priority::P0
- id: RHCE-INVENTORY-QA-012
  type: qa
  question: ping 成功但权限失败下一步是什么？
  answer: 检查 become 配置和远端 sudo 授权。
  extra: 连接层已成立。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::diagnosis
  - priority::P0
- id: RHCE-INVENTORY-QA-013
  type: qa
  question: 为什么不把口令放入 ansible.cfg/Inventory？
  answer: 会明文泄露且扩大项目暴露面。
  extra: 使用 Vault 或题目安全入口。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::diagnosis
  - priority::P0
- id: RHCE-INVENTORY-QA-014
  type: qa
  question: RHCE 项目执行前的证据链是什么？
  answer: 配置来源 → Inventory 图/变量 → pattern → SSH/Python → become。
  extra: 再进入业务模块。
  source:
  - RH294-RHEL9
  - RHCE-Course-00-03
  - RHCE9-Mock
  tags:
  - exam::rhce
  - chapter::architecture-inventory
  - card::process
  - priority::P0
