- id: RHCE-COMPREHENSIVE-QA-003
  type: qa
  question: 如何证明主机覆盖？
  answer: inventory graph 与 playbook --list-hosts 对照题目。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
