- id: RHCE-COMPREHENSIVE-QA-002
  type: qa
  question: 为什么 recap 不能发现 Inventory 漏主机？
  answer: 未匹配主机根本不会进入执行。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
