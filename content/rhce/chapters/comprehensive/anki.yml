- id: RHCE-COMPREHENSIVE-QA-004
  type: qa
  question: 为什么先 limit 代表主机？
  answer: 降低批量错误并暴露运行时问题。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
  - card::diagnosis
  - priority::P0
- id: RHCE-COMPREHENSIVE-QA-005
  type: qa
  question: 何时扩展全组？
  answer: 代表主机远端终态正确后。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
  - card::ansible
  - priority::P0
- id: RHCE-COMPREHENSIVE-QA-006
  type: qa
  question: 全量第一次后做什么？
  answer: 远端矩阵验收并再次全量检查幂等。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCE-COMPREHENSIVE-QA-007
  type: qa
  question: 秘密安全验收包含什么？
  answer: Vault 保持密文、密码入口权限、no_log、输出无明文。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
  - card::verification
  - priority::P0
- id: RHCE-COMPREHENSIVE-QA-008
  type: qa
  question: Role 共享变化后怎么验收？
  answer: 回归所有消费组，不复制分叉。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCE-COMPREHENSIVE-QA-009
  type: qa
  question: 系统状态映射原则？
  answer: 优先专用模块/System Role，shell 只补明确缺口。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
