- id: RHCE-COMPREHENSIVE-QA-010
  type: qa
  question: 第二次 0 changed 能否证明正确？
  answer: 不能，仍需主机覆盖和远端功能。
  extra: ''
  source:
  - RH294-RHEL9
  - RHCE9-Mock
  - Ansible-Documentation
  tags:
  - exam::rhce
  - chapter::comprehensive
