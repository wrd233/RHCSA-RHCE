notes:
- id: RHCSA-FILESYSTEMS-QA-001
  type: qa
  question: 写操作前查看块设备拓扑、类型、UUID 与挂载点的命令是什么？
  answer: '`lsblk -o NAME,PATH,SIZE,TYPE,FSTYPE,UUID,MOUNTPOINTS`'
  extra: 设备名相似时必须重查。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-002
  type: qa
  question: '`wipefs /dev/vdb` 与 `wipefs -a /dev/vdb` 的区别是什么？'
  answer: 前者列签名；后者擦除签名。
  extra: 调查时不得加 -a。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::comparison
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-003
  type: qa
  question: 为什么 FSTYPE 为空不能充分证明设备安全空闲？
  answer: 设备仍可能有未识别数据、分区表或上层归属。
  extra: 继续查挂载、LVM/RAID 和题意。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-004
  type: qa
  question: 在新磁盘建立 GPT 的 parted 命令骨架是什么？
  answer: '`parted -s <DISK> mklabel gpt`'
  extra: 会重写分区布局。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-005
  type: qa
  question: 创建约 2 GiB 分区并预留对齐空间的骨架是什么？
  answer: '`parted -s <DISK> mkpart data xfs 1MiB 2049MiB`'
  extra: mkpart 不创建 XFS。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-006
  type: qa
  question: 请求内核重读分区表并等待设备事件，使用什么？
  answer: '`partprobe <DISK>`；`udevadm settle`。'
  extra: 再用 lsblk 验证。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-007
  type: qa
  question: '`mkfs.xfs` 的作用与风险是什么？'
  answer: 在块设备上新建 XFS，会覆盖原文件系统结构。
  extra: 只对确认无需保留数据的新对象使用。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-008
  type: qa
  question: XFS 与 ext4 的缩小边界是什么？
  answer: XFS 不支持原地缩小；ext4 可在满足条件时缩小。
  extra: 创建题按指定类型。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::comparison
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-009
  type: qa
  question: 读取文件系统或 Swap UUID 的命令是什么？
  answer: '`blkid <DEVICE>`'
  extra: UUID 必须来自当前签名。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-010
  type: qa
  question: fstab 六字段顺序是什么？
  answer: 设备、挂载点、类型、选项、dump、fsck pass。
  extra: 各字段共同描述持久策略。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::syntax
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-011
  type: qa
  question: 为什么不应默认给 fstab 添加 `nofail`？
  answer: 它改变启动失败处理，可能掩盖本应修复的错误。
  extra: 仅按题意使用。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-012
  type: qa
  question: 修改 fstab 后的重启前验证链是什么？
  answer: '`daemon-reload` → `findmnt --verify` → `mount -a` → `findmnt`。'
  extra: 静态检查不替代实际挂载。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::process
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-013
  type: qa
  question: '`findmnt /srv/data` 与 `df -hT /srv/data` 分别证明什么？'
  answer: 挂载源/类型/选项；文件系统容量与使用率。
  extra: 两个层次。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::verification
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-014
  type: qa
  question: Swap 的三层状态是什么？
  answer: mkswap 签名、swapon 当前启用、fstab 持久条目。
  extra: 任一层不能替代其余。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::process
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-015
  type: qa
  question: 创建 Swap 签名并当前启用的命令是什么？
  answer: '`mkswap <DEV>`；`swapon <DEV>`。'
  extra: 先确认设备空闲。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::command
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-016
  type: qa
  question: Swap fstab 条目骨架是什么？
  answer: '`UUID=<UUID> none swap defaults 0 0`'
  extra: 使用真实 UUID。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::syntax
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-017
  type: qa
  question: 查看具体 Swap 设备、大小和优先级，使用什么？
  answer: '`swapon --show`'
  extra: free -h 不直接列设备。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::verification
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-018
  type: qa
  question: Swap USED=0 是否表示没有启用？
  answer: 不是；可能已启用但当前无需换出页面。
  extra: 看 swapon --show。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::output
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-019
  type: qa
  question: umount 报 target is busy 的下一步是什么？
  answer: 查嵌套挂载和 `fuser -vm <MOUNT>`/lsof。
  extra: 不先 force/lazy。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-020
  type: qa
  question: 挂载到非空目录后原内容怎样？
  answer: 被新挂载暂时遮蔽，卸载后重新出现。
  extra: 不是自动删除。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::concept
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-021
  type: qa
  question: fstab 报 UUID 不存在时怎样处理？
  answer: 用 blkid/lsblk -f 核对当前 UUID，修正条目后重新 verify/mount。
  extra: 不要重新格式化。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-022
  type: qa
  question: 目录存在但 findmnt 无结果，数据可能写到哪里？
  answer: 根文件系统中的普通目录。
  extra: 停止写入并恢复挂载。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-023
  type: qa
  question: 分区、文件系统与 Swap 综合任务的验收骨架是什么？
  answer: 布局 → 签名/UUID → 当前 mount/swapon → fstab → 容量/写入。
  extra: 逐层验证。
  source:
  - RH134-RHEL9
  - RHCSA-Course-21
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::partitions-filesystems
  - card::process
  - priority::P0
