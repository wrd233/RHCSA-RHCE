- id: RHCSA-06-O01-QA-003
  type: qa
  question: 复制一个关键配置文件后，如何分别验证内容和目标模式？
  answer: '```bash

    sha256sum SOURCE TARGET

    stat -c "%a %U %G %n" TARGET

    ```'
  extra: 摘要检查字节；`stat` 检查模式、所有者和组。
