- id: RHCSA-06-K01-QA-006
  type: qa
  question: '`cp -a` 或 `rsync -a` 已写入命令，为什么仍要在目标端验证属性？'
  answer: 因为保留选项表达的是保留意图；执行身份、目标文件系统、协议和工具选项决定属性能否实际落地。
  extra: 尤其是所有者、ACL、扩展属性和 SELinux 上下文。
