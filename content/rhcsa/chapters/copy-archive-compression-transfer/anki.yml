  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-06-K02-QA-005
  type: qa
  question: '`tar -tf archive.tar.xz` 能证明什么？'
  answer: 能非破坏性列出归档成员名称，帮助检查顶层、路径前缀和成员集合。
  extra: 它不能证明提取后所有字节和元数据都符合要求。
  source:
