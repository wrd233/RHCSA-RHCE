  semantic_type: diagnosis
- id: RHCSA-06-D01-QA-005
  type: qa
  question: 归档扩展名为 `.tar.gz`，但 `file` 显示 xz 数据。应信任哪个证据？
  answer: 信任实际格式检测和归档读取结果，不只信任文件名后缀。
  extra: 可纠正后缀或使用与实际格式匹配的工具。
  source:
