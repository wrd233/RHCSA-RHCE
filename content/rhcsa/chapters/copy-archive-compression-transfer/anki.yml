- id: RHCSA-06-T01-QA-002
  type: qa
  question: 经典归档任务中，为什么必须检查 `.release-env`？
  answer: 它验证隐藏成员没有因使用 `*` 或错误集合边界而遗漏。
  extra: 可用 `tar -tf` 精确查找成员。
  source:
  - RH124 Ch.13 pp.431-438
  - tar(1)
  - GNU tar manual
