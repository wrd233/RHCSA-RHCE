  semantic_type: process
- id: RHCSA-06-T02-QA-001
  type: qa
  question: 源 `/srv/site/` 的内容必须直接进入远端 `.../site/`，rsync 源路径应怎样写？
  answer: 写成 `/srv/site/`，保留末尾斜杠。
  extra: 否则可能形成 `site/site/`。
  source:
