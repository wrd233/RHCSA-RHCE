- id: RHCSA-06-D01-QA-006
  type: qa
  question: 传输后远端文件大小为 0，客户端命令却退出 0。下一步应先检查什么？
  answer: 确认比较的是正确远端路径和正确用户，再查看传输源大小、目标 `stat` 和相关客户端输出。
  extra: 不要先假设网络正常或文件内容正确。
  source:
  - RH124 Ch.13 pp.439-444
  - scp(1)
  - sftp(1)
  - RHEL 9 OpenSSH documentation
