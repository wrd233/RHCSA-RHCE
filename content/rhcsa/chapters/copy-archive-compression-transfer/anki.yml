- id: RHCSA-06-O01-QA-008
  type: qa
  question: 移动完成后，只看到目标路径存在是否足够？
  answer: 不够。还应确认源路径是否按要求消失，并验证目标内容和必要元数据。
  extra: 跨文件系统移动尤其不能只看目标出现。
