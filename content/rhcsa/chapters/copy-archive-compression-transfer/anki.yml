- id: RHCSA-06-O05-QA-009
  type: qa
  question: 为什么普通远端用户执行 `rsync -a` 时不一定能保留源 root 所有者？
  answer: 因为目标端设置任意 UID/GID 所有者需要足够权限。
  extra: 题目未要求所有者映射时，不要把偶然源所有者扩大为验收目标。
