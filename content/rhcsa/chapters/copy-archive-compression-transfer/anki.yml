- id: RHCSA-06-O05-QA-010
  type: qa
  question: 把本地 `/srv/site/` 的内容直接同步到远端 `/home/student/stage/site/`，先预览的命令是什么？
  answer: '```bash

    rsync -ani /srv/site/ student@serverb:/home/student/stage/site/

    ```'
  extra: 源和目标都带目录语义，源末尾斜杠确保不生成 `site/site/`。
