- id: RHCSA-06-K01-QA-004
  type: qa
  question: 一条复制命令退出状态为 0，至少还应验证哪些层次？
  answer: 目标层级和类型、成员集合、普通文件字节，以及任务要求的模式、所有者、组和时间戳；远端任务还应验证远端实际落点。
  extra: 退出状态只证明命令按自身规则完成，不证明交付终态。
  source:
