- id: RHCSA-06-O01-QA-007
  type: qa
  question: 同一文件系统内 `mv` 与跨文件系统 `mv` 的故障边界有何不同？
  answer: 同一文件系统通常主要是重命名目录项；跨文件系统通常需要复制目标再删除源，失败时可能出现目标已部分存在而源仍在。
  extra: 重要跨文件系统移动后应同时检查两端。
  source:
