- id: RHCSA-FILES-O04-QA-002
  type: qa
  question: '`tar` 的 `-z`、`-j`、`-J` 分别选择哪种压缩算法？'
  answer: '`-z` 为 gzip，`-j` 为 bzip2，`-J` 为 xz。'
  extra: 注意 `j` 与 `J` 大小写。
