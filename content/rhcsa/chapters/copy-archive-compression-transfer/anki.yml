- id: RHCSA-06-K01-QA-003
  type: qa
  question: 文件的 SHA-256 相同，能否证明它们权限、所有者和时间戳也相同？
  answer: 不能。SHA-256 只证明被比较的字节内容相同。
  extra: 使用 `stat`、ACL/xattr 工具或其他目标端证据检查元数据。
  source:
