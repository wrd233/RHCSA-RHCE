- id: RHCSA-06-K02-QA-007
  type: qa
  question: 在 `/srv` 下归档 `app` 与进入 `/srv/app` 后归档 `.`，成员顶层有什么区别？
  answer: 前者成员以 `app/` 开头；后者通常以 `./` 开头，不会自动保留名为 `app` 的顶层。
  extra: 任务要求固定顶层时，从父目录归档。
  source:
