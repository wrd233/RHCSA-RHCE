- id: RHCSA-06-O03-QA-001
  type: qa
  question: 从 `/srv` 创建包含 `app/` 顶层的 xz 压缩归档 `/root/app.tar.xz`，命令是什么？
  answer: '```bash

    tar -C /srv -cJf /root/app.tar.xz app

    ```'
  extra: 成员以 `app/...` 开头，不保存 `/srv/app` 的绝对路径。
