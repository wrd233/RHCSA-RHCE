- id: RHCSA-06-K01-QA-005
  type: qa
  question: 复制目录前，哪条证据最能区分“目标不存在、目标是文件、目标是目录”？
  answer: '`stat -- TARGET`，或使用 `test -e/-f/-d` 分别判断。'
  extra: 目标存在状态会改变源操作数的最终层级解释。
