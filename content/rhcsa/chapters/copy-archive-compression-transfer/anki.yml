- id: RHCSA-06-D01-QA-003
  type: qa
  question: 文件摘要相同但应用提示权限拒绝，下一条最有区分度的证据是什么？
  answer: '`stat` 比较源和目标的类型、模式、所有者和组；必要时再检查 ACL 和 SELinux 上下文。'
  extra: 摘要已经排除了普通文件字节差异。
  source:
  - stat(1)
  - getfacl(1)
  - ls(1)
