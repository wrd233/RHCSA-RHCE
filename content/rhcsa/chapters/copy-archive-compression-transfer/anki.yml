- id: RHCSA-FILES-K01-QA-007
  type: qa
  question: '`sha256sum` 能证明什么，不能证明什么？'
  answer: 它能高置信度证明被比较的字节是否相同；不能证明路径、模式、所有者、时间戳、ACL、SELinux 上下文或来源真实性。
  extra: 这是从旧章保留的稳定提取目标。
  source:
