- id: RHCSA-06-O01-QA-005
  type: qa
  question: '`cp -i` 适合什么场景，为什么通常不适合无人值守脚本？'
  answer: 它适合人工操作时在覆盖前询问；无人值守时交互提示会使结果不确定或阻塞。
  extra: 脚本应使用可预测的目标检查和明确覆盖策略。
