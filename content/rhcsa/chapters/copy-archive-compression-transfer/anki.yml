- id: RHCSA-06-O04-QA-010
  type: qa
  question: 什么时候更适合用 `sftp`，什么时候更适合用 `rsync`？
  answer: 需要交互式浏览、选择和上传下载时用 `sftp`；需要重复同步目录差异、属性策略和预览时用 `rsync`。
  extra: 一次性简单文件复制也可使用 `scp`。
