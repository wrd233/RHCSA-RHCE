- id: RHCSA-06-D01-QA-002
  type: qa
  question: 归档顶层是 `./`，但任务要求 `app/`。最小修复是什么？
  answer: 从源目录父级重新创建，或使用 `tar -C PARENT ... app`。
  extra: 不要在提取后用移动操作掩盖错误归档结构。
  source:
