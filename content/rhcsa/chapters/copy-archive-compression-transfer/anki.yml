- id: RHCSA-06-T02-QA-002
  type: qa
  question: 远端 `remote-note.txt` 必须保留，经典同步任务为何不能使用 `--delete`？
  answer: 因为 `--delete` 会把目标端不在源集合中的额外成员作为删除候选，与题目终态冲突。
  extra: 删除选项必须来自明确镜像需求。
  source:
  - RH124 Ch.13 pp.445-450
  - rsync(1)
