- id: RHCSA-06-D01-QA-007
  type: qa
  question: '`install` 后文件终态正确，但服务未读取新配置。本章能否直接给出关闭 SELinux或重启所有服务的答案？'
  answer: 不能。应把问题交给服务、日志和 SELinux 对应章节，基于应用证据继续调查。
  extra: 文件部署正确只排除了一层问题。
  source:
  - install(1)
  tags:
