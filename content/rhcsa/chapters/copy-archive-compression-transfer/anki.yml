  semantic_type: output
- id: RHCSA-FILES-O04-QA-004
  type: qa
  question: 不提取内容，查看 xz 压缩 tar 归档成员的命令是什么？
  answer: '```bash

    tar -tf archive.tar.xz

    ```'
  extra: 现代 tar 通常能自动识别压缩类型；保留旧 ID。
