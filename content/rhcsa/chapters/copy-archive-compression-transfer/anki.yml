  type: qa
  question: '`stat -c "%F %N" link` 显示对象是 symbolic link。复制目录树时首先要决定什么？'
  answer: 决定要复制链接对象本身，还是解引用并复制其指向内容。
  extra: 无意解引用可能把源集合之外的大量内容带入目标。
