- id: RHCSA-06-O05-QA-011
  type: qa
  question: rsync 能否在一条普通命令中让源和目标都为两个不同的远端主机？
  answer: 不能。普通远端语法要求至少一端是本地执行环境。
  extra: 需要跨远端搬运时应重新设计执行位置或中转流程。
