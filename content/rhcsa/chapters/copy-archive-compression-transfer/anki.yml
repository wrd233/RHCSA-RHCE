  type: qa
  question: '`-H`、`-A`、`-X` 分别保留什么？'
  answer: '`-H` 保留硬链接关系，`-A` 保留 ACL，`-X` 保留扩展属性。'
  extra: SELinux 文件上下文通常存储在扩展属性中。
