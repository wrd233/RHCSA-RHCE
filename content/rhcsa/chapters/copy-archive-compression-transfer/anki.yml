- id: RHCSA-06-O03-QA-007
  type: qa
  question: 为什么归档验收应包含“试提取到空目录”？
  answer: 因为成员列表正确仍不能完全证明归档可按预期恢复；空目录试提取能验证实际层级、类型和恢复行为，同时避免覆盖业务路径。
  extra: 试提取后仍需比较字节和关键元数据。
