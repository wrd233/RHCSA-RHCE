- id: RHCSA-06-K02-QA-010
  type: qa
  question: root 与普通用户提取同一归档时，所有者恢复有什么常见差异？
  answer: root 通常能够恢复归档记录的所有者；普通用户提取后通常由该用户拥有文件。
  extra: 具体模式还会受到 umask 和保留权限选项影响。
  source:
