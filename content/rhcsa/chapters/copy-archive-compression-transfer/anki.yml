- id: RHCSA-06-T02-QA-003
  type: qa
  question: 经典同步任务执行后的验收至少包括哪些证据？
  answer: 第二次 dry-run、远端目录层级、额外文件仍存在、关键文件摘要、模式和修改时间。
  extra: 每条证据回答不同层次。
  source:
