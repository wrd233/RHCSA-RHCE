  type: qa
  question: '`gzip -l` 或 `xz -l` 的输出能否证明 tar 成员正确？'
  answer: 不能。它们主要显示压缩和未压缩大小等外层信息。
  extra: 成员集合仍用 `tar -tf` 检查。
