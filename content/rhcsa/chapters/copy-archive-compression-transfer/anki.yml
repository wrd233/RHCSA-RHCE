- id: RHCSA-06-O05-QA-012
  type: qa
  question: dry-run 计划在目标创建 `source/` 子目录，但任务要求内容直接进入目标。最可能的修复是什么？
  answer: 在源目录路径末尾加 `/`，并重新 dry-run。
  extra: 不要执行后再盲目移动目录层级。
