- id: RHCSA-FILES-O04-QA-003
  type: qa
  question: '`tar -C /srv -cf app.tar app` 中 `-C /srv` 的作用是什么？'
  answer: 让后续成员路径从 `/srv` 解释，因此归档成员以 `app/...` 开头。
  extra: '`-C` 具有位置语义，只影响其后的路径参数。'
