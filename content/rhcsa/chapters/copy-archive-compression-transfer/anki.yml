- id: RHCSA-06-O03-QA-002
  type: qa
  question: 创建 gzip 和 bzip2 压缩 tar 归档的参数组合分别是什么？
  answer: gzip 使用 `-czf`，bzip2 使用 `-cjf`。
  extra: xz 使用 `-cJf`。
