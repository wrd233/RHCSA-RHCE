- id: RHCSA-06-O04-QA-012
  type: qa
  question: 远端目录递归传输后，除了摘要还必须检查什么高频问题？
  answer: 检查目标是否多包一层目录、隐藏成员是否存在，以及关键模式和时间是否满足要求。
  extra: 目录树不是单个字节对象。
