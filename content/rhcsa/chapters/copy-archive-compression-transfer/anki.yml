- id: RHCSA-FILES-O04-QA-007
  type: qa
  question: 为什么 `rsync --delete` 必须先 dry-run？
  answer: 因为它会删除目标端在可见源集合中不存在的成员；源根、目标或排除规则错误时可能造成大规模误删。
  extra: 只在题目明确要求精确镜像时使用；保留旧 ID。
