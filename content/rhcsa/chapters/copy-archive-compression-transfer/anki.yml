  semantic_type: security
- id: RHCSA-06-K02-QA-009
  type: qa
  question: tar 默认是否一定保存 ACL、扩展属性和 SELinux 上下文？
  answer: 不一定。通常需显式使用 `--acls`、`--xattrs` 和 `--selinux` 等选项。
  extra: 保存后仍需在目标端用对应工具验证恢复结果。
  source:
