- id: RHCSA-06-O01-QA-001
  type: qa
  question: 把 `/srv/source/` 的全部成员（包括隐藏成员）直接复制到已有 `/srv/destination/`，常用命令是什么？
  answer: '```bash

    cp -a /srv/source/. /srv/destination/

    ```'
  extra: '`SOURCE/.` 避免 `SOURCE/*` 漏掉点号开头的成员。'
