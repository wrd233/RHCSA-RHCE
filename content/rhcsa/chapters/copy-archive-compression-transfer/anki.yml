- id: RHCSA-06-D01-QA-004
  type: qa
  question: rsync dry-run 计划删除大量文件时，最小安全动作是什么？
  answer: 停止实际执行，重新确认源集合、目标路径、末尾斜杠、排除规则和删除授权。
  extra: 不能用 `--force` 或直接执行来“看结果”。
  source:
  - RH124 Ch.13 pp.445-450
  - rsync(1)
