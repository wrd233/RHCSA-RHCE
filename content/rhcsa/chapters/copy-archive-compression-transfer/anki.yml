- id: RHCSA-06-O01-QA-002
  type: qa
  question: '`cp -R` 与 `cp -a` 的主要区别是什么？'
  answer: '`-R` 主要提供递归复制；`-a` 在递归基础上请求尽可能保留链接、模式、所有权、时间戳和扩展属性等归档语义。'
  extra: '`-a` 仍不替代目标端属性验证。'
