- id: RHCSA-06-K02-QA-004
  type: qa
  question: 归档与压缩的本质区别是什么？
  answer: 归档把多个成员及其元数据组织成一个成员序列；压缩只改变一个文件或字节流的表示大小。
  extra: 多文件目录通常先 tar，再选择 gzip/bzip2/xz。
  source:
  - RH124 Ch.13 pp.431-438
  - tar(1)
  - GNU tar manual
  tags:
