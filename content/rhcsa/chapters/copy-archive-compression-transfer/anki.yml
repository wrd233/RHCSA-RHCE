- id: RHCSA-06-O05-QA-013
  type: qa
  question: 每次 rsync 都反复显示同一个文件变化，下一步先比较什么？
  answer: 比较两端文件大小、精确修改时间，确认文件是否持续被写入，并检查两端时钟和文件系统时间精度。
  extra: 不要直接用更激进的校验掩盖持续写入。
