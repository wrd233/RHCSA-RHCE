- id: RHCSA-06-O04-QA-011
  type: qa
  question: RHEL 9 中，为什么不能把“`scp` 命令”简单等同于“旧 SCP 协议”？
  answer: 因为 RHEL 9 的 OpenSSH `scp` 默认使用 SFTP 协议后端；旧 SCP 协议是兼容路径。
  extra: 这是版本敏感事实，命令界面和底层协议应分开理解。
  source:
