- id: RHCSA-06-O05-QA-003
  type: qa
  question: '`rsync -a` 常见地保留哪些方面，又不默认包含哪些高价值属性？'
  answer: 它提供递归并保留链接、模式、时间、组、所有者和设备等常用归档语义；硬链接、ACL 和扩展属性分别通常需 `-H`、`-A`、`-X`。
  extra: 是否能实际保留还受目标端权限和文件系统影响。
