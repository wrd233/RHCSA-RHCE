- id: RHCSA-06-K01-QA-002
  type: qa
  question: “复制目录本身”和“复制目录内容”有什么终态差异？
  answer: 复制目录本身会在目标下形成源目录这一层；复制目录内容则让源的成员直接进入既定目标目录。
  extra: 执行前应先写出预期目录树，不能只看命令是否包含斜杠。
  source:
  - RH124 Ch.3
  - RH124 Ch.13
