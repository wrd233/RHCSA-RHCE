- id: RHCSA-06-O03-QA-003
  type: qa
  question: 为什么不能用 `gzip directory` 代替目录归档？
  answer: gzip 主要压缩单个文件或流，不负责把目录树组织成多个可列出和恢复的成员。
  extra: 目录应先用 tar 归档。
