- id: RHCSA-FILES-O04-QA-006
  type: qa
  question: 在不实际修改目标的情况下预览 rsync 同步，命令骨架是什么？
  answer: '```bash

    rsync -ani SOURCE/ DESTINATION/

    ```'
  extra: '`-n` dry-run，`-i` 逐项显示变化；保留旧 ID。'
