- id: RHCSA-06-O06-QA-004
  type: qa
  question: 如何对两个目录的普通文件建立可比较的稳定摘要视图？
  answer: 在各自目录根中，用 `find . -type f -print0 | sort -z | xargs -0 sha256sum` 生成相对路径排序的清单，再比较清单。
  extra: 该方法不检查目录、符号链接和元数据。
