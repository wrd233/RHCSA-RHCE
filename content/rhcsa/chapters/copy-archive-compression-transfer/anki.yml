- id: RHCSA-FILES-O04-QA-005
  type: qa
  question: '`rsync -a /source /target/` 与 `rsync -a /source/ /target/` 的结果区别是什么？'
  answer: 前者通常在目标中创建 `source/` 子目录；后者把 source 的内容直接同步到目标目录。
  extra: 保留旧 ID；末尾斜杠定义同步根。
  source:
  - RH124 Ch.13 pp.445-450
