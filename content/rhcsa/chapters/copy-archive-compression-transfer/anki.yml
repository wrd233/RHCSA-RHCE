- id: RHCSA-06-K01-QA-001
  type: qa
  question: 复制或同步一个数据集合时，至少应把哪三个状态维度分开？
  answer: 字节内容、名称与目录层级、元数据。
  extra: 摘要相同只证明字节；路径、类型、模式、所有者、时间戳、ACL 和安全上下文仍需独立证据。
  source:
