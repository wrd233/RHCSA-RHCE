- id: RHCSA-06-O03-QA-006
  type: qa
  question: 使用 `tar -xzf backup.tar.xz` 报“not in gzip format”，下一条最有区分度的证据是什么？
  answer: '```bash

    file backup.tar.xz

    tar -tf backup.tar.xz

    ```'
  extra: 手工指定的 gzip 参数与实际 xz 格式不匹配；可让 tar 自动识别或使用 `-J`。
