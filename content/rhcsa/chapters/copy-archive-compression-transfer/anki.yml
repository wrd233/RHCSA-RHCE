- id: RHCSA-06-O01-QA-004
  type: qa
  question: 为什么不应把 `cp -f` 作为覆盖问题的默认答案？
  answer: 它会在缺少调查和备份策略时强制替换目标，可能破坏已有有效数据。
  extra: 先检查目标、明确覆盖授权，再选择交互、备份、跳过或替换策略。
