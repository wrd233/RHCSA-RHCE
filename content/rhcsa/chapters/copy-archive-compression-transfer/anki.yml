- id: RHCSA-06-O01-QA-006
  type: qa
  question: 目标中缺少 `.env`，已确认源存在。下一条最有区分度的证据是什么？
  answer: '比较源和目标第一层成员，确认命令是否使用了 `SOURCE/*`：

    ```bash

    find SOURCE -mindepth 1 -maxdepth 1 -printf "%P\n" | sort

    find TARGET -mindepth 1 -maxdepth 1 -printf "%P\n" | sort

    ```'
  extra: Shell 的普通 `*` 不匹配点号开头成员。
  source:
