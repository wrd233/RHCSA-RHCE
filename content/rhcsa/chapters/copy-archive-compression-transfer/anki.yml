- id: RHCSA-06-O05-QA-008
  type: qa
  question: 实际同步后再次运行同一条 `rsync -ani` 无输出，能证明什么？
  answer: 证明 rsync 根据当前选择和比较规则认为没有需要再次更新的差异。
  extra: 不能独立证明全部字节、ACL、xattr 或业务功能。
