- id: RHCSA-06-T01-QA-001
  type: qa
  question: 要求归档成员有单一顶层 `app-release/`，源为 `/srv/app-release/`。创建 xz 归档的关键命令是什么？
  answer: '```bash

    tar -C /srv -cJf ARCHIVE app-release

    ```'
  extra: '`-C /srv` 与成员 `app-release` 共同固定顶层。'
  source:
  - RH124 Ch.13 pp.431-438
  - tar(1)
  - GNU tar manual
