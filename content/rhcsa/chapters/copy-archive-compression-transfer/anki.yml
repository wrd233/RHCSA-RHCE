- id: RHCSA-06-O03-QA-004
  type: qa
  question: 分别解压 `.gz`、`.bz2` 和 `.xz` 单文件的命令是什么？
  answer: '`gunzip FILE.gz`、`bunzip2 FILE.bz2`、`unxz FILE.xz`。'
  extra: 解压单文件和从 tar 归档提取成员是不同操作。
