- id: RHCSA-FILES-O01-QA-002
  type: qa
  question: 把 `app.conf` 部署为 `/etc/myapp/app.conf`，创建缺失父目录并设置模式 `0640`，命令是什么？
  answer: '```bash

    install -D -m 0640 app.conf /etc/myapp/app.conf

    ```'
  extra: 保留旧 ID；`install` 是文件部署工具，不是软件包安装器。
