  type: qa
  question: '`tar` 的 `-c`、`-t`、`-x` 和 `-f` 分别表示什么？'
  answer: '`-c` 创建，`-t` 列出成员，`-x` 提取，`-f` 指定归档文件。'
  extra: '`-c/-t/-x` 是主要操作，通常一次选择一个。'
