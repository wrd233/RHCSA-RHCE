- id: RHCSA-06-T01-QA-003
  type: qa
  question: 未知归档的推荐验收顺序是什么？
  answer: 先 `file`，再 `tar -tf/-tvf`，然后提取到空目录，最后比较层级、字节、链接和关键元数据。
  extra: 不要直接提取到业务路径。
  source:
  - RH124 Ch.13 pp.431-438
  - tar(1)
  - GNU tar manual
