  type: qa
  question: 两个归档恢复出的普通文件完全相同，归档文件 SHA-256 是否一定相同？
  answer: 不一定。成员顺序、归档时间戳、元数据或压缩参数不同都可能使归档字节不同。
  extra: 归档摘要与恢复后数据集合验证回答不同问题。
