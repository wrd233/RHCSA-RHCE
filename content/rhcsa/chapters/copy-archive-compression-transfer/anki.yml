- id: RHCSA-06-K01-QA-008
  type: qa
  question: '`file`、`tar -tf` 和 `sha256sum` 分别回答什么问题？'
  answer: '`file` 识别外层格式；`tar -tf` 查看归档成员和路径；`sha256sum` 对整个归档文件或指定成员字节建立摘要。'
  extra: 三条证据不能互相替代。
  source:
