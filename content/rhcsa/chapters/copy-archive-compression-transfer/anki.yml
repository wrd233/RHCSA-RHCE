- id: RHCSA-06-K02-QA-008
  type: qa
  question: 为什么未知归档应先列成员并提取到空目录？
  answer: 为了检查绝对路径、`..`、链接和目标层级，避免直接覆盖已有系统或业务文件。
  extra: 不要把工具默认保护当作唯一安全边界。
  source:
