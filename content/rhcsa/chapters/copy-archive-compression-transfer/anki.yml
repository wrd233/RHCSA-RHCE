- id: RHCSA-06-D01-QA-001
  type: qa
  question: 目标多出一层源目录时，下一条最有区分度的证据是什么？
  answer: 查看目标前两层目录树，并核对源操作数是否带末尾斜杠或 `/.`。
  extra: 先确认同步根，再做最小修复。
  source:
