- id: RHCSA-06-O05-QA-002
  type: qa
  question: '`rsync` 的“增量”主要表示什么？'
  answer: 首次同步后，后续运行通过比较源和目标，只传输被判定为变化的文件或数据差异。
  extra: 首次同步仍可能接近完整复制。
