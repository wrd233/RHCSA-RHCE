  question: '`install -D` 与 `install -d` 分别做什么？'
  answer: '`-D` 在部署文件时创建缺失的父目录；`-d` 把参数本身作为要创建的目录。'
  extra: 创建目录时可同时用 `-m` 指定目录模式。
