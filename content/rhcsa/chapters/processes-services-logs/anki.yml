chapter_id: RHCSA-SERVICES
deck: RedHat::RHCSA-RHEL9
note_types: [RedHat-QA, RedHat-Cloze]
notes:
  - id: RHCSA-SERVICES-K01-QA-001
    type: qa
    question: 查看 PID、PPID、用户、状态、nice 和完整命令的骨架是什么？
    answer: '`ps -eo pid,ppid,user,stat,ni,cmd`'
    extra: 可按判断需要增加 `--sort` 字段。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-K01-QA-002
    type: qa
    question: 按用户和进程名查 PID 与命令行，推荐什么？
    answer: '`pgrep -a -u <USER> <NAME>`'
    extra: 操作前仍要核对完整命令行。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P1]
  - id: RHCSA-SERVICES-K01-QA-003
    type: qa
    question: '`kill <PID>` 默认发送哪个信号？'
    answer: SIGTERM（15）。
    extra: 它请求程序有序退出。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::parameter, priority::P0]
  - id: RHCSA-SERVICES-K01-QA-004
    type: qa
    question: 为什么 SIGKILL 不应作为终止进程的第一选择？
    answer: 程序无法捕获它或清理资源，可能留下不一致状态。
    extra: 先 TERM、验证，再在确认对象后 KILL。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-K01-QA-005
    type: qa
    question: 僵尸进程为什么不能靠继续发送信号清除？
    answer: 它已经退出，只等待父进程回收状态。
    extra: 应调查父进程。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P1]
  - id: RHCSA-SERVICES-K01-QA-006
    type: qa
    question: nice 值越大，CPU 调度优先级怎样变化？
    answer: 越低。
    extra: nice 不是 CPU 配额或完成时间保证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::concept, priority::P0]
  - id: RHCSA-SERVICES-K01-QA-007
    type: qa
    question: '`jobs`、`fg`、`bg` 的作用范围是什么？'
    answer: 当前 Shell 的作业表。
    extra: 不适合作为长期服务管理方案。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::concept, priority::P1]
  - id: RHCSA-SERVICES-O01-QA-001
    type: qa
    question: '`systemctl start` 与 `enable` 的核心区别是什么？'
    answer: start 改变当前运行；enable 建立开机启动依赖。
    extra: '`enable --now` 同时处理两者。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::comparison, priority::P0]
  - id: RHCSA-SERVICES-O01-QA-002
    type: qa
    question: 同时启用并立即启动 `httpd` 的命令是什么？
    answer: '`systemctl enable --now httpd`'
    extra: 后续分别验证 active 和 enabled。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O01-QA-003
    type: qa
    question: '`systemctl mask` 比 disable 多做了什么？'
    answer: 阻止 unit 被手工或依赖启动，通常链接到 `/dev/null`。
    extra: 解除使用 `unmask`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::comparison, priority::P0]
  - id: RHCSA-SERVICES-O01-QA-004
    type: qa
    question: 什么时候需要 `systemctl daemon-reload`？
    answer: unit 文件或 drop-in 发生变化时。
    extra: 它不自动重启应用服务。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O01-QA-005
    type: qa
    question: 应用配置文件改变后，`daemon-reload` 能否让应用读取新配置？
    answer: 不能；应先做应用语法检查，再 reload 或 restart 应用。
    extra: unit 定义与应用配置是不同对象。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-O01-QA-006
    type: qa
    question: 查看 unit 主文件与 drop-in 合并来源，使用什么？
    answer: '`systemctl cat <UNIT>`'
    extra: 属性查询可用 `systemctl show -p`。
    source: [systemd]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, coverage::extra]
  - id: RHCSA-SERVICES-O01-QA-007
    type: qa
    question: 服务 `active` 能否证明端口与业务访问正确？
    answer: 不能；还要检查监听、过滤层和最终功能。
    extra: active 只描述 systemd 当前状态。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::verification, priority::P0]
  - id: RHCSA-SERVICES-O02-QA-001
    type: qa
    question: 查看当前启动中 httpd 最近 10 分钟日志的骨架是什么？
    answer: '`journalctl -u httpd -b --since ''-10 min''`'
    extra: '`--no-pager` 适合非交互输出。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O02-QA-002
    type: qa
    question: '`journalctl -b -1` 查询什么？'
    answer: 上一次启动轮次的日志。
    extra: 是否可见取决于 journal 持久存储。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::parameter, priority::P1]
  - id: RHCSA-SERVICES-O02-QA-003
    type: qa
    question: 当前能看到 journal，能否证明重启后仍能看到？
    answer: 不能；当前日志可能只在 `/run/log/journal` 易失存储中。
    extra: 持久存储通常涉及 `/var/log/journal` 与 Storage 配置。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::verification, priority::P0]
  - id: RHCSA-SERVICES-O02-QA-004
    type: qa
    question: 校验 rsyslog 配置语法的命令是什么？
    answer: '`rsyslogd -N1`'
    extra: 通过后再重启服务并发送测试消息。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O02-QA-005
    type: qa
    question: 生成带 facility/priority 与 tag 的受控日志消息，使用什么骨架？
    answer: '`logger -p local0.notice -t exam-check ''message''`'
    extra: 再分别查询 journal 和目标文件。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P1]
  - id: RHCSA-SERVICES-O02-QA-006
    type: qa
    question: 日志时间范围查询为空时，为什么先检查 `timedatectl`？
    answer: 错误时区或时钟会让预期事件落在另一时间范围。
    extra: 空日志不一定表示事件未发生。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-O03-QA-001
    type: qa
    question: 修改时区与配置网络时间同步是同一状态吗？
    answer: 不是；时区控制显示偏移，时间同步控制时钟来源与校正。
    extra: 两者分别验证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::comparison, priority::P0]
  - id: RHCSA-SERVICES-O03-QA-002
    type: qa
    question: 查看 chrony 时间源和跟踪状态分别用什么？
    answer: '`chronyc sources -v` 与 `chronyc tracking`。'
    extra: 服务 active 不能替代这两层。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O03-QA-003
    type: qa
    question: chrony sources 中 `^*`、`^+`、`^?` 的常见含义是什么？
    answer: 当前选中；可接受候选；不可达或无有效测量。
    extra: 结合完整输出与 tracking 判断。
    source: [chrony]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::output, priority::P0]
  - id: RHCSA-SERVICES-O04-QA-001
    type: qa
    question: 用户 crontab 的五个时间字段顺序是什么？
    answer: 分、时、日、月、星期。
    extra: 后面直接是命令。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::syntax, priority::P0]
  - id: RHCSA-SERVICES-O04-QA-002
    type: qa
    question: '`/etc/crontab` 或 `/etc/cron.d/` 比用户 crontab 多哪个字段？'
    answer: 时间字段后多一个执行用户字段。
    extra: 两种格式混用会让任务错误。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::comparison, priority::P0]
  - id: RHCSA-SERVICES-O04-QA-003
    type: qa
    question: 每天 02:15 运行脚本的用户 crontab 时间表达是什么？
    answer: '`15 2 * * *`'
    extra: 后接绝对脚本路径与重定向。
    source: [RH124, RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P0]
  - id: RHCSA-SERVICES-O04-QA-004
    type: qa
    question: 为什么 cron 中应使用绝对路径并显式重定向？
    answer: cron 的 PATH、工作目录和环境有限，且无人交互读取输出。
    extra: 让脚本明确依赖而非复制完整交互环境。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-O04-QA-005
    type: qa
    question: 提交、列出、查看、删除 at 作业分别用什么？
    answer: '`at`、`atq`、`at -c <JOB>`、`atrm <JOB>`。'
    extra: 还要确认 atd 和真实产物。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::command, priority::P1]
  - id: RHCSA-SERVICES-O04-QA-006
    type: qa
    question: cron 配置存在能否证明任务执行成功？
    answer: 不能；还要检查 crond、目标身份环境、日志和实际产物。
    extra: 手工执行成功也不能证明 cron 环境成功。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::verification, priority::P0]
  - id: RHCSA-SERVICES-D01-QA-001
    type: qa
    question: 服务启动失败的推荐证据顺序是什么？
    answer: status → 当前 boot 的 unit journal → 应用语法 → 端口/权限/SELinux。
    extra: 不要反复 restart 覆盖最近证据。
    source: [RH124, RH134]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::process, priority::P0]
  - id: RHCSA-SERVICES-D01-QA-002
    type: qa
    question: 手工运行脚本成功而 cron 失败，优先比较什么？
    answer: 执行用户、PATH、工作目录、环境变量、权限和错误输出。
    extra: 可在精简环境中复现。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-D01-QA-003
    type: qa
    question: unit 为 enabled 但没有运行，下一步查什么？
    answer: '`is-active`、status、本次启动 journal，以及是否 masked/条件跳过。'
    extra: enabled 只表示启动依赖。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::diagnosis, priority::P0]
  - id: RHCSA-SERVICES-C01-QA-001
    type: qa
    question: 服务、日志、时间、cron 综合任务的验收骨架是什么？
    answer: 服务语法/状态/功能 → 日志语法/受控消息 → 时区/源/tracking → cron 配置/身份/产物。
    extra: 每组状态分别证明。
    source: [RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::process, priority::P0, task::service-health]
  - id: RHCSA-SERVICES-O01-CLOZE-001
    type: cloze
    text: '`systemctl {{c1::enable --now}} httpd` 同时建立{{c2::启动依赖并立即启动}}。'
    extra: 后续分别查 active 与 enabled。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::cloze, priority::P0]
  - id: RHCSA-SERVICES-O04-CLOZE-001
    type: cloze
    text: 用户 cron 字段顺序：{{c1::分 时 日 月 星期}}；系统 cron 随后还要写{{c2::执行用户}}。
    extra: 最后才是命令。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::cloze, priority::P0]
  - id: RHCSA-SERVICES-O03-CLOZE-001
    type: cloze
    text: chrony 验收：`{{c1::chronyc sources -v}}` 看源，`{{c2::chronyc tracking}}` 看时钟跟踪。
    extra: active 不等于已同步。
    source: [RH124]
    tags: [exam::rhcsa, chapter::processes-services-logs, card::cloze, priority::P0]
