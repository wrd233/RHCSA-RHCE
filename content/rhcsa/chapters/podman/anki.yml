notes:
- id: RHCSA-PODMAN-QA-001
  type: qa
  question: image 与 container 的区别是什么？
  answer: image 是只读模板，container 是其实例。
  extra: 实例有独立运行状态。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::concept
  - priority::P0
- id: RHCSA-PODMAN-QA-002
  type: qa
  question: '`-p 8080:80` 的方向是什么？'
  answer: 宿主 8080 转发到容器 80。
  extra: 宿主端口在前。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::parameter
  - priority::P0
- id: RHCSA-PODMAN-QA-003
  type: qa
  question: bind mount 的 `:Z` 与 `:z` 区别是什么？
  answer: :Z 私有重标记；:z 允许多容器共享。
  extra: 按共享边界选择。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::comparison
  - priority::P0
- id: RHCSA-PODMAN-QA-004
  type: qa
  question: 查看全部容器含已退出实例用什么？
  answer: '`podman ps -a`'
  extra: 立即退出时先查。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::command
  - priority::P0
- id: RHCSA-PODMAN-QA-005
  type: qa
  question: 查看容器端口发布用什么？
  answer: '`podman port <CONTAINER>`'
  extra: 再用 ss 与 curl 验证。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::verification
  - priority::P0
- id: RHCSA-PODMAN-QA-006
  type: qa
  question: 容器立即退出的证据入口是什么？
  answer: '`podman ps -a`、`podman logs`、`podman inspect`。'
  extra: 不反复创建。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::diagnosis
  - priority::P0
- id: RHCSA-PODMAN-QA-007
  type: qa
  question: 卷 permission denied 的调查层是什么？
  answer: 宿主 DAC、rootless UID 映射、SELinux 标签/AVC。
  extra: 不 chmod 777 或禁用 SELinux。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::diagnosis
  - priority::P0
- id: RHCSA-PODMAN-QA-008
  type: qa
  question: rootless 容器为什么要以目标用户运行 podman？
  answer: 容器存储、用户命名空间和 user units 都属于该用户。
  extra: root 是另一套状态。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::concept
  - priority::P0
- id: RHCSA-PODMAN-QA-009
  type: qa
  question: 用户退出后仍运行 user service 的关键设置是什么？
  answer: '`loginctl enable-linger <USER>`'
  extra: 另需 user unit enabled。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::command
  - priority::P0
- id: RHCSA-PODMAN-QA-010
  type: qa
  question: 用户 unit 与系统 unit 的 systemctl 区别是什么？
  answer: 用户 unit 使用 `systemctl --user` 并在对应用户上下文。
  extra: 管理器不同。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::comparison
  - priority::P0
- id: RHCSA-PODMAN-QA-011
  type: qa
  question: 容器 running 能否证明重启后运行？
  answer: 不能；还要验证 user unit enabled 与 linger。
  extra: 当前/持久分开。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::verification
  - priority::P0
- id: RHCSA-PODMAN-QA-012
  type: qa
  question: 完整容器验收骨架是什么？
  answer: image → ps/logs/inspect → port/ss → volume/data → user unit/linger → HTTP。
  extra: 分层取证。
  source:
  - RH134-RHEL9
  - Podman-Course
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::podman
  - card::process
  - priority::P0
