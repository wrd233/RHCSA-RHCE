  type: qa
  question: 镜像首次拉取导致 service 超过 systemd 启动超时，优先有哪些处理？
  answer: 可以预拉镜像；有证据表明只是拉取耗时时，再在 `[Service]` 中适当增加 `TimeoutStartSec=`。
  extra: 不要无调查地无限放大超时。
