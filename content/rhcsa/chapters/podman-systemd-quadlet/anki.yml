- id: RHCSA-32-K01-QA-002
  type: qa
  question: 迁移现有容器前，为什么应先保存 `podman inspect` 基线？
  answer: 为了记录当前镜像、端口、挂载、环境和用户等事实，避免在重建时遗漏必须保留的配置。
  extra: '`inspect` 是调查证据，不应无筛选地复制所有历史临时参数。'
  source:
