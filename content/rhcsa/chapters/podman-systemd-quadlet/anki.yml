  question: 怎样比较本地 tag 当前 image ID 与运行容器使用的 image ID？
  answer: 分别使用 `podman image inspect IMAGE --format '{{.Id}}'` 和 `podman inspect NAME --format '{{.Image}}'`。
  extra: 名称相同不代表 ID 相同。
