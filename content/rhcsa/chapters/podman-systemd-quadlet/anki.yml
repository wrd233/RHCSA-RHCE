- id: RHCSA-32-K02-QA-004
  type: qa
  question: 为什么 `sudo systemctl status report.service` 可能对 rootless Quadlet 给出误导性结果？
  answer: 它查询系统 manager，而 rootless Quadlet 的 `report.service` 属于目标用户的 user manager。
  extra: 应在目标用户上下文使用 `systemctl --user`。
