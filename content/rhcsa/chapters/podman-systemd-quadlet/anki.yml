- id: RHCSA-32-O01-QA-007
  type: qa
  question: 让 rootless Quadlet 随用户 manager 的默认 target 启动，应在源文件写什么？
  answer: 在 `[Install]` 中写 `WantedBy=default.target`。
  extra: generator 会应用该 Install 关系。
