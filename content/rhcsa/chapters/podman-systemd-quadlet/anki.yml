- id: RHCSA-32-O01-QA-006
  type: qa
  question: 让 generated service 在失败退出后等待 5 秒重启，应写哪些字段？
  answer: 在 `[Service]` 中写 `Restart=on-failure` 和 `RestartSec=5`。
  extra: Restart 不会修复重名、端口或权限等持续错误。
  source:
