- id: RHCSA-32-K01-QA-004
  type: qa
  question: 为什么容器 ID 不适合作为长期配置身份？
  answer: 容器删除和重建后 ID 通常变化；长期声明应使用稳定的 unit 名、容器名和外部数据位置。
  extra: ID 变化不等于数据丢失，数据是否外置才是关键。
