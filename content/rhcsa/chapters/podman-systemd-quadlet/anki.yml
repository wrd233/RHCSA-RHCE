- id: RHCSA-32-K04-QA-003
  type: qa
  question: '`Restart=on-failure` 能否修复端口持续被占用？'
  answer: 不能。它只会在失败后重试，端口冲突未消除时可能形成 restart loop。
  extra: 应先用监听和容器证据定位冲突对象。
