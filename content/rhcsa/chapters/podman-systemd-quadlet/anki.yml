- id: RHCSA-32-K01-QA-001
  type: qa
  question: 当前容器实例与 Quadlet `.container` 分别代表什么？
  answer: 当前实例代表已经发生的运行事实；`.container` 代表下一次生成容器时的期望声明。
  extra: 修改其中一方不会自动改写另一方。
  source:
