  question: 容器 stop 后数据仍在，是否足以证明数据独立于容器实例？
  answer: 不足。stop 不删除实例和可写层；更强证据是删除/重建实例后，新实例仍能读取外部数据。
  extra: 执行删除前必须确认数据已经外置。
