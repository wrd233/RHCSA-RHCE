  disabled: false
  semantic_type: comparison
- id: RHCSA-PODMAN-QA-011
  type: qa
  question: 某 rootless 容器现在显示 running。这个证据是否足以证明主机重启后、该用户尚未登录时也会运行？
  answer: 不足。还要验证 `.container` 的 `[Install]` 启动关系、目标用户 `Linger=yes`，并在冷启动后、目标用户首次登录前从外部验证功能。
  extra: 当前实例状态、持久配置和未登录功能是三个独立层次。
  source:
  - loginctl(1)
  - podman-systemd.unit(5)-4.6.1
