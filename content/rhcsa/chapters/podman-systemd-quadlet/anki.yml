- id: RHCSA-32-K04-QA-002
  type: qa
  question: Quadlet 依赖另一个 `database.container` 时，`After=` 应引用什么名称？
  answer: '`After=database.service`，即生成后的 service 名称。'
  extra: 不要写 `After=database.container`。
