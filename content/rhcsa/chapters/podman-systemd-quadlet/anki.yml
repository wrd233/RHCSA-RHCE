- id: RHCSA-32-K01-QA-003
  type: qa
  question: 编辑 `.container` 后，当前运行容器会立即采用新配置吗？
  answer: 不会。通常还需 `systemctl --user daemon-reload` 重新生成 unit，再 restart 使运行实例采用新配置。
  extra: 编辑、reload、restart 是三个不同动作。
  source:
  - podman-systemd.unit(5)-4.6.1
  - RHEL9-container-documentation
