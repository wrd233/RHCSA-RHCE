- id: RHCSA-32-O03-QA-003
  type: qa
  question: 宿主目录写入失败时，为什么不应直接 `chmod 777`？
  answer: 它破坏最小权限，也可能仍无法解决容器 UID 映射或 SELinux 拒绝。
  extra: 应依次检查路径、所有者/模式、容器 UID 和 AVC。
