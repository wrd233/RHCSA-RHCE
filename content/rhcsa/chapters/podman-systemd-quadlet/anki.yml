- id: RHCSA-32-K04-QA-001
  type: qa
  question: '`Requires=database.service` 与 `After=database.service` 的区别是什么？'
  answer: '`Requires=` 把依赖 unit 拉入事务并表达失败关系；`After=` 只表达同时启动时的先后顺序。'
  extra: 常见场景需要两者组合。
