- id: RHCSA-32-O03-QA-004
  type: qa
  question: 持久目录访问失败的推荐调查顺序是什么？
  answer: 路径是否正确 -> 宿主 DAC -> 容器内 UID/rootless 映射 -> SELinux 上下文和 AVC。
  extra: 每一步选择能区分假设的证据。
