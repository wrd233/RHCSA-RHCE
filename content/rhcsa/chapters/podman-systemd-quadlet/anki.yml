  type: qa
  question: 用户重新登录后服务才恢复，能否算“重启后未登录自动运行”通过？
  answer: 不能。登录动作可能创建 user manager 或触发 unit，已经污染未登录启动证据。
  extra: 应在目标用户首次登录前从其他账号或远端测试功能。
