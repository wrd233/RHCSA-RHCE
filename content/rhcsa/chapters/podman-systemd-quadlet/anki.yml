- id: RHCSA-32-K02-QA-001
  type: qa
  question: 在 root shell 中执行 `podman ps` 为空，能否证明普通用户 appsvc 没有 rootless 容器？
  answer: 不能。root 与 appsvc 使用不同的 rootless/rootful 存储作用域，应切换到 appsvc 的完整用户环境再查询。
  extra: 先核对 `id`，再解释 Podman 输出。
