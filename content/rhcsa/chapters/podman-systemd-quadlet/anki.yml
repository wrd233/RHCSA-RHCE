- id: RHCSA-PODMAN-QA-010
  type: qa
  question: 管理 rootless Quadlet 生成的用户 unit 时，普通 `systemctl` 与 `systemctl --user` 的作用域有什么不同？
  answer: '`systemctl` 默认连接系统 manager；`systemctl --user` 连接当前用户的 manager。rootless 容器服务应在目标用户作用域内查询和控制。'
  extra: root 的 Podman 存储、普通用户 Podman 存储和各自 user manager 相互分离。
  source:
  - systemctl(1)
  - RH134-RHEL9
  tags:
