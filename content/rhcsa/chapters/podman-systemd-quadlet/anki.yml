- id: RHCSA-PODMAN-QA-009
  type: qa
  question: 普通用户的 rootless 容器需要在该用户注销后继续由 user systemd manager 管理。应启用什么状态，并怎样验证？
  answer: 由管理员执行 `loginctl enable-linger <user>`，再用 `loginctl show-user <user> -p Linger` 验证为 `Linger=yes`。
  extra: linger 延长用户 manager 的登录外生命周期，不证明 Quadlet、unit 或业务功能正确。
  source:
  - loginctl(1)
  - RH134-RHEL9
