- id: RHCSA-32-O01-QA-008
  type: qa
  question: 为什么不能用 `systemctl --user enable report.service` 让 Quadlet generated service 获得持久启用关系？
  answer: 因为 Quadlet 生成的 service 是 transient/generated unit，普通 `enable` 不能为它建立持久启用关系；应在源 `.container` 的 `[Install]` 中写 `WantedBy=default.target`，由
    generator 应用。
  extra: 普通手写 user service 与 Quadlet generated service 的 enable 机制不能混用；generated service 是派生状态。
  source:
  - podman-systemd.unit(5)-4.6.1
  - RHEL9-container-documentation
