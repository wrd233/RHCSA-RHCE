  question: 在 `projectvg` 中创建 50 个 extent、名为 `projectlv` 的 LV，命令是什么？
  answer: '```bash

    lvcreate -l 50 -n projectlv projectvg

    ```'
  extra: 题目按 extent 表达，因此使用小写 `-l`。
