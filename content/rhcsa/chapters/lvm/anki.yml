- id: RHCSA-LVM-K01-QA-001
  type: qa
  question: 从空闲设备到应用可用目录，LVM 相关层次按顺序是什么？
  answer: 设备或分区 → PV → VG → LV → 文件系统 → 挂载点。
  extra: 每一层解决的问题不同，不能用单一查询代替完整验收。
  source:
  - RHEL9-LVM-Overview
  - RH134
