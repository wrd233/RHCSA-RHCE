- id: RHCSA-LVM-O02-QA-003
  type: qa
  question: 使用 `/dev/vdb1` 创建 PE 大小为 16 MiB 的 `projectvg`，命令是什么？
  answer: '```bash

    vgcreate -s 16M projectvg /dev/vdb1

    ```'
  extra: '`-s` 设置 VG 的 PE 大小。'
