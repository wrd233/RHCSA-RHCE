  type: qa
  question: 从安全调查到 LV 创建的最短对象闭环是什么？
  answer: 确认设备 → `pvcreate` → `pvs` → `vgcreate` → `vgs` → `lvcreate` → `lvs`。
  extra: 文件系统与挂载是后续上层。
