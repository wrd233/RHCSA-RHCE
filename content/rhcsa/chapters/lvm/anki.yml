  type: qa
  question: 给 `projectlv` 增加 20 个 extent，并同时扩大文件系统的命令是什么？
  answer: '```bash

    lvextend --extents +20 --resizefs projectvg/projectlv

    ```'
  extra: 短选项可写为 `lvextend -l +20 -r projectvg/projectlv`。
