- id: RHCSA-LVM-K01-QA-006
  type: qa
  question: 为什么 `lvs` 的 LV 大小与 `df -hT` 显示的文件系统大小可能略有不同？
  answer: '`lvs` 显示块设备标称容量；文件系统会占用元数据并按自己的单位报告容量。'
  extra: 小幅差异不等于扩容失败，应判断两层是否都发生预期变化。
  source:
