- id: RHCSA-25-O03-QA-002
  type: qa
  question: 把已确认空闲的 `/dev/vdc1` 加入 `projectvg` 的推荐两步命令是什么？
  answer: '```bash

    pvcreate /dev/vdc1

    vgextend projectvg /dev/vdc1

    ```'
  extra: 分步操作便于分别验证 PV 和 VG 状态。
