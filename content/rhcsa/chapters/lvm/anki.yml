- id: RHCSA-LVM-O01-QA-001
  type: qa
  question: 准备操作一块新设备时，先用什么命令观察块设备层级、文件系统和挂载点？
  answer: '```bash

    lsblk -o NAME,PATH,SIZE,TYPE,FSTYPE,MOUNTPOINTS

    ```'
  extra: 不要仅凭设备名猜测它是否空闲。
