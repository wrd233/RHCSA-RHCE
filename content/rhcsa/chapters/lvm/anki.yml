  disabled: false
  semantic_type: process
- id: RHCSA-LVM-K01-QA-002
  type: qa
  question: LVM 中的 PV 是什么？
  answer: 被 LVM 初始化并纳入管理的物理设备或分区。
  extra: '`pvcreate` 会写入 LVM 标签和元数据。'
  source:
  - RHEL9-LVM-Physical-Volumes
  - pvcreate(8)
