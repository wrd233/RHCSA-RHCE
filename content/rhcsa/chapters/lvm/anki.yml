  question: 从两个候选分区完成经典任务的主要流程骨架是什么？
  answer: 调查设备 → PV/VG → 指定 extent 的 LV → 文件系统和挂载 → 数据基线 → 必要时扩展 VG → 扩展 LV/文件系统 → 分层验收。
