- id: RHCSA-LVM-K01-QA-005
  type: qa
  question: '`lvs` 显示 LV 已存在，能否证明应用目录已经可用？'
  answer: 不能。还要确认文件系统、当前挂载和必要的持久配置。
  extra: LV 只属于块设备层。
  source:
