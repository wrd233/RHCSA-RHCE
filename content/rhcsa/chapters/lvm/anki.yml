- id: RHCSA-LVM-K03-QA-001
  type: qa
  question: 为什么扩大 LV 后还必须确认文件系统是否增长？
  answer: LV 是底层块设备，文件系统不会因块设备变大而必然自动使用新增空间。
  extra: 应分别用 `lvs` 和 `df -hT` 验证。
