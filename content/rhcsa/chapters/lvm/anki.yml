  type: qa
  question: 创建 LV 后，怎样读取系统报告的设备路径而不是自己拼接？
  answer: '```bash

    lvs projectvg/projectlv -o lv_name,vg_name,lv_path,lv_size

    ```'
  extra: 使用 `lv_path` 作为后续文件系统操作依据。
