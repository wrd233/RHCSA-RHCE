- id: RHCSA-LVM-O01-QA-002
  type: qa
  question: 怎样确认 `/dev/vdb1` 是否已经被 LVM 当作 PV 使用？
  answer: '```bash

    pvs -o pv_name,vg_name,pv_size,pv_free

    ```'
  extra: '`lsblk` 不能完整替代 PV 查询。'
