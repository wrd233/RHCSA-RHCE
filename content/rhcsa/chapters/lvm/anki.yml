- id: RHCSA-LVM-K01-QA-003
  type: qa
  question: LVM 中的 VG 承担什么作用？
  answer: 把一个或多个 PV 的容量汇聚成可分配的空间池。
  extra: LV 从 VG 分配容量；VG 的空闲 PE 才是 LV 的直接容量来源。
  source:
  - RHEL9-LVM-Overview
  - RH134
  tags:
  - exam::rhcsa
  - chapter::lvm
  - topic::object-model
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-LVM-K01-QA-004
  type: qa
  question: LVM 中的 LV 是什么？
  answer: 从 VG 中分配出的虚拟块设备，可在其上创建文件系统或供其他上层使用。
  extra: LV 存在并不等于已有文件系统或挂载。
  source:
  - RHEL9-LVM-Overview
  - RH134
