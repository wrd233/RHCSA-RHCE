- id: RHCSA-25-B01-QA-002
  type: qa
  question: RHEL 9 中 XFS 的缩容边界是什么？
  answer: XFS 可以增长，但不能原地缩小。
  extra: 缩小需求通常需要新建、迁移、切换。
