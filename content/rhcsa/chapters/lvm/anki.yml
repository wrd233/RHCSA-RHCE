  type: qa
  question: 创建 PV 和 VG 后，至少用哪些命令分别验证成员关系和容量？
  answer: 使用 `pvs` 验证 PV 所属 VG，使用 `vgs` 验证 VG 大小、空闲空间和 PE 大小。
  extra: 两层验证不能合并成一句“命令成功”。
