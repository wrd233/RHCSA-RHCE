- id: RHCSA-LVM-O01-QA-007
  type: qa
  question: 为什么执行 `pvcreate` 或 `mkfs` 前必须重新确认设备身份？
  answer: 因为它们会写入元数据或重建文件系统，作用到错误设备时可能破坏原数据。
  extra: 设备名称相似时尤其不能依赖记忆。
