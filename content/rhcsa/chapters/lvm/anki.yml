  question: 只执行 `lvextend` 后，`lvs` 变大但 `df` 不变，最可能说明什么？
  answer: 底层 LV 已扩大，但文件系统尚未扩展到新增空间。
  extra: 应根据文件系统类型使用 `-r` 或对应增长工具。
