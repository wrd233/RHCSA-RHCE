- id: RHCSA-LVM-K02-QA-002
  type: qa
  question: 普通线性 LV 中，LE 与 PE 通常是什么关系？
  answer: 一个 LE 映射到一个 PE。
  extra: 因此 extent 数量乘以 PE 大小可得到 LV 标称容量。
  source:
