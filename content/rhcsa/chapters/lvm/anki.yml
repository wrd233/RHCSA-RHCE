- id: RHCSA-25-B01-QA-001
  type: qa
  question: 为什么 `lvreduce` 不是 `lvextend` 的简单反向命令？
  answer: 缩小 LV 可能移除文件系统仍在使用的数据和元数据块。
  extra: 必须先满足文件系统的缩小能力和安全条件。
