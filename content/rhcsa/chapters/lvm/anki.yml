- id: RHCSA-LVM-K01-QA-008
  type: qa
  question: 挂载点目录已经存在，能否证明文件系统已经挂载？
  answer: 不能。目录即使未挂载也会存在，应使用 `findmnt` 或 `mountpoint` 验证。
  extra: 挂载失败时继续写入，可能实际占用根文件系统。
  source:
  - RHEL9-Managing-File-Systems
  - xfs_growfs(8)
  - resize2fs(8)
