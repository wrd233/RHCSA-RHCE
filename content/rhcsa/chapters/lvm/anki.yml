  type: qa
  question: 扩展 LV 前，应使用哪一层的查询判断真正可分配的剩余空间？
  answer: 查看目标 VG 的 `vg_free` 或 `vg_free_count`。
  extra: 磁盘有空闲空间不等于该空间已经进入目标 VG。
