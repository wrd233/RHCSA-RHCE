- id: RHCSA-LVM-K01-QA-007
  type: qa
  question: '`pvs`、`vgs`、`lvs` 分别主要回答什么问题？'
  answer: PV 属于哪个 VG；VG 有多大和剩余多少；LV 的名称、大小、路径与映射。
  extra: 三组命令对应三个不同的 LVM 层次。
  source:
