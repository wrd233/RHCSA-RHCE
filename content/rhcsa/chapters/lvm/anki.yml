  type: qa
  question: 怎样让新 LV 使用 VG 的全部剩余 extent？
  answer: '```bash

    lvcreate -l 100%FREE -n <LV> <VG>

    ```'
  extra: 只有题目确实要求使用全部剩余空间时才这样做。
