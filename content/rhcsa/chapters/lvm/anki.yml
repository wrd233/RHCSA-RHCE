- id: RHCSA-25-B01-QA-003
  type: qa
  question: ext4 支持缩小，为什么本章仍不把它当作普通操作？
  answer: 缩小通常需要离线，并要求先安全缩小文件系统再缩小 LV，风险远高于扩容。
  extra: 完整流程归文件系统章节。
