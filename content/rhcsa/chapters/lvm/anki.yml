- id: RHCSA-LVM-K03-QA-002
  type: qa
  question: 在 LVM 扩容任务中，`--resizefs` 把哪两个动作连接起来？
  answer: 扩大 LV，并随后扩大其上的受支持文件系统。
  extra: 它避免只完成块设备层而遗漏文件系统层。
