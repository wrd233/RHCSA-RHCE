  question: '`lvextend --resizefs` 中的 `--resizefs` 解决什么问题？'
  answer: 在扩大 LV 后继续调整受支持的文件系统，使新增块设备空间可被文件系统使用。
  extra: 没有它时，LV 与文件系统大小可能不一致。
