- id: RHCSA-25-O03-QA-001
  type: qa
  question: '`lvextend` 报可用空间不足时，下一条最有区分度的证据是什么？'
  answer: '```bash

    vgs <VG> -o vg_name,vg_free,vg_extent_size,vg_free_count

    ```'
  extra: 先证明是 VG 余量问题，再决定是否加入新 PV。
