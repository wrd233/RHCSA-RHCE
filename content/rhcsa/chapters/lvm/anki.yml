- id: RHCSA-25-O04-QA-001
  type: qa
  question: 不使用 `-r` 时，把 ext4 所在 LV 增加 512 MiB 并增长文件系统的两条核心命令是什么？
  answer: '```bash

    lvextend -L +512M <VG>/<LV>

    resize2fs <LV_PATH>

    ```'
  extra: 执行前先确认文件系统确实是 ext4。
