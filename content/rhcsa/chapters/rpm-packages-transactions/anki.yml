- id: RHCSA-16-O05-QA-007
  type: qa
  question: 为什么不能为所有应用统一编造 `<COMMAND> --config-test`？
  answer: 不同应用的配置检查接口不同；必须从 man page、`--help` 或官方文档确认真实命令。
