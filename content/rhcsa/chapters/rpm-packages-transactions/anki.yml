- id: RHCSA-16-O02-QA-011
  type: qa
  question: 用 `rpm2cpio` 提取文件后，为什么不能说包已经安装？
  answer: 提取不会更新 RPM 数据库、解析依赖或执行 scriptlet，只是把归档内容写到当前目录。
  extra: ''
