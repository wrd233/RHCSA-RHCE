  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::boundary
  - priority::P1
- id: RHCSA-16-K01-QA-009
  type: qa
  question: RPM 查询格式中 `--qf` 的作用是什么？
  answer: 按指定格式输出包头查询标签，便于精确审计和脚本处理。
  extra: 可用 `rpm --querytags` 查看可用标签。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
