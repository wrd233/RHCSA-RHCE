  - priority::P0
- id: RHCSA-16-K03-QA-004
  type: qa
  question: 为什么看到 `.rpmnew` 后不应直接覆盖正式配置？
  answer: 正式配置可能包含业务所需本地设置，而新版本还可能引入或废弃参数；必须先 diff、选择性合并和语法检查。
  extra: ''
