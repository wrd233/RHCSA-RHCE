- id: RHCSA-16-K02-QA-009
  type: qa
  question: RPM 查询和事务普遍报数据库错误时，为什么不应立即无备份重建数据库？
  answer: 因为需要先保留错误、判断事务中断和数据库状态，并按官方恢复流程评估；盲目重建可能丢失证据或扩大损坏。
  extra: ''
