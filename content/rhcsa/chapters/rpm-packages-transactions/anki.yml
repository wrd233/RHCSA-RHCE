- id: RHCSA-16-D01-QA-006
  type: qa
  question: 签名检查提示缺少公钥，最小安全处理是什么？
  answer: 暂停事务，从可信独立渠道取得正确公钥并核对指纹，再按组织策略导入和重新验证。
