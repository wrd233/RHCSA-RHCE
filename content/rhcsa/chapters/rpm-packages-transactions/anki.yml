- id: RHCSA-16-D01-QA-009
  type: qa
  question: 大量包同时出现文件摘要差异，为什么不应逐包重装作为第一步？
  answer: 这可能指向磁盘、配置管理、安全事件或系统级变更；应先建立范围、时间线和共同原因。
