- id: RHCSA-16-O04-QA-005
  type: qa
  question: '`rpm -i`、`rpm -U`、`rpm -F` 的语义差异是什么？'
  answer: '`-i` 安装；`-U` 安装或升级；`-F` 只更新已经安装的同名包。'
  extra: 普通依赖事务仍优先使用 DNF。
  source:
