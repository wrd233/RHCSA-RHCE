- id: RHCSA-16-O01-QA-008
  type: qa
  question: 从命令名 `<COMMAND>` 调查提供它的已安装包，应按什么顺序？
  answer: 先用 `command -v <COMMAND>` 得到真实外部路径，再用 `rpm -qf <PATH>` 反查包。
  extra: 如果结果是 Shell builtin、函数或 alias，不能直接作为文件路径。
  source:
