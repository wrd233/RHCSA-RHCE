- id: RHCSA-16-O04-QA-013
  type: qa
  question: 使用 `dnf reinstall` 恢复文件后，为什么仍需运行 `rpm -V` 和应用验证？
  answer: 重装只处理包管理的内容，配置、数据、外部依赖和运行状态仍可能不符合目标。
  extra: ''
