  - priority::P0
- id: RHCSA-16-K01-QA-005
  type: qa
  question: 需要查看本地 `./tool.rpm` 的 Name、Epoch、Version、Release 和 Architecture，应使用什么命令骨架？
  answer: '```bash

    rpm -qp --qf ''Name: %{NAME}\nEpoch: %{EPOCH}\nVersion: %{VERSION}\nRelease: %{RELEASE}\nArch: %{ARCH}\n'' ./tool.rpm

    ```'
  extra: '`-p` 将查询对象切换为包文件。'
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::command
  - priority::P0
- id: RHCSA-16-K01-QA-006
  type: qa
  question: '`rpm -q <PACKAGE>` 与 `rpm -qp <FILE.rpm>` 的对象差异是什么？'
  answer: 前者查询本机 RPM 数据库中的已安装包；后者读取指定本地 RPM 文件的包头。
  extra: ''
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::comparison
  - priority::P0
- id: RHCSA-16-K01-QA-007
  type: qa
  question: 一个 `.rpm` 文件保存在 `/tmp` 中，能否据此判断该包已经安装？
  answer: 不能。文件存在只证明本地有一个候选包；已安装状态必须查询 RPM 数据库。
  extra: 可用 `rpm -q <NAME>` 查询。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::output
  - priority::P1
- id: RHCSA-16-K01-QA-008
  type: qa
  question: 为什么删除同名包前应注意多版本和多架构场景？
  answer: 因为同一个 Name 可能匹配多个已安装实例；模糊删除可能影响并行版本或不同架构。
  extra: 内核包是常见的多版本并行示例。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
