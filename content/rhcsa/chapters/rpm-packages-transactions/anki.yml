- id: RHCSA-16-O04-QA-009
  type: qa
  question: 为什么不使用 `rpm --nodeps` 解决依赖失败？
  answer: 它绕过依赖检查，可能让 RPM 数据库和运行环境进入不满足依赖的状态；应修复可信依赖来源。
  extra: ''
