- id: RHCSA-16-D01-QA-007
  type: qa
  question: '`dnf history undo` 因旧版本不可用而失败，下一步是什么？'
  answer: 读取具体缺失的 NEVRA，确认受信仓库或归档是否可提供，并评估后续依赖；不要反复 undo 或扩大删除。
