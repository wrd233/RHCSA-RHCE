  type: qa
  question: 升级后为什么要同时检查 `rpm -V` 和 `.rpmnew/.rpmsave`？
  answer: '`rpm -V` 揭示文件属性差异；旁置文件揭示配置迁移尚未处理的候选和旧版本。'
