- id: RHCSA-16-K03-QA-007
  type: qa
  question: 完成 `.rpmnew` 合并后，为什么还需要应用自身的配置检查？
  answer: 文本合并成功不代表语法和语义合法；应用检查能在 reload/restart 前发现错误。
