- id: RHCSA-PACKAGES-K01-QA-001
  type: qa
  question: RPM 包身份中的 NEVRA 分别由哪些字段组成？
  answer: '`Name`、`Epoch`、`Version`、`Release`、`Architecture`。'
  extra: NEVRA 用于精确描述包身份；文件名、命令名和服务名都不是它的同义词。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::concept
  - priority::P0
- id: RHCSA-16-K01-QA-002
  type: qa
  question: RPM 身份中 `Version` 与 `Release` 分别由谁描述什么？
  answer: '`Version` 通常对应上游软件版本；`Release` 是该上游版本的打包发行修订。'
  extra: 同一 Version 可以有多个 Release。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::comparison
  - priority::P0
- id: RHCSA-16-K01-QA-003
  type: qa
  question: Epoch 在普通查询输出中经常不显眼，为什么仍不能忽略？
  answer: 因为 Epoch 是 RPM 版本比较的一部分；一旦设置，它会影响哪个包被判断为更新。
  extra: 需要审计时应使用查询格式读取真实 Epoch，不自行假设为 0。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::nevra
  - card::concept
  - priority::P1
- id: RHCSA-16-K01-QA-004
  type: qa
  question: 为什么不能仅根据 `name-version-release.arch.rpm` 的文件名手工认定包身份？
  answer: 文件可以被重命名，而且复杂 Name、Version、Release 不适合靠字符串切分可靠解析。应让 RPM 读取包头。
  extra: ''
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
