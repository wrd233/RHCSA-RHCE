- id: RHCSA-16-O02-QA-009
  type: qa
  question: 包未签名与签名验证失败是否等价？
  answer: 不等价。未签名表示没有可验证签名；验证失败表示现有摘要或签名检查未通过。两者都必须按策略处理。
  extra: ''
