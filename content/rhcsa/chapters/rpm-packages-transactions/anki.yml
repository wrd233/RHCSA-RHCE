  - chapter::rpm-packages-transactions
  - topic::transactions
  - card::comparison
  - priority::P1
- id: RHCSA-16-O04-QA-008
  type: qa
  question: 为什么 `dnf history undo <ID>` 不能视为无条件回滚按钮？
  answer: 它依赖所需旧包仍可获得、仓库和后续依赖关系允许回退；失败时需要按具体缺失版本调查。
  extra: ''
