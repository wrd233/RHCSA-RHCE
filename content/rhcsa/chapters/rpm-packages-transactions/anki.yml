- id: RHCSA-16-O04-QA-014
  type: qa
  question: '`rpm --test` 的作用是什么？'
  answer: 执行事务测试而不应用文件和数据库变更，用于观察低层事务能否通过检查。
  extra: 它仍不能代替 DNF 的仓库依赖选择和最终功能验证。
