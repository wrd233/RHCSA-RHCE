  type: qa
  question: 只想列出本地 RPM 的归档内容而不安装，可使用什么命令骨架？
  answer: '```bash

    rpm2cpio ./package.rpm | cpio -t

    ```'
  extra: 提取单个文件时应在隔离目录中操作并检查相对路径。
