  question: 本地 RPM 的 Architecture 为 `x86_64`，安装前至少还应与什么证据比较？
  answer: 与目标系统架构（如 `uname -m`）及组织支持范围比较。
  extra: '`noarch` 表示内容通常不绑定特定 CPU 架构。'
