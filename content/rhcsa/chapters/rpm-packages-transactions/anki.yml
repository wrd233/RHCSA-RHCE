- id: RHCSA-16-D01-QA-001
  type: qa
  question: '`dnf install ./package.rpm` 失败，下一条证据链应从哪里开始？'
  answer: 保留完整错误和摘要，然后检查包头/架构、`rpmkeys --checksig`、`rpm -qp --requires`，再区分依赖、签名、冲突或仓库问题。
  extra: ''
  source:
