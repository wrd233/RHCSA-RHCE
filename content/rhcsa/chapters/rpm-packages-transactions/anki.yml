- id: RHCSA-16-K03-QA-005
  type: qa
  question: 在 `/etc` 中定位 `.rpmnew` 和 `.rpmsave` 的命令骨架是什么？
  answer: '```bash

    find /etc -type f \( -name ''*.rpmnew'' -o -name ''*.rpmsave'' \) -print

    ```'
  extra: 优先限制到本次事务相关目录。
