- id: RHCSA-16-O02-QA-007
  type: qa
  question: 签名检查提示缺少公钥，能否直接断言包已被篡改？
  answer: 不能。它表示当前信任库无法完成签名来源验证；仍需从可信渠道取得正确公钥并核对指纹。
  extra: 也不能因此把包当作可信。
  source:
