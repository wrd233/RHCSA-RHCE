- id: RHCSA-16-D01-QA-008
  type: qa
  question: '`rpm -V` 只有 `T` 差异，能否据此断言文件内容改变？'
  answer: 不能。`T` 表示修改时间不同；应结合摘要、大小和内容证据判断。
