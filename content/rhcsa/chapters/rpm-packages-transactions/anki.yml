- id: RHCSA-16-O02-QA-010
  type: qa
  question: 收到第三方本地 RPM 后，安装前的主要检查顺序是什么？
  answer: 文件可读 → 包头和 NEVRA → 架构 → 文件/配置 → 依赖和脚本 → 签名策略 → 当前已安装版本 → DNF 事务摘要。
  extra: ''
