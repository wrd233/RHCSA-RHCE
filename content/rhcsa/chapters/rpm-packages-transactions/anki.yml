  type: qa
  question: 本地 RPM 任务完成后，最小验收矩阵包含哪些层次？
  answer: 包文件信任 → 事务 → 最终 NEVRA → 关键文件/归属 → 配置迁移 → unit 当前/持久状态 → 真实功能 → history。
