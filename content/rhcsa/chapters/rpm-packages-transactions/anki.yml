- id: RHCSA-16-D01-QA-002
  type: qa
  question: 包显示已安装，但关键文件缺失，下一步最有区分度的证据是什么？
  answer: 先确认当前版本清单中是否仍声明该路径：`rpm -ql <PACKAGE>`，再用 `rpm -V` 判断缺失。
  extra: ''
