- id: RHCSA-16-K02-QA-001
  type: qa
  question: RPM 数据库主要记录什么？
  answer: 已安装包的包头、NEVRA、文件清单、文件属性基线、依赖和脚本等元数据。
  extra: 它记录包管理状态，不等同于应用实时状态。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::rpm-database
  - card::concept
  - priority::P0
- id: RHCSA-16-K02-QA-002
  type: qa
  question: '`rpm -qf /path` 成功与 `rpm -V <PACKAGE>` 无输出分别证明什么？'
  answer: '`-qf` 证明某已安装包声明拥有该路径；`-V` 无输出表示本次可检查属性未发现与数据库基线的差异。'
  extra: 两者都不能证明应用功能正常。
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::rpm-database
  - card::comparison
  - priority::P0
- id: RHCSA-16-K02-QA-003
  type: qa
  question: 为什么 `ls /path` 成功不能证明该文件受 RPM 管理？
  answer: 因为文件可能由管理员、脚本、源码安装或应用运行时创建；必须用 `rpm -qf` 检查归属。
  extra: ''
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::rpm-database
  - card::boundary
  - priority::P0
- id: RHCSA-16-K02-QA-004
  type: qa
  question: '`rpm -ql`、`rpm -qc`、`rpm -qd` 的集合关系是什么？'
  answer: '`-ql` 列出包记录的全部路径；`-qc` 和 `-qd` 分别是配置文件与文档文件的分类视图。'
  extra: ''
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
  - exam::rhcsa
  - chapter::rpm-packages-transactions
  - topic::rpm-database
  - card::comparison
  - priority::P0
- id: RHCSA-16-K02-QA-005
  type: qa
  question: 为什么不应使用 `rpm -ql <PACKAGE> | grep /etc` 代替 `rpm -qc <PACKAGE>`？
  answer: 配置文件不一定都在 `/etc`，而 `/etc` 下的路径也不一定被 RPM 标记为配置文件。
  extra: ''
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
