  - topic::rpm-database
  - card::output
  - priority::P1
- id: RHCSA-16-K02-QA-007
  type: qa
  question: RPM 文件归属与“最后修改者”有什么区别？
  answer: 归属表示哪个已安装包声明该路径；最后修改者可能是管理员、应用、脚本或配置管理系统。
  extra: ''
  source:
