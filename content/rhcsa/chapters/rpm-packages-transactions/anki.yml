- id: RHCSA-16-O01-QA-012
  type: qa
  question: '`rpm -qf <PATH>` 报没有任何包拥有该文件，下一步不应直接做什么？'
  answer: 不应直接删除或认定文件恶意；应调查它是否由管理员、应用、源码安装、运行时或未安装包创建。
