- id: RHCSA-16-O04-QA-012
  type: qa
  question: DNF 事务摘要计划删除大量超出目标的包，最合理的动作是什么？
  answer: 取消事务，保留摘要并调查依赖关系和真正目标，而不是加 `--allowerasing` 或 `--nodeps`。
  extra: ''
