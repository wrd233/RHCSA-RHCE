- id: RHCSA-16-O02-QA-008
  type: qa
  question: 为什么不应从与未知 RPM 相同的未验证来源下载公钥后立即信任？
  answer: 因为包和 key 可能同时被替换，无法建立独立信任链。应通过受控渠道核对公钥指纹。
