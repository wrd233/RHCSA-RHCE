- id: RHCSA-16-K03-QA-001
  type: qa
  question: 升级后出现 `.rpmnew`，常见含义是什么？
  answer: 当前正式配置被保留，新包提供的候选配置被旁置为 `.rpmnew`，等待管理员比较和合并。
  extra: 具体行为仍取决于包的配置标记和文件状态。
  source:
  - rpm(8)
  - dnf(8)
  - RH124-RHEL9-Ch14
  tags:
