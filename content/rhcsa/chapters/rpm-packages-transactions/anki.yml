- id: RHCSA-16-D01-QA-005
  type: qa
  question: DNF 成功但命令仍找不到，应按什么顺序调查？
  answer: '`rpm -q` → `rpm -ql` 确认是否提供命令 → `command -v`/PATH → `rpm -qf` → `stat`/`rpm -V` → Shell 缓存和解释器。'
