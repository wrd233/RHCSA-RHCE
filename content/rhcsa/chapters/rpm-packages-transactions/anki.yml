  - chapter::rpm-packages-transactions
  - topic::rpm-database
  - card::boundary
  - priority::P1
- id: RHCSA-16-K02-QA-006
  type: qa
  question: 某路径被人工删除后，为什么 `rpm -ql <PACKAGE>` 仍可能列出它？
  answer: 因为 `rpm -ql` 读取 RPM 数据库中的包清单，而不是实时扫描磁盘。
  extra: '`rpm -V` 可进一步报告路径缺失。'
  source:
  - rpm(8)
  - RH124-RHEL9-Ch14
  tags:
