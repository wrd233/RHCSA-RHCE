- id: RHCSA-16-O04-QA-011
  type: qa
  question: 为什么不把 `dnf --nogpgcheck` 当作签名问题的默认修复？
  answer: 它跳过来源和完整性保护，没有解决公钥、来源或包文件本身的问题。
