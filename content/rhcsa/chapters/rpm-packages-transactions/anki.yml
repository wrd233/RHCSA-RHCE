- id: RHCSA-16-K02-QA-008
  type: qa
  question: 为什么管理脚本不应直接依赖 RPM 数据库的内部文件和后端格式？
  answer: 内部实现可能随版本变化；稳定接口是 `rpm` 和 DNF 提供的查询与事务命令。
  extra: ''
