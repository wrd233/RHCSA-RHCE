- id: RHCSA-16-K03-QA-003
  type: qa
  question: '`.rpmnew` 与 `.rpmsave` 的主要区别是什么？'
  answer: '`.rpmnew` 常见为保留当前文件、旁置新版本；`.rpmsave` 常见为正式路径使用新版本、保存旧文件。'
  extra: 不能把这一描述当作所有包的固定公式。
  source:
  - rpm(8)
  - dnf(8)
  - RH124-RHEL9-Ch14
