- id: RHCSA-16-O04-QA-010
  type: qa
  question: '`rpm --force` 为什么是高风险选项？'
  answer: 它会放宽包替换、文件冲突和旧版本等保护，可能覆盖现有文件或破坏版本关系。
  extra: ''
