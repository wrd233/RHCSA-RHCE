- id: RHCSA-16-K03-QA-006
  type: qa
  question: 处理旁置配置文件的正确流程是什么？
  answer: 定位并确认所属事务 → `diff -u` → 识别新增/废弃参数 → 选择性合并 → 应用语法检查 → 备份和原子替换 → reload/restart → 功能验证。
  extra: ''
