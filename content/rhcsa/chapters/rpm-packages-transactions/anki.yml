  - chapter::rpm-packages-transactions
  - topic::config-preservation
  - card::concept
  - priority::P0
- id: RHCSA-16-K03-QA-002
  type: qa
  question: 升级后出现 `.rpmsave`，常见含义是什么？
  answer: 新包版本取得正式配置路径，旧的本地配置被保存为 `.rpmsave`。
  extra: 需要迁移仍有效的本地设置。
  source:
  - rpm(8)
  - dnf(8)
  - RH124-RHEL9-Ch14
