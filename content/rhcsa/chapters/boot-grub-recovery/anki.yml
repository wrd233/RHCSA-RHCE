  - priority::P0
- id: RHCSA-30-D01-QA-006
  type: qa
  question: 失败 unit 为 `data.mount`，怎样把它与 `/etc/fstab` 对应起来？
  answer: 查看 unit 状态中的挂载点，并检查 `/data` 对应的 `fstab` 行；可用 `systemd-escape --path --suffix=mount /data` 验证名称。
  extra: 不要批量注释其他行。
  source:
  - systemd-escape(1)
  - systemd.mount(5)
  tags:
