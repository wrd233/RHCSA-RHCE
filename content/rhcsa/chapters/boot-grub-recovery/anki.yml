  type: qa
  question: GRUB 菜单临时编辑与 `grubby --update-kernel` 的生命周期区别是什么？
  answer: 前者只影响一次启动；后者修改持久启动条目，影响未来启动。
  extra: 恢复场景通常优先临时编辑。
