- id: RHCSA-30-D01-QA-010
  type: qa
  question: 题目要求必需数据卷开机挂载，但当前条目错误。允许的最小修复是什么？
  answer: 从 `blkid`/`lsblk -f` 获取真实身份，只修正对应 `fstab` 字段，并完成静态、当前和重启后验证。
  extra: 不能注释条目或用 `nofail` 改写目标要求。
