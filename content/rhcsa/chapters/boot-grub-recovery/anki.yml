- id: RHCSA-30-O02-QA-001
  type: qa
  question: 怎样只为一次启动临时追加 kernel 参数？
  answer: 进入 GRUB 菜单，选择条目按 `e`，在 kernel command line 末尾追加参数，再按界面提示继续启动。
  extra: 该操作正常情况下不回写持久 BLS 条目。
  source:
  - RHEL9 kernel documentation
  tags:
