- id: RHCSA-30-D02-QA-005
  type: qa
  question: '`journalctl -b` 与 `journalctl -b -p err` 的区别是什么？'
  answer: 前者保留本次启动完整时间线；后者只筛较高错误优先级，可能漏掉因果上下文。
  extra: 诊断通常先看错误，再根据需要回到完整上下文。
