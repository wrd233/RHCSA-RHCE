  - chapter::boot-grub-recovery
  - topic::root-password
  - card::process
  - priority::P0
- id: RHCSA-30-O03-QA-007
  type: qa
  question: root 口令恢复后，最终功能验证是什么？
  answer: 在正常启动的真实系统中使用新口令完成 root 认证。
  extra: '`passwd` 返回成功只证明修改动作完成，不等于认证终态。'
  source:
