- id: RHCSA-30-D01-QA-002
  type: qa
  question: 怎样对 `/etc/fstab` 做静态验证？
  answer: '```bash

    findmnt --verify

    ```'
  extra: 静态通过不能代替真实 `mount -a` 和目标 `findmnt`。
