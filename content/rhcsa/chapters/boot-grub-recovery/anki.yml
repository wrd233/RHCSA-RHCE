- id: RHCSA-30-D03-QA-001
  type: qa
  question: 启动配置变更的稳健工作流是什么？
  answer: 建立基线 → 最小变更 → 静态与当前验证 → 确认控制台/回退 → 受控重启 → 用同一对象复验。
  extra: 重启不是第一条诊断命令。
  source:
  - RHCSA-30 lecture.md
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::process
  - priority::P0
- id: RHCSA-30-D03-QA-002
  type: qa
  question: 为什么不应同时修改默认 kernel、全部参数、default target 和多条 `fstab`？
  answer: 多个变量同时改变会扩大故障面，并使重启失败后难以识别根因。
  extra: 一次只改变一个启动维度。
  source:
  - RHCSA-30 lecture.md
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::boundary
  - priority::P0
- id: RHCSA-30-D03-QA-003
  type: qa
  question: 持久 kernel 参数重启前后应分别用什么证据？
  answer: 重启前用 `grubby --info=ALL` 验证条目；重启后用 `/proc/cmdline` 验证实际生效。
  extra: 同一对象前后对应。
  source:
  - grubby(8)
  - proc_cmdline(5)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::verification
  - priority::P0
- id: RHCSA-30-D03-QA-004
  type: qa
  question: default target 变更重启前后应如何验证？
  answer: 重启前后都检查 `systemctl get-default`，重启后再检查 active target 和目标功能。
  extra: default 值不等于当前已达到。
  source:
  - systemctl(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::verification
  - priority::P0
- id: RHCSA-30-D03-QA-005
  type: qa
  question: 远程服务器没有控制台时，为什么应谨慎执行启动链变更和 reboot？
  answer: 错误可能在重启时才暴露，并同时切断唯一网络管理通道。
  extra: 应先确认 BMC/控制台、回退条目和变更窗口。
  source:
  - RHCSA-30 lecture.md
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::boundary
  - priority::P0
- id: RHCSA-30-D03-QA-006
  type: qa
  question: 口令恢复时把 SELinux 永久设为 permissive 能否作为完成终态？
  answer: 不能。它改变安全要求并掩盖标签问题；应保持原模式并使用 `/.autorelabel`。
  extra: 安全终态必须单独验证。
  source:
  - RHEL9 SELinux documentation
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::security
  - priority::P0
- id: RHCSA-30-D03-QA-007
  type: qa
  question: 修改 `fstab` 后当前验证全部通过，任务还要求重启持久。重启后最少检查哪些对象？
  answer: '`systemctl --failed`、目标 `findmnt`、default/active target 以及本次 boot Journal。'
  extra: 还应验证题目要求的实际功能。
  source:
  - RHCSA-30 lecture.md
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::reboot-risk
  - card::task
  - priority::P1
- id: RHCSA-30-D03-CLOZE-001
