- id: RHCSA-30-D01-QA-004
  type: qa
  question: 修改 `fstab` 后，为什么要执行 `systemctl daemon-reload`？
  answer: 让 systemd 重新运行/读取生成关系，使 mount unit 反映新的 `fstab`。
  extra: 它不等于已经实际挂载目标。
  source:
  - systemctl(1)
