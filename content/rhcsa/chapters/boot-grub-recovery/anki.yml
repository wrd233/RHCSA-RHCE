  - priority::P1
- id: RHCSA-30-K02-QA-006
  type: qa
  question: 当前系统在维护 target 中，怎样请求回到持久 default target？
  answer: '```bash

    systemctl default

    ```'
  extra: 执行前仍要评估依赖启动和当前维护工作是否完成。
  source:
  - systemctl(1)
