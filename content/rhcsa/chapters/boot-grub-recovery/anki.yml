- id: RHCSA-30-K02-QA-007
  type: qa
  question: 为什么 `graphical.target` 与 `multi-user.target` 可能同时显示 active？
  answer: '`graphical.target` 通常依赖 `multi-user.target`；active target 表示依赖同步点，不是互斥运行级别。'
  extra: 多行 active 不是异常。
  source:
  - systemd.special(7)
