- id: RHCSA-30-K02-QA-001
  type: qa
  question: systemd target 的本质是什么？
  answer: 一组 unit 依赖和同步关系，用来表示系统要达到的状态集合。
  extra: 它不是一个长期运行的传统“运行级别进程”。
  source:
  - systemd.target(5)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
  - card::concept
  - priority::P0
- id: RHCSA-30-K02-QA-002
  type: qa
  question: '`systemctl get-default` 与 `systemctl list-units --type=target --state=active` 分别看什么？'
  answer: 前者看持久默认启动目标；后者看当前已达到的 target。
  extra: default 与 active 必须分开验证。
  source:
  - systemctl(1)
