- id: RHCSA-30-D02-QA-006
  type: qa
  question: 为什么固件阶段故障通常无法从 `journalctl -b -1` 得到证据？
  answer: 当时 Linux kernel 和 Journal 尚未运行，事件没有进入 systemd 日志链。
  extra: 应使用控制台、BMC 和固件证据。
  source:
  - RHCSA-30 lecture.md
  tags:
