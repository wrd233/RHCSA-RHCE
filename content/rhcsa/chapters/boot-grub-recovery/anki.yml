  - priority::P0
- id: RHCSA-30-K02-QA-005
  type: qa
  question: 怎样只让本次启动进入 emergency target？
  answer: 在 kernel command line 临时追加 `systemd.unit=emergency.target`。
  extra: 该参数只影响本次启动。
  source:
  - systemd(1)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
