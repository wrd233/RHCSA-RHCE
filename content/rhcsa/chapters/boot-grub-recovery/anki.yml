- id: RHCSA-30-O02-QA-007
  type: qa
  question: 为什么日常参数管理不优先直接编辑生成后的 `grub.cfg`？
  answer: 生成文件可能被后续工具覆盖，且复杂内容更易误改；RHEL 9 优先通过 `grubby` 管理条目。
  extra: GRUB 重装与主配置恢复不在本章主线。
