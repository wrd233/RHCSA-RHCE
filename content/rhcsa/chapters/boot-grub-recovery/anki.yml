- id: RHCSA-BOOT-QA-001
  type: qa
  question: RHEL 9 主机从固件到登录环境的核心启动链是什么？
  answer: '`firmware → GRUB → kernel 与 initramfs → 真实根文件系统 → systemd PID 1 → default target`。'
  extra: 每一阶段能读取的配置和证据不同。故障诊断应先判断控制权已经到哪一层。
  source:
  - RH134-RHEL9
  - RHCSA细分课件18 pp.15-16
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::process
  - priority::P0
- id: RHCSA-BOOT-QA-002
  type: qa
  question: 怎样查询当前持久默认 target，并把下次正常启动目标设置为 `multi-user.target`？
  answer: '```bash

    systemctl get-default

    systemctl set-default multi-user.target

    ```'
  extra: '`set-default` 不会自动切换当前运行状态；修改后再次执行 `get-default`。'
  source:
  - systemctl(1)
  - systemd.special(7)
  - RHCSA细分课件18 p.13
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-003
  type: qa
  question: 在远程主机执行 `systemctl isolate rescue.target` 前，最重要的风险判断是什么？
  answer: 确认切换会停止哪些非目标依赖 unit，以及网络、SSH 或当前会话是否会中断；应先确保有控制台或回退通道。
  extra: '`isolate` 改变当前运行集合，不等同于只查看 target，也不改变持久 default target。'
  source:
  - systemctl(1)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
  - card::boundary
  - priority::P0
- id: RHCSA-BOOT-QA-004
  type: qa
  question: 使用 `rd.break` 进入 shell 后，当前 `/` 和真实系统根通常分别在哪里？
  answer: 当前 `/` 是 initramfs 的临时根；真实系统根通常挂载在 `/sysroot`。
  extra: 这就是后续需要 remount `/sysroot` 并 `chroot /sysroot` 的原因。
  source:
  - dracut(8)
  - RH134-RHEL9
  - RHCSA细分课件18 pp.21-22
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::comparison
  - priority::P0
- id: RHCSA-BOOT-QA-005
  type: qa
  question: '`rd.break` shell 中，怎样把真实根重新挂载为读写并验证？'
  answer: '```bash

    mount -o remount,rw /sysroot

    findmnt -no TARGET,SOURCE,FSTYPE,OPTIONS /sysroot

    ```'
  extra: 先用 `findmnt /sysroot` 确认作用对象；不能只凭 `mount` 无报错判断成功。
  source:
  - mount(8)
  - findmnt(8)
  - RHCSA细分课件18 p.22
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-006
  type: qa
  question: '`chroot /sysroot` 在口令恢复流程中改变了什么？'
  answer: 它把当前进程的路径解析根改为 `/sysroot`，使 `/etc/shadow`、`/.autorelabel` 等路径指向真实系统。
  extra: '`chroot` 不会启动新 kernel、创建完整容器或让磁盘 systemd 自动成为当前 PID 1。'
  source:
  - chroot(1)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::boundary
  - priority::P0
- id: RHCSA-BOOT-QA-007
  type: qa
  question: 在 `rd.break` 口令恢复中，为什么要在 chroot 内执行 `touch /.autorelabel`？
  answer: 它在真实根中创建下一次启动的 SELinux 全盘重标记请求，避免修改后的安全文件保留错误标签。
  extra: 该命令不是立即完成重标记；若在 chroot 前执行，文件会落在 initramfs 临时根。
  source:
  - RHEL9 basic system settings documentation
  - RHCSA细分课件18 p.22
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::selinux-relabel
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-008
  type: qa
  question: 系统因疑似 `/etc/fstab` 错误进入 emergency，推荐的证据链是什么？
  answer: '`systemctl --failed → journalctl -b → 映射失败 mount unit 与 fstab 行 → lsblk -f/blkid → findmnt --verify → 最小修复 → daemon-reload
    → mount -a → findmnt 目标 → 重启复验`。'
  extra: 不要从“进入 emergency”直接跳到注释 fstab 或格式化设备。
  source:
  - fstab(5)
  - systemd.mount(5)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::fstab-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-009
  type: qa
  question: 什么时候可以考虑在 `fstab` 中使用 `nofail`，什么时候不应使用？
  answer: 只有业务明确允许该挂载缺失且系统仍应继续启动时才评估；必需数据或系统挂载不能用 `nofail` 掩盖真实故障。
  extra: 选项选择必须来自目标终态，而不是为了让错误暂时不阻断启动。
  source:
  - fstab(5)
  - systemd.mount(5)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::fstab-recovery
  - card::boundary
  - priority::P0
- id: RHCSA-BOOT-QA-010
  type: qa
  question: 系统已经进入 systemd emergency，哪两类命令最适合先定位本次启动失败？
  answer: '```bash

    systemctl --failed

    journalctl -b

    ```'
  extra: 前者列失败 unit，后者给出本次启动的时间序列；可再按 unit、kernel 或优先级收窄。
  source:
  - systemctl(1)
  - journalctl(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-evidence
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-011
  type: qa
  question: 在 `rd.break` shell 中直接执行 `passwd root` 后，正常启动仍无法使用新口令。最可能遗漏了什么作用域步骤？
  answer: 没有先 `chroot /sysroot`，因此 `passwd` 未必修改真实磁盘系统的账号数据库。
  extra: 下一步应确认 `/sysroot`、读写挂载状态和实际被修改的文件环境，而不是重复改口令。
  source:
  - chroot(1)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-012
  type: qa
  question: '`multi-user.target` 显示 active 能否证明所有服务器业务功能正确？'
  answer: 不能。它只证明该 target 的同步点已达到；仍需验证目标服务、监听、挂载、数据和外部功能。
  extra: target 状态是启动层证据，不是全部业务终态。
  source:
  - systemd.special(7)
  - systemctl(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
  - card::verification
  - priority::P0
- id: RHCSA-BOOT-QA-013
  type: qa
  question: '`rescue.target` 与 `emergency.target` 的主要区别是什么？'
  answer: '`rescue.target` 提供较完整的单用户维护环境；`emergency.target` 只拉起极少依赖，适合更早、更严重的故障。'
  extra: 根是否只读不能仅靠 target 名称判断，应使用 `findmnt /`。
  source:
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::comparison
  - priority::P0
- id: RHCSA-BOOT-QA-014
  type: qa
  question: 使用 `rd.break` 恢复 root 口令的核心流程是什么？
  answer: '`GRUB 临时追加 rd.break → remount /sysroot 为 rw → chroot /sysroot → passwd root → touch /.autorelabel → exit 两次 → 正常启动后验证`。'
  extra: 流程卡训练顺序；每一步仍应以阶段、根和验证证据为依据。
  source:
  - RH134-RHEL9
  - RHCSA细分课件18 pp.21-22
  - RHCSA9.0模拟题 p.12
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::process
  - priority::P0
- id: RHCSA-30-K01-QA-001
  type: qa
  question: firmware 在 Linux 启动链中的职责边界是什么？
  answer: 完成基本硬件初始化、选择可启动设备并进入 boot loader；它不读取 `fstab`，也不启动 systemd 服务。
  extra: 若尚未进入 kernel，Journal 通常无法提供该阶段证据。
  source:
  - RH134-RHEL9
  - RHCSA细分课件18 p.15
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::concept
  - priority::P0
- id: RHCSA-30-K01-QA-002
  type: qa
  question: GRUB 启动条目向下一阶段提供哪三类核心内容？
  answer: kernel image、initramfs image 和 kernel command line。
  extra: 菜单标题和默认选择用于选择条目，但真正交给 kernel 的关键是镜像与参数。
  source:
  - grubby(8)
  - RHCSA细分课件18 p.15
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::comparison
  - priority::P0
- id: RHCSA-30-K01-QA-003
  type: qa
  question: initramfs 为什么存在？
  answer: 它提供早期用户空间，装载访问真实根所需模块、发现存储并把真实根挂载到 `/sysroot`。
  extra: 它解决“必须先访问根才能获得访问根的能力”的依赖问题。
  source:
  - dracut(8)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::concept
  - priority::P0
- id: RHCSA-30-K01-QA-004
  type: qa
  question: 看到启动故障时，为什么不应立即执行 `dracut -f`？
  answer: 因为重建 initramfs 只有在证据指向 initramfs 内容缺失、损坏或硬件适配问题时才合理；其他阶段故障不会因此修复。
  extra: 先判断失败阶段和根因。
  source:
  - dracut(8)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::boundary
  - priority::P1
- id: RHCSA-30-K01-QA-005
  type: qa
  question: initramfs 阶段的 systemd 与正常根中的 systemd 有什么关键差异？
  answer: 前者运行于早期用户空间并负责找到、挂载真实根；根切换后使用磁盘系统中的 systemd 继续正常启动。
  extra: 不要把 initramfs shell 当作完整正常系统。
  source:
  - dracut(8)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::boot-chain
  - card::comparison
  - priority::P0
- id: RHCSA-30-K01-QA-006
  type: qa
  question: 控制台仍停在固件“无可启动设备”，下一条最有区分度的证据是什么？
  answer: 检查固件/BMC 是否识别目标磁盘及启动顺序，而不是先查 systemd Journal。
  extra: Linux 内核尚未运行。
  source:
