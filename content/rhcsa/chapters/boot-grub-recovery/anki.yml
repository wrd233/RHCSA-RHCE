  - priority::P0
- id: RHCSA-30-K02-QA-004
  type: qa
  question: 怎样只让本次启动进入 rescue target，而不改变持久 default？
  answer: 在 kernel command line 临时追加 `systemd.unit=rescue.target`。
  extra: 正常启动后 `systemctl get-default` 应保持原值。
  source:
  - systemd(1)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
