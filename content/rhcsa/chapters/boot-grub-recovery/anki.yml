- id: RHCSA-30-T01-QA-001
  type: qa
  question: root 口令恢复任务的完整验收不应只看 `passwd`，还包括哪些状态？
  answer: 真实根写入、SELinux 重标记、临时参数未持久化、default target 未改变、正常启动、failed unit 与实际 root 认证。
  extra: 这是综合任务卡，答案按验收对象组织。
  source:
  - RHCSA-30 lecture.md
  - RHCSA9.0模拟题 p.12
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::classic-task-root
  - card::task
  - priority::P0
- id: RHCSA-30-T02-QA-001
  type: qa
  question: '`fstab` emergency 任务的最终持久验收是什么？'
  answer: 受控重启后系统无需人工干预到达原 default target，目标文件系统以正确 source/fstype/options 挂载，相关 mount unit 不失败。
  extra: 离开 emergency 不是唯一终态。
  source:
  - RHCSA-30 lecture.md
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::classic-task-fstab
  - card::task
  - priority::P0
