  - priority::P0
- id: RHCSA-30-O03-QA-009
  type: qa
  question: SELinux 重标记进行时为什么不应强制断电？
  answer: 重标记遍历文件系统并更新标签；中断可能留下不完整的标签状态。
  extra: 应等待完成并在启动后检查模式、failed unit 和 Journal。
  source:
