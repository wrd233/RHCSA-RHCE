  - chapter::boot-grub-recovery
  - topic::fstab-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-30-D01-QA-008
  type: qa
  question: 已有数据文件系统因 `fstab` 错误未挂载，为什么不能直接执行 `mkfs`？
  answer: '`mkfs` 会创建新文件系统并可能破坏原数据；配置、身份或选项错误不需要格式化。'
  extra: 先以 `lsblk -f`、`blkid`、日志和 `findmnt` 取证。
  source:
  - mkfs(8)
