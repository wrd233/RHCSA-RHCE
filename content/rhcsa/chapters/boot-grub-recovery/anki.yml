- id: RHCSA-30-D02-QA-007
  type: qa
  question: Journal 中出现某 service 的 “Started” 是否证明业务功能正确？
  answer: 不能。它通常只证明 unit 启动动作成功；仍需验证监听、请求、数据或业务响应。
  extra: 启动证据与功能证据分层。
  source:
  - systemd.service(5)
  - journalctl(1)
