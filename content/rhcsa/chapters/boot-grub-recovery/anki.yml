- id: RHCSA-30-D01-QA-003
  type: qa
  question: 怎样查看块设备真实 UUID、LABEL 和文件系统类型？
  answer: '```bash

    lsblk -f

    blkid

    ```'
  extra: 不要编造 UUID 或只依赖易变化的 `/dev/sdX` 名称。
