  - priority::P0
- id: RHCSA-30-K02-QA-003
  type: qa
  question: 怎样查询当前 active target？
  answer: '```bash

    systemctl list-units --type=target --state=active

    ```'
  extra: 系统可同时有多个 active target，因为 target 之间存在依赖。
  source:
  - systemctl(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::target-state
