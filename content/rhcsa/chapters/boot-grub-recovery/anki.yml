  - topic::fstab-recovery
  - card::boundary
  - priority::P0
- id: RHCSA-30-D01-QA-009
  type: qa
  question: 修复 `fstab` 后的当前验证顺序是什么？
  answer: '`daemon-reload → findmnt --verify → mount -a → findmnt <TARGET> → systemctl --failed`。'
  extra: 当前闭环后再进行受控重启。
  source:
