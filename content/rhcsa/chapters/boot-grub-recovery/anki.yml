- id: RHCSA-30-K03-QA-001
  type: qa
  question: '`rd.break` 与 `emergency.target` 最关键的阶段差异是什么？'
  answer: '`rd.break` 在 initramfs 根切换前中断；`emergency.target` 属于真实系统中的最小 systemd 目标。'
  extra: 因此真实根路径和可用证据不同。
  source:
  - dracut(8)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::comparison
  - priority::P0
- id: RHCSA-30-K03-QA-002
  type: qa
  question: 进入 emergency shell 后，怎样判断根是否只读？
  answer: '```bash

    findmnt -no TARGET,SOURCE,FSTYPE,OPTIONS /

    ```'
  extra: 不能仅根据“emergency”名称假设固定挂载模式。
  source:
  - findmnt(8)
  - systemd.special(7)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::verification
  - priority::P0
- id: RHCSA-30-K03-QA-003
  type: qa
  question: 正常系统或 systemd emergency 中，根为只读时怎样重挂载为读写？
  answer: '```bash

    mount -o remount,rw /

    ```'
  extra: 先用 `findmnt /` 确认当前根和选项。
  source:
  - mount(8)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::command
  - priority::P1
- id: RHCSA-30-K03-QA-004
  type: qa
  question: '`chroot /sysroot` 为什么不等于启动了一个容器？'
  answer: 它主要改变路径解析根，不自动创建完整 namespace、启动新 kernel 或新 PID 1。
  extra: 复杂救援可能还需绑定 `/dev`、`/proc`、`/sys`，但不属于本章口令恢复主流程。
  source:
  - chroot(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::boundary
  - priority::P1
- id: RHCSA-30-K03-QA-005
  type: qa
  question: 维护 shell 中不确定当前真实根在哪里，下一条最有区分度的命令是什么？
  answer: 分别执行 `findmnt /` 和必要时 `findmnt /sysroot`，结合 `/proc/cmdline` 判断当前阶段。
  extra: 先判根，再改文件。
  source:
  - findmnt(8)
  - proc_cmdline(5)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::recovery-env
  - card::diagnosis
  - priority::P0
- id: RHCSA-30-O03-QA-001
  type: qa
  question: 在 GRUB 中为口令恢复追加的最小参数是什么？
  answer: '`rd.break`。'
  extra: 只追加该参数，不删除原有启动参数，也不写入持久条目。
  source:
  - dracut(8)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::parameter
  - priority::P0
- id: RHCSA-30-O03-QA-002
  type: qa
  question: 进入 `rd.break` shell 后，怎样先证明本次确实使用了断点参数？
  answer: '```bash

    cat /proc/cmdline

    ```'
  extra: 输出中应包含 `rd.break`。
  source:
  - proc_cmdline(5)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::verification
  - priority::P0
- id: RHCSA-30-O03-QA-003
  type: qa
  question: 在真实根中交互修改 root 口令的命令是什么？
  answer: '```bash

    passwd root

    ```'
  extra: 推荐交互输入，避免把明文口令写入历史或进程参数。
  source:
  - passwd(1)
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::command
  - priority::P0
- id: RHCSA-30-O03-QA-004
  type: qa
  question: 为什么本章不把 `echo 密码 | passwd --stdin root` 作为默认答案？
  answer: 它会把明文口令暴露在命令文本、历史或记录中；交互 `passwd root` 更符合最小暴露原则。
  extra: 模拟题写法用于识别题型，不覆盖安全边界。
  source:
  - passwd(1)
  - RHCSA9.0模拟题 p.12
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::root-password
  - card::security
  - priority::P0
- id: RHCSA-30-O03-QA-005
  type: qa
  question: 在 chroot 内创建重标记请求后，怎样静态确认文件位于真实根？
  answer: '```bash

    ls -l /.autorelabel

    ```'
  extra: 真正的重标记要到下一次启动才执行。
  source:
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::boot-grub-recovery
  - topic::selinux-relabel
  - card::verification
  - priority::P1
- id: RHCSA-30-O03-QA-006
  type: qa
  question: 为什么恢复流程通常要执行两次 `exit`？
  answer: 第一次退出 chroot 回到 initramfs shell；第二次退出断点 shell，让启动继续。
  extra: 这反映了两个嵌套环境。
  source:
  - RH134-RHEL9
  tags:
