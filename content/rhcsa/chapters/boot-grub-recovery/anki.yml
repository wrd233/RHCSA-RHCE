  - priority::P0
- id: RHCSA-30-O03-QA-008
  type: qa
  question: 恢复后怎样确认 `rd.break` 没有被持久化？
  answer: 正常启动后执行 `cat /proc/cmdline`，并可同时用 `grubby --info=ALL` 检查条目。
  extra: 临时参数不应出现在未来条目。
  source:
