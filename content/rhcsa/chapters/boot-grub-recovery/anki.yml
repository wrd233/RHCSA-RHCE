- id: RHCSA-30-O01-QA-008
  type: qa
  question: RHEL 9 主机启动时没有显示 GRUB 菜单，但系统能继续启动。首先应如何理解？
  answer: 菜单可能被自动隐藏，不等于 GRUB 未运行；可在启动时尝试 `Esc`、`F8` 或 `Shift` 进入。
  extra: 按键时机受固件和控制台影响，需 live 环境确认。
  source:
