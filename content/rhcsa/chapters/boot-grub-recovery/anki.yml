- id: RHCSA-30-O02-QA-006
  type: qa
  question: 执行 `rd.break` 恢复时，为什么不应删除现有 kernel 参数直到只剩 `ro`？
  answer: 现有参数可能包含根设备、LVM、console 等启动所需信息；无证据删除会制造新故障。
  extra: 只在行末追加 `rd.break` 即可。
