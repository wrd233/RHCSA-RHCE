  - card::diagnosis
  - priority::P0
- id: RHCSA-30-D01-QA-007
  type: qa
  question: Journal 报告设备 UUID 不存在，下一条最有区分度的证据是什么？
  answer: 执行 `lsblk -f` 和 `blkid`，比较真实 UUID 与 `fstab` 声明。
  extra: 若真实设备不存在，还要调查设备发现与依赖，而不是随意换成另一个设备。
  source:
  - blkid(8)
  - lsblk(8)
  - fstab(5)
  tags:
