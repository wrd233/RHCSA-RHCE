- id: RHCSA-30-D02-QA-008
  type: qa
  question: 上一次启动失败，但 `journalctl -b -1` 没有记录。合理的下一步是什么？
  answer: 检查 `journalctl --list-boots` 和 Journal 持久化/轮转条件，并结合控制台或外部日志；不要断言没有失败。
  extra: 证据缺失本身也是边界。
  source:
  - journalctl(1)
  - journald.conf(5)
