- id: RHCSA-30-D01-QA-005
  type: qa
  question: '`mount -a` 无输出后，还必须验证什么？'
  answer: 用 `findmnt <TARGET>` 确认目标实际挂载到正确 source、fstype 和 options，并检查 `systemctl --failed`。
  extra: 命令无输出不是完整终态。
  source:
  - mount(8)
  - findmnt(8)
