- id: RHCSA-20-K03-QA-004
  type: qa
  question: '`sshd -t`、`sshd -T` 与 `sshd -T -C ...` 分别回答什么？'
  answer: '`sshd -t` 检查配置能否解析并通过基本文件检查；`sshd -T` 输出全局有效配置；`sshd -T -C ...` 在给定用户、来源和本地连接条件下计算 `Match` 后的有效配置。'
  extra: 三者都不证明服务已经 reload，也不证明独立客户端能够成功登录。
