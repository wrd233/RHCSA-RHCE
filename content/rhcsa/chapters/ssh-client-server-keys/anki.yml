  model: RedHat-QA
  priority: P0
- id: RHCSA-NETWORK-O03-QA-007
  type: qa
  question: SSH 登录成功后，怎样用远程命令证明连接到了正确用户和主机？
  answer: '```bash

    ssh user@host "id && hostname"

    ```'
  extra: 登录提示符不是充分证据；还应确认认证方法符合任务。
