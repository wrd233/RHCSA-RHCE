  model: RedHat-QA
  priority: P0
- id: RHCSA-NETWORK-O03-QA-004
  type: qa
  question: 修改 OpenSSH 服务端配置后，在 reload 前用于检查配置能否解析的命令是什么？
  answer: '```bash

    sshd -t

    ```'
  extra: '`sshd -t` 通过不代表服务已重载，也不代表真实登录成功。'
  source:
