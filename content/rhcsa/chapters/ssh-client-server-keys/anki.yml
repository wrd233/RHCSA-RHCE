- id: RHCSA-20-T02-QA-002
  type: qa
  question: 目标要求 root 直登和口令式认证禁止，验收时应分别测试哪些路径？
  answer: 普通用户指定私钥的 key-only 成功；root 直登失败；普通用户 password/keyboard-interactive-only 失败。
