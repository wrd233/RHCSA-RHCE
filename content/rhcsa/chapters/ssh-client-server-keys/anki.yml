- id: RHCSA-20-K01-QA-001
  type: qa
  question: '`Connection refused` 与 `Permission denied (publickey)` 分别说明 SSH 失败停在哪一层？'
  answer: '`Connection refused` 停在传输/监听层；`Permission denied (publickey)` 表示已连接到 SSH 服务，但用户认证未完成。'
