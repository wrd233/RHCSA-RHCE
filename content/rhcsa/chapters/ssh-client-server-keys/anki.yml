- id: RHCSA-NETWORK-O03-QA-005
  type: qa
  question: 客户端已无法用公钥登录。应组合哪两侧的核心证据，而不是只看一侧？
  answer: 客户端使用 `ssh -vvv` 查看配置、密钥 offer 和最终方法；服务端使用 `journalctl -u sshd` 查看拒绝原因。
  extra: 再根据证据检查有效配置、授权文件、owner/mode 和 SELinux 标签。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
  - exam::rhcsa
  - chapter::ssh-client-server-keys
  - topic::two-sided-diagnosis
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-NETWORK-O03-QA-006
  type: qa
  question: 出现 `REMOTE HOST IDENTIFICATION HAS CHANGED` 时，为什么不能立即删除记录并重连？
  answer: 因为该变化可能来自错误目标或中间人攻击。必须先通过可信渠道核对变更原因和新指纹，再只删除对应主机记录。
  extra: 合法确认后可用 `ssh-keygen -R <host>` 更新。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
  - exam::rhcsa
  - chapter::ssh-client-server-keys
  - topic::host-key-change
  - card::security
