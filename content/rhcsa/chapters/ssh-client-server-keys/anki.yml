- id: RHCSA-20-T01-QA-001
  type: qa
  question: 你已为 `operator1` 安装公钥。怎样用一条测试命令证明指定私钥成功且没有回退到密码？
  answer: "```bash\nssh -i ~/.ssh/rhcsa20_operator \\\n  -o IdentitiesOnly=yes \\\n  -o PreferredAuthentications=publickey\
    \ \\\n  -o PasswordAuthentication=no \\\n  -o KbdInteractiveAuthentication=no \\\n  operator1@servera 'id && hostname'\n\
    ```"
  extra: 成功还需确认 `ssh -vvv` 的最终方法为 publickey、远端用户/主机正确且退出状态为 0。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
