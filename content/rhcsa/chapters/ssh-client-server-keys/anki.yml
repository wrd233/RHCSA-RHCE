- id: RHCSA-20-K01-QA-003
  type: qa
  question: '`ssh -vvv` 中出现 `Authenticated ... using "password"` 说明什么？'
  answer: 最终成功方法是密码，不是公钥；即使此前出现过 `Offering public key`，该公钥认证也没有完成。
