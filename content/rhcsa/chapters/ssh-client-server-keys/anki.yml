- id: RHCSA-20-O02-QA-004
  type: qa
  question: 怎样只用指定私钥测试公钥认证，并禁止 password 与 keyboard-interactive 回退？
  answer: "```bash\nssh -i ~/.ssh/rhcsa20_operator \\\n  -o IdentitiesOnly=yes \\\n  -o PreferredAuthentications=publickey\
    \ \\\n  -o PasswordAuthentication=no \\\n  -o KbdInteractiveAuthentication=no \\\n  user@host\n```"
  extra: '`IdentitiesOnly=yes` 限制候选身份；后三项限制认证方法。测试成功后仍要用 `ssh -vvv` 和远端 `id`/`hostname` 证明方法与对象。'
  source:
