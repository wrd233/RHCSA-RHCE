- id: RHCSA-20-T02-QA-003
  type: qa
  question: 为什么 `sshd -t`、服务 active、端口监听三项全部通过仍不能关闭旧会话？
  answer: 它们没有证明目标用户在新连接中能使用预期认证方法；必须从独立客户端完成登录。
