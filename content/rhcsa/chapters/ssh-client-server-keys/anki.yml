- id: RHCSA-20-D01-QA-001
  type: qa
  question: '`ssh -vvv` 没有出现目标密钥的 `Offering public key`，下一条最有区分度的证据是什么？'
  answer: 先在客户端执行 `ssh -G <alias>` 并核对 `identityfile`、`identitiesonly`、目标用户和端口，再核对私钥权限及 `ssh-add -l`。
  extra: 服务端尚未收到目标公钥，此时先改 `authorized_keys` 或 sshd 策略通常没有区分度。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
