- id: RHCSA-NETWORK-O03-QA-001
  type: qa
  question: 在 SSH 公钥认证中，客户端和服务端分别保存哪一种用户密钥？
  answer: 客户端保存并使用私钥；服务端目标账号的 `~/.ssh/authorized_keys` 保存公钥。
  extra: 私钥不应复制到服务器。主机密钥是另一条信任链。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
  - exam::rhcsa
  - chapter::ssh-client-server-keys
  - topic::user-key-direction
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-NETWORK-O03-QA-002
  type: qa
  question: 在非 FIPS 的 RHEL 9 环境中，为当前用户生成名为 `~/.ssh/rhcsa20_operator` 的 Ed25519 密钥对，命令骨架是什么？
  answer: '```bash

    ssh-keygen -t ed25519 -f ~/.ssh/rhcsa20_operator -C "operator@workstation"

    ```'
  extra: 若环境处于 FIPS 模式或题目要求 RSA，应显式改用允许的算法，例如 `-t rsa -b 3072`。
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
  - exam::rhcsa
  - chapter::ssh-client-server-keys
  - topic::user-key-generation
  - card::command
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-NETWORK-O03-QA-003
  type: qa
  question: 把 `~/.ssh/rhcsa20_operator.pub` 追加授权给远端 `operator@servera`，优先使用什么命令？
  answer: '```bash

    ssh-copy-id -i ~/.ssh/rhcsa20_operator.pub operator@servera

    ```'
  extra: '`-i` 指向公钥文件；该命令需要已有的密码或其他可用认证路径。'
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
  - exam::rhcsa
