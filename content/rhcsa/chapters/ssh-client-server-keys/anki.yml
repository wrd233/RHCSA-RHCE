- id: RHCSA-20-D01-QA-002
  type: qa
  question: '`ssh -vvv` 已出现目标密钥的 `Offering public key`，但服务端未接受，诊断应转向哪里？'
  answer: 转向服务端：核对目标账号、`sshd -T -C ...`、`AuthorizedKeysFile`、授权内容、逐层 owner/mode、SELinux label，并按同一时间窗口查看 `journalctl -u sshd`。
  extra: '`Offering public key` 只证明客户端发送了候选公钥，不证明服务端已授权或接受。'
  source:
  - RH124 Ch.10
  - OpenSSH man pages
