- id: RHCSA-20-K05-QA-001
  type: qa
  question: 用户密钥轮换的安全顺序是什么？
  answer: 生成新密钥 → 追加新公钥 → 用新私钥完成 key-only 验证 → 删除旧公钥 → 记录旧指纹撤销。
  extra: ''
  source:
  - RH124 Ch.10
  - OpenSSH man pages
  tags:
