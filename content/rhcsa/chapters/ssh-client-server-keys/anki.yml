  model: RedHat-QA
  priority: P0
- id: RHCSA-20-T01-QA-002
  type: qa
  question: 专用密钥由 agent 使用时，怎样证明 agent 中身份就是预期公钥？
  answer: 分别执行 `ssh-keygen -lf key.pub` 与 `ssh-add -l`，比较 SHA256 指纹。
