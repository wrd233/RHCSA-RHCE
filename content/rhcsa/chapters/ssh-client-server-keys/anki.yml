- id: RHCSA-20-K02-QA-001
  type: qa
  question: SSH 双向信任中，`known_hosts` 与 `authorized_keys` 分别信任什么对象？
  answer: '`known_hosts` 约束服务器主机身份；`authorized_keys` 约束目标账号允许哪些用户公钥认证。'
  extra: 前者位于客户端信任链，后者位于服务端用户授权链；两者不能互相替代。
  source:
