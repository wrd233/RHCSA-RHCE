- id: RHCSA-20-K05-QA-003
  type: qa
  question: 批量生成 `/etc/ssh/ssh_known_hosts` 时，最关键的信任边界是什么？
  answer: 主机公钥必须来自可信资产或带外流程；仅从不可信网络批量 `ssh-keyscan` 不能建立身份。
