- id: RHCSA-20-D01-QA-003
  type: qa
  question: '`Server accepts key` 能否单独证明已经登录完成？'
  answer: 不能。它说明服务端接受该候选密钥，还应看到最终 `Authenticated ... using "publickey"` 和远端功能结果。
