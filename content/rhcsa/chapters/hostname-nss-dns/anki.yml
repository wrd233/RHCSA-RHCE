- id: RHCSA-19-S01-QA-001
  type: qa
  question: 排查主机名与名称解析问题时，完整调用路径是什么？
  answer: 名称形式 → hostname 身份 → NSS 策略 → hosts/DNS 来源 → resolver 持久与当前状态 → A/AAAA/PTR → getent → 应用功能。
  extra: 用于考试读题和真实故障分层。
