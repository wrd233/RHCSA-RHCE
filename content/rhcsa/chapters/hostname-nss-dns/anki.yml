- id: RHCSA-19-K01-QA-003
  type: qa
  question: 执行 `hostnamectl set-hostname node1.example.com` 后，能否据此断言 DNS 中已经存在同名 A 记录？
  answer: 不能。该命令修改本机 hostname，不会自动发布 DNS 记录。
  extra: 仍需用 `dig` 检查 DNS，并用 `getent` 检查系统解析路径。
  source:
  - hostnamectl(1)
