- id: RHCSA-19-T02-QA-003
  type: qa
  question: 仅缺少 search domain，且题目未要求排除 DHCP DNS 时，为什么不应默认设置 `ipv4.ignore-auto-dns yes`？
  answer: 题目只缺 search domain，并未要求丢弃 DHCP DNS。
