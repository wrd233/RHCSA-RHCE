- id: RHCSA-19-K03-QA-005
  type: qa
  question: NSS 常见状态 `SUCCESS`、`NOTFOUND`、`UNAVAIL`、`TRYAGAIN` 分别表示什么方向？
  answer: 成功、有权威的未找到、来源不可用、暂时失败。
  extra: 具体来源如何映射状态应结合模块和手册。
