- id: RHCSA-19-K03-QA-006
  type: qa
  question: 查看当前主机数据库 NSS 策略的命令是什么？
  answer: '```bash

    grep -E ''^[[:space:]]*hosts:'' /etc/nsswitch.conf

    ```'
  extra: 不要背诵某一发行镜像的默认行来代替实际读取。
