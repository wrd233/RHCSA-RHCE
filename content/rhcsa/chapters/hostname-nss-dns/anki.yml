- id: RHCSA-19-K03-QA-002
  type: qa
  question: '在 `hosts: files dns` 中，`files` 与 `dns` 通常分别对应什么？'
  answer: '`files` 通常读取 `/etc/hosts`；`dns` 通过 resolver 查询 DNS。'
  extra: 当前系统可能还有 `myhostname`、`resolve` 等模块。
  source:
