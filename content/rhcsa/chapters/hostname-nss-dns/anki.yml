- id: RHCSA-19-K01-QA-004
  type: qa
  question: '`hostname` 与 `cat /etc/hostname` 分别主要证明什么？'
  answer: '`hostname` 主要显示当前内核名称；`/etc/hostname` 显示静态持久配置。'
  extra: 当前正确不代表重启后一定保持，持久文件正确也不代表当前状态已应用。
