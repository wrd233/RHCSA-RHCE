  type: qa
  question: 题目要求主机名和 DNS 配置重启后保持。静态持久性证据是什么，真实重启后还要复验什么？
  answer: 静态证据是 `/etc/hostname` 与 NetworkManager connection profile；真实重启后还要重复 hostname、NSS、DNS 和应用功能测试。
  extra: 持久输入正确不等于重启后的运行状态已经验证。
