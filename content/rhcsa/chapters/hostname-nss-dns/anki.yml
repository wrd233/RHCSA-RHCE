- id: RHCSA-19-K02-QA-004
  type: qa
  question: 配置 `search training.example` 后，`node1` 是否必然能解析？
  answer: 不必然。扩展后的 `node1.training.example` 仍必须在某个 NSS 来源中存在。
  extra: search 只生成候选名称。
