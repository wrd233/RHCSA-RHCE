- id: RHCSA-19-K03-QA-003
  type: qa
  question: '`/etc/hosts` 有旧地址且 `files` 位于 `dns` 前时，`getent` 与 `dig` 可能出现什么差异？'
  answer: '`getent` 可能返回旧本地地址，而 `dig` 返回 DNS 中的新地址。'
  extra: 优先修正坏条目，不要用全局重排来源掩盖冲突。
