  type: qa
  question: '`resolv.conf` 中哪个指令用于列出短名搜索域？'
  answer: '`search`。'
  extra: '`domain` 可表示单一搜索域；若 `domain` 与 `search` 同时出现，应以最后出现的有效指令所形成的搜索列表为准。'
