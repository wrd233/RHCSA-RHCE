- id: RHCSA-19-K02-QA-008
  type: qa
  question: '`options ndots:N` 主要影响什么？'
  answer: 影响包含多少个点的名称会优先按绝对名称尝试，以及与 search 的尝试顺序。
  extra: RHCSA 不必背所有分支，但诊断时应分别测试短名、FQDN 和绝对名称。
