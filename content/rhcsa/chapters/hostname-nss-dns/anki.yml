- id: RHCSA-19-K01-QA-006
  type: qa
  question: '`hostnamectl status` 中静态主机名正确，但 `getent hosts` 查询该名称失败。下一步应调查哪一层？'
  answer: 调查 NSS、`/etc/hosts`、resolver 配置和 DNS 记录，而不是重复设置 hostname。
  extra: 主机身份与名称解析是不同对象。
