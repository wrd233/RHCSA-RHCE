- id: RHCSA-19-K03-QA-004
  type: qa
  question: NSS 中类似 `[NOTFOUND=return]` 的结构控制什么？
  answer: 控制某个来源返回特定状态时是停止并返回，还是继续下一个来源。
  extra: 没有明确证据时不要修改全局动作。
