- id: RHCSA-19-K01-QA-007
  type: qa
  question: 为什么 `hostname -f` 不能被当作 `/etc/hostname` 的简单显示？
  answer: 它会尝试通过名称解析得到规范名称，其结果依赖当前 hostname 和 NSS。
  extra: 解析链不完整时，`hostname -f` 可能失败或返回意外名称。
  source:
