- id: RHCSA-19-T02-QA-001
  type: qa
  question: '`dig @server FQDN` 正确、`getent FQDN` 旧、短名失败时的最小修复顺序是什么？'
  answer: 固定同一 FQDN/地址族 → 查 NSS/hosts → 修正旧条目 → 配置 search → 重复 getent/dig → 必要时刷新应用缓存。
  extra: 不重排全局 NSS 来掩盖坏条目。
  source:
