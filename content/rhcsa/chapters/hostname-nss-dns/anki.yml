- id: RHCSA-19-T02-QA-002
  type: qa
  question: '`dig` 与 `getent` 曾返回不同地址。修复后哪四类结果应共同验收？'
  answer: '`getent` FQDN、`getent` 短名、普通/指定服务器 `dig` 可解释、应用请求使用新地址成功。'
  extra: 每条证明不同层。
