- id: RHCSA-19-K03-QA-007
  type: qa
  question: 为什么 `cat /etc/hosts` 不能证明应用一定使用其中的条目？
  answer: 它只证明文件内容存在；NSS 顺序、动作和应用自己的解析方式仍可能改变结果。
  extra: 应使用 `getent hosts` 并最终验证应用。
