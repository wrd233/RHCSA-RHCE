  type: qa
  question: 题目要求主机名重启后保持。静态验证至少要检查哪两类证据？
  answer: 检查当前 hostname 状态和 `/etc/hostname` 的持久配置。
  extra: 真实重启仍需在 live VM 中执行，静态检查不能代替。
