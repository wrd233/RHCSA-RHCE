- id: RHCSA-19-K01-QA-005
  type: qa
  question: pretty hostname 可以直接作为 DNS 主机名使用吗？
  answer: 不应。pretty hostname 是描述性文本，可包含空格或大小写，不受 DNS 标签语法约束。
  extra: 可解析身份应使用合规的 static hostname。
