- id: RHCSA-19-O01-QA-001
  type: qa
  question: 安全修改主机名的推荐流程是什么？
  answer: 建立当前/持久基线 → 设置目标 hostname → 检查当前状态 → 检查 `/etc/hostname` → 验证名称解析 → 在 live 环境复验重启持久性。
  extra: 不要把单条命令成功扩大为完整终态。
  source:
  - hostnamectl(1)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::hostname-nss-dns
  - topic::hostname-operations
  - card::process
