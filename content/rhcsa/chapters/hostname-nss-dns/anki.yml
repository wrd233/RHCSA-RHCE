  type: qa
  question: static、transient 与 pretty hostname 分别表达什么？
  answer: static 是持久机器身份；transient 是当前运行期的临时名称；pretty 是面向人的描述。
  extra: 设置可解析主机身份时重点通常是 static。
  source:
