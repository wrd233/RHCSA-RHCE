- id: RHCSA-19-K01-QA-002
  type: qa
  question: RHEL 9 的静态主机名通常持久保存在哪个文件？
  answer: '`/etc/hostname`。'
  extra: 优先通过 `hostnamectl set-hostname` 修改，并用文件与当前状态交叉验证。
  source:
  - hostnamectl(1)
  - RH124
