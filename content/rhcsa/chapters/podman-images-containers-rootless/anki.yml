- id: RHCSA-PODMAN-QA-006
  type: qa
  question: '`podman run -d` 返回容器 ID，但容器没有出现在 `podman ps` 中。最先应读取哪三类证据？'
  answer: '`podman ps -a`、`podman logs <CONTAINER>`、`podman container inspect <CONTAINER>`。'
  extra: 重点检查实际命令、状态、退出码和错误日志，不要反复创建同名容器。
  source:
