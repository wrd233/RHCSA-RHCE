- id: RHCSA-PODMAN-QA-007
  type: qa
  question: Rootless 容器访问 bind mount 时出现 `permission denied`，应按哪三个权限层调查？
  answer: 宿主 DAC 权限、rootless UID/GID 映射、SELinux 标签与 AVC。
  extra: 默认答案不是 `chmod 777`、关闭 SELinux 或 `--privileged`。
