- id: RHCSA-PODMAN-QA-001
  type: qa
  question: 在 Podman 对象模型中，image 与 container 的核心区别是什么？
  answer: Image 是只读模板和层集合；container 是从镜像创建的实例，具有独立配置、可写层和生命周期。
  extra: 同一镜像可创建多个容器。容器删除通常不删除镜像。
  source:
  - RH134-RHEL9-Running-Containers
  - RHEL9-Building-Running-Managing-Containers
  tags:
  - exam::rhcsa
  - chapter::podman-images-containers-rootless
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-PODMAN-QA-002
  type: qa
  question: 创建容器时使用 `-p 8088:8080`，两个端口分别属于哪一侧？
  answer: 宿主端口是 `8088`，容器端口是 `8080`。
  extra: 语法方向为 `HOST_PORT:CONTAINER_PORT`。还要用 `podman port`、`ss` 和 `curl` 分层验证。
  source:
