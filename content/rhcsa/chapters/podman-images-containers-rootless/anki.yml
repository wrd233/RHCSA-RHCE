- id: RHCSA-PODMAN-QA-003
  type: qa
  question: Bind mount 的 `:Z` 与 `:z` 分别适合什么共享边界？
  answer: '`:Z` 为当前容器使用私有、非共享标签；`:z` 为多个容器共享同一内容使用共享标签。'
  extra: 两者都会请求重标记宿主内容。不要对系统大目录随意使用。
