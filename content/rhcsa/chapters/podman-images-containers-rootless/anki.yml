- id: RHCSA-PODMAN-QA-008
  type: qa
  question: 题目要求面向用户 `websvc` 运行 rootless 容器。为什么 login、pull、run、inspect 和 rm 都应保持在该用户上下文？
  answer: 因为 rootless 的镜像、容器、卷、Registry 认证和用户命名空间都属于调用 Podman 的宿主用户。
  extra: root 或其他普通用户查询的是另一套 Podman 状态。
