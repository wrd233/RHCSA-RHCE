- id: RHCSA-11-O02-QA-004
  type: qa
  question: '`pgrep -u appsvc -P 2450 worker` 中不同条件如何组合？'
  answer: 目标必须同时满足有效用户、直接父 PID 和名称模式，通常是 AND 关系。
  extra: 同一选项的逗号列表可包含多个候选值。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-selection
  - card::boundary
  - priority::P0
- id: RHCSA-11-O02-QA-005
  type: qa
  question: 怎样选择启动超过一小时的 `report-worker`？
  answer: '```bash

    pgrep -a -O 3600 report-worker

    ```'
  extra: '`-O` 按运行时间筛选；仍要核对参数和父进程，不能把“更老”直接等同于错误实例。'
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-selection
  - card::command
  - priority::P1
- id: RHCSA-11-O02-QA-006
  type: qa
  question: '`pgrep -o` 和 `pgrep -n` 分别选择什么？'
  answer: '`-o` 选择最旧实例；`-n` 选择最新实例。'
  extra: 排序选择不等于业务身份判断。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-selection
  - card::comparison
  - priority::P1
- id: RHCSA-11-O02-QA-007
  type: qa
  question: 为什么执行 `pkill -f` 前应先运行同条件的 `pgrep -a -f`？
  answer: 为了看到完整匹配集合，确认不会包含非目标实例或管理命令。
  extra: 风险主要来自选择集合过宽。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::pkill-safety
  - card::boundary
  - priority::P0
- id: RHCSA-11-O02-QA-008
  type: qa
  question: '`pgrep -w` 输出的是什么？'
  answer: 输出匹配进程的线程 ID（TID/LWP），而不仅是进程组长的 PID。
  extra: 线程选择用于取证时要保留所属 PID。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::threads
  - card::parameter
  - priority::P2
- id: RHCSA-11-O02-QA-009
  type: qa
  question: 操作后原 PID 消失，但同条件 `pgrep -a -f` 出现新 PID。下一步是什么？
  answer: 比较新旧启动时间、PPID 和进程树，识别父进程或服务管理器是否重新拉起。
  extra: 不要继续无差别重复 `pkill`。
  source:
  - pgrep(1)
  - pstree(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::restart-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-O02-CLOZE-001
  type: cloze
  text: 批量信号的安全顺序是先用{{c1::pgrep -a}}预览集合，再用相同条件执行 `pkill`，之后再用{{c2::原条件}}验收。
  extra: 集合选择、操作和验收必须保持一致。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::pkill-safety
  - card::cloze
  - priority::P0
- id: RHCSA-11-O03-QA-001
  type: qa
  question: 怎样每 2 秒采样一次、共 5 轮，并把 `top` 输出保存到文件？
  answer: '```bash

    top -b -d 2 -n 5 -w 200 > /tmp/top-sample.txt

    ```'
  extra: 批处理模式适合留证；固定采样窗口便于前后对比。
  source:
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::sampling
  - card::command
  - priority::P0
- id: RHCSA-11-O03-QA-002
  type: qa
  question: '`top -H -p 2450` 的作用是什么？'
  answer: 只观察 PID 2450，并展开其线程。
  extra: 用于从进程级热点下钻到线程级执行单元。
  source:
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::threads
  - card::command
  - priority::P0
- id: RHCSA-11-O03-QA-003
  type: qa
  question: '`top -n 5` 与 `top -d 2` 分别控制什么？'
  answer: '`-n 5` 控制迭代次数；`-d 2` 控制每轮间隔秒数。'
  extra: 两者与 `-b` 组合可形成可重复采样。
  source:
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::sampling
  - card::parameter
  - priority::P0
- id: RHCSA-11-O03-QA-004
  type: qa
  question: '`/proc/PID/status` 适合读取哪些信息？'
  answer: 人类可读的名称、状态、PID/PPID、线程数、UID/GID、内存等字段。
  extra: 它是活对象接口，进程可能在读取过程中退出。
  source:
  - proc_pid_status(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::concept
  - priority::P1
- id: RHCSA-11-O03-QA-005
  type: qa
  question: 为什么读取 `/proc/PID/cmdline` 时常使用 `tr "\0" " "`？
  answer: 命令行参数以 NUL 字节分隔，直接 `cat` 可能看起来粘连。
  extra: 示例：`tr "\0" " " < /proc/PID/cmdline; echo`。
  source:
  - proc_pid_cmdline(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::command
  - priority::P0
- id: RHCSA-11-O03-QA-006
  type: qa
  question: '`/proc/PID/exe` 与 `/proc/PID/cwd` 分别是什么？'
  answer: 分别是当前可执行文件和当前工作目录的符号链接。
  extra: 可使用 `readlink -f` 查看；权限和进程退出会影响读取。
  source:
  - proc_pid_exe(5)
  - proc_pid_cwd(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::comparison
  - priority::P1
- id: RHCSA-11-O03-QA-007
  type: qa
  question: '`/proc/PID/fd/` 能证明业务 I/O 正常吗？'
  answer: 不能。它只显示打开的文件描述符及其链接目标。
  extra: 存在描述符不证明数据已成功读写、刷新或到达远端。
  source:
  - proc_pid_fd(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::boundary
  - priority::P1
- id: RHCSA-11-O03-QA-008
  type: qa
  question: '`/proc/PID/io` 与 `wchan` 分别提供什么线索？'
  answer: '`io` 提供进程读写计数；`wchan` 提供当前内核等待位置。'
  extra: 二者都只是诊断线索，需要结合状态和依赖解释。
  source:
  - proc_pid_io(5)
  - proc_pid_wchan(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::comparison
  - priority::P1
- id: RHCSA-11-O03-QA-009
  type: qa
  question: 为什么不应默认打印 `/proc/PID/environ`？
  answer: 环境变量可能包含令牌、密码或其他敏感信息。
  extra: 只在有明确必要、权限和脱敏方案时读取所需字段。
  source:
  - proc_pid_environ(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::security
  - priority::P0
- id: RHCSA-11-O03-QA-010
  type: qa
  question: 读取多个 `/proc/PID/*` 文件时，某条路径突然不存在，最先考虑什么？
  answer: 进程可能在读取期间退出或执行状态发生变化。
  extra: 区分对象已消失、PID 复用和权限不足，不要编造缺失内容。
  source:
  - proc(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::proc-evidence
  - card::diagnosis
  - priority::P1
- id: RHCSA-11-O03-CLOZE-001
  type: cloze
  text: '`top` 的{{c1::-b}}进入批处理模式，{{c2::-n}}设置迭代次数，{{c3::-d}}设置采样间隔。'
  extra: 三者组合适合保存多轮证据。
  source:
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::sampling
  - card::cloze
  - priority::P0
- id: RHCSA-11-O04-QA-001
  type: qa
  question: 命令末尾的 `&` 改变了什么？
  answer: 让当前 Shell 不等待该作业完成，并立即返回提示符。
  extra: 后台运行仍可能依赖终端，并不自动抵抗 SIGHUP。
  source:
  - RH124 Ch.8
  - bash(1) Job Control
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::concept
  - priority::P0
- id: RHCSA-11-O04-QA-002
  type: qa
  question: 怎样显示当前 Shell 作业的作业号、PID 和状态？
  answer: '```bash

    jobs -l

    ```'
  extra: '`jobs -r` 只列运行作业，`jobs -s` 只列停止作业。'
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::command
  - priority::P0
- id: RHCSA-11-O04-QA-003
  type: qa
  question: 前台命令按 `Ctrl+Z` 后，怎样让作业 1 在后台继续？
  answer: '```bash

    bg %1

    ```'
  extra: '`Ctrl+Z` 通常发送 `SIGTSTP`；`bg` 发送继续信号并保持后台。'
  source:
  - RH124 Ch.8
  - bash(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::command
  - priority::P0
- id: RHCSA-11-O04-QA-004
  type: qa
  question: 怎样把作业 1 拉回前台？
  answer: '```bash

    fg %1

    ```'
  extra: 前台作业重新获得终端；Shell 会等待它停止或退出。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::command
  - priority::P0
- id: RHCSA-11-O04-QA-005
  type: qa
  question: '`%+`、`%%` 与 `%-` 分别表示什么？'
  answer: '`%+` 和 `%%` 表示当前作业；`%-` 表示上一个作业。'
  extra: jobspec 只在当前 Shell 的作业表中有效。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::syntax
  - priority::P1
- id: RHCSA-11-O04-QA-006
  type: qa
  question: 为什么后台作业可能因读取终端输入再次停止？
  answer: 后台进程组通常不能直接从控制终端读取输入，Shell/终端作业控制会使其停止。
  extra: 需要交互的程序应拉回前台，而不是强行后台运行。
  source:
  - bash(1) Job Control
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::diagnosis
  - priority::P1
- id: RHCSA-11-O04-QA-007
  type: qa
  question: '`nohup` 是否会自动把命令放到后台？'
  answer: 不会。`nohup` 主要让命令忽略 SIGHUP 并处理仍连接终端的标准流。
  extra: 常见组合是显式重定向后再加 `&`。
  source:
  - nohup(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::nohup-disown
  - card::boundary
  - priority::P0
- id: RHCSA-11-O04-QA-008
  type: qa
  question: 怎样用 `nohup` 启动一次性长任务，并明确保存输出？
  answer: '```bash

    nohup /usr/local/bin/import-data   > /var/tmp/import-data.log 2>&1 &

    ```'
  extra: 仍需记录 PID、退出状态和功能结果；它不是服务管理。
  source:
  - nohup(1)
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::nohup-disown
  - card::command
  - priority::P0
- id: RHCSA-11-O04-QA-009
  type: qa
  question: '`disown -h %1` 与 `disown %1` 的区别是什么？'
  answer: '`-h` 标记作业在 Shell 退出时不接收 HUP，但保留作业表；不带 `-h` 会把作业从作业表移除。'
  extra: 两者都是 Bash builtin 行为。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::nohup-disown
  - card::comparison
  - priority::P1
- id: RHCSA-11-O04-QA-010
  type: qa
  question: 为什么 `nohup`/`disown` 不应替代 systemd service？
  answer: 它们不提供开机启动、失败重启、依赖、统一状态、身份隔离和标准化日志。
  extra: 需要长期生命周期管理时应进入第 12 章。
  source:
  - nohup(1)
  - bash(1)
  - chapter-boundary
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::nohup-disown
  - card::boundary
  - priority::P0
- id: RHCSA-11-O04-CLOZE-001
  type: cloze
  text: '`Ctrl+Z` 通常发送{{c1::SIGTSTP}}，`bg`/`fg` 恢复作业时会涉及{{c2::SIGCONT}}。'
  extra: STOP 类信号与 CONT 构成暂停/继续控制。
  source:
  - bash(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::cloze
  - priority::P0
- id: RHCSA-11-O05-QA-001
  type: qa
  question: '`SIGTERM` 和 `SIGKILL` 的本质区别是什么？'
  answer: TERM 是可由进程处理的有序终止请求；KILL 由内核强制终止且无清理机会。
  extra: 默认先 TERM，等待和再查询后才考虑 KILL。
  source:
  - signal(7)
  - RH124 Ch.8
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::comparison
  - priority::P0
- id: RHCSA-11-O05-QA-002
  type: qa
  question: 哪些常用信号不能被捕获、阻塞或忽略？
  answer: '`SIGKILL` 和 `SIGSTOP`。'
  extra: 这两个信号构成强制终止和强制停止边界。
  source:
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::concept
  - priority::P0
- id: RHCSA-11-O05-QA-003
  type: qa
  question: '`SIGHUP` 是否统一表示“重新加载配置”？'
  answer: 不是。它的传统含义是终端挂断，部分守护进程约定用它重读配置。
  extra: 是否 reload 必须查具体程序文档。
  source:
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::boundary
  - priority::P0
- id: RHCSA-11-O05-QA-004
  type: qa
  question: 怎样向 PID 2450 请求有序退出，并在两秒后重新查询？
  answer: '```bash

    kill -TERM 2450

    sleep 2

    ps -p 2450 -o pid,ppid,user,lstart,stat,args

    ```'
  extra: 还应按原业务匹配条件检查是否出现新 PID。
  source:
  - kill(1)
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signal-flow
  - card::process
  - priority::P0
- id: RHCSA-11-O05-QA-005
  type: qa
  question: '`kill -0 2450` 能证明什么？'
  answer: PID 是否存在以及当前用户是否有发送信号的权限。
  extra: 它不验证 PID 仍属于原实例，也不证明业务健康。
  source:
  - kill(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::verification
  - priority::P0
- id: RHCSA-11-O05-QA-006
  type: qa
  question: 怎样继续一个明确的停止进程？
  answer: '```bash

    kill -CONT 2450

    ```'
  extra: 操作后用 `ps -p 2450 -o pid,stat,args` 验证是否离开 `T`。
  source:
  - kill(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::command
  - priority::P1
- id: RHCSA-11-O05-QA-007
  type: qa
  question: 为什么信号命令返回 0 不能证明进程已经退出？
  answer: 返回成功通常只表示信号请求已被接受；进程可能捕获、忽略、延迟处理或处于 D 状态。
  extra: 必须再次查询 PID、状态和业务特征。
  source:
  - kill(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signal-flow
  - card::verification
  - priority::P0
- id: RHCSA-11-O05-QA-008
  type: qa
  question: 要向 PGID 6200 发送 TERM，可使用什么清晰形式？
  answer: '```bash

    kill -TERM -- -6200

    ```'
  extra: 负目标表示进程组；`--` 消除把负数解释为选项的歧义。操作前先确认 PGID。
  source:
  - kill(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::command
  - priority::P1
- id: RHCSA-11-O05-QA-009
  type: qa
  question: 为什么不能把一个工作进程 PID 消失等同于服务停止？
  answer: 主进程或外部管理器可能重新创建 worker，服务也可能包含多个进程。
  extra: 按原业务条件和进程树检查新 PID；必要时转到 systemd 管理层。
  source:
  - RH124 Ch.8
  - chapter-boundary
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::restart-diagnosis
  - card::boundary
  - priority::P0
- id: RHCSA-11-O05-QA-010
  type: qa
  question: 一个目标在 TERM 后仍存在，升级到 KILL 前必须再次确认什么？
  answer: 用户、启动时间、完整命令行和父进程仍与原目标一致，并确认不是 D 状态等待。
  extra: 这是降低 PID 复用和误伤风险的关键步骤。
  source:
  - kill(1)
  - ps(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signal-flow
  - card::security
  - priority::P0
- id: RHCSA-11-O05-QA-011
  type: qa
  question: 对多个同名进程执行 `pkill -TERM name` 前，最少要做什么？
  answer: 用同条件 `pgrep -a` 查看完整集合，并确认用户、参数和父进程范围。
  extra: 名称本身不等于唯一业务对象。
  source:
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::pkill-safety
  - card::process
  - priority::P0
- id: RHCSA-11-O05-CLOZE-001
  type: cloze
  text: 未指定信号时，`kill PID` 通常发送{{c1::SIGTERM}}；强制且无清理机会的是{{c2::SIGKILL}}。
  extra: 信号名称比数字更具可移植性。
  source:
  - kill(1)
  - signal(7)
