- id: RHCSA-11-O01-QA-001
  type: qa
  question: 要核对 PID 2450 的父进程、用户、启动时间、会话、进程组、终端、状态和命令行，应执行什么？
  answer: '```bash

    ps -p 2450 -o pid,ppid,user,lstart,etimes,sid,pgid,tty,stat,args

    ```'
  extra: 这是操作前的身份视图；强制操作前应再次读取。
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
