- id: RHCSA-11-O06-QA-001
  type: qa
  question: 怎样以调整量 10 启动 `build-index`？
  answer: '```bash

    nice -n 10 /usr/local/bin/build-index

    ```'
  extra: GNU nice 的 `-n` 是相对继承值的调整量；操作后检查实际 NI。
  source:
  - nice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::command
  - priority::P0
- id: RHCSA-11-O06-QA-002
  type: qa
  question: 为什么本章在 `renice` 示例中优先使用 `--priority`？
  answer: 它明确表示目标绝对 nice 值，避免 `-n` 在实现和兼容模式中的相对/绝对歧义。
  extra: 相对调整使用 `--relative`。
  source:
  - renice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::boundary
  - priority::P1
- id: RHCSA-11-O06-QA-003
  type: qa
  question: 怎样把运行中的 PID 2450 设置为 nice 15？
  answer: '```bash

    renice --priority 15 --pid 2450

    ```'
  extra: 然后用 `ps -p 2450 -o pid,user,lstart,ni,pri,stat,args` 验证。
  source:
  - renice(1)
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::command
  - priority::P0
- id: RHCSA-11-O06-QA-004
  type: qa
  question: '`renice --pgrp` 与 `renice --user` 分别改变什么集合？'
  answer: 分别作用于指定进程组中的任务，以及指定用户拥有的匹配任务集合。
  extra: 集合操作前应评估影响，不要用用户级选择器处理单个业务实例。
  source:
  - renice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::comparison
  - priority::P1
- id: RHCSA-11-O06-QA-005
  type: qa
  question: 普通用户通常能把自己的进程从 nice 10 调到 nice 15 吗？
  answer: 通常可以，因为这让进程更不利、更礼让。
  extra: 把 nice 降到更有利的值通常需要额外权限。
  source:
  - renice(1)
  - capabilities(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::security
  - priority::P0
- id: RHCSA-11-O06-QA-006
  type: qa
  question: 调整 nice 后应怎样验证？
  answer: '```bash

    ps -p 2450 -o pid,ppid,user,lstart,ni,pri,stat,%cpu,args

    ```'
  extra: 同时保留身份字段，防止 PID 复用造成误判。
  source:
  - ps(1)
  - renice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::verification
  - priority::P0
- id: RHCSA-11-O06-QA-007
  type: qa
  question: 高负载来自多个 D 状态任务时，`renice` 是合适根因修复吗？
  answer: 通常不是。nice 主要影响普通 CPU 调度，不修复不可中断 I/O 等待。
  extra: 应先调查共同存储、NFS、驱动或内核依赖。
  source:
  - renice(1)
  - sched(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-O06-QA-008
  type: qa
  question: nice 能限制进程最多使用 20% CPU 吗？
  answer: 不能。nice 是相对调度倾向，不是硬配额。
  extra: CPU 配额和 cgroup 深度治理不在本章主线。
  source:
  - nice(1)
  - sched(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::boundary
  - priority::P0
- id: RHCSA-11-O06-CLOZE-001
  type: cloze
  text: nice 值越{{c1::低}}，普通调度越有利；值越{{c2::高}}，任务越礼让。
  extra: 不要把数值大小和调度优先方向混淆。
  source:
  - nice(1)
  - renice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::cloze
  - priority::P0
- id: RHCSA-11-D01-QA-001
  type: qa
  question: 多个 `D` 状态进程共享同一 `wchan`，且都访问同一 NFS 挂载。下一步最有区分度的方向是什么？
  answer: 调查该网络文件系统和网络/服务端依赖，而不是继续向每个 PID 发送 KILL。
  extra: 本章记录到依赖层入口；NFS 和日志细节在相应章节展开。
  source:
  - proc_pid_wchan(5)
  - RH124 Ch.8
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::d-state
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-D01-QA-002
  type: qa
  question: 一个无 `jobs` 记录的进程处于 `T`。下一步应检查什么？
  answer: 读取 SID、PGID、TTY、父进程和是否存在调试/外部 STOP 来源。
  extra: 不要对所有 T 状态统一发送 CONT。
  source:
  - ps(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::t-state
  - card::diagnosis
  - priority::P1
- id: RHCSA-11-D01-QA-003
  type: qa
  question: load average 高、CPU idle 仍有余量时，哪类状态应优先统计？
  answer: '`D` 状态和可运行 `R` 状态的数量与趋势。'
  extra: 这有助于区分 I/O 等待与 CPU 竞争。
  source:
  - RH124 Ch.8
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::load
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-D01-QA-004
  type: qa
  question: 没有单一高 CPU 进程时，为什么要查看线程视图？
  answer: 热点可能分布在同一进程的多个线程，进程级汇总难以显示内部差异。
  extra: 使用 `top -H` 或 `ps -eL`。
  source:
  - top(1)
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::load
  - card::diagnosis
  - priority::P1
- id: RHCSA-11-D01-QA-005
  type: qa
  question: 怎样识别大量短命子进程造成的压力？
  answer: 使用固定间隔重复 `ps`，结合 `pstree` 观察某个父进程持续派生运行时间很短的子进程。
  extra: 单次快照可能完全漏掉短命任务。
  source:
  - ps(1)
  - pstree(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::sampling
  - card::diagnosis
  - priority::P1
- id: RHCSA-11-D01-QA-006
  type: qa
  question: 终止 worker 后新 PID 立即出现，哪条证据比“再 kill 一次”更有区分度？
  answer: 查看新 PID 的 PPID、祖先链、启动时间和完整命令行。
  extra: 用于识别主进程重建或外部管理者。
  source:
  - ps(1)
  - pstree(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::restart-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-D01-QA-007
  type: qa
  question: 为什么“进程命令返回成功”不能作为任务最终验收？
  answer: 它只能证明局部操作被接受，不能证明目标集合为空、非目标未受影响、业务功能正确或进程不会被重建。
  extra: 验收应覆盖身份、目标状态、非目标保护和管理层。
  source:
  - RHEL lecture design standard
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::verification
  - card::boundary
  - priority::P0
- id: RHCSA-11-D01-QA-008
  type: qa
  question: 调查高负载时，什么时候才适合考虑 `renice`？
  answer: 证据已支持普通 CPU 竞争，目标任务身份明确，并且业务允许降低其进度时。
  extra: 操作前记录基线，操作后用相同采样窗口复核。
  source:
  - renice(1)
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::load
  - card::process
  - priority::P0
- id: RHCSA-11-T01-QA-001
  type: qa
  question: 多个同名 worker 中只需停止 legacy 参数实例，第一条选择命令应具有什么特征？
  answer: 同时限定有效用户、完整可执行路径和 legacy 关键参数，并使用 `pgrep -a -f` 预览。
  extra: 不能只按短命令名操作。
  source:
  - pgrep(1)
  - classic-task T01
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-old-worker
  - card::task
  - priority::P0
- id: RHCSA-11-T01-QA-002
  type: qa
  question: 安全停止旧 worker 的完整验收为什么要检查 current 参数实例？
  answer: 用于证明操作没有误伤非目标实例。
  extra: 目标消失与非目标保护是两个独立验收维度。
  source:
  - classic-task T01
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-old-worker
  - card::verification
  - priority::P0
- id: RHCSA-11-T01-QA-003
  type: qa
  question: 旧 worker 原 PID 消失但 legacy 匹配出现新 PID，任务是否完成？
  answer: 未完成。应识别新 PID 的父进程或管理器，停止继续追杀 PID。
  extra: 原 PID 消失不等于业务实例不会再出现。
  source:
  - classic-task T01
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-old-worker
  - card::boundary
  - priority::P0
- id: RHCSA-11-T02-QA-001
  type: qa
  question: 高负载经典任务中，为什么要求 `top -b -d 2 -n 5` 而不是截图一次交互界面？
  answer: 固定采样间隔和轮数可保存趋势并支持前后可比验证。
  extra: 单屏只能证明一个瞬间。
  source:
  - top(1)
  - classic-task T02
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-high-load
  - card::process
  - priority::P0
- id: RHCSA-11-T02-QA-002
  type: qa
  question: 高负载但 CPU idle 有余量时，哪四类假设应保留？
  answer: 多个 R 任务竞争、多个 D 任务等待 I/O、线程级热点、大量短命子进程。
  extra: 证据不足时不要强行只选一个根因。
  source:
  - classic-task T02
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-high-load
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-T02-QA-003
  type: qa
  question: 修复依赖后怎样验证高负载改善？
  answer: 使用与变更前相同的采样间隔、轮数和字段，比较 load、R/D 数量和资源趋势。
  extra: 验证窗口不同会削弱对比可信度。
  source:
  - classic-task T02
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::task-high-load
  - card::verification
  - priority::P0
- id: RHCSA-11-D01-CLOZE-001
  type: cloze
  text: 诊断链应按“症状 → 当前证据 → 假设 → {{c1::下一条最有区分度的证据}} → 最小修复 → 再验证”推进。
  extra: 不要一次堆砌所有命令。
  source:
  - RHEL lecture design standard
