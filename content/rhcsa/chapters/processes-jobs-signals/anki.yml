  - priority::P0
- id: RHCSA-11-O01-QA-002
  type: qa
  question: '`ps -C report-worker` 按什么匹配？'
  answer: 按短命令名选择进程。
  extra: 它不匹配完整参数；需要参数级区分时使用 `pgrep -f` 或先得到 PID 后检查 `args`。
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::ps-selection
  - card::parameter
  - priority::P1
- id: RHCSA-11-O01-QA-003
  type: qa
  question: 怎样查看 PID 2450 的直接子进程？
  answer: '```bash

    ps --ppid 2450 -o pid,ppid,stat,etimes,args

    ```'
  extra: '`--ppid` 只选择直接子进程，不递归整个后代树。'
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::ps-selection
  - card::command
  - priority::P0
- id: RHCSA-11-O01-QA-004
  type: qa
  question: 怎样按 RSS 从大到小查看进程？
  answer: '```bash

    ps -eo pid,ppid,user,%mem,rss,vsz,stat,etimes,args --sort=-rss

    ```'
  extra: 排序键前的 `-` 表示降序。RSS 和 VSZ 应同时保留以避免误读。
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::ps-view
  - card::command
  - priority::P1
- id: RHCSA-11-O01-QA-005
  type: qa
  question: '`ps --forest` 与 `pstree` 各有什么优势？'
  answer: '`ps --forest` 可与自定义字段结合；`pstree` 更直观展示祖先和后代结构。'
  extra: 需要精确字段时回到 `ps`；相同子树在 `pstree` 中可能被压缩。
  source:
  - ps(1)
  - pstree(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-tree
  - card::comparison
  - priority::P1
- id: RHCSA-11-O01-QA-006
  type: qa
  question: 怎样显示 PID 2450 的祖先链和参数？
  answer: '```bash

    pstree -aps 2450

    ```'
  extra: '`-a` 显示参数，`-p` 显示 PID，`-s` 显示祖先。'
  source:
  - pstree(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-tree
  - card::command
  - priority::P1
- id: RHCSA-11-O01-QA-007
  type: qa
  question: '`pidof -s chronyd` 的 `-s` 有什么作用？'
  answer: 只返回一个匹配 PID。
  extra: “只返回一个”不等于完成唯一身份确认，多实例场景仍需核对。
  source:
  - pidof(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::pidof
  - card::parameter
  - priority::P2
- id: RHCSA-11-O01-QA-008
  type: qa
  question: 为什么操作前后应使用同一套 `ps -o` 字段？
  answer: 这样才能直接比较对象身份、状态和资源是否发生预期变化。
  extra: 只换成另一条模糊命令，可能无法证明操作对象和终态。
  source:
