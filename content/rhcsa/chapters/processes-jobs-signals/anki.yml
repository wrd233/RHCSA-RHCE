- id: RHCSA-11-O02-QA-003
  type: qa
  question: 怎样选择 PID 2450 的直接子进程并显示完整命令行？
  answer: '```bash

    pgrep -a -P 2450

    ```'
  extra: 这不会递归选择所有后代。
  source:
  - pgrep(1)
