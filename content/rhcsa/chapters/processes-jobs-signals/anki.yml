  type: qa
  question: '`pgrep -a` 与 `pgrep -l` 的区别是什么？'
  answer: '`-a` 显示 PID 和完整命令行；`-l` 显示 PID 和短命令名。'
  extra: 批量操作前更适合使用 `-a` 审阅参数。
