- id: RHCSA-SERVICES-K01-QA-001
  type: qa
  question: 需要按 CPU 降序查看全部进程，并显示 PID、PPID、用户、状态、nice、CPU、内存、RSS 和完整命令行。`ps` 骨架是什么？
  answer: '```bash

    ps -eo pid,ppid,user,stat,ni,%cpu,%mem,rss,args --sort=-%cpu

    ```'
  extra: '`-e` 选择全部进程；`-o` 定制字段；排序前的负号表示降序。一次输出只是快照。'
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::ps-view
  - card::command
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-002
  type: qa
  question: 系统有多个同名 worker。怎样先按有效用户 `appsvc` 和名称选择，并显示完整命令行？
  answer: '```bash

    pgrep -a -u appsvc worker

    ```'
  extra: 若需要匹配完整命令行中的路径或参数，再加 `-f`；进入 `pkill` 前先预览集合。
  source:
  - RH124 Ch.8
  - pgrep(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-selection
  - card::command
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-003
  type: qa
  question: 已经确认 PID 2450 是目标进程。`kill 2450` 未指定信号时通常发送什么？
  answer: '`SIGTERM`。'
  extra: 它是请求有序终止的默认首选；命令返回成功不证明进程已经退出。
  source:
  - RH124 Ch.8
  - kill(1)
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::concept
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-004
  type: qa
  question: 为什么不应把 `SIGKILL` 作为终止进程的第一选择？
  answer: '`SIGKILL` 不能被捕获、阻塞或忽略，进程没有机会刷新数据、释放锁或执行清理。'
  extra: 先发送 `SIGTERM`，等待并再查询；重新确认目标仍存在后才考虑 `SIGKILL`。
  source:
  - RH124 Ch.8
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::signals
  - card::boundary
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-005
  type: qa
  question: '`ps` 显示一个子进程为 `Z`。为什么继续向这个 PID 发送信号不能清除它？'
  answer: 僵尸进程已经退出，只剩父进程尚未回收的退出状态和少量进程表信息。
  extra: 下一步应查 `PPID` 和父进程健康，而不是继续“杀僵尸”。
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::diagnosis
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-006
  type: qa
  question: nice 值的方向是什么？
  answer: nice 值越低，普通 CPU 调度越有利；值越高，任务越礼让。
  extra: 常见范围为 `-20` 到 `19`。nice 不是 CPU 配额。
  source:
  - RH124 Ch.8
  - nice(1)
  - renice(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::niceness
  - card::comparison
  - priority::P0
- id: RHCSA-SERVICES-K01-QA-007
  type: qa
  question: '`jobs`、`fg` 和 `bg` 的作用范围是什么？'
  answer: 只作用于当前交互 Shell 的作业表和 jobspec。
  extra: 另一个终端没有同一作业表；系统级长期进程应使用明确的服务管理方式。
  source:
  - RH124 Ch.8
  - bash(1) Job Control
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::boundary
  - priority::P0
- id: RHCSA-11-K01-QA-001
  type: qa
  question: 程序、进程与线程分别是什么？
  answer: 程序是磁盘上的可执行内容；进程是程序的一次运行实例；线程是进程内部的调度执行单元。
  extra: 同一程序可有多个进程，同一进程可有多个线程。
  source:
  - RH124 Ch.8
  - proc(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::object-model
  - card::concept
  - priority::P0
- id: RHCSA-11-K01-QA-002
  type: qa
  question: PID 能长期代表同一个业务实例吗？
  answer: 不能。PID 只在进程存活期间标识当前实例，退出后可能被复用。
  extra: 高风险操作前应重新核对用户、启动时间、完整命令行和 PPID。
  source:
  - RH124 Ch.8
  - proc(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::identity
  - card::boundary
  - priority::P0
- id: RHCSA-11-K01-QA-003
  type: qa
  question: '`PID`、`PPID`、`PGID` 与 `SID` 分别表示什么？'
  answer: '`PID` 是进程实例；`PPID` 是直接父进程；`PGID` 是进程组；`SID` 是会话。'
  extra: 终端前后台和作业控制主要围绕进程组与会话组织。
  source:
  - RH124 Ch.8
  - ps(1)
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-11-K01-QA-004
  type: qa
  question: '`ps` 的 `TTY` 字段显示 `?` 通常说明什么？'
  answer: 该进程没有控制终端。
  extra: 守护进程和 systemd 管理的服务常见这种情况，不自动表示异常。
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::object-model
  - card::output
  - priority::P1
- id: RHCSA-11-K01-QA-005
  type: qa
  question: 为什么一条 Shell 管道可能显示多个 PID，但 `jobs` 只显示一个作业？
  answer: 管道包含多个进程，Bash 通常把它们放入同一进程组，并作为一个作业管理。
  extra: 终端信号通常发送给整个前台进程组。
  source:
  - RH124 Ch.8
  - bash(1) Job Control
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::concept
  - priority::P0
- id: RHCSA-11-K01-QA-006
  type: qa
  question: 进程成为“孤儿”说明什么？
  answer: 父进程先退出，仍存活的子进程被 PID 1 或子收割器接管。
  extra: 孤儿只描述父子关系变化，不等于失控或故障。
  source:
  - RH124 Ch.8
  - proc(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::lifecycle
  - card::concept
  - priority::P1
- id: RHCSA-11-K01-QA-007
  type: qa
  question: 要查看 PID 2450 的线程，应使用哪两类入口？
  answer: 可使用 `ps -T -p 2450`/`ps -eL`，或 `top -H -p 2450`。
  extra: 线程视图用于定位进程内部执行单元；应用栈分析超出本章。
  source:
  - ps(1)
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::threads
  - card::command
  - priority::P1
- id: RHCSA-11-K01-CLOZE-001
  type: cloze
  text: 终端的 `Ctrl+C` 通常向{{c1::前台进程组}}发送 `SIGINT`，不是只发送给管道中的某一个 PID。
  extra: 这也是 PGID 和 Shell Job 必须与 PID 区分的原因。
  source:
  - bash(1) Job Control
  - signal(7)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::job-control
  - card::cloze
  - priority::P0
- id: RHCSA-11-K02-QA-001
  type: qa
  question: '`ps` 主状态 `R` 表示什么？'
  answer: 正在 CPU 上运行或位于可运行队列
  extra: 用多轮采样判断是否持续存在 CPU 竞争
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P0
- id: RHCSA-11-K02-QA-002
  type: qa
  question: '`ps` 主状态 `S` 表示什么？'
  answer: 可中断睡眠，等待事件
  extra: 多数服务长时间处于 S 可以是正常状态
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P1
- id: RHCSA-11-K02-QA-003
  type: qa
  question: '`ps` 主状态 `D` 表示什么？'
  answer: 不可中断睡眠，常见于内核 I/O 等待
  extra: 查 wchan、I/O、挂载和共同依赖，而不是不断升级信号
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P0
- id: RHCSA-11-K02-QA-004
  type: qa
  question: '`ps` 主状态 `T` 表示什么？'
  answer: 被作业控制信号停止或处于跟踪状态
  extra: 查 jobs、TTY、PGID 和信号/调试来源
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P0
- id: RHCSA-11-K02-QA-005
  type: qa
  question: '`ps` 主状态 `Z` 表示什么？'
  answer: 子进程已退出但父进程尚未回收
  extra: 查 PPID 和父进程健康
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P0
- id: RHCSA-11-K02-QA-006
  type: qa
  question: '`STAT` 中的 `+` 修饰符说明什么？'
  answer: 该进程位于其控制终端的前台进程组。
  extra: 这不是字符串相加，也不是“优先级更高”。
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P1
- id: RHCSA-11-K02-QA-007
  type: qa
  question: '`STAT` 中的 `l` 与 `N` 分别常表示什么？'
  answer: '`l` 表示多线程；`N` 表示较低的调度优先级。'
  extra: 主状态字符和修饰符应分开解读。
  source:
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::process-states
  - card::output
  - priority::P2
- id: RHCSA-11-K02-QA-008
  type: qa
  question: RSS 与 VSZ 的区别是什么？
  answer: RSS 是当前驻留物理内存；VSZ 是虚拟地址空间总量。
  extra: VSZ 很大不能直接推出消耗了同等大小的物理 RAM。
  source:
  - RH124 Ch.8
  - ps(1)
  - proc(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::memory
  - card::comparison
  - priority::P0
- id: RHCSA-11-K02-QA-009
  type: qa
  question: Linux load average 可以直接当作 CPU 使用百分比吗？
  answer: 不能。它反映可运行任务和某些不可中断等待任务的平均数量。
  extra: 高负载可能来自 CPU 竞争，也可能来自 D 状态 I/O 等待。
  source:
  - RH124 Ch.8
  - proc_loadavg(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::load
  - card::boundary
  - priority::P0
- id: RHCSA-11-K02-QA-010
  type: qa
  question: 为什么一次 `ps` 输出不能证明高 CPU 是持续问题？
  answer: '`ps` 只提供采样瞬间的快照，短命进程和波动热点可能在下一次采样中变化。'
  extra: 使用固定间隔的多轮 `top -b` 或重复 `ps` 保存趋势。
  source:
  - RH124 Ch.8
  - ps(1)
  - top(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::sampling
  - card::verification
  - priority::P0
- id: RHCSA-11-K02-QA-011
  type: qa
  question: 多个 `Z` 状态进程持续累积时，下一条最有区分度的证据是什么？
  answer: 读取它们的 `PPID`，并检查共同父进程是否健康、是否持续未回收子进程。
  extra: 不要向每个僵尸反复发送 `SIGKILL`。
  source:
  - RH124 Ch.8
  - ps(1)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::zombie
  - card::diagnosis
  - priority::P0
- id: RHCSA-11-K02-QA-012
  type: qa
  question: 一个 `D` 状态 PID 在 `kill -KILL` 后仍存在，是否证明信号发送失败？
  answer: 不一定。信号可能已待处理，但要等不可中断的内核等待返回后才生效。
  extra: 继续查等待依赖，而不是反复发送信号。
  source:
  - signal(7)
  - proc_pid_wchan(5)
  tags:
  - exam::rhcsa
  - chapter::processes-jobs-signals
  - topic::d-state
  - card::diagnosis
  - priority::P0
