  type: qa
  question: 修改 `/etc/fstab` 后为什么执行 `systemctl daemon-reload`？
  answer: 让 systemd 重新读取 unit 配置并重新运行包括 fstab generator 在内的生成器。
  extra: 它不会自动证明挂载成功。
