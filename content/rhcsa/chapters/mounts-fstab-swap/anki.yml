notes:
- id: RHCSA-24-K01-QA-001
  type: qa
  question: 挂载关系中的 source、target 与 active mount 分别是什么？
  answer: source 是文件系统来源；target 是接入目录；active mount 是当前 mount namespace 中已经建立的源—目标关系。
  extra: 设备或目录存在都不能单独证明 active mount。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-model
  - card::concept
  - priority::P0
- id: RHCSA-24-K01-QA-002
  type: qa
  question: '`/srv/project` 目录存在，能否证明目标文件系统已挂载？'
  answer: 不能。目录可能只是父文件系统中的普通目录。
  extra: 使用 `findmnt --target /srv/project` 核对精确挂载关系。
  source:
  - findmnt(8)
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-model
  - card::verification
  - priority::P0
- id: RHCSA-24-K01-QA-003
  type: qa
  question: 手工执行 `mount UUID=<UUID> /srv/project` 后，为什么重启仍可能丢失该挂载？
  answer: 该命令只建立当前运行时关系，没有创建启动持久策略。
  extra: 应配置 `/etc/fstab` 并完成静态、当前和重入验证。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::current-persistent
  - card::comparison
  - priority::P0
- id: RHCSA-24-K01-QA-004
  type: qa
  question: 挂载到一个非空目录后，目录原有内容发生了什么？
  answer: 原内容被新挂载暂时遮蔽，正常卸载后重新可见。
  extra: 不是自动删除；挂载前应检查目录内容。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-shadowing
  - card::concept
  - priority::P0
- id: RHCSA-24-K01-QA-005
  type: qa
  question: 应用向 `/srv/project` 写入成功，为什么仍不能断定挂载正确？
  answer: 路径可能仍位于根文件系统中的普通目录。
  extra: 先核对 `findmnt` 的 source、target、FSTYPE 和 OPTIONS。
  source:
  - findmnt(8)
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-model
  - card::boundary
  - priority::P0
- id: RHCSA-24-K01-QA-006
  type: qa
  question: 怎样查询任意路径实际位于哪个已挂载文件系统？
  answer: '`findmnt -T <PATH>`'
  extra: 结果可能是父文件系统；仍要与期望 target/source 比较。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::command
  - priority::P0
- id: RHCSA-24-K01-QA-007
  type: qa
  question: 当前挂载表是否一定对系统中的所有隔离进程完全相同？
  answer: 不一定。挂载关系属于 mount namespace，不同 namespace 可以看到不同视图。
  extra: RHCSA 只要求理解边界，不展开 namespace 创建。
  source:
  - mount_namespaces(7)
  - mount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-model
  - card::boundary
  - priority::P2
- id: RHCSA-24-K01-QA-008
  type: qa
  question: 卸载一个文件系统会删除挂载点目录或文件系统内容吗？
  answer: 不会。它只解除当前挂载关系。
  extra: fstab 条目若仍存在，后续可能重新挂载。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::umount
  - card::concept
  - priority::P0
- id: RHCSA-24-O01-QA-001
  type: qa
  question: 精确查询 `/srv/project` 当前挂载源、类型和选项的命令骨架是什么？
  answer: '`findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS --target /srv/project`'
  extra: 按目标验收时不要只看目录存在。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::command
  - priority::P0
- id: RHCSA-24-O01-QA-002
  type: qa
  question: 怎样按文件系统 UUID 查询它当前挂到了哪些目标？
  answer: '`findmnt --source UUID=<REAL_UUID>`'
  extra: 可发现同源多挂载或挂错目标。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::command
  - priority::P1
- id: RHCSA-24-O01-QA-003
  type: qa
  question: 卸载前怎样查看 `/srv/project` 下的子挂载？
  answer: '`findmnt -R /srv/project`'
  extra: 子挂载通常需要按依赖从内到外处理。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::command
  - priority::P0
- id: RHCSA-24-O01-QA-004
  type: qa
  question: '`findmnt` 与 `df -hT` 分别主要证明什么？'
  answer: '`findmnt` 证明当前挂载源、目标、类型和选项；`df` 提供路径所在文件系统的容量和使用率。'
  extra: '`df` 不能代替持久配置验证。'
  source:
  - findmnt(8)
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::evidence-boundary
  - card::comparison
  - priority::P0
- id: RHCSA-24-O01-QA-005
  type: qa
  question: '`mountpoint -q /srv/project` 成功能证明哪些内容？'
  answer: 只能快速证明该目录是一个挂载点。
  extra: 不能证明 source、FSTYPE、OPTIONS 或 fstab 正确。
  source:
  - mountpoint(1)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::evidence-boundary
  - card::boundary
  - priority::P1
- id: RHCSA-24-O01-QA-006
  type: qa
  question: 查看 fstab 中与 `/srv/project` 对应条目的 findmnt 形式是什么？
  answer: '`findmnt --fstab --target /srv/project`'
  extra: 这是持久声明视图，不是当前挂载视图。
  source:
  - findmnt(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::command
  - priority::P0
- id: RHCSA-24-O01-QA-007
  type: qa
  question: '`findmnt -T /srv/project/file` 返回根文件系统通常说明什么？'
  answer: 该路径当前落在根文件系统；预期的独立挂载可能缺失。
  extra: 继续核对精确 target、fstab 和 mount unit。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::findmnt
  - card::output
  - priority::P0
- id: RHCSA-24-O01-QA-008
  type: qa
  question: '`lsblk -f` 显示某设备有 MOUNTPOINTS，为什么仍建议使用 findmnt？'
  answer: '`findmnt` 更完整地展示当前挂载层次、精确 target 和 OPTIONS。'
  extra: 两者用于交叉核对，不是互相替代。
  source:
  - lsblk(8)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::evidence-boundary
  - card::comparison
  - priority::P1
- id: RHCSA-24-O02-QA-001
  type: qa
  question: 建立当前挂载的基本命令骨架是什么？
  answer: '`mount <SOURCE> <TARGET>`'
  extra: target 应存在；操作前检查是否非空和是否已有挂载。
  source:
  - mount(8)
  - RH124-RHEL9-Ch15
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-current
  - card::syntax
  - priority::P0
- id: RHCSA-24-O02-QA-002
  type: qa
  question: 使用真实 UUID 将文件系统当前挂到 `/srv/project` 的命令是什么？
  answer: '`mount UUID=<REAL_UUID> /srv/project`'
  extra: UUID 来自当前 `blkid`/`lsblk -f` 输出。
  source:
  - mount(8)
  - blkid(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-current
  - card::command
  - priority::P0
- id: RHCSA-24-O02-QA-003
  type: qa
  question: 已有唯一 fstab 条目时，只按挂载点建立当前挂载的命令是什么？
  answer: '`mount /srv/project`'
  extra: mount 会从 fstab 补齐 source、type 和 options。
  source:
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-current
  - card::command
  - priority::P0
- id: RHCSA-24-O02-QA-004
  type: qa
  question: '`mount -t xfs -o nodev,nosuid <SOURCE> /srv/project` 中 `-t` 与 `-o` 分别做什么？'
  answer: '`-t` 指定文件系统类型；`-o` 提供逗号分隔的挂载选项。'
  extra: 操作后仍应查看当前 OPTIONS。
  source:
  - mount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-options
  - card::parameter
  - priority::P0
- id: RHCSA-24-O02-QA-005
  type: qa
  question: 怎样把当前已挂载的 `/srv/project` 重新挂为只读？
  answer: '`mount -o remount,ro /srv/project`'
  extra: 只改变当前状态；持久要求还要修改 fstab。
  source:
  - mount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-options
  - card::command
  - priority::P0
- id: RHCSA-24-O02-QA-006
  type: qa
  question: '`nodev`、`nosuid`、`noexec` 分别限制什么？'
  answer: 分别限制设备文件解释、setuid/setgid 提权语义和从挂载直接执行。
  extra: 三者不能互相替代；`noexec` 也不是完整沙箱。
  source:
  - mount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-options
  - card::comparison
  - priority::P0
- id: RHCSA-24-O02-QA-007
  type: qa
  question: 为什么 LABEL 通常不如 UUID 适合唯一持久标识？
  answer: LABEL 便于阅读，但管理员可能创建重复标签；UUID 通常用于唯一匹配当前文件系统。
  extra: 重新格式化会改变 UUID。
  source:
  - fstab(5)
  - blkid(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::source-identifiers
  - card::comparison
  - priority::P1
- id: RHCSA-24-O02-QA-008
  type: qa
  question: remount 成功后，为什么还要比较 fstab？
  answer: remount 只改变当前挂载选项，重启后会重新按持久配置建立。
  extra: 当前和持久必须分别验证。
  source:
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::current-persistent
  - card::verification
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-019
  type: qa
  question: '`umount` 报 `target is busy` 时，下一条高区分度证据是什么？'
  answer: 先用 `findmnt -R <MOUNT>` 查子挂载，再用 `fuser -vm <MOUNT>` 或可用的 lsof 查询进程引用。
  extra: 不要先使用 force/lazy 或无调查终止进程。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  - fuser(1)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::diagnosis
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-020
  type: qa
  question: 挂载到非空目录后，原内容怎样？
  answer: 被新文件系统暂时遮蔽，卸载后重新出现。
  extra: 这不是删除。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-shadowing
  - card::concept
  - priority::P0
- id: RHCSA-24-D01-QA-001
  type: qa
  question: 当前 Shell 位于 `/srv/project` 内导致 busy，最小修复是什么？
  answer: 先 `cd /` 或离开该文件系统，再重试 `umount /srv/project`。
  extra: 还要确认其他进程没有引用。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::process
  - priority::P0
- id: RHCSA-24-D01-QA-002
  type: qa
  question: 查看哪些进程正在使用某个挂载文件系统的核心命令是什么？
  answer: '`fuser -vm /srv/project`'
  extra: 识别用户和管理者后再正常释放引用。
  source:
  - fuser(1)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::command
  - priority::P0
- id: RHCSA-24-D01-QA-003
  type: qa
  question: 为什么不应看到 fuser 输出后直接 `kill -9`？
  answer: 进程可能属于服务或正在写数据；强杀会跳过应用清理并可能被 systemd 重建。
  extra: 先识别管理者，优先正常停止。
  source:
  - fuser(1)
  - systemctl(1)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::boundary
  - priority::P0
- id: RHCSA-24-D01-QA-004
  type: qa
  question: '`umount -l` 的主要边界是什么？'
  answer: 它把挂载立即从目录树分离，等引用释放后再清理；旧引用可能继续存在，现场更难理解。
  extra: 不是普通 busy 的第一修复。
  source:
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::boundary
  - priority::P1
- id: RHCSA-24-D01-QA-005
  type: qa
  question: 卸载后怎样证明挂载关系消失但目录仍存在？
  answer: 结合 `findmnt --target <DIR>`、`mountpoint <DIR>` 与 `ls -ld <DIR>`。
  extra: 卸载不删除挂载点。
  source:
  - findmnt(8)
  - mountpoint(1)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::umount
  - card::verification
  - priority::P0
- id: RHCSA-24-D01-QA-006
  type: qa
  question: 目标下还有子挂载时，推荐的处理顺序是什么？
  answer: 先用 `findmnt -R` 理解层次，再按依赖从内到外安全卸载。
  extra: 不要用递归操作掩盖未知业务挂载。
  source:
  - findmnt(8)
  - umount(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::busy
  - card::process
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-010
  type: qa
  question: fstab 六字段顺序是什么？
  answer: 设备标识、挂载点、文件系统类型、挂载选项、dump 字段、fsck pass。
  extra: 六字段共同描述持久策略。
  source:
  - RH134-RHEL9-Ch5
  - RHEL9-Managing-File-Systems
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::syntax
  - priority::P0
- id: RHCSA-FILESYSTEMS-QA-011
  type: qa
  question: 为什么不应默认给 fstab 添加 `nofail`？
  answer: 它改变启动失败处理和依赖，可能掩盖本应修复的错误或让应用写入未挂载目录。
  extra: 只在明确允许降级时使用。
  source:
  - systemd.mount(5)
  - systemd-fstab-generator(8)
  - systemctl(1)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::systemd-mount
  - card::boundary
  - priority::P0
- id: RHCSA-24-K02-QA-001
  type: qa
  question: 普通 XFS 按 UUID 持久挂载的 fstab 骨架是什么？
  answer: '`UUID=<REAL_UUID> /srv/project xfs defaults 0 0`'
  extra: 按任务添加明确选项，UUID 必须是真实值。
  source:
  - RH134-RHEL9-Ch5
  - RHEL9-Managing-File-Systems
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::syntax
  - priority::P0
- id: RHCSA-24-K02-QA-002
  type: qa
  question: fstab 的 `fs_spec` 字段回答什么问题？
  answer: 要挂载或启用的源对象是谁。
  extra: 可使用 UUID=、LABEL= 或设备路径等。
  source:
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::concept
  - priority::P0
- id: RHCSA-24-K02-QA-003
  type: qa
  question: fstab 的 `fs_file` 字段回答什么问题？
  answer: 普通文件系统的挂载点；Swap 条目通常写 `none`。
  extra: 挂载点目录应存在。
  source:
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::concept
  - priority::P0
- id: RHCSA-24-K02-QA-004
  type: qa
  question: fstab 的第五、六字段常见 `0 0` 分别表示什么？
  answer: 第五字段不参与 dump；第六字段不由启动 fsck 按顺序检查。
  extra: 具体文件系统和题意可能使用其他 pass 值。
  source:
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::parameter
  - priority::P1
- id: RHCSA-24-K02-QA-005
  type: qa
  question: '`defaults` 是否等于“没有任何挂载选项”？'
  answer: 不是。它表示默认行为集合，但不会自动表达 nodev、nosuid、noexec、nofail 等策略。
  extra: 需要的限制应显式写出。
  source:
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-options
  - card::boundary
  - priority::P0
- id: RHCSA-24-K02-QA-006
  type: qa
  question: '`noauto` 与 `nofail` 的核心区别是什么？'
  answer: '`noauto` 让正常自动挂载和 `mount -a` 跳过；`nofail` 允许挂载失败而不把它作为到达相关 target 的强制条件。'
  extra: 两者都不修复错误 source。
  source:
  - fstab(5)
  - systemd.mount(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::systemd-mount
  - card::comparison
  - priority::P0
- id: RHCSA-24-K02-QA-007
  type: qa
  question: fstab 字段中的路径包含空格时应怎样表示？
  answer: 使用转义 `\040` 表示空格。
  extra: 仅加引号不能替代 fstab 的字段转义。
  source:
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::fstab-fields
  - card::syntax
