- id: RHCSA-24-K03-QA-006
  type: qa
  question: 什么场景比普通本地磁盘更可能需要 `_netdev`？
  answer: 底层依赖网络但文件系统类型本身看起来像本地类型，例如网络块设备上的文件系统。
  extra: NFS 等远程文件系统细节归第 26 章。
