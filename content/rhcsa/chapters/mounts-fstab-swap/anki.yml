  type: qa
  question: '`findmnt --verify` 通过后，为什么还要实际挂载？'
  answer: 它主要做静态解析和明显问题核对，不能证明设备当前可用、文件系统可挂载或功能正确。
  extra: 继续 `mount -a` 或挂载目标并验收。
