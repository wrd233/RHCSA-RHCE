- id: RHCSA-24-D02-QA-003
  type: qa
  question: 使用 `nofail` 后系统启动完成，但业务目录异常，先查什么？
  answer: 先用 `findmnt --target` 和 mount unit/Journal 确认目标是否实际挂载。
  extra: 启动完成不代表可选挂载成功。
  source:
  - systemd.mount(5)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::nofail
  - card::diagnosis
  - priority::P0
- id: RHCSA-24-D02-QA-004
  type: qa
  question: 当前挂载成功但重启后缺失，应重点核对哪些持久层证据？
  answer: fstab 条目、`noauto`/选项、generator 生成的 mount unit 及本次启动日志。
  extra: 手工当前挂载不是持久证据。
  source:
  - systemd.mount(5)
  - systemd-fstab-generator(8)
  - systemctl(1)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::mount-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-24-C01-QA-001
  type: qa
  question: 经典挂载任务中，第一步为什么不是直接编辑 fstab？
  answer: 必须先确认真实 UUID、文件系统类型、目标当前状态和目录是否含有需保留内容。
  extra: 避免挂错对象和遮蔽数据。
  source:
  - RH124-RHEL9-Ch15
  - mount(8)
  - umount(8)
  - RH134-RHEL9-Ch5
  - RHEL9-Managing-File-Systems
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-persistent-mount
  - card::process
  - priority::P0
  - task::persistent-mount
- id: RHCSA-24-C01-QA-002
  type: qa
  question: 怎样证明 `/srv/project` 当前由目标文件系统提供，而不是根文件系统普通目录？
  answer: 核对 `findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS --target /srv/project`，并结合 `df -hT`。
  extra: 目录存在和 touch 成功都不够。
  source:
  - findmnt(8)
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-persistent-mount
  - card::verification
  - priority::P0
  - task::persistent-mount
- id: RHCSA-24-C01-QA-003
  type: qa
  question: 为什么经典挂载任务建议从未挂载状态执行 `mount /srv/project`？
  answer: 它迫使 mount 从 fstab 读取完整声明，直接测试该条配置能否建立当前关系。
  extra: 已手工挂载时 `mount -a` 可能跳过。
  source:
  - mount(8)
  - fstab(5)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-persistent-mount
  - card::verification
  - priority::P0
  - task::persistent-mount
- id: RHCSA-24-C01-QA-004
  type: qa
  question: 挂载选项验收时，为什么不要求当前 OPTIONS 与 fstab 文本逐字相同？
  answer: 内核和文件系统会补充或展开当前选项；应确认目标选项存在且没有冲突。
  extra: 重点核对语义而非字符串完全相等。
  source:
  - mount(8)
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-persistent-mount
  - card::output
  - priority::P1
  - task::persistent-mount
- id: RHCSA-24-C02-QA-001
  type: qa
  question: 新增 Swap 任务中，怎样证明没有破坏原有 Swap？
  answer: 保存操作前后的 `swapon --show`，逐项比较已有 NAME、SIZE 和 PRIO。
  extra: 只看总量增加不够。
  source:
  - swapon(8)
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-swap
  - card::verification
  - priority::P0
  - task::swap-priority
- id: RHCSA-24-C02-QA-002
  type: qa
  question: 新增 Swap 的完整主流程是什么？
  answer: 基线 → 确认空闲 → `mkswap` → 取 UUID → `swapon -p` → 写 fstab → reload/verify → 设备级验收 → 安全重入。
  extra: 每层都有独立证据。
  source:
  - RH134-RHEL9-Ch5-pp140-143
  - mkswap(8)
  - swapon(8)
  - fstab(5)
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-swap
  - card::process
  - priority::P0
  - task::swap-priority
- id: RHCSA-24-C02-QA-003
  type: qa
  question: 经典 Swap 任务中，为什么 `free -h` 只能作为补充证据？
  answer: 它只显示汇总总量和使用量，不显示具体设备、类型或优先级。
  extra: 核心验收使用 `swapon --show`。
  source:
  - free(1)
  - swapon(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-swap
  - card::boundary
  - priority::P0
  - task::swap-priority
- id: RHCSA-24-C02-QA-004
  type: qa
  question: 经典 Swap 任务中，从 fstab 重入前必须满足什么安全条件？
  answer: 只操作新增区域，并确认其 USED、可用内存和其他 Swap 足以承接页面。
  extra: 不满足时不要为了测试强行 swapoff。
  source:
  - swapoff(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::task-swap
  - card::security
  - priority::P0
  - task::swap-priority
- id: RHCSA-24-O05-QA-001
  type: qa
  question: 持久挂载变更的三种验证层次是什么？
  answer: 即时验证、从未挂载状态的重入验证、真实重启验证。
  extra: 本章没有执行真实重启。
  source:
  - RHEL9-Managing-File-Systems
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::verification-boundary
  - card::comparison
  - priority::P0
- id: RHCSA-24-O05-QA-002
  type: qa
  question: 监控关键挂载时，为什么不能只检查目录存在？
  answer: 挂载缺失时目录仍可能存在并可写，导致数据写入父文件系统。
  extra: 监控应核对 target 对应的 source/type。
  source:
  - findmnt(8)
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::monitoring
  - card::boundary
  - priority::P1
- id: RHCSA-24-O05-QA-003
  type: qa
  question: RHCE 自动化对本章手工状态模型的核心映射是什么？
  answer: 把 source、target、fstype、options、当前状态和持久状态映射为声明式目标，并继续分层验证。
  extra: 具体模块归 RHCE 存储自动化章。
  source:
  - ansible.posix.mount
  - RHEL9-RHCSA-RHCE-Architecture
  tags:
  - exam::rhcsa
  - chapter::mounts-fstab-swap
  - topic::automation-boundary
  - card::concept
  - priority::P2
