  type: qa
  question: '`_netdev` 的核心作用是什么？'
  answer: 强制把该挂载按依赖网络的挂载分类，从而建立相应网络和 remote-fs 相关依赖/排序。
  extra: 它不配置网络，也不修复远端不可达。
