  question: 为什么关键数据盘不应为“能启动”随意添加 `nofail`？
  answer: 挂载缺失时系统可能继续启动，应用随后把数据写入父文件系统，故障被延迟和掩盖。
  extra: 应由业务降级策略和监控决定。
