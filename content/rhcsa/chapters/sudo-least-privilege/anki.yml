- id: RHCSA-10-K05-QA-001
  type: qa
  question: 为什么把 `/usr/bin/python3` 授权给 root Runas 通常等价于可编程特权入口？
  answer: 解释器可以执行任意代码、系统调用和其他程序。
  extra: 不能只因命令路径固定就认为行为固定。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::wrapper-risk
  - card::security
  - priority::P0
- id: RHCSA-10-K05-QA-002
  type: qa
  question: 规则只允许一个 root 包装脚本时，至少还要检查哪些对象？
  answer: 脚本和父目录所有权/可写性、内部 PATH、调用的子命令、参数和用户可控配置。
  extra: 用户能修改脚本或替换目录项时，可改变 root 执行内容。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::wrapper-risk
  - card::process
  - priority::P0
- id: RHCSA-10-K05-QA-003
  type: qa
  question: 为什么“只允许 root 编辑器”仍可能获得远超单文件编辑的能力？
  answer: 编辑器可能打开其他文件、执行外部命令或启动 Shell。
  extra: 只需编辑特定文件时优先 sudoedit。
  source:
  - sudoers(5)
  - sudo(8)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
