- id: RHCSA-10-O02-QA-003
  type: qa
  question: '`#includedir /etc/sudoers.d` 开头的 `#` 是否表示整行只是注释？'
  answer: 不是；这里是 sudoers 的 include 语法。
  extra: 不要按普通 Shell 注释规则误判。
  source:
