- id: RHCSA-10-O02-QA-005
  type: qa
  question: sudoers.d 片段推荐的所有者和模式是什么？
  answer: 通常为 `root:root` 和 `0440`。
  extra: 仍应以目标系统策略和 visudo 检查结果为准。
  source:
