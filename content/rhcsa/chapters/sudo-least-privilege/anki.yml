  - chapter::sudo-least-privilege
  - topic::visudo-includes
  - card::command
  - priority::P0
- id: RHCSA-10-O02-QA-001
  type: qa
  question: 安全创建 `/etc/sudoers.d/70-webops-httpd` 的编辑命令是什么？
  answer: '`visudo -f /etc/sudoers.d/70-webops-httpd`'
  extra: visudo 提供锁定与保存时语法检查。
  source:
  - RH124-RHEL9
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - visudo(8)
