- id: RHCSA-10-O03-QA-002
  type: qa
  question: 测试 `NOPASSWD` 前为什么先执行 `sudo -k`？
  answer: 使下一次需要密码的调用重新认证，避免现有认证时间戳掩盖真实标签行为。
  extra: 它不删除 sudoers 规则。
  source:
  - RHCSA-Advanced-Users-Permissions-Slides
  - sudo(8)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::list-verification
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-O03-QA-003
  type: qa
  question: '`sudo -n <command>` 的作用是什么？'
  answer: 使用非交互模式；若需要密码则不提示并直接失败。
  extra: 失败还要区分“需密码”和“未授权”。
  source:
  - sudo(8)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::list-verification
  - card::parameter
  - priority::P0
- id: RHCSA-10-O03-QA-004
  type: qa
  question: 怎样证明精确 status 命令为免密授权，而不是命中了旧认证时间戳？
  answer: 先 `sudo -k`，再执行 `sudo -n /usr/bin/systemctl --no-pager status httpd`。
  extra: 同时确认 `sudo -l` 中该精确命令标为 NOPASSWD。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::list-verification
  - card::verification
  - priority::P0
- id: RHCSA-10-O03-QA-005
  type: qa
  question: '`sudo -l` 中出现相关命令，为什么仍要运行真实调用？'
  answer: 列表不能证明本次 Runas、路径和参数完全一致，也不能证明目标程序成功。
  extra: 它是匹配调查入口，不是功能终态。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::list-verification
  - card::boundary
  - priority::P0
- id: RHCSA-USERS-O03-QA-007
  type: qa
  question: sudoers 中 `NOPASSWD:` 改变什么，不改变什么？
  answer: 改变匹配命令是否要求本次密码认证；不改变允许执行的命令范围。
  extra: 仍需最小命令授权，并排除认证时间戳干扰。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authentication
  - card::comparison
  - priority::P0
- id: RHCSA-10-K06-QA-001
  type: qa
  question: sudo 默认要求调用者密码还是 root 密码？
  answer: 通常要求调用者自己的密码。
  extra: 具体认证策略仍可能由配置改变。
  source:
  - RH124-RHEL9
  - sudo(8)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authentication
  - card::concept
  - priority::P0
- id: RHCSA-10-K06-QA-002
  type: qa
  question: 一次 sudo 未提示密码，能否直接断言规则是 `NOPASSWD`？
  answer: 不能；可能只是近期认证时间戳仍有效。
  extra: 用 `sudo -k` 后重新测试。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
