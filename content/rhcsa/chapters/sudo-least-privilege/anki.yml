  type: qa
  question: 该 webops 任务的分层验收顺序是什么？
  answer: 片段语法 → 完整策略 → sudo -l → status 免密 → restart 认证 → 其他动作/服务/Shell 拒绝 → 服务功能。
  extra: 每层证明不同事实。
