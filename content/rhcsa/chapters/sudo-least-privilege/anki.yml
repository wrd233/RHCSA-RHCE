- id: RHCSA-10-O03-QA-001
  type: qa
  question: 当前用户查看自己 sudo 授权的命令是什么？
  answer: '`sudo -l`'
  extra: 同时读取适用 Defaults、Runas、标签、路径和参数。
  source:
