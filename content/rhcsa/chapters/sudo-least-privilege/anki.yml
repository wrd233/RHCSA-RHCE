- id: RHCSA-10-K07-QA-001
  type: qa
  question: '`env_reset` 的主要安全目的是什么？'
  answer: 构造较受控的命令环境，减少调用者不受控变量进入特权进程。
  extra: 不应为方便而默认保留整个用户环境。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::environment
  - card::security
  - priority::P1
- id: RHCSA-10-K07-QA-002
  type: qa
  question: '`secure_path` 配置后会影响什么？'
  answer: sudo 执行命令时使用的 PATH；它可包含管理命令目录并降低 PATH 劫持风险。
  extra: 实际值必须读取目标系统配置。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::environment
  - card::configuration
  - priority::P0
- id: RHCSA-10-K07-QA-003
  type: qa
  question: sudoers 已使用绝对脚本路径，为什么脚本内部仍可能受 PATH 影响？
  answer: 脚本内部可能用非绝对名称启动子命令。
  extra: 脚本应设置安全 PATH 或为子命令使用绝对路径。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::environment
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-K07-QA-004
  type: qa
  question: 命令普通执行成功、经 sudo 后找不到程序，下一步最有区分度的证据是什么？
  answer: 比较 `env` 与 `sudo env`，并检查 `secure_path` 和目标脚本内部调用。
  extra: 不要先把规则扩大为 ALL。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::environment
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-K07-QA-005
  type: qa
  question: 为什么不应把 `sudo -E` 当作环境问题的默认修复？
  answer: 它可能保留不可信变量进入特权进程，扩大攻击面。
  extra: 应只保留业务明确需要且经过评估的变量。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::environment
  - card::boundary
  - priority::P1
- id: RHCSA-10-O04-QA-001
  type: qa
  question: sudoers 中允许编辑 `/etc/motd` 的 sudoedit 规则骨架是什么？
  answer: '`operator ALL=(root) sudoedit /etc/motd`'
  extra: sudoedit 是内建命令，在 sudoers 中不写前导路径。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoedit
  - card::configuration
  - priority::P0
- id: RHCSA-10-O04-QA-002
  type: qa
  question: 调用 sudoedit 编辑目标文件的两种常见形式是什么？
  answer: '`sudoedit /path/to/file` 或 `sudo -e /path/to/file`。'
  extra: 编辑器以调用者身份处理临时副本，之后受控写回。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoedit
  - card::command
  - priority::P0
- id: RHCSA-10-O04-QA-003
  type: qa
  question: 为什么 sudoers 中不应写 `/usr/bin/sudoedit /etc/motd`？
  answer: sudoedit 是 sudo 内建能力，应在规则中写成无前导路径的 `sudoedit`。
  extra: 带完整路径的写法会被 visudo 视为错误。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoedit
  - card::syntax
  - priority::P0
- id: RHCSA-10-O04-QA-004
  type: qa
  question: 为什么不能把 sudoedit 授权给位于调用者可写目录中的文件？
  answer: 调用者可能替换文件或链接，从而改变真正被编辑的对象。
  extra: 授权前检查所有父目录的控制权。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoedit
  - card::security
  - priority::P0
- id: RHCSA-10-O04-QA-005
  type: qa
  question: 只需编辑一份配置时，sudoedit 相比 `sudo vim` 的核心优势是什么？
  answer: 可把授权限制到目标路径，编辑器本身以调用者身份运行，降低通用 root 编辑器的逃逸面。
  extra: 仍需验证未授权文件被拒绝。
  source:
  - sudoers(5)
  - sudo(8)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoedit
  - card::comparison
  - priority::P0
- id: RHCSA-10-D01-QA-001
  type: qa
  question: '`sudo -l` 允许 `/usr/bin/systemctl --no-pager status httpd`，实际 `status httpd.service` 被拒绝，下一条最有区分度的命令是什么？'
  answer: '`sudo /usr/bin/systemctl --no-pager status httpd`'
  extra: 先按列表中的精确参数调用，隔离参数匹配问题。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::mismatch-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-D01-QA-002
  type: qa
  question: 规则只允许 `(postgres)`，用户不带 `-u` 执行命令被拒绝，最可能缺少什么？
  answer: 请求的 Runas 身份不匹配；应按规则使用 `sudo -u postgres ...`。
  extra: 不要为解决 Runas 差异扩大成 `(ALL)`。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::mismatch-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-D01-QA-003
  type: qa
  question: 修复参数不匹配时，哪两种方案符合最小修改？
  answer: 让用户使用已授权的精确形式，或在业务确有需要时增加另一条精确命令规格。
  extra: 不要改成 `/usr/bin/systemctl *`。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::mismatch-diagnosis
  - card::process
  - priority::P0
- id: RHCSA-10-D01-QA-004
  type: qa
  question: 为什么 systemctl 的参数顺序也应进入 sudo 验收？
  answer: sudoers 匹配命令行参数；目标程序接受等价顺序，不代表策略自动匹配。
  extra: 用实际规则和调用逐字比较。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::mismatch-diagnosis
  - card::boundary
  - priority::P1
- id: RHCSA-10-D02-QA-001
  type: qa
  question: sudoers.d 片段存在但 `sudo -l` 看不到，第一组证据是什么？
  answer: '`ls -l`/`stat` 检查文件名、路径、所有者和模式，再运行 `visudo -cf` 与 `visudo -c`。'
  extra: 重点排除点号、波浪号后缀和错误目录。
  source:
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - visudo(8)
  tags:
