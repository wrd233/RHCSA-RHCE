- id: RHCSA-10-O01-QA-002
  type: qa
  question: 只允许免密查看 httpd 状态的规则骨架是什么？
  answer: '`%webops ALL=(root) NOPASSWD: /usr/bin/systemctl --no-pager status httpd`'
  extra: 路径必须先在目标机确认。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::least-privilege-design
  - card::configuration
  - priority::P0
- id: RHCSA-10-O01-QA-003
  type: qa
  question: 为什么最小授权验收必须包含拒绝矩阵？
  answer: 成功命令只能证明允许路径；拒绝矩阵才能证明其他参数、对象和 Shell 没有被意外授权。
  extra: 至少测试其他服务、其他动作和 root Shell。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::least-privilege-design
  - card::verification
  - priority::P0
- id: RHCSA-10-O01-QA-004
  type: qa
  question: 现有系统已存在宽泛 `%webops ... ALL`，新增精确规则后能否直接宣布收紧成功？
  answer: 不能；宽泛规则仍可能继续匹配，必须定位并删除或收缩它，再重做拒绝测试。
  extra: 完整策略和顺序比单个新片段更重要。
  source:
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - sudoers(5)
  tags:
