- id: RHCSA-10-K02-QA-001
  type: qa
  question: 规则 `%webops ALL=(root:root) /usr/bin/id` 中四个主要部分分别是什么？
  answer: '`%webops` 是主体组，`ALL` 是主机，`(root:root)` 是 Runas 用户和组，最后是命令规格。'
  extra: 不同位置的 `ALL` 语义不同。
  source:
  - RH124-RHEL9
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - sudoers(5)
