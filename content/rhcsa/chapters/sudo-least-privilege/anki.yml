  - priority::P0
- id: RHCSA-10-D03-QA-002
  type: qa
  question: systemctl 经 sudo 执行后 unit 仍 failed，本章下一步是什么？
  answer: 确认策略层已通过，然后转入 systemd 章节检查 unit 状态、日志和依赖。
  extra: 不要扩大 sudo 规则来掩盖服务故障。
  source:
  - sudo(8)
  tags:
