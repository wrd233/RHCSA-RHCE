- id: RHCSA-10-K02-QA-002
  type: qa
  question: sudoers 主体前的 `%` 表示什么？
  answer: 表示 Unix 组；规则匹配该组成员。
  extra: 组创建和成员维护归用户与组章节。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
