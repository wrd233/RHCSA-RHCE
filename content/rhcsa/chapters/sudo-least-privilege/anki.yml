- id: RHCSA-10-K01-QA-001
  type: qa
  question: 一次 sudo 授权请求至少要同时判断哪些核心维度？
  answer: 调用者、主机、Runas 用户/组、命令绝对路径和参数；标签与 Defaults 还会影响认证和环境。
  extra: 只说“用户有 sudo 权限”无法表达真实边界。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authorization-model
  - card::concept
  - priority::P0
- id: RHCSA-10-K01-QA-002
  type: qa
  question: 调用者身份与 Runas 身份分别是什么？
  answer: 调用者是发起 sudo 的当前用户；Runas 是目标命令最终使用的用户和组。
  extra: 默认目标用户常为 root，但规则可以指定其他用户。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authorization-model
  - card::comparison
  - priority::P0
- id: RHCSA-10-K01-QA-003
  type: qa
  question: sudo 没有拒绝命令，能否证明目标服务或文件任务已经正确完成？
  answer: 不能。它只证明策略允许并启动了目标程序；还要检查程序退出状态和目标对象证据。
  extra: 不要把授权成功扩大为业务终态正确。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authorization-model
  - card::boundary
  - priority::P0
- id: RHCSA-10-K01-QA-004
  type: qa
  question: 为什么允许 `sudo -i` 或 `/bin/bash` 通常不属于最小特权？
  answer: 它提供可继续选择任意命令的 root Shell，使原本的路径和参数限制失效。
  extra: 有限管理任务应直接允许所需的精确命令。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::authorization-model
  - card::security
  - priority::P0
