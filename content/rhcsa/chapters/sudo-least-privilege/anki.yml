  - chapter::sudo-least-privilege
  - topic::least-privilege-design
  - card::diagnosis
  - priority::P0
- id: RHCSA-USERS-O03-QA-005
  type: qa
  question: 校验 sudoers 片段语法的命令骨架是什么？
  answer: '`visudo -cf /etc/sudoers.d/<file>`'
  extra: 片段通过后还应运行 `visudo -c` 校验完整策略树；片段推荐由 root 控制并使用 0440。
  source:
  - RH124-RHEL9
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - visudo(8)
  tags:
