- id: RHCSA-10-C01-QA-001
  type: qa
  question: 为 webops 配置“status 免密、restart 需密码”的最小规则，核心命令列表是什么？
  answer: '`NOPASSWD: /usr/bin/systemctl --no-pager status httpd, PASSWD: /usr/bin/systemctl restart httpd`'
  extra: 前面还应写 `%webops ALL=(root)`；路径以目标机为准。
