- id: RHCSA-10-D03-QA-003
  type: qa
  question: 目标文件经 sudoedit 写回后应用仍不可用，能否据此判断 sudoedit 授权失败？
  answer: 不能；还要检查写回结果、文件内容、权限、应用配置校验和服务状态。
  extra: sudoedit 只负责受控编辑边界。
  source:
  - sudoers(5)
