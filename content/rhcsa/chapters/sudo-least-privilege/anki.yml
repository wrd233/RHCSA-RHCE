  - chapter::sudo-least-privilege
  - topic::load-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-D02-QA-002
  type: qa
  question: 片段 `visudo -cf` 成功但 `visudo -c` 失败，说明什么？
  answer: 当前片段自身可解析，但完整策略树中仍有其他文件、别名或组合错误。
  extra: 不要把片段成功扩大为全局有效。
  source:
  - visudo(8)
