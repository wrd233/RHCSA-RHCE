- id: RHCSA-10-O02-QA-004
  type: qa
  question: 为什么 `visudo -cf <fragment>` 成功后仍要执行 `visudo -c`？
  answer: 片段单独通过不能发现完整策略中的别名冲突、其他文件错误和顺序影响。
  extra: 全局校验把主文件和 include 作为整体读取。
  source:
