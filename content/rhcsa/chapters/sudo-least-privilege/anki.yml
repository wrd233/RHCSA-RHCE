- id: RHCSA-USERS-C01-QA-002
  type: qa
  question: 只允许项目组查看和重启 httpd，sudoers 应避免什么宽泛规则？
  answer: 避免 `%project ALL=(ALL) ALL`；只列出所需的 Runas、绝对命令路径和参数。
  extra: 还要用 visudo、sudo -l、允许和拒绝测试验收。
  source:
  - RHCSA9-Mock-Sudo-Task
  - RH124-RHEL9
  - sudoers(5)
  tags:
