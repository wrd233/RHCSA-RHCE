- id: RHCSA-10-K02-QA-003
  type: qa
  question: sudoers 中括号里的 `(postgres)` 表示调用者还是目标身份？
  answer: 目标 Runas 用户；调用者写在规则最左侧。
  extra: 调用时通常用 `sudo -u postgres ...` 请求该身份。
  source:
  - RH124-RHEL9
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoers-syntax
  - card::comparison
  - priority::P0
- id: RHCSA-10-K02-QA-004
  type: qa
  question: 一条命令列表中的 `NOPASSWD:` 会影响哪里？
  answer: 从该标签出现的位置开始影响后续命令，直到被同列表中的相反标签等改变。
  extra: 复杂列表应显式重复标签，降低误读。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoers-syntax
  - card::configuration
  - priority::P1
- id: RHCSA-10-K02-QA-005
  type: qa
  question: 主机字段中的 `ALL` 与命令位置的 `ALL` 有何区别？
  answer: 主机 `ALL` 表示规则适用于所有匹配主机；命令 `ALL` 表示允许所有命令，风险远大。
  extra: 读规则必须结合字段位置。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::sudoers-syntax
  - card::comparison
  - priority::P0
