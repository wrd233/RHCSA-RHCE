- id: RHCSA-10-C01-QA-004
  type: qa
  question: webops 经典任务至少应拒绝哪些三类能力？
  answer: 未授权 systemctl 动作、其他 unit、root Shell/通用解释器。
  extra: 拒绝测试用于证明规则没有超出目标。
