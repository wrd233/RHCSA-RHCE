  - card::security
  - priority::P0
- id: RHCSA-10-K05-QA-004
  type: qa
  question: 检查授权脚本路径各级目录控制权的推荐命令是什么？
  answer: '`namei -l <path>`，再结合 `stat` 和必要的 `getfacl`。'
  extra: 权限机制细节归第 08、09 章。
  source:
  - sudoers(5)
  tags:
