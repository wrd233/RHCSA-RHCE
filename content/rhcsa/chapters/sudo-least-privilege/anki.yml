- id: RHCSA-10-K03-QA-001
  type: qa
  question: '`User_Alias`、`Host_Alias`、`Runas_Alias`、`Cmnd_Alias` 分别复用什么？'
  answer: 调用者、主机、目标身份、命令规格集合。
  extra: 别名只提高复用和可读性，不自动收紧授权。
  source:
  - RHCSA-Advanced-Users-Permissions-Slides
  - sudoers(5)
  tags:
