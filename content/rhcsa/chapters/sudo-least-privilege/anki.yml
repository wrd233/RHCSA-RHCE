- id: RHCSA-10-O02-QA-002
  type: qa
  question: 为什么 sudoers.d 片段名不应包含 `.` 或以 `~` 结尾？
  answer: include 目录会忽略这类名称，规则可能存在于磁盘却没有被加载。
  extra: 编辑器备份名是常见故障来源。
  source:
