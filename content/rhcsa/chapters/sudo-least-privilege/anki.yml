  - chapter::sudo-least-privilege
  - topic::load-diagnosis
  - card::output
  - priority::P0
- id: RHCSA-10-D02-QA-003
  type: qa
  question: 规则看似 NOPASSWD，但测试仍要求密码，除标签外还要检查什么？
  answer: 同一请求匹配的后续规则及 PASSWD 标签、调用参数是否精确一致。
  extra: 先 `sudo -k` 排除时间戳，再看完整顺序。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::load-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-D02-QA-004
  type: qa
  question: sudo 已启动程序但程序报告 `command not found`，是否应先扩大 sudoers？
  answer: 不应；先检查 sudo 环境、secure_path 和程序内部的子命令路径。
  extra: 这是执行环境或目标程序问题，不等于未授权。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::load-diagnosis
