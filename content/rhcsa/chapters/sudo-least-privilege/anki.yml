  type: qa
  question: 诊断“列表可见但调用被拒绝”的比较顺序是什么？
  answer: 调用者/主机 → Runas → 可执行路径 → 参数内容与顺序 → 后续规则和标签。
  extra: 每步都缩小匹配差异。
