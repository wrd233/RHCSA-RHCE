  - chapter::sudo-least-privilege
  - topic::aliases-order
  - card::comparison
  - priority::P1
- id: RHCSA-10-K03-QA-002
  type: qa
  question: 同一请求匹配多条 sudoers 规则时，能否假定最具体的一条优先？
  answer: 不能。匹配项按读取顺序应用，冲突时最后匹配值可能生效。
  extra: 调查必须读取完整策略和 include 顺序。
  source:
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::aliases-order
  - card::boundary
  - priority::P0
- id: RHCSA-10-K03-QA-003
  type: qa
  question: 为什么不推荐用 `ALL, !/bin/bash` 作为有限授权的主要结构？
  answer: 否定少数命令无法穷举所有等价 Shell、解释器和程序逃逸路径。
  extra: 优先从短小允许列表开始。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::aliases-order
  - card::security
  - priority::P0
- id: RHCSA-10-K03-QA-004
  type: qa
  question: 只使用一次且内容很短的命令集合，是否必须定义 `Cmnd_Alias`？
  answer: 不必须。直接写清楚常比增加间接层更容易审计。
  extra: 别名适合复用稳定集合，而不是追求形式复杂。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::aliases-order
  - card::boundary
  - priority::P2
- id: RHCSA-USERS-O03-QA-008
  type: qa
  question: 为什么 sudoers 命令通常写绝对路径？
  answer: 明确授权的是哪个可执行文件，减少 PATH 解析歧义。
  extra: 仍需检查参数、程序内部子命令和用户可修改脚本带来的扩权。
  source:
  - RH124-RHEL9
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-K04-QA-001
  type: qa
  question: sudoers 只写 `/usr/bin/systemctl` 而不写参数，通常意味着什么？
  answer: 用户可为该命令选择任意参数，而不是“只能无参数运行”。
  extra: 对多功能管理命令，这通常过宽。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::boundary
  - priority::P0
- id: RHCSA-10-K04-QA-002
  type: qa
  question: 规则允许 `/usr/bin/systemctl --no-pager status httpd`，调用 `systemctl status httpd.service` 一定匹配吗？
  answer: 不一定；参数内容和顺序不同，sudoers 会按命令规格匹配。
  extra: 程序层面的等价写法不等于策略层自动等价。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::output
  - priority::P0
- id: RHCSA-10-K04-QA-003
  type: qa
  question: 为什么 sudoers 参数中的 `*` 比普通文件名 glob 更危险？
  answer: 参数按组合字符串匹配，`*` 可匹配空白并跨越参数边界。
  extra: 它可能把额外路径或子命令一并纳入允许范围。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::security
  - priority::P0
- id: RHCSA-10-K04-QA-004
  type: qa
  question: 编写 sudoers 前确认命令真实路径的命令骨架是什么？
  answer: '`command -v <command>`；需要时再用 `readlink -f` 查看解析后的路径。'
  extra: 以目标主机实际结果为准。
  source:
  - RHEL9-Configuring-Basic-System-Settings-Ch8
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::command
  - priority::P0
- id: RHCSA-10-K04-QA-005
  type: qa
  question: 怎样在 sudoers 中表达“程序不得带任何参数”这一意图？
  answer: 可使用命令后跟空参数字符串 `""` 的语义。
  extra: 这是精确边界语法；常规任务更常直接写出需要的固定参数。
  source:
  - sudoers(5)
  tags:
  - exam::rhcsa
  - chapter::sudo-least-privilege
  - topic::command-arguments
  - card::syntax
  - priority::P2
- id: RHCSA-10-K04-CLOZE-001
  type: cloze
  text: sudoers 中未指定命令行参数时，用户通常可选择{{c1::任意参数}}；参数通配符 `*` 还可能匹配{{c2::空白}}。
  extra: 这也是多功能命令必须限制参数的原因。
