- id: RHCSA-10-C01-QA-003
  type: qa
  question: 验证 restart 确实需要密码，而不是测试终端已有时间戳，应怎样做？
  answer: 先 `sudo -k`，再用 `sudo -n /usr/bin/systemctl restart httpd`；预期因需要认证而失败。
  extra: 随后用交互方式输入调用者密码验证允许路径。
