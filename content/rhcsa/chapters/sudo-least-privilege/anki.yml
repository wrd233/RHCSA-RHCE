  - priority::P0
- id: RHCSA-10-D03-QA-001
  type: qa
  question: 怎样区分 sudoers 拒绝与目标程序自身失败？
  answer: 看错误来源、sudo 是否已启动目标程序、目标程序的退出状态和自身错误信息。
  extra: 授权通过后应转入目标对象的诊断入口。
  source:
  - sudo(8)
  - sudoers(5)
  tags:
