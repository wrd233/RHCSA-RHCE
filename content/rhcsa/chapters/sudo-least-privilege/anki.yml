  - chapter::sudo-least-privilege
  - topic::least-privilege-design
  - card::diagnosis
  - priority::P0
- id: RHCSA-10-O01-QA-001
  type: qa
  question: 把“允许 webops 管理 httpd”改写为 sudoers 前，应先明确哪两张清单？
  answer: 允许动作清单和必须拒绝的动作清单。
  extra: 例如允许 status/restart，同时拒绝 stop、其他 unit 和 root Shell。
  source:
  - RH124-RHEL9
  - RHCSA9-Mock-Sudo-Task
  tags:
