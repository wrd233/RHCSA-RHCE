- id: RHCSA-10-K06-QA-003
  type: qa
  question: '`sudo -n` 返回非零是否一定表示命令未授权？'
  answer: 不一定；命令可能已授权但需要交互式密码。
  extra: 结合错误信息、sudo -l 和标签判断。
  source:
  - sudo(8)
