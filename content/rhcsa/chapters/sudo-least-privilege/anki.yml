  type: qa
  question: 规则允许精确 status 形式但实际命令参数不同，为什么不能直接改成 `systemctl *`？
  answer: 它会把其他动作和其他 unit 一并放开，远超当前参数差异的修复范围。
  extra: 应改调用形式或增加另一条精确命令。
