chapter_id: RHCSA-USERS
deck: RedHat::RHCSA-RHEL9
note_types: [RedHat-QA, RedHat-Cloze]
notes:
  - id: RHCSA-USERS-K01-QA-001
    type: qa
    question: '`/etc/passwd`、`/etc/shadow`、`/etc/group` 分别保存什么核心信息？'
    answer: 账号属性；口令哈希与期限；组定义与显式成员。
    extra: 用户主组由 passwd 中的主 GID 表达。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::comparison, priority::P0]
  - id: RHCSA-USERS-K01-QA-002
    type: qa
    question: 为什么 `/etc/group` 某组成员列表为空仍可能有人属于该组？
    answer: 用户可以通过 `/etc/passwd` 中的主 GID 把该组作为主组。
    extra: 使用 `id <USER>` 汇总身份。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-K01-QA-003
    type: qa
    question: 通过系统名称服务查询账号和组，推荐什么命令？
    answer: '`getent passwd <USER>` 与 `getent group <GROUP>`。'
    extra: 比直接 grep 本地文件更符合解析语义。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-K01-QA-004
    type: qa
    question: '`useradd -u`、`-g`、`-G`、`-s` 分别指定什么？'
    answer: UID、主组、附加组列表、登录 Shell。
    extra: '`-d` 指定家目录，`-m` 创建家目录。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::parameter, priority::P0]
  - id: RHCSA-USERS-K01-QA-005
    type: qa
    question: 给 alice 追加附加组 developers 的正确命令是什么？
    answer: '`usermod -aG developers alice`'
    extra: 漏掉 `-a` 会替换附加组列表。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-K01-QA-006
    type: qa
    question: 管理员已把用户加入新组，但其当前 Shell 的 `id` 看不到，原因是什么？
    answer: 进程在启动时取得附加组，现有会话未刷新。
    extra: 重新登录或创建新的组身份会话。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-K02-QA-001
    type: qa
    question: 目录的 `r`、`w`、`x` 分别控制什么？
    answer: 列出名称；创建/删除/改名目录项；穿越并访问已知名称。
    extra: 与普通文件 rwx 语义不同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::concept, priority::P0]
  - id: RHCSA-USERS-K02-QA-002
    type: qa
    question: 删除一个文件主要取决于文件自身写权限还是父目录权限？
    answer: 父目录的写和执行权限。
    extra: sticky 位可能继续限制删除者身份。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-K02-QA-003
    type: qa
    question: 用户既是文件所有者又属于文件组时，权限会相加吗？
    answer: 不会；匹配 owner 后只使用 owner 权限类。
    extra: owner、group、other 三类只选择一类。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::concept, priority::P1]
  - id: RHCSA-USERS-K02-QA-004
    type: qa
    question: umask 为 `0027` 时，典型新文件和新目录模式是什么？
    answer: 文件 `0640`，目录 `0750`。
    extra: 程序可请求更窄权限。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::calculation, priority::P0]
  - id: RHCSA-USERS-K02-QA-005
    type: qa
    question: 只在当前 Shell 执行 `umask 0027` 能否证明持久策略已配置？
    answer: 不能；它只影响当前 Shell 及其后代。
    extra: 持久配置后要用新登录会话创建样本验证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::verification, priority::P0]
  - id: RHCSA-USERS-K02-QA-006
    type: qa
    question: 目录 setgid 位解决什么问题？
    answer: 让新建对象继承目录所属组。
    extra: 它不自动保证组写权限。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::concept, priority::P0]
  - id: RHCSA-USERS-K02-QA-007
    type: qa
    question: 把 `/srv/project` 配为组内 rwx 且新对象继承组，模式命令是什么？
    answer: '`chmod 2770 /srv/project`'
    extra: 前导 2 是 setgid。
    source: [RH124, RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-K02-QA-008
    type: qa
    question: 目录 sticky 位的核心效果是什么？
    answer: 在可写目录中限制删除/改名，通常只允许文件所有者、目录所有者或 root。
    extra: 典型公共目录模式为 `1777`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::concept, priority::P0]
  - id: RHCSA-USERS-O01-QA-001
    type: qa
    question: setgid 协作目录中，新文件仍不允许组写，优先检查什么？
    answer: 创建进程的 umask 或目录默认 ACL。
    extra: setgid 只负责所属组继承。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-O01-QA-002
    type: qa
    question: 怎样用 bob 的实际身份测试其能否追加项目文件？
    answer: '`sudo -u bob sh -c ''echo test >> /srv/project/file''`'
    extra: 真实功能测试能同时暴露身份、路径和文件权限问题。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::verification, priority::P1]
  - id: RHCSA-USERS-O02-QA-001
    type: qa
    question: 访问 ACL 与目录默认 ACL 的核心区别是什么？
    answer: 访问 ACL 控制当前对象；默认 ACL 作为新建后代的继承模板。
    extra: 默认 ACL 不回溯修改已有对象。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::comparison, priority::P0]
  - id: RHCSA-USERS-O02-QA-002
    type: qa
    question: 给 alice 增加当前对象 `rw` ACL 的命令骨架是什么？
    answer: '`setfacl -m u:alice:rw <PATH>`'
    extra: 目录穿越通常需要 `x`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-O02-QA-003
    type: qa
    question: 给目录设置 alice 的默认 `rwx` ACL，命令骨架是什么？
    answer: '`setfacl -m d:u:alice:rwx <DIR>`'
    extra: 仍应创建新对象检查继承结果。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-O02-QA-004
    type: qa
    question: '`getfacl` 中出现 `#effective:r--` 表示什么？'
    answer: 条目写得更宽，但 ACL mask 把有效权限限制为只读。
    extra: mask 影响 group class 的多个条目。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::output, priority::P0]
  - id: RHCSA-USERS-O02-QA-005
    type: qa
    question: 为什么不应无条件把 ACL mask 设为 rwx？
    answer: 它会同时放宽 named users、named groups 和所属组的有效权限上限。
    extra: 应按目标授权最小调整。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-O02-QA-006
    type: qa
    question: 怎样证明默认 ACL 真正影响了新对象？
    answer: 以目标创建身份新建对象，再对新对象运行 `getfacl` 和功能测试。
    extra: 只看目录默认条目不够。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::verification, priority::P0]
  - id: RHCSA-USERS-O03-QA-001
    type: qa
    question: '`chage -M`、`-m`、`-W`、`-E` 分别设置什么？'
    answer: 最大期限、最小期限、到期前警告天数、账号过期日期。
    extra: '`-d 0` 常用于强制下次登录修改口令。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::parameter, priority::P0]
  - id: RHCSA-USERS-O03-QA-002
    type: qa
    question: 查看用户口令期限和口令状态分别用什么？
    answer: '`chage -l <USER>` 与 `passwd -S <USER>`。'
    extra: 两者观察维度不同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-O03-QA-003
    type: qa
    question: '`passwd -l` 能否保证用户无法通过 SSH 公钥登录？'
    answer: 不能；它锁定口令认证，不必然禁用其他认证方式。
    extra: 先明确题目要求禁止的访问类型。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-O03-QA-004
    type: qa
    question: '`/sbin/nologin` 的主要作用边界是什么？'
    answer: 阻止正常交互登录 Shell；不能笼统等同于完全禁用账号。
    extra: 服务账号仍可能运行进程。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::concept, priority::P1]
  - id: RHCSA-USERS-O03-QA-005
    type: qa
    question: 校验 sudoers 片段语法的命令骨架是什么？
    answer: '`visudo -cf /etc/sudoers.d/<FILE>`'
    extra: 片段权限通常应为 `0440`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::command, priority::P0]
  - id: RHCSA-USERS-O03-QA-006
    type: qa
    question: 查看 alice 可用 sudo 授权的命令是什么？
    answer: '`sudo -l -U alice`'
    extra: 授权列表正确仍要实际验证目标命令。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::verification, priority::P0]
  - id: RHCSA-USERS-O03-QA-007
    type: qa
    question: sudoers 中 `NOPASSWD:` 改变什么，不改变什么？
    answer: 改变是否再次询问口令；不改变允许执行的命令范围。
    extra: 仍需最小命令授权。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::comparison, priority::P1]
  - id: RHCSA-USERS-O03-QA-008
    type: qa
    question: 为什么 sudoers 命令通常写绝对路径？
    answer: 明确授权的是哪个可执行文件，减少 PATH 解析歧义。
    extra: 仍需检查参数和用户可修改脚本带来的扩权。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0]
  - id: RHCSA-USERS-D01-QA-001
    type: qa
    question: '`Permission denied` 的推荐分层调查顺序是什么？'
    answer: 当前 `id` → 父路径 `namei -l` → 模式/身份 `stat` → ACL/mask `getfacl` → 其他安全层。
    extra: 最终以目标身份重试功能。
    source: [RH124, RH134]
    tags: [exam::rhcsa, chapter::users-permissions, card::process, priority::P0]
  - id: RHCSA-USERS-C01-QA-001
    type: qa
    question: 团队协作目录的关键配置骨架是什么？
    answer: 创建组与成员 → 目录属组 → setgid 模式 → umask/默认 ACL → 多身份验证。
    extra: 每层解决不同问题。
    source: [RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::users-permissions, card::process, priority::P0, task::team-directory]
  - id: RHCSA-USERS-C01-QA-002
    type: qa
    question: 只允许项目组查看和重启 httpd，sudoers 应避免什么宽泛规则？
    answer: 避免 `%project ALL=(ALL) ALL`；只列出所需绝对命令路径。
    extra: 还要用 `visudo` 和允许/拒绝测试验收。
    source: [RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::users-permissions, card::diagnosis, priority::P0, task::team-directory]
  - id: RHCSA-USERS-K01-CLOZE-001
    type: cloze
    text: '`usermod {{c1::-aG}} developers alice` 中，`-a` 表示{{c2::追加而非替换附加组}}。'
    extra: 修改组后要刷新用户会话。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::cloze, priority::P0]
  - id: RHCSA-USERS-K02-CLOZE-001
    type: cloze
    text: 协作目录 setgid 模式常写 `{{c1::2770}}`；公共可写且防互删目录常写 `{{c2::1777}}`。
    extra: 2=setgid，1=sticky。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::cloze, priority::P0]
  - id: RHCSA-USERS-O02-CLOZE-001
    type: cloze
    text: 访问 ACL：`setfacl -m {{c1::u:alice:rw}} <PATH>`；默认 ACL 增加前缀 `{{c2::d:}}`。
    extra: 默认 ACL 只影响新对象。
    source: [RH124]
    tags: [exam::rhcsa, chapter::users-permissions, card::cloze, priority::P0]
