- id: RHCSA-21-D01-QA-006
  type: qa
  question: 执行 reload 后规则仍不能让远端访问，哪种 zone 错误可能被忽略？
  answer: 规则虽进入 runtime，但仍位于错误 zone。
  extra: reload 只同步双态，不会自动把规则移动到实际 zone。
  source:
