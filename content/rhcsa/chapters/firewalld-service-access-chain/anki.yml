- id: RHCSA-NETWORK-O04-QA-007
  type: qa
  question: '`firewall-cmd --zone=public --query-port=8088/tcp` 返回 `yes`，能否证明服务正在监听？'
  answer: 不能。它只证明该 zone 的当前规则包含此端口。
  extra: 应使用 `ss -lntp` 或 `ss -lnup` 检查真实 listener。
