- id: RHCSA-21-D01-QA-008
  type: qa
  question: UDP 服务排错时为什么不能只用 `ss -lntp`？
  answer: '`-t` 只查看 TCP。'
  extra: 使用 `ss -lnup`，并用实际 UDP 协议客户端完成验证。
  source:
