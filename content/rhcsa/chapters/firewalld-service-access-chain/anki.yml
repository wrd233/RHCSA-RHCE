- id: RHCSA-NETWORK-O04-QA-006
  type: qa
  question: 怎样分别确认 `public` zone 当前和持久配置都允许 `8088/tcp`？
  answer: '```bash

    firewall-cmd --zone=public --query-port=8088/tcp

    firewall-cmd --permanent --zone=public --query-port=8088/tcp

    ```'
  extra: 两个查询回答不同状态维度。`yes` 的退出码为 0，`no` 的退出码为 1。
  source:
