- id: RHCSA-21-O02-QA-004
  type: qa
  question: 为什么 `http` service 不能自动放行应用改到的 `8088/tcp`？
  answer: service 使用其定义中的端口，不会动态读取应用配置。
  extra: 对照 `--info-service=http` 和 `ss`，再决定添加端口或自定义 service。
