- id: RHCSA-NETWORK-O04-QA-008
  type: qa
  question: 本机 `curl 127.0.0.1:8088` 成功，能否证明远端客户端可访问？
  answer: 不能。
  extra: 回环请求可能不经过远端使用的接口和 zone；还要测试服务器地址、双态规则和远端协议访问。
