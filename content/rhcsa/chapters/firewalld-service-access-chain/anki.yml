- id: RHCSA-21-D01-QA-007
  type: qa
  question: 普通 service/port 显示允许，但某个来源仍失败，应继续查看什么？
  answer: source bindings 和 rich rules。
  extra: 该来源可能进入不同 zone，或被更具体的 rich rule 拒绝。
