- id: RHCSA-21-T02-QA-002
  type: qa
  question: 修复错误 zone 后，是否应立即删除旧 zone 中的规则？
  answer: 不一定。先确认旧 zone 是否还有其他接口、来源或业务依赖。
  extra: 确认无依赖后再分别清理需要的状态层。
  source:
