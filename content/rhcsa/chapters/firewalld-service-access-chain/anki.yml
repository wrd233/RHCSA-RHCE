- id: RHCSA-21-D01-QA-001
  type: qa
  question: 远端收到 `Connection refused`，第一条高区分度证据是什么？
  answer: 在服务器上用 `ss` 检查目标地址/端口是否存在 listener。
  extra: 也可能有显式 reject，因此确认 listener 后再看防火墙动作。
  source:
  - lecture.md#RHCSA-21-D01
  - firewall-cmd(1)
  - RHEL 9 Configuring firewalls and packet filters
  tags:
