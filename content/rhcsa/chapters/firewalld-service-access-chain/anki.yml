- id: RHCSA-21-D02-QA-001
  type: qa
  question: 为什么“停止 firewalld 后服务可访问”不能作为最终修复？
  answer: 它移除了大量安全边界，只能作为高风险对照，不能满足最小放行终态。
  extra: 应恢复 firewalld，并建立精确 zone/service/port 规则。
  source:
  - lecture.md#RHCSA-21-D02
  - firewall-cmd(1)
  - RHEL 9 Configuring firewalls and packet filters
  tags:
