  type: qa
  question: 只允许 `192.0.2.0/24` 访问 `8088/tcp` 的 rich rule 骨架是什么？
  answer: '`rule family="ipv4" source address="192.0.2.0/24" port port="8088" protocol="tcp" accept`'
  extra: 将该完整字符串传给 `--add-rich-rule`。
