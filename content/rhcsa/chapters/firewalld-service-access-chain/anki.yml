  model: RedHat-QA
  priority: P0
  disabled: false
  semantic_type: security
- id: RHCSA-21-D02-QA-002
  type: qa
  question: 为什么把接口加入 trusted 不是推荐排错方法？
  answer: trusted 接受几乎所有流量，会扩大暴露面且掩盖原规则错误。
  extra: 应读取实际 zone 和最小规则。
  source:
