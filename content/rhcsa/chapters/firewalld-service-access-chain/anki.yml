- id: RHCSA-21-T02-QA-001
  type: qa
  question: permanent 中规则存在、runtime 中不存在、且规则位于错误 zone。为什么单独 reload 仍可能失败？
  answer: reload 只会把规则加载到原来的错误 zone，实际接口仍使用另一个 zone。
  extra: 必须同时修复 zone 归属和双态。
  source:
