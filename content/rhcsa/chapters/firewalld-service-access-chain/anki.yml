- id: RHCSA-21-K01-QA-006
  type: qa
  question: firewalld 与 SELinux 端口类型分别控制什么？
  answer: firewalld 控制网络流量是否允许到达；SELinux 端口类型控制受限域能否绑定或使用相应端口。
  extra: 两者是独立层，不能互相替代。
