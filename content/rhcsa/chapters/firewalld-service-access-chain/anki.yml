  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: diagnosis
- id: RHCSA-21-D01-QA-002
  type: qa
  question: 远端连接超时，能否直接判定 firewalld 在 drop？
  answer: 不能。
  extra: 路由、中间设备、来源 zone、rich rule 和 listener 等都需分层检查。
  source:
  - lecture.md#RHCSA-21-D01
  - firewall-cmd(1)
  - RHEL 9 Configuring firewalls and packet filters
