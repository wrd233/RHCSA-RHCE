- id: RHCSA-21-D01-QA-004
  type: qa
  question: 回环请求成功但服务器地址请求失败，优先检查什么？
  answer: 监听地址、地址族、服务器地址和应用虚拟主机。
  extra: 还没到远端防火墙结论。
  source:
