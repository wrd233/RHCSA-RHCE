- id: RHCSA-21-O04-QA-002
  type: qa
  question: '`127.0.0.1:8088` 与 `0.0.0.0:8088` 对远端访问意味着什么？'
  answer: 前者仅监听回环；后者监听所有 IPv4 本地地址。
  extra: 防火墙放行不能把回环 listener 变成外部 listener。
