- id: RHCSA-21-K01-QA-001
  type: qa
  question: firewalld 开放一个端口后，是否会自动创建应用 listener？
  answer: 不会。firewalld 只改变包过滤规则，不启动应用或创建 socket。
  extra: 用 `systemctl` 检查服务，用 `ss` 检查 listener。
  source:
