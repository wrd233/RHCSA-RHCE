  answer: '`firewall-cmd --zone=public --list-ports`'
  extra: 此命令只列出直接 port 规则；通过 service 放行的端口不会出现在这里，应同时查看 `--list-services` 或 `--list-all`。加 `--permanent` 查看持久状态。
