- id: RHCSA-NETWORK-O04-QA-004
  type: qa
  question: 同一条 firewalld 修改怎样同时满足“现在生效”和“reload 后保留”？
  answer: 分别执行一次 runtime 修改和一次带 `--permanent` 的持久修改。
  extra: 例如先 `--add-port=8088/tcp`，再执行 `--permanent --add-port=8088/tcp`。
  source:
