- id: RHCSA-21-K02-QA-001
  type: qa
  question: firewalld zone 的本质是什么？
  answer: 一组信任边界、流量绑定和允许/拒绝规则的容器。
  extra: zone 可包含 interfaces、sources、services、ports 和 rich rules。
