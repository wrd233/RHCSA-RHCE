- id: RHCSA-21-D02-QA-004
  type: qa
  question: 删除一个旧端口规则前应确认什么？
  answer: 是否仍有其他接口、来源或业务依赖该 zone 中的端口。
  extra: 清理也需要证据，不能只因当前任务不使用就删除。
  source:
