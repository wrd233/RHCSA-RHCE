- id: RHCSA-21-T01-QA-002
  type: qa
  question: 任务要求现在和重启后都开放 `8088/tcp`，但不希望 reload 影响其他临时规则。最合适的做法是什么？
  answer: 分别添加 runtime 和 permanent 规则，不执行全局 reload。
  extra: 完成后分别 query 两层。
  source:
