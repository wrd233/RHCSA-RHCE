- id: RHCSA-21-D01-QA-005
  type: qa
  question: 规则在 public 中存在，但接口属于 internal。问题本质是什么？
  answer: 规则配置在不处理实际流量的 zone。
  extra: 应在实际 zone 建立规则，而不是反复向 public 添加。
  source:
