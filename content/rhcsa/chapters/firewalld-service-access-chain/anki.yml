  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-NETWORK-O04-QA-005
  type: qa
  question: '`firewall-cmd --reload` 对 runtime-only 规则有什么影响？'
  answer: 用 permanent 重建 runtime；未写入 permanent 的 runtime-only 修改会丢失。
  extra: 普通 reload 尽量保留连接状态；不要把它和更激进的 `--complete-reload` 混同。
  source:
