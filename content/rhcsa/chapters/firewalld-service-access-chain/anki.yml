- id: RHCSA-NETWORK-O04-QA-002
  type: qa
  question: 标准 HTTP 服务需要在 `public` zone 中立即放行，命令是什么？
  answer: '`firewall-cmd --zone=public --add-service=http`'
  extra: 这是 runtime 修改。若还要求 reload 或重启后保留，需要再执行带 `--permanent` 的同一修改。
  source:
