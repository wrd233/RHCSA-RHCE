- id: RHCSA-21-O02-QA-003
  type: qa
  question: 标准服务与直接端口规则应如何选择？
  answer: 有合适的标准 service 时优先 service；非标准端口或无合适定义时使用 port/protocol。
  extra: 最终必须与 `ss` 观察到的真实 listener 对齐。
