  type: qa
  question: '`--add-protocol=icmp` 与 `--add-port=8088/tcp` 的对象有何区别？'
  answer: 前者允许 IP 层协议，后者允许指定传输层端口/协议。
  extra: 普通应用端口不要用“允许整个 tcp 协议”来替代精确端口规则。
