- id: RHCSA-NETWORK-O04-QA-001
  type: qa
  question: 某接口接收远端请求时，先用什么命令确认它当前属于哪个 firewalld zone？
  answer: '`firewall-cmd --get-zone-of-interface=<INTERFACE>`'
  extra: 再用 `--get-active-zones` 查看所有当前 interface/source 绑定；不要默认认为流量进入 default zone。
  source:
