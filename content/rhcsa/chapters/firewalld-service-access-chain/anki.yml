- id: RHCSA-NETWORK-O04-QA-003
  type: qa
  question: 应用真实监听 `8088/tcp`，系统没有合适的预定义 service。立即放行应使用什么命令？
  answer: '`firewall-cmd --zone=<ZONE> --add-port=8088/tcp`'
  extra: 端口必须同时指定协议；`8088/tcp` 与 `8088/udp` 是不同规则。
  source:
