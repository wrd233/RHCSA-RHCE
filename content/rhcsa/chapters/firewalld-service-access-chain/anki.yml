  type: qa
  question: 服务 active、本机服务器地址请求成功，但远端失败。下一条最有区分度的 firewalld 证据是什么？
  answer: 确认实际入站 zone，再查询该 zone 的 runtime 规则。
  extra: 优先使用 `--get-active-zones`、`--get-zone-of-interface`，不要只检查 default zone。
