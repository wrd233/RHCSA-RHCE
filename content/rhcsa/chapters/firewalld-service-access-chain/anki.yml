  semantic_type: boundary
- id: RHCSA-21-D01-QA-003
  type: qa
  question: 服务 active 但没有目标 listener，下一步应查什么？
  answer: 服务配置、启动日志、监听地址/端口和非标准端口的 SELinux 边界。
  extra: 此时重复加防火墙规则没有区分度。
  source:
