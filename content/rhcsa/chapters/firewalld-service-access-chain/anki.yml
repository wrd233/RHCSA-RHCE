- id: RHCSA-21-D02-QA-003
  type: qa
  question: reload 前为什么要比对 runtime 和 permanent 的 `list-all`？
  answer: 识别会在 reload 时丢失的 runtime-only 规则。
  extra: 这也是远程变更风险评估的一部分。
