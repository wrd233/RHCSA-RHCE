- id: RHCSA-21-T01-QA-001
  type: qa
  question: 发布非标准端口 Web 服务时，推荐的完整操作顺序是什么？
  answer: 确认服务和 listener → 本机协议 → 实际 zone → runtime/permanent 最小规则 → 双态查询 → 远端协议。
  extra: 非标准端口启动失败时加入 SELinux 独立分支。
  source:
  - lecture.md#RHCSA-21-T01
  - firewall-cmd(1)
  - RHEL 9 Configuring firewalls and packet filters
