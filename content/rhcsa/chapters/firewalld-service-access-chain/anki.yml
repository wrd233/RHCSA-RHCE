- id: RHCSA-21-K01-QA-002
  type: qa
  question: 一个远端网络服务的完整验收至少需要哪些层？
  answer: 服务状态、真实 listener、本机协议响应、实际 zone、runtime、permanent 和远端协议访问。
  extra: 非标准端口还应把 SELinux 端口类型作为独立层。
  source:
