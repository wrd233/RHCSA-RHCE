- id: RHCSA-05-K03-QA-005
  type: qa
  question: '`locate` 候选的最小实时确认组合是什么？'
  answer: 对具体路径运行 `stat`，或在预期根目录用限定范围的 `find` 重新查询。
  extra: 不要把索引结果直接交给破坏性批量动作。
