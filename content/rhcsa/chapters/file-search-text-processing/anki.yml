- id: RHCSA-05-O01-QA-011
  type: qa
  question: 查找 `/usr/share` 下大于 50 MiB 且小于 100 MiB 的普通文件，命令骨架是什么？
  answer: '`find /usr/share -type f -size +52428800c -size -104857600c -print`。'
  extra: 两个大小测试之间是隐式 AND。
