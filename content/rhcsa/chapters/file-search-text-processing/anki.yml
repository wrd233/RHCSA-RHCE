- id: RHCSA-05-O02-QA-006
  type: qa
  question: 使用 `find -printf` 时，为什么格式中通常要显式写 `\n`？
  answer: '`-printf` 不自动为每个对象添加换行。'
  extra: 机器处理任意名称仍优先 `-print0`；`-printf` 主要用于可读审计。
