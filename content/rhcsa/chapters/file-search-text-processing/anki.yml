  type: qa
  question: 按冒号第 3 字段数字升序、再按第 1 字段排序，`sort` 骨架是什么？
  answer: '`sort -t: -k3,3n -k1,1 file`。'
  extra: '`-k3,3n` 把数字比较限定在第 3 字段，避免键延伸到行尾。'
