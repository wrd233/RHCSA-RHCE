- id: RHCSA-05-D01-QA-006
  type: qa
  question: 文本批量任务的最小验收矩阵包含哪些维度？
  answer: 候选集合、目标新状态、旧状态消失、范围外反例、备份/回退材料、stderr 与退出状态。
  extra: 每个维度回答不同问题，不能用一个 `grep` 结果代替全部。
