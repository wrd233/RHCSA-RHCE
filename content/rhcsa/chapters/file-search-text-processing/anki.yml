- id: RHCSA-05-K04-QA-001
  type: qa
  question: 搜索含有字面量 `server[1]` 的记录，为什么优先使用 `grep -F`？
  answer: '`-F` 把模式当固定字符串，不把方括号解释为正则字符集合。'
  extra: 固定配置键或带大量元字符的字面量通常更适合 `-F`。
  source:
