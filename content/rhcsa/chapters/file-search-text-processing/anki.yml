- id: RHCSA-05-O03-QA-003
  type: qa
  question: 为什么不推荐长期依赖 `cut -d" " -f10` 解析面向人的对齐输出？
  answer: 连续空白数量和列布局可能随内容、locale 或版本变化，单空格并不是稳定字段合同。
  extra: 优先选择机器可读输出或使用能够按空白字段处理并验证 `NF` 的工具。
