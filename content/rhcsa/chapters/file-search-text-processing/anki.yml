- id: RHCSA-05-K03-QA-002
  type: qa
  question: 刚创建的文件为什么可能无法被 `locate` 找到？
  answer: 名称数据库尚未更新，或该路径被索引配置排除。
  extra: 可在确认影响后运行 updatedb，最终仍用 stat/find 验证。不要把旧 mlocate 数据库路径做成固定记忆；实现、包名和路径由目标 RHEL 9 环境确认。
  source:
