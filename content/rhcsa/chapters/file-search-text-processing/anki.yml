- id: RHCSA-05-O05-QA-004
  type: qa
  question: '`awk ''$3 >= 1000 {print $1}'' /etc/passwd` 的模式和动作分别是什么？'
  answer: 模式是 `$3 >= 1000`；动作是 `{print $1}`。
  extra: 只有模式为真的记录执行动作。
