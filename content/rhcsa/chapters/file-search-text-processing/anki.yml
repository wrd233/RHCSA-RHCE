- id: RHCSA-05-K04-QA-007
  type: qa
  question: '`grep -o` 输出什么？'
  answer: 只输出每个非空匹配片段，而不是完整记录。
  extra: 它会改变记录数量，后续 `wc -l` 统计的是匹配片段数。
