- id: RHCSA-FILES-O02-QA-006
  type: qa
  question: 候选直接来自 `find`，要批量把路径作为独立参数传给命令，推荐什么动作？
  answer: '`-exec command -- {} +`。'
  extra: '`+` 尽可能批量调用；`{} \;` 通常逐个对象调用。'
  source:
