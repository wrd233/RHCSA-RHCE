  type: qa
  question: 即使内容替换正确，`sed -i` 后还应验证哪些非内容边界？
  answer: 备份、所有者、模式、ACL、扩展属性、SELinux 上下文和硬链接关系是否仍符合要求。
  extra: 原地编辑常通过临时文件替换路径，真实影响需在目标环境确认。
