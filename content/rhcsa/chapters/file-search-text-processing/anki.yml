  type: qa
  question: 普通 `xargs` 默认怎样解释空白和引号，为什么不适合任意文件名？
  answer: 它按空白分隔项目，并对引号和反斜杠有解析规则，文件名中的这些字符可能被改变。
  extra: 任意文件名使用 `xargs -0`。
