  question: 递归搜索目录时，`grep -r` 与 `-R` 的关键边界是什么？
  answer: 两者对符号链接的跟随策略不同。
  extra: 跨链接目录树前查看本机 `grep(1)`；能先用 `find -type f` 限定对象时通常更可控。
