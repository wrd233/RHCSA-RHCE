- id: RHCSA-05-O01-QA-006
  type: qa
  question: '`find -perm -0600` 的语义是什么？'
  answer: 用户读、写两个权限位都必须存在，其他权限位可以额外存在。
  extra: 前导减号表示指定的所有位都要包含。
