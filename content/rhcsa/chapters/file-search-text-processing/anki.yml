- id: RHCSA-05-T01-QA-003
  type: qa
  question: 配置候选已经保存为 NUL 清单，批量备份修改的命令骨架是什么？
  answer: '`xargs -0 -r sed -i.SUFFIX -E ''s/OLD/NEW/'' -- < candidates.nul`。'
  extra: 执行前必须先用不带 `-i` 的 `sed` 预览。
