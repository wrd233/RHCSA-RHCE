- id: RHCSA-05-O02-QA-007
  type: qa
  question: '`-exec command {} \;` 与 `-exec command {} +` 的主要差异是什么？'
  answer: 前者通常逐个对象执行，后者尽可能把多个路径批量作为参数。
  extra: 批量形式更高效，但子命令必须能接收多个路径。
