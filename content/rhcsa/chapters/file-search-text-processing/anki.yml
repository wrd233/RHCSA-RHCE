- id: RHCSA-FILES-O02-QA-003
  type: qa
  question: '`find ... -size +10M` 中的 `+` 表示什么？'
  answer: 对象大小大于 10 个 MiB 计数单位。
  extra: 无符号形式按单位块取整匹配，`-10M` 表示小于 10 个单位；边界用 `stat -c %s` 抽查。
  source:
  - find(1)
  - GNU Findutils manual
