- id: RHCSA-05-K02-QA-008
  type: qa
  question: 为什么批量修改任务通常不应随意给 `find` 加 `-L`？
  answer: 跟随符号链接可能进入起点之外的目标目录或修改链接目标，使实际对象集合超出预期。
  extra: 确需跟随时必须证明边界、循环和目标身份。
