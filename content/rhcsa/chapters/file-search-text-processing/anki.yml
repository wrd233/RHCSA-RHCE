- id: RHCSA-05-O02-QA-004
  type: qa
  question: 为什么动作放在 OR 表达式一侧可能导致部分对象不输出？
  answer: '`find` 使用短路求值，测试或动作的真值可能使另一分支不再执行。'
  extra: 通常先形成完整测试，再把统一输出动作放在表达式末尾。
