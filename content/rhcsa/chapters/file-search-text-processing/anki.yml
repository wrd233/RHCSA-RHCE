- id: RHCSA-05-O06-QA-007
  type: qa
  question: 文件名以 `-` 开头时，子命令参数边界怎样处理？
  answer: 尽量使用绝对路径或 `./` 前缀，并在支持的命令中用 `--` 结束选项。
  extra: NUL 保持名称完整，但不会自动阻止子命令把参数解析为选项。
