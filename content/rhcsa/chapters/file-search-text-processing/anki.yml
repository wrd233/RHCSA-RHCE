- id: RHCSA-05-O05-QA-003
  type: qa
  question: '`awk -F: -v OFS="\t"` 分别设置什么？'
  answer: '`-F:` 设置输入字段分隔符为冒号；`OFS` 设置 `print` 的输出字段分隔符为制表符。'
  extra: 输入和输出合同可以不同。
