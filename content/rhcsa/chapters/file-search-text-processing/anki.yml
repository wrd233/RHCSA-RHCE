  type: qa
  question: '`-nouser` 和 `-nogroup` 分别发现什么？'
  answer: 发现 UID 或 GID 无法映射到当前用户/组数据库名称的对象。
  extra: 不能仅凭这一结果立即删除；应调查账号生命周期、挂载和恢复场景。
