- id: RHCSA-05-O01-QA-005
  type: qa
  question: '`find -perm 0640` 的语义是什么？'
  answer: 权限模式精确匹配 0640。
  extra: 文件类型位不属于这里的 MODE；需要“至少具备某些位”应使用 `-MODE`。
