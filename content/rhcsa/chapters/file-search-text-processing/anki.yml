- id: RHCSA-05-K04-QA-004
  type: qa
  question: POSIX 字符类 `[[:digit:]]` 相比 `[0-9]` 的主要价值是什么？
  answer: 它表达字符类别并与 POSIX 正则和 locale 规则配合，通常比手写范围更明确。
  extra: 需要纯 ASCII 字节边界时可局部设置 `LC_ALL=C`。
