- id: RHCSA-05-K02-QA-002
  type: qa
  question: 为什么 `find /etc -name *.conf` 的语义不稳定？
  answer: Shell 可能先在当前目录展开 `*.conf`，使 `find` 收到零个、一个或多个非预期参数。
  extra: 应写成 `find /etc -name '*.conf'`。
