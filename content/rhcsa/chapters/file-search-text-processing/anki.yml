- id: RHCSA-05-D01-QA-005
  type: qa
  question: 预览集合与执行集合为什么应来自同一个机器可读清单？
  answer: 重新运行条件可能因目录树变化或命令重写而产生不同集合。
  extra: 保存 NUL 清单可让人工审查和实际执行引用同一组对象。
