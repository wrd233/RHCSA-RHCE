- id: RHCSA-05-K04-QA-008
  type: qa
  question: '`grep` 退出状态 0、1、2 通常分别表示什么？'
  answer: 0 表示有选择记录，1 表示无选择记录，2 表示错误。
  extra: 脚本应把状态 1 作为“查询成功但集合为空”的独立分支处理；只有状态 2 才是 grep 错误。
