- id: RHCSA-05-D01-QA-004
  type: qa
  question: 批量动作只处理部分对象时，应保留哪四类证据？
  answer: 原始候选清单、子命令 stderr/退出状态、执行批次信息、修改后重新生成的未完成对象清单。
  extra: 不要只重复执行整条命令。
