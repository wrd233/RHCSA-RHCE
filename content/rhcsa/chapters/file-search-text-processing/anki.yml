- id: RHCSA-05-T02-QA-001
  type: qa
  question: 结构化日志聚合前，为什么要先检查 `NF` 和数字字段？
  answer: 否则缺字段或非数字数据会进入错误用户、被隐式当作 0，导致统计悄然失真。
  extra: 异常记录应带 `FNR` 保存到单独清单。
