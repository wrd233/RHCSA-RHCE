  question: 为什么机器可重复排序常局部使用 `LC_ALL=C`？
  answer: 它使字符比较采用确定的字节排序规则，避免不同 locale 的整理顺序差异。
  extra: 只对需要确定性的命令局部设置，不必改变整个用户环境。
