- id: RHCSA-05-K01-QA-004
  type: qa
  question: 批量修改前，候选清单为什么应被视为审计真源？
  answer: 它固定并记录“准备修改谁”，便于比较执行集合、验证遗漏、调查部分失败和回滚。
  extra: 可读预览用于人工审查；机器处理仍应保留原始 NUL 清单。
  source:
  - RHEL 9 RHCSA/RHCE 讲义知识架构与章节编写总规范
