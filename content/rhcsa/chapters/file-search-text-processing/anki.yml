- id: RHCSA-FILES-O03-QA-002
  type: qa
  question: 为什么 `uniq` 前通常先运行 `sort`？
  answer: '`uniq` 只识别相邻的重复记录。'
  extra: 先排序会改变原顺序；需要保留首次出现顺序时应使用显式状态方法。
