  type: qa
  question: '`find` 的通用结构是什么？'
  answer: '`find START... EXPRESSION`。表达式通常由全局选项、测试、动作和逻辑运算符组成。'
  extra: 阅读命令时先分离搜索起点、对象条件和动作。
  source:
