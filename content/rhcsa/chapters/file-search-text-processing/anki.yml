- id: RHCSA-05-T02-QA-003
  type: qa
  question: 聚合报告的两个关键恒等式是什么？
  answer: 总失败记录数等于各用户次数之和；总失败字节数等于各用户字节总量之和。
  extra: 同时还应核对有效、异常、注释和空行对总输入的覆盖关系。
