- id: RHCSA-05-K02-QA-003
  type: qa
  question: '`-maxdepth 1` 与 `-mindepth 1` 分别限制什么？'
  answer: '`-maxdepth 1` 只检查起点及直接成员；`-mindepth 1` 排除起点本身。'
  extra: 它们控制遍历层次，不替代文件类型或名称测试。
