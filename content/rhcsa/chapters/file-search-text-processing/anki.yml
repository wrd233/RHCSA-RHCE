- id: RHCSA-05-K02-QA-001
  type: qa
  question: 省略 `find` 搜索起点时，GNU `find` 从哪里开始？
  answer: 从当前目录 `.` 开始。
  extra: 关键任务建议显式写出起点，避免工作目录变化导致搜索范围变化。
