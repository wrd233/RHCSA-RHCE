- id: RHCSA-05-T01-QA-002
  type: qa
  question: 空白可变但必须完整匹配 `Listen 8080` 的 ERE 是什么？
  answer: '`^[[:space:]]*Listen[[:space:]]+8080[[:space:]]*$`。'
  extra: 它排除注释、`80800` 和额外字段。
