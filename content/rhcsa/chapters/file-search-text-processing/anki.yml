- id: RHCSA-05-T01-QA-004
  type: qa
  question: 验证配置修改时，为什么只检查 `Listen 8081` 存在还不够？
  answer: 还要证明旧有效行消失、每个候选都成功、备份存在，以及注释和范围外文件未变。
  extra: 这是“新状态、旧状态、集合、反例”分层验证。
