- id: RHCSA-05-K01-QA-005
  type: qa
  question: 路径名中哪些字节不能出现，因此可作为任意文件名的安全分隔符？
  answer: NUL 字节不能出现在文件名中，因此 NUL 可作为文件名记录分隔符。
  extra: 斜杠也不能出现在单个路径组件中，但它承担目录分隔语义，不能作为完整路径列表分隔符。
  source:
  - xargs(1)
  - find(1)
  - GNU Findutils manual
