- id: RHCSA-05-O06-QA-006
  type: qa
  question: 为什么不把 `xargs -P` 作为批量修改默认答案？
  answer: 并行会打乱顺序、并发修改共享资源并放大失败恢复复杂度。
  extra: 只有已证明操作幂等、顺序无关和资源可承受时才评估。
