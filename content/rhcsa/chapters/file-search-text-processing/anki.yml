- id: RHCSA-05-O05-QA-009
  type: qa
  question: '`print` 与 `printf` 在输出合同上的主要差异是什么？'
  answer: '`print` 自动使用 `OFS/ORS`；`printf` 完全由格式字符串控制且不自动换行。'
  extra: 机器可读输出应显式定义字段和记录边界。
