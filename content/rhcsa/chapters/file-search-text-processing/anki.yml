- id: RHCSA-05-O02-QA-003
  type: qa
  question: 只选择普通 `.conf` 或 `.ini` 文件的正确表达式骨架是什么？
  answer: '`-type f \( -name ''*.conf'' -o -name ''*.ini'' \)`。'
  extra: 括号由 `find` 解释，因此在 Shell 中需要转义或引用。
