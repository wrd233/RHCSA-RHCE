- id: RHCSA-05-K01-QA-001
  type: qa
  question: 在本章流水线中，“文件对象”和“路径文本”有什么区别？
  answer: 文件对象是文件系统中的实体；路径文本是目录项组成的名称。一个对象可以有多个名称，名称也可以在对象不变时改变。
  extra: '`find` 选择对象时通常输出路径名称，下游工具不要把显示字符串误当成永久对象身份。'
  source:
  - find(1)
  - GNU Findutils manual
  tags:
  - exam::rhcsa
  - chapter::file-search-text-processing
  - topic::object-model
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-05-K01-QA-002
  type: qa
  question: 为什么必须先确定记录分隔符，再讨论字段分隔符？
  answer: 字段只能在一条完整记录内部拆分；如果记录边界已经把一个对象拆成多条，后续字段处理无法恢复原对象。
  extra: 文件名集合不能默认“一行一个路径”，任意文件名应使用 NUL。
  source:
  - gawk(1)
  - GNU awk manual
  - xargs(1)
  - find(1)
  - GNU Findutils manual
