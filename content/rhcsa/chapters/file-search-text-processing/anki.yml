- id: RHCSA-05-D01-QA-001
  type: qa
  question: '`find` 复杂表达式结果过多时，第一步怎样缩小问题？'
  answer: 移除动作和后半条件，从起点与简单 `-print` 开始，逐个加入测试并记录每步数量。
  extra: 优先检查 OR 括号、`-type`、`-name/-path` 和链接跟随。
