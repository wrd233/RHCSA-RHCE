- id: RHCSA-FILES-O02-QA-007
  type: qa
  question: '`find` 与 `xargs` 之间安全传递任意文件名的组合是什么？'
  answer: '`find ... -print0 | xargs -0 -r command --`。'
  extra: 生产端和消费端都使用 NUL；GNU `xargs -r` 防止空输入时仍执行命令。
