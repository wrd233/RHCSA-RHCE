- id: RHCSA-05-O01-QA-012
  type: qa
  question: '`find` 结果中的一个路径在稍后执行时已被替换，这说明什么边界？'
  answer: 目录树查询与使用之间存在 TOCTOU 竞态；匹配时成立的属性不保证执行时仍成立。
  extra: NUL 只保护名称分隔，不能消除对象替换竞态。
