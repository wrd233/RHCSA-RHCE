- id: RHCSA-05-O01-QA-009
  type: qa
  question: 最近 90 分钟修改过的文件应优先使用哪个测试？
  answer: '`-mmin -90`。'
  extra: '`-mtime` 使用完整 24 小时计数，不适合分钟级要求。'
