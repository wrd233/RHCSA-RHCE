- id: RHCSA-FILES-O03-QA-003
  type: qa
  question: 验证文本筛选结果时，除了结果非空还应检查什么？
  answer: 检查数量、代表性匹配、边界对象以及应被排除的反例。
  extra: 这样才能发现模式过窄、过宽或记录结构被破坏。
