- id: RHCSA-05-D01-QA-003
  type: qa
  question: '`uniq` 后仍出现“看起来相同”的记录，下一条证据是什么？'
  answer: 观察不可见字符和尾随空白，例如使用 `sed -n l` 或字节级工具。
  extra: 也要确认重复记录是否在输入中相邻。
