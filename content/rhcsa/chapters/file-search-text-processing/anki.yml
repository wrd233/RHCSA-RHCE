- id: RHCSA-05-O04-QA-006
  type: qa
  question: '`sed -i.rhcsa05.bak` 与 `sed -i` 的主要差异是什么？'
  answer: 前者按指定后缀保留原文件备份；后者不生成备份。
  extra: 批量修改前先把转换结果写到 stdout 预览；执行时使用明确备份后缀；完成后同时检查内容与 owner/mode、ACL、扩展属性、SELinux 上下文及硬链接关系。
