- id: RHCSA-05-K04-QA-003
  type: qa
  question: 完整匹配有效行 `Listen 8080`，允许空白变化，ERE 骨架是什么？
  answer: '`^[[:space:]]*Listen[[:space:]]+8080[[:space:]]*$`。'
  extra: 开头和结尾锚点防止匹配注释、额外字段和 `80800`。
