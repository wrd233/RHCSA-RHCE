- id: RHCSA-FILES-O03-QA-001
  type: qa
  question: '`grep -E`、`-i`、`-n`、`-v` 分别表示什么？'
  answer: 扩展正则、忽略大小写、显示行号、反选。
  extra: '`-I` 不是忽略大小写，而是忽略二进制文件。'
