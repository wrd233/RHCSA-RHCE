- id: RHCSA-05-K04-QA-012
  type: qa
  question: 模式由 Shell 变量提供时，命令骨架应怎样引用？
  answer: '`grep -E -- "$pattern" file`。'
  extra: 双引号保持变量为一个参数；`--` 防止以连字符开头的模式被当成选项。动态正则仍需评估是否应使用 `-F`。
