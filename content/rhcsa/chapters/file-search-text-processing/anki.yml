- id: RHCSA-05-K02-QA-004
  type: qa
  question: 从 `/` 查找大文件时，`-xdev` 的主要作用是什么？
  answer: 阻止 `find` 下降到其他文件系统。
  extra: 它可避免跨入 `/proc`、网络挂载或其他独立文件系统，但不限制结果的文件类型。
