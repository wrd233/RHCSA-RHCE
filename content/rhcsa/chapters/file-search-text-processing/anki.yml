- id: RHCSA-05-O05-QA-002
  type: qa
  question: '`NR` 与 `FNR` 的差异是什么？'
  answer: '`NR` 在所有输入文件间累计；`FNR` 在每个新文件开始时重新从 1 计数。'
  extra: 处理多个文件并需要文件内行号时使用 `FNR`。
