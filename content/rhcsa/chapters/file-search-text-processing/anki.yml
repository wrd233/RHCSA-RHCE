- id: RHCSA-05-K04-QA-009
  type: qa
  question: 为什么诊断输入错误时不应只依赖 `grep -q`？
  answer: '`-q` 在发现匹配后可能提前成功退出，使后续输入中的某些错误不再影响最终状态。'
  extra: 需要审计所有输入时应保留正常读取和 stderr。
