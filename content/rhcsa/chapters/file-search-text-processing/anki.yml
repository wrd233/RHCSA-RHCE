- id: RHCSA-05-K03-QA-004
  type: qa
  question: '`updatedb` 执行成功能证明所有挂载点都已被索引吗？'
  answer: 不能。实现可能按文件系统类型、挂载选项和配置排除路径。
  extra: 具体数据库路径和更新计划具有版本差异，应查看本机手册和配置。
