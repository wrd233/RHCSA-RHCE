- id: RHCSA-05-K03-QA-001
  type: qa
  question: '`locate` 为什么通常比 `find` 快？'
  answer: 它查询预先生成的名称数据库，而不是实时遍历目录树。
  extra: 速度来自索引，也带来新鲜度和排除范围边界。
