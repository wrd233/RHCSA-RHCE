- id: RHCSA-05-O04-QA-007
  type: qa
  question: 为什么 `sed -n -i 's/old/new/' file` 可能把文件写空？
  answer: '`-n` 关闭默认输出，而脚本没有 `p` 等输出命令；原地写回的结果为空。'
  extra: 这是高优先级安全边界。
