  semantic_type: parameter
- id: RHCSA-FILES-O02-QA-004
  type: qa
  question: '`find ... -mtime -7` 的核心语义是什么？'
  answer: 修改时间落在最近 7 个完整 24 小时计数范围内。
  extra: 存在取整边界；需要分钟级条件用 `-mmin`，需要精确时间用 `stat` 或参照文件比较。
  source:
