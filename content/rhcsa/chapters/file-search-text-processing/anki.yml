- id: RHCSA-05-O01-QA-007
  type: qa
  question: '`find -perm /002` 的语义是什么？'
  answer: 指定权限位中至少一个存在；这里只有 other 写位，因此匹配 other 可写对象。
  extra: 斜杠模式是“任一指定位”，不是路径分隔符。
