- id: RHCSA-05-K01-QA-003
  type: qa
  question: '`find`、`grep` 与 `awk` 分别主要选择哪个层次的对象？'
  answer: '`find` 选择目录树对象；`grep` 选择文本记录；`awk` 按记录和字段条件选择并转换数据。'
  extra: 它们可以组合，但每一层的输入合同必须明确。
