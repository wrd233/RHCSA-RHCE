- id: RHCSA-05-O02-QA-008
  type: qa
  question: '`-execdir` 相比 `-exec` 改变了什么？'
  answer: 它在匹配对象所在子目录执行命令，并以相对路径传递对象。
  extra: 这可降低部分风险，但改变工作目录并要求安全的 `PATH`，不是万能保护。
