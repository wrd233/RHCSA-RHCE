- id: RHCSA-05-O05-QA-001
  type: qa
  question: '`awk` 中 `$0`、`$1` 和 `NF` 分别是什么？'
  answer: '`$0` 是当前完整记录，`$1` 是第一个字段，`NF` 是当前记录字段数。'
  extra: 字段如何拆分由 `FS` 决定。
  source:
