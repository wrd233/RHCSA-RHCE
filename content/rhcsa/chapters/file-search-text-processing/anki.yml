- id: RHCSA-05-K04-QA-005
  type: qa
  question: 只输出包含匹配记录的文件名，使用什么选项？
  answer: '`grep -l`。'
  extra: 继续输出任意文件名到 NUL 管道时使用 GNU `-Z`。
