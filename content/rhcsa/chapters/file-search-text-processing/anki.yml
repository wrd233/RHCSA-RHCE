- id: RHCSA-05-D01-QA-002
  type: qa
  question: 为什么验证筛选模式必须包含反例？
  answer: 正例只能证明模式能匹配某些目标，反例用于证明模式没有把不应处理的内容纳入。
  extra: 配置替换至少准备注释行、相似值和额外字段等反例。
