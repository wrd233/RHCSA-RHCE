  question: '`cut -d: -f1,3 /etc/passwd` 的输入合同是什么？'
  answer: 每条记录使用单字符冒号作为字段分隔符，并且需要第 1、3 字段。
  extra: 它不理解 CSV 引号、转义或嵌套分隔。
