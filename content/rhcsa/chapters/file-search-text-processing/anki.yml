- id: RHCSA-05-K02-QA-006
  type: qa
  question: '`find` 标准输出为空时，下一条最有区分度的证据是什么？'
  answer: 检查 stderr 和退出状态，并先运行只含起点和简单 `-print` 的查询。
  extra: 这样可区分真正无匹配、起点错误、权限不足和表达式错误。
