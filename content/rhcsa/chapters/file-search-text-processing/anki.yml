- id: RHCSA-05-O05-QA-005
  type: qa
  question: '`awk` 中正则匹配和否定匹配分别使用什么运算符？'
  answer: '`~` 和 `!~`。'
  extra: 例如 `$0 ~ /ERROR/`。
