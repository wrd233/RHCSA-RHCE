- id: RHCSA-05-K04-QA-002
  type: qa
  question: '`grep` 与 `grep -E` 分别使用哪类正则？'
  answer: 默认使用基本正则 BRE；`-E` 使用扩展正则 ERE。
  extra: 新内容优先写 `grep -E`，不依赖已弃用风格的 `egrep` 名称。
