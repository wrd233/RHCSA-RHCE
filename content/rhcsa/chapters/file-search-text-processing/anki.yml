- id: RHCSA-05-K03-QA-003
  type: qa
  question: '`locate` 返回的路径已经不存在，最合理的解释是什么？'
  answer: 索引仍保留上次扫描时的名称，数据库尚未反映删除或改名。
  extra: 候选路径应使用 `stat` 或 `test -e` 实时确认。
