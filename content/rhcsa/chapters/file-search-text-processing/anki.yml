  question: 为什么旧异常文件在本次没有异常时可能造成误判？
  answer: 如果 awk 从未向异常文件写入，它可能不会截断旧文件，旧内容会被误认为本次结果。
  extra: '运行前用 `: > "$invalid"` 显式清空。'
