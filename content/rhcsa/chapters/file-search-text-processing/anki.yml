- id: RHCSA-05-K01-QA-006
  type: qa
  question: 为什么“命令退出 0”不能单独证明批量文本任务完成？
  answer: 它通常只证明命令层没有报告失败，不能证明候选集合正确、所有目标内容达到终态或范围外对象未被修改。
  extra: 应验证集合、新状态、旧状态消失、反例和错误流。
