- id: RHCSA-05-O01-QA-001
  type: qa
  question: '`find -name` 与 `find -path` 的匹配对象分别是什么？'
  answer: '`-name` 匹配 basename；`-path` 匹配从搜索起点形成的路径文本。'
  extra: 两者都使用 glob 模式，不是正则表达式。
