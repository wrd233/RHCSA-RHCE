- id: RHCSA-05-O05-QA-006
  type: qa
  question: 为什么从 Shell 向 `awk` 传值优先使用 `-v name="$value"`？
  answer: 它把值作为变量传入，避免直接拼接并破坏 awk 源码或引用边界。
  extra: 动态内容仍需判断应作为固定字符串还是正则。
