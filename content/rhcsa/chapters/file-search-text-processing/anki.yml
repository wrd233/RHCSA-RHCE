- id: RHCSA-05-T01-QA-001
  type: qa
  question: 配置批量替换任务中，元数据候选和内容候选为什么要分两阶段生成？
  answer: 先用 `find` 限定对象和读取范围，再用 `grep` 判断内容，可减少 I/O 并使每层条件独立验证。
  extra: 两阶段都保持 NUL 清单。
