- id: RHCSA-05-K02-QA-007
  type: qa
  question: 遍历目录时，目录的哪类权限直接影响 `find` 进入已知子路径？
  answer: 目录执行权限控制路径穿越；读取权限影响列出成员名称。
  extra: 完整权限模型属于权限章节，本章只用于解释搜索可见性。
