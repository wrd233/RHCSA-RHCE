- id: RHCSA-05-O06-QA-008
  type: qa
  question: NUL 流水线能否消除选择后对象被替换的竞态？
  answer: 不能。NUL 只解决记录边界和文件名完整性，不能消除“检查后、使用前”（TOCTOU）的对象替换竞态。
  extra: 执行时仍应重新评估对象身份、符号链接策略和目录可写性；高风险变更应在受控目录或维护窗口完成。
