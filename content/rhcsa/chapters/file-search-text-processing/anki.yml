  question: 使用 `sed -n '/ERROR/p' file` 时，`-n` 的作用是什么？
  answer: 关闭每条记录处理后的默认输出，只保留显式 `p` 的记录。
  extra: 忘记 `-n` 通常会让匹配行打印两次。
