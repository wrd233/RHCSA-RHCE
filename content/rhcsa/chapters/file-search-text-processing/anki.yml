- id: RHCSA-FILES-O02-QA-005
  type: qa
  question: 为什么不推荐 `for f in $(find ...)` 处理路径？
  answer: 命令替换结果会再次按空白分词，并可能进行通配展开，含空格、制表符或换行的文件名会被破坏。
  extra: 使用 `-exec command -- {} +`，或使用完整 NUL 流水线。
  source:
