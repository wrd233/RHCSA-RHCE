- id: RHCSA-05-O02-QA-009
  type: qa
  question: 为什么 `-ok` 不等于完整的批量变更安全流程？
  answer: 逐项确认只能降低即时误操作，不能证明候选完整、保留审计清单或完成执行后验证。
  extra: 大量对象逐项确认还容易产生疲劳误判。
