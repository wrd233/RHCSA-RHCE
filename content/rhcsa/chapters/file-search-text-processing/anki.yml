- id: RHCSA-05-K02-QA-005
  type: qa
  question: GNU `find` 默认的符号链接处理模式是什么？
  answer: '`-P`，遍历时不跟随符号链接。'
  extra: '`-L` 会跟随并可能改变 `-type` 的观察对象和搜索边界。'
