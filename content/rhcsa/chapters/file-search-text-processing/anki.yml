- id: RHCSA-05-O05-QA-007
  type: qa
  question: 验证冒号记录必须有 5 个字段，`awk` 条件是什么？
  answer: '`NF != 5` 用于选择结构异常记录。'
  extra: 异常记录应单独保存，不能静默丢弃后继续聚合。
