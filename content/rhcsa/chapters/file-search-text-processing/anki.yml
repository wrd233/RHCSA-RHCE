- id: RHCSA-05-O02-QA-001
  type: qa
  question: '`find` 相邻测试之间没有显式运算符时，默认是什么？'
  answer: 逻辑 AND，即 `-a`。
  extra: 这也是 `-type f -user appsvc` 可直接连接的原因。
