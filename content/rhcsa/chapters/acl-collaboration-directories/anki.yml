- id: RHCSA-09-O03-QA-002
  type: qa
  question: 目录 default ACL 含 `x`，为什么普通新文件通常仍没有执行位？
  answer: 普通文件常以 `0666` 请求创建；创建 mode 不含 `x`，继承结果会移除执行权限。
  extra: 新目录常以 `0777` 为上限，因此可继承穿越位。
