  type: qa
  question: 父目录存在 default ACL 时，还能否用“0666/0777 直接减 umask”准确预测新对象？
  answer: 不能。此时按 default ACL 与创建 mode 生成，传统 umask 计算路径不再是完整模型。
  extra: 必须创建样本并查看实际 ACL。
