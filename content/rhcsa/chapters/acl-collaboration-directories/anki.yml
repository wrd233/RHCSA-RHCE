- id: RHCSA-09-C01-QA-001
  type: qa
  question: 已有协作目录需要“项目组可写、auditor 只读、未来对象继承”，至少要修改哪三类状态？
  answer: 当前目录 access ACL、已有对象 access ACL、目录 default ACL。
  extra: 若已有子目录也直接接收新对象，还要给它们建立 default ACL。
