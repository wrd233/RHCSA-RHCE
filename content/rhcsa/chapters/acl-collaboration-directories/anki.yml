- id: RHCSA-09-D01-QA-005
  type: qa
  question: 父目录 default ACL 正确，为什么旧子目录中新建文件仍可能不继承？
  answer: 旧子目录自身没有 default ACL；父目录后来新增模板不会回溯。
  extra: 检查创建动作的直接父目录，而不只看树根。
