- id: RHCSA-09-C02-QA-003
  type: qa
  question: 诊断 mask 时，什么情况下直接提高 mask 可能过度授权？
  answer: 其他 named user/group 条目已经声明了更宽权限，只是此前被窄 mask 截断时。
  extra: 应先收窄不应生效的条目，再提高公共上限。
