- id: RHCSA-09-O05-QA-007
  type: qa
  question: ACL 备份生成后，最低限度应验证什么？
  answer: 文件非空、包含预期根路径和对象，并能被 `setfacl --test --restore` 解析。
  extra: 解析成功仍不等于真实恢复后的业务功能正确。
