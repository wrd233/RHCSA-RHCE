  type: qa
  question: '`ls -l` 权限字符串末尾的 `+` 能证明什么？'
  answer: 对象具有扩展 access ACL，或目录具有 default ACL。
  extra: 它只是线索，不能显示具体条目、mask 或目标用户的最终权限。
