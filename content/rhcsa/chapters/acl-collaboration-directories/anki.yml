  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-09-K01-QA-003
  type: qa
  question: '`group::rwx` 与 `group:qa:rwx` 的主体有何区别？'
  answer: '`group::` 表示文件记录的 owning group；`group:qa:` 表示额外 named group qa。'
  extra: 两者都属于 group class，存在 mask 时都受其限制。
  source:
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::acl-model
  - card::comparison
  - priority::P1
