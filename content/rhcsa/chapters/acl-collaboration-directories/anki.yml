- id: RHCSA-09-K01-QA-005
  type: qa
  question: 一个 ACL 出现 named user 或 named group 时，还必须存在什么条目？
  answer: 恰好一个 `mask::` 条目。
  extra: mask 表示 named user、owning group 与 named group 的最大有效权限。
  source:
  - acl(5)
  - setfacl(1)
  tags:
