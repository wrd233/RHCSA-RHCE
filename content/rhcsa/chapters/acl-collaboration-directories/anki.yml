  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-09-K02-QA-005
  type: qa
  question: named user 的 effective 权限如何计算？
  answer: named user 条目权限与 `mask::` 的交集。
  extra: 例如 `rw- ∩ r-- = r--`。
  source:
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-09-K02-QA-006
  type: qa
  question: 用户匹配多个组 ACL 条目时，组阶段如何判断？
  answer: 考虑 owning group 和所有匹配 named group；只要某个匹配组条目与 mask 共同包含请求权限即可通过。
  extra: 调查时要结合该进程的 effective GID 和 supplementary groups。
  source:
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-09-K02-QA-007
  type: qa
  question: named user 条目已匹配但缺少写权限，该用户能否再依靠自己所属的 named group 获得写权限？
  answer: 不能。named user 阶段匹配后即在该阶段决定允许或拒绝。
  extra: 不要把 ACL 各行简单相加。
  source:
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
