- id: RHCSA-09-C01-QA-003
  type: qa
  question: 协作目录的完整功能验收至少包含哪些身份动作？
  answer: 成员 A 创建、成员 B 交叉写、只读用户读取成功、只读用户写入和创建失败。
  extra: 再读取新文件和新目录 ACL，区分结构与功能。
