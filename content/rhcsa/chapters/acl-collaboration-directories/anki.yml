- id: RHCSA-09-O04-QA-003
  type: qa
  question: 只读 auditor 对目录和普通文件的典型 ACL 权限分别是什么？
  answer: 目录 `r-x`，普通文件 `r--`。
  extra: 目录需要 `x` 才能穿越；不给目录 `w` 才能阻止创建和删除目录项。
