  question: '`setfacl --restore` 除 ACL 外还可能恢复什么？'
  answer: 根据备份注释尝试恢复 owner、owning group，以及 setuid/setgid/sticky 位。
  extra: 因此应先预演并在测试树验证，不能当作轻量单条 ACL 修改。
