- id: RHCSA-09-K01-QA-001
  type: qa
  question: POSIX ACL 中，access ACL 与目录 default ACL 分别控制什么？
  answer: access ACL 参与当前对象的访问检查；default ACL 用于初始化目录内未来新对象的 access ACL。
  extra: default ACL 不能附着在普通文件上，也不会回溯修改已有对象。
  source:
  - acl(5)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::acl-model
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-09-K01-QA-002
  type: qa
  question: '`user::rwx` 与 `user:alice:rwx` 的主体有何区别？'
  answer: '`user::` 表示文件所有者；`user:alice:` 表示 named user alice。'
  extra: 空 qualifier 不是“所有用户”，而是 owner 条目。
  source:
  - acl(5)
  - getfacl(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::acl-model
  - card::comparison
