- id: RHCSA-09-O01-QA-002
  type: qa
  question: 保留绝对路径显示完整 ACL 的命令骨架是什么？
  answer: '`getfacl -p <PATH>`'
  extra: '`-p` 防止默认移除路径前导 `/`。'
