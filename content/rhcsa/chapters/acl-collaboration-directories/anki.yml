- id: RHCSA-09-D01-QA-001
  type: qa
  question: ACL 相关 `Permission denied` 的推荐调查顺序是什么？
  answer: 当前进程 `id` → 父路径 `namei -l` → `getfacl -e` 选择条目与 mask → 区分旧/新对象 → 最小修复 → 真实身份重试 → 其他安全层。
  extra: 不要从 `chmod 777` 或清空 ACL 开始。
  source:
  - RH124
  - acl(5)
  - getfacl(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::acl-diagnosis
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-09-D01-QA-002
  type: qa
  question: 账号已加入 project，但当前 Shell 的 `id` 没有 project，应该先做什么？
  answer: 刷新用户会话或创建新进程身份，再重新测试。
  extra: 组成员关系通常在进程启动时取得，继续修改 ACL 会掩盖身份问题。
  source:
  - RH124
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::acl-diagnosis
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: diagnosis
- id: RHCSA-09-D01-QA-003
  type: qa
  question: 新文件 ACL 正确而旧文件缺少 auditor 条目，根因最可能是什么？
  answer: 父目录 default ACL 只影响建立之后的新对象，未回溯旧文件。
  extra: 对明确旧对象设置 access ACL，而不是继续改 default ACL。
