- id: RHCSA-09-C02-QA-002
  type: qa
  question: 上一题修复 mask 后，`ls -l` 的 group 位为什么可能从 `r--` 变为 `rw-`？
  answer: 扩展 ACL 中 group mode bits 对应 mask；这里变化表示 group class 上限恢复。
  extra: 不能据此推断只修改了 owning group 条目。
