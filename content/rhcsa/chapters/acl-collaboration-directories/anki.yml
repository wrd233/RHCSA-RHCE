- id: RHCSA-09-O04-QA-001
  type: qa
  question: 协作目录的 ACL 工作流应按什么顺序推进？
  answer: 基线与授权矩阵 → 当前目录 access ACL → 已有树 → default ACL → 新对象 → 多身份允许/拒绝验证。
  extra: 每层解决的状态不同，不能用一步替代全部。
