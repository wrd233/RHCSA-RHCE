- id: RHCSA-09-D01-QA-008
  type: qa
  question: 修复 mask 后，为什么还要用目标用户实际追加而不只看 `getfacl`？
  answer: '`getfacl` 只证明 ACL 结构和 effective；实际追加还能暴露身份、路径和打开文件语义。'
  extra: 结构验证与功能验证不能互相替代。
