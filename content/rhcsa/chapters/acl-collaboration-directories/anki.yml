- id: RHCSA-09-K01-QA-006
  type: qa
  question: 目录上存在 `default:user:auditor:r-x`，能否据此证明 auditor 现在能进入该目录？
  answer: 不能。default ACL 只参与新对象创建，不参与当前目录的访问检查。
  extra: 还应查看目录 access ACL 和父路径穿越权限。
  source:
  - acl(5)
  - RH124
  tags:
