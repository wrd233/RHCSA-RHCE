- id: RHCSA-09-K01-QA-007
  type: qa
  question: ACL 条目中的目录 `r` 与 `x` 分别允许什么？
  answer: '`r` 允许列出目录项名称；`x` 允许穿越目录并访问已知名称。'
  extra: 审计只读遍历通常需要目录 `r-x`，而不是只有 `r--`。
  source:
  - RH124
  - acl(5)
  tags:
  - exam::rhcsa
