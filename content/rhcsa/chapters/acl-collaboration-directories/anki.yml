- id: RHCSA-09-C02-QA-001
  type: qa
  question: '文件显示 `user:analyst:rw- #effective:r--`、`group:qa:r--`、`mask::r--`，目标是 analyst 与 owning group 可写而 qa 只读，最小 mask
    修复是什么？'
  answer: '`setfacl -m m::rw- <FILE>`'
  extra: qa 条目本身只有 `r--`，提高上限到 `rw-` 不会让 qa 获得写权限；仍须检查完整 ACL。
  source:
  - acl(5)
  - setfacl(1)
  tags:
