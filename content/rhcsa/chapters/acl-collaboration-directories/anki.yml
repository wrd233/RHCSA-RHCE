- id: RHCSA-09-O04-QA-007
  type: qa
  question: setgid 协作目录与 default ACL 各解决什么问题？
  answer: setgid 让新对象继承目录所属组；default ACL 初始化新对象权限和额外主体条目。
  extra: setgid 不保证组写权限，default ACL 也不替代组归属。
