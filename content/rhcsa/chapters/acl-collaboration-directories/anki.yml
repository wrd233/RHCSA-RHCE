- id: RHCSA-09-D01-QA-006
  type: qa
  question: ACL、身份和父路径均允许但操作仍被拒绝，下一步应如何处理？
  answer: 保留 DAC 证据并转向只读挂载、SELinux、应用策略或其他层。
  extra: 不要通过放宽 ACL 来“验证”非 ACL 拒绝。
