  type: qa
  question: 按目录和普通文件分别预览 `/srv/atlas` 递归范围的命令是什么？
  answer: '`find /srv/atlas -xdev -type d -print` 与 `find /srv/atlas -xdev -type f -print`。'
  extra: 预览后再执行批量 ACL 修改，避免误给普通文件执行位。
