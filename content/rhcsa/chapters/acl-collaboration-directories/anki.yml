  model: RedHat-QA
  priority: P0
  disabled: false
  semantic_type: output
- id: RHCSA-09-K02-QA-004
  type: qa
  question: ACL mask 限制哪些条目？
  answer: 所有 named user、`group::` owning group 和所有 named group。
  extra: '`user::` 文件所有者与 `other::` 不受 mask 限制。'
  source:
  - acl(5)
  - getfacl(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::concept
