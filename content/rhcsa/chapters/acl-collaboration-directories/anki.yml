- id: RHCSA-09-D01-QA-004
  type: qa
  question: 执行 `setfacl -m u:analyst:rw- file` 成功，但 analyst 仍只读，下一条证据是什么？
  answer: '`getfacl -e -p file`，检查 mask 和 `#effective:`。'
  extra: 命令成功不等于 effective 包含写权限。
