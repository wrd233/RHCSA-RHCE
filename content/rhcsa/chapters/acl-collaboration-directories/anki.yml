- id: RHCSA-09-O04-QA-002
  type: qa
  question: alice 能创建文件后，为什么还要让 bob 追加同一文件？
  answer: 创建成功只证明 alice 对目录有创建权限；bob 追加才能证明新文件的 group class 实际可写。
  extra: 这同时验证继承、mask 和 bob 的当前组身份。
