- id: RHCSA-09-O05-QA-006
  type: qa
  question: 文件内容复制成功能否证明 ACL 也已保留？
  answer: 不能。是否保留 ACL 取决于工具、选项和目标文件系统。
  extra: 迁移后必须重新运行 `getfacl`；复制/归档工具完整语义属于第 06 章。
