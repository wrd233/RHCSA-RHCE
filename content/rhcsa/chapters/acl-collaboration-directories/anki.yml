  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-09-K01-QA-004
  type: qa
  question: 哪些 ACL 条目构成基础 ACL？
  answer: '`user::`、`group::`、`other::`。'
  extra: named user、named group 与 mask 属于扩展结构。
  source:
  - acl(5)
  - getfacl(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
