- id: RHCSA-09-K01-QA-008
  type: qa
  question: ACL 检查通过是否能证明最终文件操作一定成功？
  answer: 不能。父路径、只读挂载、SELinux 或应用策略仍可能拒绝。
  extra: ACL 只是自主访问控制链中的一层。
  source:
