- id: RHCSA-09-O01-QA-003
  type: qa
  question: '`getfacl -a` 与 `getfacl -d` 分别显示什么？'
  answer: '`-a` 只显示 access ACL；`-d` 只显示目录 default ACL。'
  extra: 这组参数用于分离当前状态与未来模板。
  source:
