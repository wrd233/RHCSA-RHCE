- id: RHCSA-09-D01-QA-007
  type: qa
  question: 为何 `setfacl -b` 不应作为 ACL 故障的默认修复？
  answer: 它会删除全部扩展 access entries，可能破坏仍然需要的历史授权。
  extra: 应识别具体条目或 mask 后执行最小修改。
