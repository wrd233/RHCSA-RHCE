- id: RHCSA-09-K02-QA-001
  type: qa
  question: ACL 访问匹配的主要顺序是什么？
  answer: 文件所有者 → named user → owning group/所有匹配 named groups → other。
  extra: 某一更具体阶段匹配后，不会因为权限不足再回退到更宽的后续类别。
  source:
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-09-K02-QA-002
  type: qa
  question: 文件所有者的 `user::` 缺少写权限，但他同时属于具有写权限的文件组，权限会相加吗？
  answer: 不会。owner 匹配后只按 `user::` 判断。
  extra: 这与传统 owner/group/other 最具体类别优先一致。
  source:
  - acl(5)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
  disabled: false
  semantic_type: boundary
- id: RHCSA-09-K02-QA-003
  type: qa
  question: '`user:analyst:rw- #effective:r--` 表示什么？'
  answer: analyst 条目声明读写，但 mask 只允许读，因此实际只有 `r--`。
  extra: 名义权限不能代替 effective 权限。
  source:
  - getfacl(1)
  - acl(5)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::output
