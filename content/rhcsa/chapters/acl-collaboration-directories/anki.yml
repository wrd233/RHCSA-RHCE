  type: qa
  question: 父目录有 default ACL 时，新对象 ACL 的形成顺序是什么？
  answer: 先继承父目录 default ACL 作为 access ACL，再删除创建程序请求 mode 中没有的权限。
  extra: 最终权限不得超过创建程序请求的 mode。
