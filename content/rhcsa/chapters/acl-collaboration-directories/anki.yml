- id: RHCSA-09-K02-QA-009
  type: qa
  question: 为什么对带扩展 ACL 的文件执行 `chmod g=r` 可能让 named user 失去写权限？
  answer: 扩展 ACL 下 group mode bits 对应 mask；`chmod g=r` 会把 mask 收窄为只读。
  extra: named user、owning group 与 named group 的 effective 上限会一起变化。
  source:
  - acl(5)
  - chmod(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: diagnosis
- id: RHCSA-09-K02-QA-010
  type: qa
  question: 为什么不应无条件执行 `setfacl -m m::rwx <PATH>`？
  answer: 它会同时放宽整个 group class 的 effective 上限。
  extra: 修复前应审阅所有 named user、owning group 和 named group 条目。
  source:
  - acl(5)
  - setfacl(1)
  tags:
  - exam::rhcsa
  - chapter::acl-collaboration-directories
  - topic::mask-effective
  - card::security
