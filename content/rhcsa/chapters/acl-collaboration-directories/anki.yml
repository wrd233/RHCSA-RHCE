- id: RHCSA-09-K02-QA-008
  type: qa
  question: 对象具有扩展 ACL 和 mask 时，`ls -l` 的 group 三位通常对应哪个条目？
  answer: '`mask::`，而不是简单对应 `group::`。'
  extra: 因此必须用 `getfacl` 区分 owning group 条目和 group class 上限。
  source:
  - acl(5)
  tags:
