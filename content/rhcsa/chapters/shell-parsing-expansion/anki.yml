- id: RHCSA-01-K03-QA-001
  type: qa
  question: 本章用于判断参数数量的核心展开链是什么？
  answer: 参数展开/命令替换 → 未引用结果的词拆分 → 路径名展开 → 形成最终参数。
  extra: 引用上下文从解析阶段就影响这些步骤，不能理解为最后才加引号。
  source:
