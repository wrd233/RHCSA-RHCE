- id: RHCSA-01-K01-QA-001
  type: qa
  question: 在 Shell 层，命令的“选项”和“普通参数”有什么共同点？
  answer: 它们首先都是最终参数列表中的字符串；目标程序再按自身接口决定哪些字符串是选项、路径或其他参数。
  extra: Shell 负责边界和展开，不负责理解每个程序的业务选项。
  source:
  - RH124
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::shell-parsing-expansion
  - topic::argv-model
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-01-K01-QA-002
  type: qa
  question: 命令 `ls -l /etc/hosts` 形成的前三个 argv 项分别是什么？
  answer: '`argv[0]=ls`、`argv[1]=-l`、`argv[2]=/etc/hosts`。'
  extra: 这是参数模型，不表示已经验证文件存在或命令成功。
  source:
  - RH124
  - bash(1)
  tags:
