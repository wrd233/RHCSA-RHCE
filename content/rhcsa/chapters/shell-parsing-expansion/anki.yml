- id: RHCSA-01-K01-QA-008
  type: qa
  question: '`type name` 成功能证明什么，不能证明什么？'
  answer: 能证明当前 Shell 找到了名称解析入口；不能证明参数正确、命令执行成功或最终业务终态正确。
  extra: 继续用参数观察、退出状态和目标对象查询完成分层验证。
