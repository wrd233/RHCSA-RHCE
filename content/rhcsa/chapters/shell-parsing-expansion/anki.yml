- id: RHCSA-SHELL-K01-QA-005
  type: qa
  question: '`cmd1 && cmd2` 与 `cmd1 || cmd2` 的执行条件分别是什么？'
  answer: '`&&` 只在左侧状态为 0 时执行右侧；`||` 只在左侧状态非零时执行右侧。'
  extra: '`;` 表示无条件顺序执行。'
  source:
  - 'bash(1): Lists'
  tags:
