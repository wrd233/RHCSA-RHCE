- id: RHCSA-01-K01-QA-005
  type: qa
  question: 为什么命令源码中的语法引号通常不会出现在目标程序收到的参数中？
  answer: 引号主要控制 Shell 解析和展开，随后作为语法字符被移除；最终参数保留引号内的数据，而不是语法引号本身。
  extra: 若参数本身需要引号字符，必须把引号作为数据另行引用或转义。
  source:
  - RH124
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::shell-parsing-expansion
  - topic::argv-model
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: concept
- id: RHCSA-01-K01-QA-006
  type: qa
  question: 未引用空格与引用中的空格在词边界上有什么区别？
  answer: 未引用空格通常分隔 Shell 词；引号中的空格属于同一个词的数据。
  extra: 变量展开结果中的空格还可能在后续词拆分阶段产生多个参数。
  source:
  - RH124
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::shell-parsing-expansion
  - topic::argv-model
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-01-K01-QA-007
  type: qa
  question: 反斜杠紧接换行在 Bash 输入中表示什么？
  answer: 它表示续行；反斜杠和换行都被移除，使下一物理行继续当前命令。
  extra: 这与把字面换行字符传入参数不是同一件事。
  source:
