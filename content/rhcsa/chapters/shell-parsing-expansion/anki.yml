- id: RHCSA-SHELL-K01-QA-003
  type: qa
  question: 捕获 `date +%F` 输出到变量 `today` 的推荐写法是什么？
  answer: '`today=$(date +%F)`'
  extra: '`$(...)` 比反引号更清晰且易于嵌套；显示变量时仍推荐 `"$today"`。'
  source:
  - 'RH124: Command Substitution'
  - 'bash(1): Command Substitution'
