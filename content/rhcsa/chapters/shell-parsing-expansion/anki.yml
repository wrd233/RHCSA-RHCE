- id: RHCSA-01-K01-QA-003
  type: qa
  question: 如何判断名称 `printf` 当前会解析成 builtin、函数、alias 还是外部命令？
  answer: '`type printf`；要尽可能列出所有入口，使用 `type -a printf`。'
  extra: '`type` 解释当前 Shell 的名称解析，单独查路径不能覆盖 builtin 或函数。'
  source:
