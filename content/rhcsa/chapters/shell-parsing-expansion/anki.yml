- id: RHCSA-SHELL-K01-QA-004
  type: qa
  question: '`$?` 保存什么？什么时候读取才有意义？'
  answer: 它保存最近一条命令或命令列表的退出状态；必须在任何其他命令覆盖它之前读取或赋给普通变量。
  extra: 状态 0 通常只说明该命令按自身定义成功，不能自动证明完整任务终态。
  source:
  - RH124
  - 'bash(1): Special Parameters'
  tags:
