  semantic_type: comparison
- id: RHCSA-SHELL-K01-QA-002
  type: qa
  question: 路径变量可能包含空格时，为什么通常写成 `"$path"`？
  answer: 双引号使参数展开结果保持为一个参数，防止值中的空白触发词拆分，也防止值中的 glob 字符再次进行路径名展开。
  extra: 引用只能保护参数边界，不能证明路径存在、可访问或操作安全。
  source:
  - 'RH124: Shell 变量'
  - 'bash(1): Word Splitting'
