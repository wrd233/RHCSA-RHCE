- id: RHCSA-01-K02-QA-007
  type: qa
  question: 相邻的已引用和未引用片段会形成多个参数吗？
  answer: 不会，只要中间没有词分隔，它们会拼接成同一个 Shell 词。
  extra: 例如 `"$prefix"-'report'\ final` 仍可形成一个参数。
