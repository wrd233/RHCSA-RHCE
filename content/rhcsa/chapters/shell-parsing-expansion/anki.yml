  type: qa
  question: 双引号中的反斜杠能否无条件转义任意字符？
  answer: 不能。它只在有限字符前具有特殊转义作用；其他字符前的反斜杠可能被保留为数据。
  extra: 不要用大量反斜杠代替清晰的引用结构。
