- id: RHCSA-01-K01-QA-004
  type: qa
  question: 你需要同时查看新 Bash 收到的参数数量和每个参数边界，使用什么只读骨架？
  answer: '```bash

    bash -c ''

    printf "argc=%s\n" "$#"

    printf "arg=<%s>\n" "$@"

    '' _ <ARGUMENTS...>

    ```'
  extra: '`_` 占据新 Bash 的 `$0`，其后的参数进入 `$1`、`$2`……。'
  source:
  - RH124
  - bash(1)
  tags:
  - exam::rhcsa
