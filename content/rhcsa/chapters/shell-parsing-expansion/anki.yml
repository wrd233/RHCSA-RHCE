- id: RHCSA-01-K02-QA-003
  type: qa
  question: 为什么不能在单引号内部直接写反斜杠加单引号来表示字面单引号？
  answer: 单引号内部所有字符都按字面处理，反斜杠不能在那里结束或转义单引号；必须结束引用、插入受保护的单引号、再开始引用。
  extra: 常见拼接形式：`'don'\''t'`。
