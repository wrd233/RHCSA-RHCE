- id: RHCSA-01-K02-QA-001
  type: qa
  question: 只需要保护紧随其后的一个空格或美元符号时，应使用什么？
  answer: 使用反斜杠，例如 `alpha\ beta` 或 `\$HOME`。
  extra: 反斜杠只保护下一个字符，不自动保护后续整段文本。
