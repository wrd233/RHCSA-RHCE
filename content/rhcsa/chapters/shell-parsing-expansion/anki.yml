- id: RHCSA-SHELL-K01-QA-001
  type: qa
  question: 需要完全保留字面文本与需要允许变量展开时，分别怎样选择单引号和双引号？
  answer: 完全保留字面文本使用单引号；允许参数展开或命令替换但仍希望保持一个参数时使用双引号。
  extra: 双引号同时抑制普通词拆分和路径名展开；单引号阻止普通 Shell 展开。
  source:
  - 'RH124: Shell 扩展'
  - 'bash(1): Quoting'
