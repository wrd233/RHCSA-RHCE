notes:
- id: RHCSA-BOOT-QA-001
  type: qa
  question: RHEL 启动主链路是什么？
  answer: firmware → boot loader → kernel/initramfs → systemd/target。
  extra: 失败证据按阶段不同。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::process
  - priority::P0
- id: RHCSA-BOOT-QA-002
  type: qa
  question: 查询和设置默认 target 分别用什么？
  answer: '`systemctl get-default`；`systemctl set-default <TARGET>`。'
  extra: 设置只影响下次启动。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-003
  type: qa
  question: '`systemctl isolate` 的作用和风险是什么？'
  answer: 当前切换 target 并停止无关 units，可能中断会话。
  extra: 不等于 set-default。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-004
  type: qa
  question: rd.break 后真实根通常在哪里？
  answer: '`/sysroot`。'
  extra: 先确认并重挂 rw。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::concept
  - priority::P0
- id: RHCSA-BOOT-QA-005
  type: qa
  question: 重挂真实根为读写的命令是什么？
  answer: '`mount -o remount,rw /sysroot`'
  extra: 随后 chroot。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-006
  type: qa
  question: 为什么必须 `chroot /sysroot` 后再 passwd？
  answer: 否则可能修改 initramfs 环境而非真实系统。
  extra: 命令成功也可能作用对象错误。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-007
  type: qa
  question: 重置口令后创建 `/.autorelabel` 的目的是什么？
  answer: 让下次启动对真实文件系统重新进行 SELinux 标记。
  extra: relabel 可能耗时。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::verification
  - priority::P0
- id: RHCSA-BOOT-QA-008
  type: qa
  question: 修复 fstab 的证据顺序是什么？
  answer: 失败 unit/journal → blkid/lsblk → 编辑 → findmnt --verify → mount -a。
  extra: 不先重启。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::process
  - priority::P0
- id: RHCSA-BOOT-QA-009
  type: qa
  question: fstab 必需挂载失败时能否默认加 nofail？
  answer: 不能；这改变要求并掩盖错误。
  extra: 修正真实 UUID/类型/选项。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-010
  type: qa
  question: 查看本次启动错误与失败 units 用什么？
  answer: '`journalctl -b -p err`；`systemctl --failed`。'
  extra: 再进入具体 unit。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::command
  - priority::P0
- id: RHCSA-BOOT-QA-011
  type: qa
  question: passwd 显示成功但重启后旧口令仍有效，优先检查什么？
  answer: 是否 chroot 到真实根、根是否 rw。
  extra: 对象层错误。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::diagnosis
  - priority::P0
- id: RHCSA-BOOT-QA-012
  type: qa
  question: 默认 target 正确能否证明所有服务已运行？
  answer: 不能；仍需查具体 unit active/enabled 与日志。
  extra: target 是依赖集合。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::verification
  - priority::P0
- id: RHCSA-BOOT-QA-013
  type: qa
  question: rescue 与 emergency 的大致区别是什么？
  answer: rescue 环境较完整；emergency 更小且挂载更少。
  extra: 按可用工具和题目选择。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::comparison
  - priority::P0
- id: RHCSA-BOOT-QA-014
  type: qa
  question: root 口令恢复的完整骨架是什么？
  answer: rd.break → remount rw → chroot → passwd → autorelabel → exit。
  extra: 启动后再验收。
  source:
  - RH134-RHEL9
  - RHCSA-Course-18
  - RHCSA9-Mock
  tags:
  - exam::rhcsa
  - chapter::boot-recovery
  - card::process
  - priority::P0
