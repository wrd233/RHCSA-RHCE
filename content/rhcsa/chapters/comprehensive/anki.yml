- id: RHCSA-33-K03-QA-007
  type: qa
  question: 为什么 `--force`、`--nodeps` 或 `--allowerasing` 不能作为综合题默认答案？
  answer: 它们可能绕过依赖或安全检查并扩大影响面，只有题目和证据明确支持时才可评估。
  extra: 默认选择最小、可解释的修改。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
