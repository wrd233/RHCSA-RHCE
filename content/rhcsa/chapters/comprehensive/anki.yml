- id: RHCSA-33-O01-QA-003
  type: qa
  question: 同时查看 NetworkManager 连接名、UUID、设备和 autoconnect 的命令骨架是什么？
  answer: '`nmcli -f NAME,UUID,TYPE,DEVICE,AUTOCONNECT connection show`。'
  extra: 连接 profile 与 device 当前状态应分开看。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::command
  - priority::P0
- id: RHCSA-33-O01-QA-004
  type: qa
  question: 构建存储宽基线的核心命令组合是什么？
  answer: '`lsblk`、`blkid`、`pvs/vgs/lvs`、`findmnt`、`swapon --show` 和 `/etc/fstab`。'
  extra: 单一命令不能证明设备完全空闲。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::command
  - priority::P0
- id: RHCSA-33-O01-QA-005
  type: qa
  question: 为什么 root 的 `podman ps` 不能作为 `svcweb` rootless 容器证据？
  answer: root 与 svcweb 使用不同的用户存储、配置和 systemd manager。
  extra: 必须在目标用户上下文调查。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::boundary
  - priority::P0
- id: RHCSA-33-O01-QA-006
  type: qa
  question: 任务账本中的“缺失证据”字段有什么作用？
  answer: 明确当前为何不能关账，并指出下一条验证；避免把执行动作误写为完成。
  extra: blocked 项尤其需要此字段。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::process
  - priority::P0
- id: RHCSA-33-O01-QA-007
  type: qa
  question: '`systemctl --failed` 没有输出能证明所有服务健康吗？'
  answer: 不能。它只说明没有被 systemd 标记为 failed 的 unit，不能证明业务功能。
  extra: 仍需按题目对象验证。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::output
  - priority::P0
- id: RHCSA-33-O01-QA-008
  type: qa
  question: 为何要同时保存初始状态和修改后状态？
  answer: 便于确认变化由本次操作产生，识别覆盖关系，并支持最小恢复。
  extra: 只保存最终输出会丢失因果证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::baseline
  - card::verification
  - priority::P0
- id: RHCSA-33-O02-QA-001
  type: qa
  question: 静态证据和当前证据分别回答什么？
  answer: 静态证据回答声明/语法是否正确；当前证据回答此刻是否已加载并生效。
  extra: 两者都不自动等于功能证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::comparison
  - priority::P0
- id: RHCSA-33-O02-QA-002
  type: qa
  question: '`httpd -t` 通过不能证明哪些状态？'
  answer: 不能证明服务已运行、监听 8082、SELinux/firewalld 正确或客户端可访问。
  extra: 它只验证 Apache 配置语法。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::boundary
  - priority::P0
- id: RHCSA-33-O02-QA-003
  type: qa
  question: '`findmnt /srv/data` 通过不能证明什么？'
  answer: 不能证明 fstab 正确或重启后自动挂载。
  extra: 需要 `findmnt --verify` 和重启证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::boundary
  - priority::P0
- id: RHCSA-33-O02-QA-004
  type: qa
  question: '`crontab -l` 或 cron 文件存在不能证明什么？'
  answer: 不能证明调度到点后以正确身份和环境成功运行。
  extra: 需产物和日志证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::boundary
  - priority::P0
- id: RHCSA-33-O02-QA-005
  type: qa
  question: 验证 ACL 未来继承的最佳方式是什么？
  answer: 以目标创建者新建文件/目录，再用 `getfacl` 和真实消费者访问验证。
  extra: 只读取默认 ACL 条目不足。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::verification
  - priority::P0
- id: RHCSA-33-O02-QA-006
  type: qa
  question: 验证 firewalld 持久性为什么要查询两次？
  answer: runtime 与 permanent 是独立状态；分别使用普通查询和 `--permanent` 查询。
  extra: reload/reboot 后以 permanent 重建 runtime。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::verification
  - priority::P0
- id: RHCSA-33-O02-QA-007
  type: qa
  question: 一项任务何时可以标记 verified？
  answer: 题目要求的所有证据层已关闭、参数一致、限制未破坏，并完成必要回归。
  extra: 缺一层就记录 pending/blocked。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::process
  - priority::P0
- id: RHCSA-33-O02-QA-008
  type: qa
  question: '`systemctl is-enabled` 可能返回 enabled 以外的哪些有意义状态？'
  answer: 例如 disabled、static、indirect、generated 等；应结合 unit 类型解释。
  extra: Quadlet 生成 unit 可能显示 generated。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
