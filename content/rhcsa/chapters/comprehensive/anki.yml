  - priority::P0
- id: RHCSA-33-O01-QA-001
  type: qa
  question: 查看路径每一级目录所有者和权限的命令是什么？
  answer: '`namei -om /path`。'
  extra: 它补充 `stat` 只看末级对象的局限。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
