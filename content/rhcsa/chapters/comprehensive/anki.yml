- id: RHCSA-33-T03-QA-006
  type: qa
  question: 查询 LV 文件系统 UUID 的命令是什么？
  answer: '`blkid -s UUID -o value /dev/vgexam/lvdata`。'
  extra: 不要编造 UUID。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
