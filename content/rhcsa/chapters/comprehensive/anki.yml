- id: RHCSA-COMPREHENSIVE-QA-001
  type: qa
  question: 面对一组跨用户、网络、服务和存储的 RHCSA 要求，第一步应产出什么？
  answer: 把原题拆成独立评分行，并为每行写出目标对象、精确参数、限制和必需证据。
  extra: 不要先把题号转换成命令清单；评分对象是终态。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::method
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-002
  type: qa
  question: 哪些关系应被标记为综合任务中的硬依赖？
  answer: 当前置对象不成立时，后续功能无法正确建立或验证的关系。
  extra: 例如网络和名称解析是仓库、NFS 与镜像仓库的硬依赖。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::concept
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-003
  type: qa
  question: 为什么修改共享对象后需要执行回归集合？
  answer: 同一个用户、路径、端口、设备或 profile 可能被多个任务共同依赖；其变化可能使已通过的任务失效。
  extra: 回归相关任务即可，不必从头重做整台主机。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::verification
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-004
  type: qa
  question: 综合验收中“当前状态”和“持久状态”分别回答什么？
  answer: 当前状态回答系统此刻是否生效；持久状态回答重新登录、reload 或重启后是否仍会成立。
  extra: '`active` 与 `enabled`、runtime 与 permanent 是典型分离。'
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::comparison
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-005
  type: qa
  question: 为什么功能证据不能总由 root 执行？
  answer: root 可能绕过普通用户权限或使用不同的容器、环境和凭据，无法证明真实消费者能够使用目标功能。
  extra: ACL、sudo、计划任务和 rootless 容器都应在题目指定身份下验证。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::boundary
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-006
  type: qa
  question: 局部闭环的基本顺序是什么？
  answer: 调查当前对象 → 完成一个最小修改 → 运行贴近该对象的最小验证 → 记录证据。
  extra: 不要同时改多个层后再统一排错。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::method
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-007
  type: qa
  question: 存储写操作前的最低证据门包括哪些内容？
  answer: 目标设备身份、容量、当前挂载、文件系统签名、LVM/Swap 归属以及题目允许的用途。
  extra: 证据不清楚时应停止，而不是用 `wipefs -a` 或强制参数推进。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::boundary
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-008
  type: qa
  question: 为什么重启不应作为首轮排错手段？
  answer: 重启会同时改变网络、服务、挂载、用户 manager 和容器状态，扩大故障面。
  extra: 先完成静态检查和当前功能闭环，再用重启证明持久性。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::boundary
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-009
  type: qa
  question: 服务显示 active 能否证明远端客户端可以访问？
  answer: 不能。还需确认配置、监听、SELinux、firewalld、网络路径和客户端请求。
  extra: active 只证明 systemd 当前认为 unit 处于活动状态。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::boundary
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-010
  type: qa
  question: 一个任务缺少远端功能证据时，应写成什么状态？
  answer: 写成 `blocked` 或 `deferred`，并记录缺失证据和下一步；不能把静态或当前状态升级为完整 PASS。
  extra: 证据矩阵必须诚实表达验证边界。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::evidence
  - card::verification
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-011
  type: qa
  question: 最终检查为什么必须从原题重新开始？
  answer: 执行历史会强化“我做过”的记忆，却可能遗漏原始参数、限制或子要求。
  extra: 从原题逐项映射证据矩阵，才能发现遗漏。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-012
  type: qa
  question: 综合任务的最终完成标准是什么？
  answer: 所有题目要求的对象达到一致终态，所需证据层关闭，限制条件未被破坏，重启或重新登录后的状态按题目要求成立。
  extra: 命令数量和没有报错都不是完成标准。
  source:
  - legacy comprehensive anki
  - RHCSA-33 lecture
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::concept
  - priority::P0
- id: RHCSA-33-K01-QA-001
  type: qa
  question: 题目写“确保 httpd 在 8082 端口提供内容”。拆解时至少应形成哪几类验收对象？
  answer: httpd 配置语法、服务当前/持久状态、监听端口、SELinux 文件与端口策略、firewalld、内容读取和客户端请求。
  extra: 题面要求的层进入矩阵，未要求的扩展不要无限展开。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::process
  - priority::P0
- id: RHCSA-33-K01-QA-002
  type: qa
  question: 题目参数与环境事实有什么区别？
  answer: 题目参数是必须达到的目标值；环境事实是接口名、现有 profile、UUID、设备签名等需要查询的当前状态。
  extra: 不得猜测环境事实。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::comparison
  - priority::P0
- id: RHCSA-33-K01-QA-003
  type: qa
  question: “不得删除目录中已有文件”应放在任务账本的哪个位置？
  answer: 作为独立限制或保持条件，与正向终态一起进入验收矩阵。
  extra: 限制条件不是可忽略备注。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::boundary
  - priority::P0
- id: RHCSA-33-K01-QA-004
  type: qa
  question: 一个大题中用户已创建，但默认 ACL 未生效。为什么不能把整题标记为完成？
  answer: 用户身份与默认 ACL 是不同评分行；默认 ACL 缺少新对象功能证据。
  extra: 大题要拆成可独立判定的子状态。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-K01-QA-005
  type: qa
  question: 执行命令退出码为 0 能证明什么？
  answer: 只能证明该命令按自身定义成功返回；不能自动证明跨层功能和持久性。
  extra: 继续读取目标对象状态。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::output
  - priority::P0
- id: RHCSA-33-K01-QA-006
  type: qa
  question: 把“配置仓库”改写为可验证终态时，应包含哪些要素？
  answer: repo ID/文件、baseurl、enabled/GPG 策略、元数据可获取，以及题目要求的软件查询或安装功能。
  extra: '`dnf repolist` 只覆盖其中一部分。'
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::process
  - priority::P0
- id: RHCSA-33-K01-QA-007
  type: qa
  question: 为什么不应把模拟题答案中的设备名或 UUID直接写入自己的操作？
  answer: 这些值属于特定环境事实；在另一环境中照抄可能操作错误设备或写入无效 fstab。
  extra: 题目参数与查询结果必须分开。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::boundary
  - priority::P0
- id: RHCSA-33-K01-QA-008
  type: qa
  question: 一道题要求“开机自动启动”，只执行 `systemctl start` 后还缺哪类证据？
  answer: 持久启动配置，例如 `systemctl is-enabled`，以及必要时重启后的实际状态。
  extra: 当前 active 不能代替持久状态。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::task-decomposition
  - card::verification
  - priority::P0
- id: RHCSA-33-K02-QA-001
  type: qa
  question: 硬依赖与顺序优化有什么区别？
  answer: 硬依赖不成立时后续任务无法正确完成；顺序优化只是减少返工或改善诊断。
  extra: 独立任务可以自由安排。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::comparison
  - priority::P0
- id: RHCSA-33-K02-QA-002
  type: qa
  question: 修改用户 `svcweb` 的 home 后，哪些对象应进入回归集合？
  answer: rootless Podman 存储/配置、Quadlet 路径、用户 systemd、容器卷和数据所有权。
  extra: 它们共享用户和 home 路径。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::process
  - priority::P0
- id: RHCSA-33-K02-QA-003
  type: qa
  question: 修改服务端口后，最小跨层回归顺序是什么？
  answer: 应用配置与语法 → 进程/监听 → SELinux 端口类型 → firewalld → 本机请求 → 远端请求。
  extra: 不要只重启服务。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::process
  - priority::P0
- id: RHCSA-33-K02-QA-004
  type: qa
  question: 把文件系统挂载到已有目录前必须调查什么？
  answer: 该目录当前内容、现有挂载、使用者和是否会遮蔽业务数据。
  extra: 挂载不会删除原目录内容，但会遮蔽视图。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::boundary
  - priority::P0
- id: RHCSA-33-K02-QA-005
  type: qa
  question: NFS 名称无法解析时，继续调整 autofs map 有什么问题？
  answer: 名称解析是硬依赖；map 即使语法正确也无法完成远程功能验证。
  extra: 先修复网络/NSS 层。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-K02-QA-006
  type: qa
  question: 本机 curl 成功而远端 curl 失败，哪些层的优先级下降？
  answer: DocumentRoot、应用内容和本机监听的嫌疑下降；应优先查 active zone、firewalld、路由和远端路径。
  extra: 仍需以实际证据为准。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::comparison
  - priority::P0
- id: RHCSA-33-K02-QA-007
  type: qa
  question: 修改 `/srv/web` 的挂载或标签后，最小回归集合是什么？
  answer: '`findmnt -T`、所有权/SELinux 标签、httpd 配置与状态、本机请求、远端请求。'
  extra: 路径是多个层的共享对象。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::process
  - priority::P0
- id: RHCSA-33-K02-QA-008
  type: qa
  question: 为什么同一个端口会同时属于应用和安全对象？
  answer: 应用决定是否监听；SELinux 决定服务域能否绑定；firewalld 决定外部流量是否允许。
  extra: 三者状态独立。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::dependency
  - card::concept
  - priority::P0
- id: RHCSA-33-K03-QA-001
  type: qa
  question: R0 只读调查与 R4 启动关键操作的策略差异是什么？
  answer: R0 可尽早执行并保存基线；R4 必须确认对象身份、通过证据门并准备恢复入口。
  extra: 风险决定前置证据，不等于禁止操作。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::comparison
  - priority::P0
- id: RHCSA-33-K03-QA-002
  type: qa
  question: 通过 SSH 修改当前 NetworkManager profile 时，最重要的恢复边界是什么？
  answer: 保留控制台或第二会话，并在删除/禁用旧 profile 前验证新 profile。
  extra: 不要先破坏当前可达性。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::boundary
  - priority::P0
- id: RHCSA-33-K03-QA-003
  type: qa
  question: 写入 `/etc/fstab` 后，进入重启前至少应执行哪些验证？
  answer: 检查重复项和 UUID，运行 `findmnt --verify --verbose`，用 `mount -a`/`swapon -a` 验证当前状态。
  extra: 还应确保有恢复入口。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::verification
  - priority::P0
- id: RHCSA-33-K03-QA-004
  type: qa
  question: 为什么配置文件备份不能撤销误格式化？
  answer: 备份只保存文本声明，不能恢复被 `mkfs` 覆盖的文件系统数据结构。
  extra: 存储安全主要依靠写入前确认。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::boundary
  - priority::P0
- id: RHCSA-33-K03-QA-005
  type: qa
  question: 网络切换后 SSH 断开，首先应从哪里恢复？
  answer: 使用预留控制台，检查设备、active profile、地址、路由和 autoconnect；不要继续远程猜命令。
  extra: 恢复入口应在修改前准备。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::risk
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-K03-QA-006
  type: qa
  question: 何时应把高风险任务标记为 blocked？
  answer: 题目对象身份、现有数据用途或恢复条件无法确认时。
  extra: 诚实阻塞优于无证据强行写入。
  source:
