- id: RHCSA-33-T01-QA-001
  type: qa
  question: 创建 GID 3100 的 `opsadmins` 组命令是什么？
  answer: '`groupadd -g 3100 opsadmins`。'
  extra: 执行前先用 `getent group` 检查名称和 GID 冲突。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::command
  - priority::P0
- id: RHCSA-33-T01-QA-002
  type: qa
  question: 创建 UID 2201、附加组为 opsadmins 的 deploy 用户命令是什么？
  answer: '`useradd -u 2201 -G opsadmins deploy`。'
  extra: '`-G` 指附加组；不要误用覆盖现有用户组的操作。'
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::command
  - priority::P0
- id: RHCSA-33-T01-QA-003
  type: qa
  question: 把 `/srv/project` 设置为 root:opsadmins 且目录模式 2770 的命令是什么？
  answer: '`chown root:opsadmins /srv/project` 与 `chmod 2770 /srv/project`。'
  extra: setgid 使新对象继承目录组。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::command
  - priority::P0
- id: RHCSA-33-T01-QA-004
  type: qa
  question: 目录模式 2770 中前导 2 表示什么？
  answer: setgid 位；在目录上使新建对象继承目录组，并影响子目录的 setgid 继承。
  extra: 它不自动解决全部 ACL 和 umask 问题。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::parameter
  - priority::P0
- id: RHCSA-33-T01-QA-005
  type: qa
  question: 验证 sudoers 全局语法的命令是什么？
  answer: '`visudo -cf /etc/sudoers`。'
  extra: 独立文件权限通常应为 0440。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::command
  - priority::P0
- id: RHCSA-33-T01-QA-006
  type: qa
  question: 仅允许 deploy 重启 httpd 的 sudoers 行是什么？
  answer: '`deploy ALL=(root) /usr/bin/systemctl restart httpd.service`。'
  extra: 不要加入通配符、shell 或任意 systemctl 子命令。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T01-QA-007
  type: qa
  question: 验证附加组时为什么必须使用新登录会话？
  answer: 已运行进程的组列表不会因账号数据库变化自动刷新。
  extra: 新会话 `id` 才能代表后续登录状态。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T01-QA-008
  type: qa
  question: ACL 条目存在但 auditor 仍无法读取，下一步最有区分度的证据是什么？
  answer: 查看 `getfacl` 的 mask，并用 `namei -om` 检查父目录遍历权限。
  extra: 命名 ACL 可能被 mask 限制。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T01-QA-009
  type: qa
  question: 为什么不能用 root 的 `cat` 验证 auditor 只读？
  answer: root 可能绕过普通访问控制，无法证明 auditor 的真实权限。
  extra: 应使用 `runuser -u auditor -- ...` 或实际登录。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::boundary
  - priority::P0
- id: RHCSA-33-T01-QA-010
  type: qa
  question: 如何验证默认 ACL 对新对象生效？
  answer: 由 deploy 新建文件，再执行 `getfacl` 并以 auditor 读取、尝试写入。
  extra: 预期写入应被拒绝。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::identity-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T02-QA-001
  type: qa
  question: 创建静态 profile `exam-static` 的核心 nmcli 骨架是什么？
  answer: '`nmcli con add type ethernet ifname enp1s0 con-name exam-static ipv4.method manual ipv4.addresses 192.0.2.20/24
    ipv4.gateway 192.0.2.1 ipv4.dns 192.0.2.53 connection.autoconnect yes`。'
  extra: 激活前先 `nmcli con show exam-static` 核对。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::command
  - priority::P0
- id: RHCSA-33-T02-QA-002
  type: qa
  question: 为什么不建议先删除 `Wired connection 1`？
  answer: 它可能是当前恢复入口；应先建立并验证新 profile，再调整旧 profile 的 autoconnect。
  extra: 通过远程连接操作时尤其重要。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::boundary
  - priority::P0
- id: RHCSA-33-T02-QA-003
  type: qa
  question: 静态网络完成后至少验证哪三个不同层面？
  answer: 地址/路由、名称解析、依赖资源访问（如仓库或远端服务）。
  extra: 只 ping 网关不足。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T02-QA-004
  type: qa
  question: 训练 repo 文件中每个仓库最低需要哪些字段？
  answer: 唯一 section ID、`name`、`baseurl`、`enabled` 和题目指定的 `gpgcheck` 策略。
  extra: 配置文件名必须以 `.repo` 结尾。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T02-QA-005
  type: qa
  question: 只刷新两个指定 repo 元数据的命令骨架是什么？
  answer: '`dnf makecache --disablerepo="*" --enablerepo=rhel9-baseos,rhel9-appstream`。'
  extra: 能区分其他仓库噪声。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::command
  - priority::P0
- id: RHCSA-33-T02-QA-006
  type: qa
  question: 为 `/srv/web` 建立持久 httpd 内容标签的命令组合是什么？
  answer: '`semanage fcontext -a -t httpd_sys_content_t "/srv/web(/.*)?"`，然后 `restorecon -RFv /srv/web`。'
  extra: '`chcon` 不是持久规则。'
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T02-QA-007
  type: qa
  question: 为尚未登记的 8082/tcp 添加 httpd 端口类型的命令是什么？
  answer: '`semanage port -a -t http_port_t -p tcp 8082`。'
  extra: 若端口已存在于其他类型，需调查后使用 `-m`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::command
  - priority::P0
- id: RHCSA-33-T02-QA-008
  type: qa
  question: 非标准 HTTP 端口当前状态的直接证据是什么？
  answer: '`ss -lnt "( sport = :8082 )"`，结合 `systemctl is-active httpd`。'
  extra: 监听不证明外部可达。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T02-QA-009
  type: qa
  question: firewall-cmd 普通 `--add-port` 与带 `--permanent` 的区别是什么？
  answer: 前者修改 runtime，后者修改持久配置；两者要分别验证。
  extra: 只做 permanent 不会自动改变当前 runtime，除非 reload。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::comparison
  - priority::P0
- id: RHCSA-33-T02-QA-010
  type: qa
  question: 本机 curl 8082 失败时，下一条证据优先看什么？
  answer: 先看 httpd 配置语法、unit 日志和 `ss` 监听，再看 AVC；不要先调整远端路由。
  extra: 失败层仍在本机服务链。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T02-QA-011
  type: qa
  question: httpd 日志没有明显错误但启动失败，怀疑 SELinux 时用什么证据？
  answer: '`ausearch -m AVC -ts recent`，并结合文件/端口上下文。'
  extra: 不要直接关闭 SELinux。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T02-QA-012
  type: qa
  question: 为什么远端 curl 是最终功能证据的一部分？
  answer: 它同时经过监听、主机防火墙和网络路径，覆盖本机 curl 无法证明的层。
  extra: 仍需确保请求的是正确内容。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::network-task
  - card::boundary
  - priority::P0
- id: RHCSA-33-T03-QA-001
  type: qa
  question: 确认 `/dev/vdb` 是否被挂载或属于 LVM 的核心命令是什么？
  answer: 结合 `lsblk`、`blkid`、`findmnt --source /dev/vdb` 和 `pvs`。
  extra: 单看 lsblk 的 MOUNTPOINT 不足。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::command
  - priority::P0
- id: RHCSA-33-T03-QA-002
  type: qa
  question: 发现 `/dev/vdb` 有未知签名时应如何处理？
  answer: 停止写入并确认题目、签名类型和是否有需保留数据；不能默认运行 `wipefs -a`。
  extra: 这是存储证据门。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::boundary
  - priority::P0
- id: RHCSA-33-T03-QA-003
  type: qa
  question: 创建 GPT 全盘分区的命令骨架是什么？
  answer: '`parted -s /dev/vdb mklabel gpt`，再 `parted -s /dev/vdb mkpart primary 1MiB 100%`。'
  extra: 随后 `partprobe` 和 `udevadm settle`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::command
  - priority::P0
- id: RHCSA-33-T03-QA-004
  type: qa
  question: 创建 vgexam、1G lvdata 和 256M lvswap 的命令顺序是什么？
  answer: '`pvcreate /dev/vdb1` → `vgcreate vgexam /dev/vdb1` → 两次 `lvcreate`。'
  extra: 每层后用 pvs/vgs/lvs 核对。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::command
  - priority::P0
- id: RHCSA-33-T03-QA-005
  type: qa
  question: '`mkfs.xfs` 与 `lvcreate` 分别改变什么对象？'
  answer: '`lvcreate` 创建块设备 LV；`mkfs.xfs` 在该块设备上创建文件系统结构。'
  extra: LV 存在不等于可挂载文件系统存在。
  source:
  - RHCSA-33 lecture
