- id: RHCSA-33-T06-QA-003
  type: qa
  question: 进入重启前，存储对象至少应满足哪些状态？
  answer: 设备和 UUID 正确、`findmnt --verify` 通过、`mount -a`/`swapon -a` 成功、没有误改其他 fstab 行。
  extra: 这是启动关键证据门。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::verification
  - priority::P0
- id: RHCSA-33-T06-QA-004
  type: qa
  question: 重启后为什么应按矩阵复查而不是重新执行配置命令？
  answer: 复查能发现持久性缺口；重新执行命令会掩盖“开机未自动恢复”的问题。
  extra: 只有定位到缺失状态后才做最小修复。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::process
  - priority::P0
- id: RHCSA-33-T06-QA-005
  type: qa
  question: 系统重启后 httpd 未启动，直接再次 `systemctl start` 会掩盖什么？
  answer: 会掩盖 enabled、依赖或启动时配置问题，无法证明自动启动终态。
  extra: 先查 `is-enabled` 和本次启动 journal。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::boundary
  - priority::P0
- id: RHCSA-33-T06-QA-006
  type: qa
  question: 考试结束前如何处理无法完成远端验证的任务？
  answer: 记录已通过层、阻塞原因、下一条证据；在环境恢复后优先补功能层。
  extra: 不能凭本机成功宣称完整完成。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::process
  - priority::P0
- id: RHCSA-33-T06-QA-007
  type: qa
  question: 最终证据矩阵对真实工作有什么迁移价值？
  answer: 它记录初始状态、变更、证明边界、回归和剩余风险，可用于维护窗口、交接和后续自动化测试。
  extra: 自动化实现属于 RHCE。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
