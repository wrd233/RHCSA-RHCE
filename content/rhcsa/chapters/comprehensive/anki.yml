notes:
- id: RHCSA-COMPREHENSIVE-QA-001
  type: qa
  question: RHCSA 综合题首先应建立什么？
  answer: 对象依赖图、共享影响表和高风险操作队列。
  extra: 不从最长命令开始。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-002
  type: qa
  question: 为什么网络与名称解析通常先于仓库/NFS/SSH？
  answer: 后三者依赖可达地址和解析。
  extra: 修改网络仍需恢复路径。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::concept
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-003
  type: qa
  question: 综合题的三列证据是什么？
  answer: 当前状态、持久配置、最终功能。
  extra: 每项要求分别映射。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-004
  type: qa
  question: 共享对象修改后为什么要回归？
  answer: 后续端口、路径、组或服务变化可能破坏已完成题。
  extra: 记录相关题号。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::diagnosis
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-005
  type: qa
  question: 高风险存储操作的证据门是什么？
  answer: 设备身份、签名/归属、已有数据、目标与恢复条件。
  extra: 不足时停止写入。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-006
  type: qa
  question: 最终检查应从哪里开始？
  answer: 从题目原文逐项反查对象和证据。
  extra: 不是从命令历史。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::verification
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-007
  type: qa
  question: 重启前最少检查什么？
  answer: 网络持久 profile、fstab verify/mount、关键服务语法和恢复入口。
  extra: 重启不是通用排错。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::verification
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-008
  type: qa
  question: 服务综合验收包含哪些层？
  answer: 包/配置语法、active/enabled、监听、安全层、协议功能。
  extra: 局部成功不替代整体。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-009
  type: qa
  question: 存储综合验收包含哪些层？
  answer: 设备/LVM、文件系统、当前挂载、fstab、容量和数据。
  extra: Swap 另查 swapon。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-010
  type: qa
  question: 容器综合验收包含哪些层？
  answer: 镜像、实例、端口、卷/数据、user unit、linger、HTTP。
  extra: rootless 身份一致。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::process
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-011
  type: qa
  question: 卡题时应记录什么？
  answer: 已证实层、缺失证据、最后错误和共享影响。
  extra: 保留现场。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - card::diagnosis
  - priority::P0
- id: RHCSA-COMPREHENSIVE-QA-012
  type: qa
  question: 综合任务完成的判据是什么？
  answer: 所有要求都有对象正确、功能成立且持久状态一致的证据。
  extra: 命令执行过不等于完成。
  source:
  - RHCSA9-Mock
  - RH124-RHEL9
  - RH134-RHEL9
