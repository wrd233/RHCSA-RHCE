- id: RHCSA-33-K03-QA-008
  type: qa
  question: 重启门的核心问题是什么？
  answer: 启动关键配置是否已静态和当前验证，持久状态是否完整，失败后是否有控制台或恢复路径。
  extra: 重启不是“碰碰运气”。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
