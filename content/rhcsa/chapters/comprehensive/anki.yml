- id: RHCSA-33-O01-QA-002
  type: qa
  question: 确认某路径实际属于哪个挂载对象，用什么命令？
  answer: '`findmnt -T /path`。'
  extra: 可发现路径被其他文件系统覆盖。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
