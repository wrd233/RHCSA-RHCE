  - priority::P0
- id: RHCSA-33-T03-QA-007
  type: qa
  question: 数据文件系统使用 UUID 的 fstab 行骨架是什么？
  answer: '`UUID=<真实UUID> /srv/data xfs defaults 0 0`。'
  extra: 追加前检查重复 UUID 和挂载点。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T03-QA-008
  type: qa
  question: Swap 使用 UUID 的 fstab 行骨架是什么？
  answer: '`UUID=<真实UUID> none swap defaults 0 0`。'
  extra: 当前状态用 `swapon -a` 和 `swapon --show` 验证。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T03-QA-009
  type: qa
  question: 为什么要先卸载 `/srv/data` 再执行 `mount -a`？
  answer: 这样能验证 fstab 条目而不是继续依赖原来的手工挂载。
  extra: 执行前确保没有进程占用。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T03-QA-010
  type: qa
  question: '`findmnt --verify --verbose` 在重启门中的作用是什么？'
  answer: 静态检查 fstab 引用、目标和选项问题，提前发现可能阻断启动的错误。
  extra: 它仍不能替代真实重启。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T03-QA-011
  type: qa
  question: '`lvs` 显示 1G，但 `df` 没有目标挂载，下一条证据是什么？'
  answer: 检查 `blkid` 是否有文件系统、`findmnt` 是否挂载到预期路径。
  extra: LV 容量与文件系统/挂载是不同层。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T03-QA-012
  type: qa
  question: XFS 文件系统能否通过常规 RHCSA 操作缩小？
  answer: 不能。XFS 支持增长，不支持原地缩小。
  extra: 容量规划错误时不能用缩小作为默认恢复。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::storage-task
  - card::boundary
  - priority::P1
- id: RHCSA-33-T04-QA-001
  type: qa
  question: autofs 间接 master map 的一行是什么？
  answer: '`/rhome /etc/auto.rhome`。'
  extra: 放在 `/etc/auto.master.d/*.autofs`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T04-QA-002
  type: qa
  question: 使用通配符把 `/rhome/remote1` 映射到 NFS home 的 map 行骨架是什么？
  answer: '`* -fstype=nfs4,rw nfs.lab.example.com:/exports/home/&`。'
  extra: '`&` 替换为被访问的 key。'
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T04-QA-003
  type: qa
  question: 为什么 autofs 验收要先访问具体 key？
  answer: autofs 按访问触发；未触发时没有 NFS 挂载是正常现象。
  extra: 访问后再用 `findmnt -T`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T04-QA-004
  type: qa
  question: 静态查看 autofs 合并映射的命令是什么？
  answer: '`automount -m`。'
  extra: 它能发现 map 解析和加载结构问题。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::command
  - priority::P0
- id: RHCSA-33-T04-QA-005
  type: qa
  question: chronyd active 与时间同步有效有什么区别？
  answer: active 只表示 daemon 运行；有效同步还需来源可达、被选择并有合理 tracking 状态。
  extra: 用 `chronyc sources -v` 和 `tracking`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::comparison
  - priority::P0
- id: RHCSA-33-T04-QA-006
  type: qa
  question: '`chronyc sources -v` 中指定源持续显示 `^?` 通常意味着什么？'
  answer: 该源当前不可选择或没有有效测量，应调查名称解析、网络、端口和源响应。
  extra: 不能仅靠重启 chronyd。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::output
  - priority::P1
- id: RHCSA-33-T04-QA-007
  type: qa
  question: '`/etc/cron.d` 条目与用户 crontab 的关键语法差异是什么？'
  answer: '`/etc/cron.d` 在五个时间字段后必须包含执行用户字段。'
  extra: 漏写用户会使条目无效或被误解析。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T04-QA-008
  type: qa
  question: 每周三 15:30 由 root 运行脚本的 cron 行是什么？
  answer: '`30 15 * * 3 root /usr/local/sbin/rhcsa33-health`。'
  extra: 在 `/etc/cron.d` 中使用绝对路径。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T04-QA-009
  type: qa
  question: 为什么计划脚本应显式设置 PATH？
  answer: cron 环境比交互 Shell 精简，依赖用户 profile 或相对路径会产生手工成功、调度失败。
  extra: 还应明确 HOME/SHELL 或使用绝对路径。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::process
  - priority::P0
- id: RHCSA-33-T04-QA-010
  type: qa
  question: 手工在 `env -i` 下运行脚本能证明什么？
  answer: 证明脚本在精简环境中可执行并产生预期产物；不能证明 cron 到点触发。
  extra: 真实调度仍需日志和产物时间证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T04-QA-011
  type: qa
  question: 按日志 tag 查询健康检查事件的命令是什么？
  answer: '`journalctl -t rhcsa33-health`。'
  extra: 可以加时间范围缩小证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::command
  - priority::P0
- id: RHCSA-33-T04-QA-012
  type: qa
  question: cron 文件存在但没有产物，下一条高区分度证据是什么？
  answer: 检查 crond journal、文件权限/SELinux、用户字段和脚本在精简环境中的执行。
  extra: 不要只重复 `systemctl restart crond`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::schedule-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T05-QA-001
  type: qa
  question: rootless 容器操作前如何确认当前确实是目标用户上下文？
  answer: 检查 `id`、`HOME`、`XDG_RUNTIME_DIR` 和 `podman info` 的存储路径。
  extra: '`sudo podman` 会切换到 rootful 对象。'
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::boundary
  - priority::P0
- id: RHCSA-33-T05-QA-002
  type: qa
  question: 为什么先运行临时手工容器再写 Quadlet？
  answer: 可以先隔离镜像、端口、卷和 SELinux 问题，避免把所有失败归因于 systemd generator。
  extra: 手工成功仍不代表持久状态完成。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::process
  - priority::P0
- id: RHCSA-33-T05-QA-003
  type: qa
  question: Podman 卷选项 `:Z` 的语义是什么？
  answer: 为该容器私有地重新标记绑定目录，使 SELinux 容器域可访问。
  extra: 共享多个容器时需评估 `:z`，不要机械替换。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::parameter
  - priority::P1
- id: RHCSA-33-T05-QA-004
  type: qa
  question: Quadlet 中发布 8088 到容器 8080 的字段是什么？
  answer: '`PublishPort=8088:8080`。'
  extra: 写在 `[Container]`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T05-QA-005
  type: qa
  question: Quadlet 持久绑定 `/home/svcweb/site` 的字段是什么？
  answer: '`Volume=/home/svcweb/site:/var/www/html:Z`。'
  extra: 路径必须真实存在且属于目标用户。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T05-QA-006
  type: qa
  question: 用户 Quadlet 开机关联 default target 的配置是什么？
  answer: 在 `[Install]` 中写 `WantedBy=default.target`。
  extra: 生成 unit 可能显示 generated，不必机械执行 enable。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::configuration
  - priority::P0
- id: RHCSA-33-T05-QA-007
  type: qa
  question: 写入 Quadlet 后让用户 manager 重新读取的命令是什么？
  answer: '`systemctl --user daemon-reload`。'
  extra: 然后查询生成 unit 并 start。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::command
  - priority::P0
- id: RHCSA-33-T05-QA-008
  type: qa
  question: 为什么 Quadlet 生成 unit 的 `is-enabled` 结果不能只按 enabled/disabled 判断？
  answer: 生成 unit 可能显示 `generated`，启动关系来自 Quadlet 的 `[Install]` 和 generator。
  extra: 结合 default target 依赖和重启结果。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::comparison
  - priority::P1
- id: RHCSA-33-T05-QA-009
  type: qa
  question: 允许 `svcweb` 未登录时保留用户 manager 的命令是什么？
  answer: 由 root 执行 `loginctl enable-linger svcweb`。
  extra: 验证 `loginctl show-user svcweb -p Linger`。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::command
  - priority::P0
- id: RHCSA-33-T05-QA-010
  type: qa
  question: linger 完成后应进行什么功能验证？
  answer: 退出 svcweb 登录会话，再从其他会话访问 8088 并检查 user-status；最终还需重启验证。
  extra: 只查询 Linger=yes 不足。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::verification
  - priority::P0
- id: RHCSA-33-T05-QA-011
  type: qa
  question: 用户 unit 启动失败时最直接的日志入口是什么？
  answer: 在 svcweb 会话执行 `journalctl --user -u web33.service` 或 `systemctl --user status`。
  extra: root 的系统 journal 视图可能缺少用户上下文细节。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-T05-QA-012
  type: qa
  question: 如何区分容器持久运行与数据持久化？
  answer: 前者检查用户 unit/容器生命周期；后者修改 host 数据并在容器重建或重启后确认仍可读取。
  extra: 二者必须分别验证。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::container-task
  - card::verification
  - priority::P0
- id: RHCSA-33-D01-QA-001
  type: qa
  question: 证据式诊断的六步链路是什么？
  answer: 症状 → 当前证据 → 假设 → 下一条高区分度证据 → 最小修复 → 再验证。
  extra: 不要用随机命令替代假设区分。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::process
  - priority::P0
- id: RHCSA-33-D01-QA-002
  type: qa
  question: 服务 active、本机监听存在，但远端超时。下一条证据优先是什么？
  answer: active zone、runtime/permanent firewalld、接口归属和网络路径。
  extra: 应用层已获得较强正证据。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-D01-QA-003
  type: qa
  question: fstab 修正后当前挂载仍正确，为什么不能立即重启？
  answer: 还需 `findmnt --verify`、重新通过 `mount -a`、核对其他 fstab 条目并确保恢复入口。
  extra: 当前手工挂载可能掩盖错误。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-D01-QA-004
  type: qa
  question: 新建 ACL 后 auditor 读取失败，最小修复前先看什么？
  answer: 父目录遍历权限、ACL mask 和实际文件 ACL。
  extra: 不要扩大为 chmod 777。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-D01-QA-005
  type: qa
  question: Quadlet 指向错误目录时，最小修复是什么？
  answer: 修正 `Volume=` 路径，确认目录/标签，`daemon-reload` 并重启该用户 unit，再做数据和退出登录回归。
  extra: 不需要删除用户或重新安装 Podman。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-33-D01-QA-006
  type: qa
  question: 看到 SELinux AVC 后为什么不能直接 `setenforce 0`？
  answer: AVC 是策略证据，应定位文件类型、端口类型或 Boolean；关闭 SELinux破坏题目限制和安全边界。
  extra: 修复后保持 Enforcing。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::boundary
  - priority::P0
- id: RHCSA-33-D01-QA-007
  type: qa
  question: 修复共享网络 profile 后应回归哪些典型任务？
  answer: 仓库、DNS/NSS、NFS/autofs、远端 HTTP、镜像仓库和 SSH 可达性。
  extra: 以实际依赖图为准。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::process
  - priority::P0
- id: RHCSA-33-D01-QA-008
  type: qa
  question: 最终矩阵中的 pending 与 blocked 有什么区别？
  answer: pending 表示尚未执行但可继续；blocked 表示缺少前置条件或安全证据，当前不应推进。
  extra: 两者都不能写 verified。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::diagnosis
  - card::output
  - priority::P0
- id: RHCSA-33-T06-QA-001
  type: qa
  question: 最终检查的第一项是什么？
  answer: 重新读取原始题目，为每个要求和限制找到对应证据矩阵行。
  extra: 不要只检查自己记得做过的任务。
  source:
  - RHCSA-33 lecture
  - RH124/RH134
  - relevant RHEL 9 man pages
  tags:
  - exam::rhcsa
  - chapter::comprehensive
  - topic::final-check
  - card::process
  - priority::P0
- id: RHCSA-33-T06-QA-002
  type: qa
  question: 进入重启前，网络对象至少应满足哪些状态？
  answer: 正确 profile 当前可用、autoconnect 持久、地址/路由/DNS正确，并保留控制台恢复入口。
  extra: 依赖网络的服务应已回归。
