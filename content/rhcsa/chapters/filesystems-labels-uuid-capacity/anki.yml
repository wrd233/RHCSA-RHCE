- id: RHCSA-23-K05-QA-001
  type: qa
  question: ext4 缩小的文件系统层标准顺序是什么？
  answer: 卸载 → `e2fsck -f <DEVICE>` → `resize2fs <DEVICE> <TARGET_SIZE>`。
  extra: 若还要缩底层容器，必须在文件系统成功缩小后进行。
