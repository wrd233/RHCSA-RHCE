- id: RHCSA-23-K03-QA-009
  type: qa
  question: 修改 LABEL 或 UUID 后为什么运行 `udevadm settle`？
  answer: 等待 udev 完成属性变化和相关设备链接更新。
  extra: 避免下一条命令仍读取旧属性。
