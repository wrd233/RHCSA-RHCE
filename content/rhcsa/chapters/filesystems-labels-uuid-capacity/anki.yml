- id: RHCSA-23-K02-QA-001
  type: qa
  question: RHEL 9 默认本地文件系统语境通常偏向哪一种类型？
  answer: XFS。
  extra: 仍必须服从题目指定类型，并读取现有系统的真实 `FSTYPE`。
  source:
  - RH124-RHEL9
  - RH134-RHEL9
