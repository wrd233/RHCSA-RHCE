  type: qa
  question: 底层块设备已扩大而文件系统容量未变，下一步最有区分度的证据是什么？
  answer: 确认挂载源和 FSTYPE，并比较 `lsblk` 与 `df -B1 -T`。
  extra: 据类型选择 `xfs_growfs` 或 `resize2fs`。
