- id: RHCSA-23-K02-QA-007
  type: qa
  question: '`fsck.xfs` 返回 0 能证明 XFS 已完成元数据检查吗？'
  answer: 不能。RHEL 9 中它是兼容占位程序，会直接成功退出。
  extra: 离线只读检查使用 `xfs_repair -n`。
  source:
  - RHEL9-Managing-File-Systems
