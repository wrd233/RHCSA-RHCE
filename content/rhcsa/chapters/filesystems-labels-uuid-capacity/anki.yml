  question: '`df` 显示大量已用空间，而 `du -shx` 汇总明显较小，优先检查什么？'
  answer: 已删除但仍被进程打开的文件。
  extra: 可使用 `lsof +L1`，同时考虑权限遗漏、元数据和被挂载遮蔽的数据。
