  question: 重新格式化后外部配置报旧 UUID 不存在，最小修复是什么？
  answer: 用 `blkid`/`lsblk -f` 读取当前 UUID，并修正外部引用。
  extra: 不要再格式化；fstab 的完整验证归下一章。
