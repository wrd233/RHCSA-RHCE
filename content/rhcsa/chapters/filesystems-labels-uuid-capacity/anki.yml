- id: RHCSA-23-K03-QA-008
  type: qa
  question: 使用显式新 UUID 修改文件系统身份的安全命令骨架是什么？
  answer: 先 `NEW_UUID=$(uuidgen)`；XFS 用 `xfs_admin -U "$NEW_UUID" <DEVICE>`，ext4 用 `tune2fs -U "$NEW_UUID" <DEVICE>`。
  extra: XFS 先卸载；修改后运行 `udevadm settle` 并重新查询。
  source:
