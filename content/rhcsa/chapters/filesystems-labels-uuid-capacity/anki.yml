  question: 为什么扩容现有 XFS 时不能再次执行 `mkfs.xfs`？
  answer: 因为它会重新创建文件系统并破坏现有数据。
  extra: 扩容使用 `xfs_growfs`，不是 `mkfs.xfs`。
