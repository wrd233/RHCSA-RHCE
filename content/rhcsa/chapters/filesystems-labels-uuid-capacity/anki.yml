  type: qa
  question: 把未挂载 XFS 的 LABEL 改为 `ARCHIVE2`，命令是什么？
  answer: '```bash

    xfs_admin -L ARCHIVE2 <DEVICE>

    udevadm settle

    ```'
  extra: 修改后重新运行 `blkid` 和 `lsblk -f`。
