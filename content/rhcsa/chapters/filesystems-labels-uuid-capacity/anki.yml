  question: 为什么重新运行 `mkfs` 后旧 UUID 引用会失效？
  answer: 因为 `mkfs` 创建了新的文件系统实例和新的 UUID。
  extra: 应读取当前 UUID 并修正引用，而不是继续格式化。
