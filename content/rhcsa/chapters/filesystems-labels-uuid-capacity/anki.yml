  type: qa
  question: '`tune2fs -l` 中哪些字段可用于判断 ext4 容量与 inode 状态？'
  answer: '`Block count`、`Free blocks`、`Block size`、`Inode count` 和 `Free inodes`。'
  extra: LABEL、UUID 和 state 也可从该输出读取。
  source:
