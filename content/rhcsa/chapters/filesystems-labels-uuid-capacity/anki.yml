- id: RHCSA-23-K01-QA-008
  type: qa
  question: 为什么不能长期依赖 `/dev/vdX` 或 `/dev/sdX` 的枚举顺序识别文件系统？
  answer: 设备枚举路径可能随硬件、启动或连接顺序变化。
  extra: 写操作前重新核对路径、容量、父设备、类型、LABEL 和 UUID。
  source:
