  type: qa
  question: 文件系统诊断的证据推进链是什么？
  answer: 症状 → 当前证据 → 假设 → 最有区分度的下一条证据 → 最小修复 → 再验证。
  extra: 避免通过反复执行破坏性命令猜测。
