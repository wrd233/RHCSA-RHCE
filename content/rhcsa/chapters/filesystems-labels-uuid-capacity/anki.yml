  - priority::P0
- id: RHCSA-23-K02-QA-006
  type: qa
  question: XFS 与 ext4 的检查/修复工具分别是什么？
  answer: XFS 使用 `xfs_repair`；ext4 使用 `e2fsck`。
  extra: 两者的实际检查都应以未挂载状态为基本边界。
  source:
  - RHEL9-Managing-File-Systems
  - xfs_repair(8)
