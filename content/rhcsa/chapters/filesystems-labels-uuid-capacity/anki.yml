  type: qa
  question: 一个文件 `ls -lh` 显示 100G，而 `du -h` 很小，最可能说明什么？
  answer: 它可能是稀疏文件，逻辑长度大但实际分配块少。
  extra: 用 `du --apparent-size` 交叉判断。
