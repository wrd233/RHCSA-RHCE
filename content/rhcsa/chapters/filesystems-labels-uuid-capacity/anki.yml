- id: RHCSA-23-O02-QA-009
  type: qa
  question: 创建前发现目标已有文件系统和数据，下一步是什么？
  answer: 停止写操作，重新核对设备用途和任务边界。
  extra: 不要用 `wipefs -a` 或强制格式化消除证据。
