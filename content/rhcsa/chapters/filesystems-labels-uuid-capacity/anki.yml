- id: RHCSA-23-K02-QA-003
  type: qa
  question: XFS 与 ext4 的文件系统增长命令分别是什么？
  answer: XFS 使用 `xfs_growfs`；ext4 使用 `resize2fs`。
  extra: 增长前底层块设备必须已经提供新增空间。
  source:
  - RHEL9-Managing-File-Systems
