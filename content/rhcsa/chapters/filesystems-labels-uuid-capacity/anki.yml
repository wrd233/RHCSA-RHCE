  question: 把 ext4 的 LABEL 改为 `ARCHIVE2`，命令是什么？
  answer: '```bash

    tune2fs -L ARCHIVE2 <DEVICE>

    udevadm settle

    ```'
  extra: 随后读取实际 LABEL。
