- id: RHCSA-23-O01-QA-006
  type: qa
  question: '`xfs_info` 中 `bsize`、`blocks` 与 `agcount` 分别表示什么？'
  answer: '`bsize` 是文件系统块大小；`blocks` 是数据区块数；`agcount` 是 allocation group 数量。'
  extra: 具体值受设备大小、创建参数和工具版本影响。
