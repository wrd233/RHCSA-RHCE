- id: RHCSA-23-K05-QA-002
  type: qa
  question: 为什么不能先缩小分区或 LV，再缩小 ext4？
  answer: 会先截断文件系统可能仍在使用的块，导致损坏。
  extra: 顺序必须是文件系统在前、底层容器在后。
