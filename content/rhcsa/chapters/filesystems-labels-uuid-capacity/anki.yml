- id: RHCSA-FILESYSTEMS-QA-008
  type: qa
  question: 在 RHEL 9 管理边界中，XFS 与 ext4 的缩小能力有什么区别？
  answer: XFS 不支持受支持的原地缩小；ext4 可以在卸载、检查并满足容量条件时缩小。
  extra: ext4 必须先缩文件系统，再缩底层容器。
  source:
  - RH124-RHEL9
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems
  - resize2fs(8)
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::xfs-ext4
  - card::comparison
  - priority::P0
- id: RHCSA-23-K02-QA-005
  type: qa
  question: 已挂载 ext4 可以执行哪一种调整，而不能执行哪一种？
  answer: 可以在线增长；不能在线缩小。
  extra: 缩小前必须卸载并运行 `e2fsck -f`。
  source:
  - RHEL9-Managing-File-Systems
  - resize2fs(8)
  tags:
