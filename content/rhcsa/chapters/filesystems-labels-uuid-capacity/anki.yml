- id: RHCSA-23-K02-QA-002
  type: qa
  question: XFS 与 ext4 的专用信息查询命令分别是什么？
  answer: XFS 使用 `xfs_info`；ext4 常用 `tune2fs -l`（或 `dumpe2fs -h`）。
  extra: '`blkid` 和 `lsblk -f` 适合两者的基本身份查询。'
