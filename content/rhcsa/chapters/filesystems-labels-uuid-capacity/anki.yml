  question: 已有文件系统类型未知时，为什么不能先尝试 `xfs_growfs` 再尝试 `resize2fs`？
  answer: 工具必须与真实文件系统类型匹配；随机尝试不能建立正确作用对象和前置条件。
  extra: 先用 `lsblk -f`、`blkid` 或 `df -T` 确认类型。
