- id: RHCSA-23-K03-QA-006
  type: qa
  question: 修改 XFS LABEL 或 UUID 时，稳定前置边界是什么？
  answer: 先卸载该 XFS。
  extra: 已挂载设备不应直接使用 `xfs_admin` 修改这些属性。
