- id: RHCSA-23-K01-QA-009
  type: qa
  question: 在写操作前，哪条命令可同时展示设备路径、容量、类型、文件系统和挂载点？
  answer: '```bash

    lsblk -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,UUID,MOUNTPOINTS

    ```'
  extra: 仍需针对目标使用 `blkid` 等证据交叉确认。
  source:
