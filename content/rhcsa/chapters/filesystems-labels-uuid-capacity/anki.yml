- id: RHCSA-23-O02-QA-008
  type: qa
  question: 为什么不能用再次运行 `mkfs` 来扩大已有文件系统？
  answer: '`mkfs` 会创建新文件系统并破坏现有数据；增长应使用类型专用调整工具。'
  extra: XFS 用 `xfs_growfs`，ext4 用 `resize2fs`。
