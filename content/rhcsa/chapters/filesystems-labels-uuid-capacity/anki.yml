- id: RHCSA-23-O02-QA-006
  type: qa
  question: '`mkfs` 因发现已有签名而警告时，默认应立即加 `-f` 吗？'
  answer: 不应。先确认旧签名、数据价值、目标设备和题意。
  extra: 强制参数不能替代设备调查。
  source:
  - RH124-RHEL9
