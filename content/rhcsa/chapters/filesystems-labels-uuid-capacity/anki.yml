  question: 对候选设备执行 `mkfs` 前，最小调查链是什么？
  answer: '`lsblk` 核对路径/容量/层级 → `blkid` 查签名 → 查当前挂载和上层归属 → 确认无需保留数据。'
  extra: 任一证据冲突都应停止写操作。
