  type: qa
  question: '`blkid` 能识别签名但文件系统无法使用，是否应重新 `mkfs`？'
  answer: 不应。先检查类型、对象身份、挂载冲突、日志和离线检查结果。
  extra: 重新格式化会覆盖现有证据和数据。
