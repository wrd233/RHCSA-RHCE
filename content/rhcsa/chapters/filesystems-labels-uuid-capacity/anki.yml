  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::boundary
  - priority::P0
- id: RHCSA-23-K01-QA-007
  type: qa
  question: '`lsblk` 的设备 `SIZE` 已增加，而 `df` 仍显示旧容量，说明哪两层状态不同？'
  answer: 底层块设备容量已增加，但文件系统尚未接管新增空间。
  extra: 下一步先确认文件系统类型，再使用对应增长工具。
  source:
