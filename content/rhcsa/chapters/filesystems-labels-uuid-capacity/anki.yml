notes:
- id: RHCSA-23-K01-QA-001
  type: qa
  question: 从底层存储到可访问目录，块设备、文件系统和挂载关系的层级顺序是什么？
  answer: 块设备 → 文件系统实例 → 当前挂载关系 → 目录树。
  extra: 每层有独立状态和查询入口，不能用目录存在代替文件系统或挂载存在。
  source:
  - RH124-RHEL9
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::process
  - priority::P0
- id: RHCSA-23-K01-QA-002
  type: qa
  question: 块设备与文件系统分别提供什么？
  answer: 块设备提供可寻址块空间；文件系统在其上组织元数据、文件数据、空闲空间和身份属性。
  extra: 设备存在不代表已经有文件系统。
  source:
  - RH124-RHEL9
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::concept
  - priority::P0
- id: RHCSA-23-K01-QA-003
  type: qa
  question: '`mkfs.xfs /dev/vdb1` 的直接作用对象是什么？'
  answer: 命令最后指定的块设备 `/dev/vdb1`。
  extra: '`mkfs` 不会替你创建分区或判断目标是否安全。'
  source:
  - RH124-RHEL9
  - RH134-RHEL9
  - mkfs.xfs(8)
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::boundary
  - priority::P0
- id: RHCSA-23-K01-QA-004
  type: qa
  question: '`mkfs`、`mount` 与 `df` 分别处理哪一层？'
  answer: '`mkfs` 创建文件系统；`mount` 建立当前目录入口；`df` 读取已挂载文件系统容量。'
  extra: 挂载与 fstab 的完整语义归下一章。
  source:
  - RH124-RHEL9
  - RH134-RHEL9
  - mkfs(8)
  - mount(8)
  - df(1)
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-23-K01-QA-005
  type: qa
  question: '`lsblk` 能看到 `/dev/vdb1`，是否足以证明它已有可用文件系统？'
  answer: 不足。还要检查 `FSTYPE`、LABEL、UUID、签名、挂载和上层归属。
  extra: 块设备存在只证明内核识别到该设备。
  source:
  - lsblk(8)
  - blkid(8)
  - RH124-RHEL9
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::filesystems-labels-uuid-capacity
  - topic::object-model
  - card::diagnosis
  - priority::P0
- id: RHCSA-23-K01-QA-006
  type: qa
  question: '`lsblk -f` 中 `FSTYPE` 为空，是否足以证明设备可安全格式化？'
  answer: 不足。设备仍可能包含未识别数据、分区表或其他上层元数据。
  extra: 继续核对挂载、LVM/RAID/加密归属和题意。
  source:
  - lsblk(8)
  - blkid(8)
  - RH124-RHEL9
  - RH134-RHEL9
