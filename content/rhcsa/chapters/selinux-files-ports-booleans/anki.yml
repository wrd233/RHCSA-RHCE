- id: RHCSA-29-O01-QA-002
  type: qa
  question: '`restorecon` 的 `-n` 参数解决什么风险？'
  answer: 它只预览计划变更，不实际修改标签，便于在大目录上确认影响范围。
  extra: 预览发现意外子目录时，应先收窄规则或路径。
