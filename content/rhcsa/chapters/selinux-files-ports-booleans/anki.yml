- id: RHCSA-SELINUX-O02-QA-003
  type: qa
  question: 已经为 `/srv/site` 建立持久文件上下文规则，如何将规则应用到现有目录及其内容？
  answer: '```bash

    restorecon -Rv /srv/site

    ```'
  extra: '`restorecon` 根据策略和 fcontext 规则恢复当前标签。'
  source:
