- id: RHCSA-SELINUX-K03-QA-002
  type: qa
  question: 目录已标记为 `httpd_sys_rw_content_t`，能否证明 httpd 一定能写入？
  answer: 不能。普通 Unix 所有者、组和权限位也必须允许写入。
  extra: DAC 与 SELinux 两层都需要满足。
