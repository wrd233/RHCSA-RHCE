- id: RHCSA-SELINUX-O02-QA-002
  type: qa
  question: '`chcon` 与 `semanage fcontext` 的核心区别是什么？'
  answer: '`chcon` 修改当前标签；`semanage fcontext` 建立路径的持久标签规则。'
  extra: 最终持久配置通常还要运行 `restorecon` 应用规则。
