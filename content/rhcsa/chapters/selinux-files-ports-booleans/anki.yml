- id: RHCSA-29-K02-QA-002
  type: qa
  question: '`ls -Z` 显示 `httpd_sys_content_t`，为什么仍不能证明配置是持久的？'
  answer: 因为当前标签可能由 `chcon` 等直接修改，未必存在对应 fcontext 规则。
  extra: 再次 `restorecon` 或重标记时可能被默认规则覆盖。
