- id: RHCSA-29-K01-QA-001
  type: qa
  question: 已经确认 SELinux 参与拒绝时，文件上下文、端口类型和 Boolean 分别处理什么对象？
  answer: 文件上下文处理路径对象的用途；端口类型处理协议与端口；Boolean 处理策略预先定义的可选业务行为。
  extra: 三者是不同策略入口，不能互相替代。
