- id: RHCSA-SELINUX-C01-QA-001
  type: qa
  question: 综合处理“自定义 Web 目录 + 非标准端口 + Enforcing”任务时，应拆分哪些主要目标状态？
  answer: SELinux 当前/持久模式、文件规则/当前标签、端口类型、服务 active/enabled、实际监听、防火墙和最终访问。
  extra: 每一项都需要独立证据，不能由局部成功代替。
