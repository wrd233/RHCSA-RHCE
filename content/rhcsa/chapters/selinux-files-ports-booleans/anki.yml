- id: RHCSA-SELINUX-K03-QA-001
  type: qa
  question: '`httpd_sys_content_t` 与 `httpd_sys_rw_content_t` 的核心差异是什么？'
  answer: 前者用于 Web 服务读取内容；后者用于确实需要由 Web 服务读写的内容。
  extra: 只给需要写入的小目录可写类型，避免扩大权限范围。
