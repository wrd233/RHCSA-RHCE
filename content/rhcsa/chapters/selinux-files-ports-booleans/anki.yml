- id: RHCSA-SELINUX-C01-QA-002
  type: qa
  question: '`systemctl is-enabled httpd` 返回 `enabled`，能否证明 Web 服务当前正在运行？'
  answer: 不能。`enabled` 只表示已配置开机启动，还要检查 `is-active`。
  extra: 当前状态与启动配置是两个维度。
