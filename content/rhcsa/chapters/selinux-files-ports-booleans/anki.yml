- id: RHCSA-29-K01-QA-004
  type: qa
  question: 为什么不应在看到 AVC 后立即用 `audit2allow` 生成本地策略模块？
  answer: 因为常见拒绝通常由错误标签、非标准端口或未配置的标准 Boolean 引起；直接生成规则可能掩盖误配置并扩大权限。
  extra: 先使用策略已经提供的标准入口。
