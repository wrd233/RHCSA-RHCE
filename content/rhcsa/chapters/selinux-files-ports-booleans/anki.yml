  question: '`ls -Z`、`matchpathcon` 和 `semanage fcontext` 分别回答什么问题？'
  answer: '`ls -Z` 看当前标签；`matchpathcon` 看路径预期标签；`semanage fcontext` 看或维护持久路径规则。'
  extra: 三者应分开验证。
