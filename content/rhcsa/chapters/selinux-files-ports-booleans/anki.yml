  question: 经典任务中，为什么在最终验收前再次执行 `restorecon -Rv /srv/exam-site`？
  answer: 为了证明站点依赖的是持久 fcontext 规则，而不是一次临时标签修改。
  extra: 执行后应再次检查标签和页面访问。
