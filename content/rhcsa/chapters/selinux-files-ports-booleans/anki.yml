  type: qa
  question: 文件从用户家目录移动到 `/var/www/html` 后仍带有 `user_home_t`，应优先使用什么操作修复？
  answer: '```bash

    restorecon -v /var/www/html/<FILE>

    ```'
  extra: '`restorecon` 根据目标路径的默认规则恢复正确类型。'
