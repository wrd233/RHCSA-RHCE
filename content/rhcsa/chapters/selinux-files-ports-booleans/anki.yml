- id: RHCSA-SELINUX-O02-QA-004
  type: qa
  question: 为 `/srv/site` 及其后代路径建立持久的 `httpd_sys_content_t` 规则，推荐命令是什么？
  answer: '```bash

    semanage fcontext -a -t httpd_sys_content_t ''/srv/site(/.*)?''

    ```'
  extra: 添加后仍需执行 `restorecon -Rv /srv/site`。
  source:
