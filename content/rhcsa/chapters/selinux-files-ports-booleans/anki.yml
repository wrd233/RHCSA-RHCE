  type: qa
  question: AVC 指向文件 `read` 或目录 `search`，且目标路径位于自定义目录。下一步最有区分度的证据是什么？
  answer: 比较该路径的当前标签、`matchpathcon` 预期标签和本地 fcontext 规则。
  extra: 不要先改端口或盲开 Boolean。
