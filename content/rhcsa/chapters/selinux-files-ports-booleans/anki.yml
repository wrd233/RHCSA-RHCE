- id: RHCSA-SELINUX-C01-QA-004
  type: qa
  question: 在自定义 Web 服务任务中，`curl` 请求成功能否单独证明配置可跨重启保持？
  answer: 不能。还需验证 SELinux 持久模式、fcontext 规则、端口映射和服务 enabled 状态。
  extra: 功能验证与持久性验证不能合并成一个结论。
