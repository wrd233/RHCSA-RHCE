- id: RHCSA-29-K02-QA-003
  type: qa
  question: 把 `chcon` 描述为“重启后必定失效”为什么不准确？
  answer: '`chcon` 修改的当前标签通常可跨普通重启保留；真正问题是它没有建立路径默认规则，可能被 `restorecon`、重标记或对象重建覆盖。'
  extra: 考试最终配置仍应使用 fcontext 规则配合 `restorecon`。
