  question: 删除 fcontext 规则后，怎样安全让现有对象回到新的默认状态？
  answer: 先用 `matchpathcon` 查询删除后的预期，再用 `restorecon -nRv` 预览，确认后执行 `restorecon -Rv`。
  extra: 删除规则和修改当前标签是两个动作。
