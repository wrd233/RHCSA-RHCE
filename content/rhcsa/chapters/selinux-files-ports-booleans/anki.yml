  type: qa
  question: 两条本地 fcontext 正则都能匹配同一路径时，为什么不能只凭“更具体”判断优先级？
  answer: 本地规则按较新的记录优先检查，第一条匹配项生效；应以 `matchpathcon` 对具体路径的结果为准。
