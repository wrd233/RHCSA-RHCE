  question: '`restorecon -Rv` 后没有标签变化，第一步应判断什么？'
  answer: 判断当前标签是否本来就与 `matchpathcon` 的预期一致。
  extra: 没有变化可能是正常结果，不应为了制造输出而先用 `chcon`。
