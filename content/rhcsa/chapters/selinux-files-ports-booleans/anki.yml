  type: qa
  question: 已知 httpd 因绑定 TCP 82 失败，AVC 显示 `name_bind`，推荐的下一步调查是什么？
  answer: 查询 TCP 82 当前的 SELinux 端口类型和 `http_port_t` 映射。
  extra: 根据已有记录决定新增或修改。
