- id: RHCSA-SELINUX-O02-QA-005
  type: qa
  question: 在 `'/srv/site(/.*)?'` 中，`(/.*)?` 的直观作用是什么？
  answer: 让规则除匹配目录本身外，也匹配其下的文件和子目录。
  extra: 单引号用于把整个路径表达式原样交给命令处理。
