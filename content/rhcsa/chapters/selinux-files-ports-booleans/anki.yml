  type: qa
  question: 站点只有 `/srv/site/uploads` 需要 Web 进程写入，最小授权的标签设计是什么？
  answer: 站点主体使用只读 `httpd_sys_content_t`，仅上传子目录使用 `httpd_sys_rw_content_t`。
  extra: 还必须满足普通权限和 ACL。
