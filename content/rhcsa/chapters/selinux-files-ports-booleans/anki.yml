- id: RHCSA-SELINUX-C01-QA-005
  type: qa
  question: 已知服务 active、防火墙允许 82/tcp，但访问自定义目录仍返回 403，系统为 Enforcing。下一步优先检查什么？
  answer: 检查近期 AVC、路径预期标签和当前文件标签。
  extra: 重点判断目标文件是否属于 Web 服务可访问的类型。
