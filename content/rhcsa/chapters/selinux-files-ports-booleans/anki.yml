  question: AVC 中出现 `denied { name_bind }`、`comm="httpd"` 和 `tclass=tcp_socket`，下一步优先检查什么？
  answer: 检查目标端口当前的 SELinux 端口类型及 `http_port_t` 映射。
  extra: 不应跳过查询直接反复新增端口规则。
