  type: qa
  question: 进程命令名是 `httpd`，能否直接认定它运行在 `httpd_t`？
  answer: 不能，应使用 `ps -Z` 查看进程当前上下文。
  extra: 命令名不等于 domain；异常启动方式可能导致未进入预期 domain。
