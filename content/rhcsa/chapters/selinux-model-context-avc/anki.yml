  question: 经典任务中，为什么要同时执行 `ls -Zd /srv/exam-site` 和 `ls -lZ /srv/exam-site/index.html`？
  answer: 分别记录目录对象和目标文件的当前上下文，避免遗漏目录 class 的拒绝。
  extra: 二者仍不能证明持久 fcontext 规则存在。
