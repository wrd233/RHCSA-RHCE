- id: RHCSA-SELINUX-K01-QA-001
  type: qa
  question: 普通 Unix 权限允许一次访问时，为什么 RHEL 9 仍可能拒绝它？
  answer: 因为 SELinux 会在 DAC 允许之后继续按安全策略检查进程域、目标对象类型、对象类别和请求行为。
  extra: DAC 拒绝时 SELinux 不替它放行；DAC 允许也不代表 SELinux 一定允许。
  source:
  - RH134
  - RHEL9-Using-SELinux-1.1
