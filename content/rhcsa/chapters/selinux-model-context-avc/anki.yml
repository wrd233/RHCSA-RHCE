- id: RHCSA-28-K01-QA-006
  type: qa
  question: RHEL 常见 `targeted` policy 的名称能否证明所有进程都受到相同强度的限制？
  answer: 不能。不同 domain 的允许集合不同，某些进程可能处于较宽松的 unconfined domain。
  extra: 策略名说明加载的 policy，不替代 `ps -Z` 对目标进程的观察。
