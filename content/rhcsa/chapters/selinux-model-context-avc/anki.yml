- id: RHCSA-28-K03-QA-009
  type: qa
  question: 怎样把一条长 AVC 翻译成一句可操作的判断？
  answer: 写成“source domain 对 target type:class 请求 permission，被策略拒绝”，再补充业务对象和模式。
  extra: 例如：`httpd_t` 对 `var_t:file` 请求 `open/read`，在 enforcing 路径被拒绝。
  source:
