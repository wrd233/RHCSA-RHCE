- id: RHCSA-28-O01-QA-005
  type: qa
  question: 切到 Permissive 后同一业务错误仍存在，最稳妥的结论是什么？
  answer: 当前症状不是只靠取消 SELinux 拒绝就能消失，应优先检查其他层。
  extra: 仍可保留和分析相关 AVC，因为系统可能同时存在多个偏差。
