- id: RHCSA-SELINUX-K04-QA-001
  type: qa
  question: '`audit2why` 在 SELinux 排错中的合适定位是什么？'
  answer: 它是帮助解释 AVC 拒绝原因的辅助工具，输出是线索而不是绝对结论。
  extra: 仍需结合上下文、标准策略入口和业务目标判断。
