- id: RHCSA-28-O03-QA-002
  type: qa
  question: '`ausearch -ts recent` 解决什么问题？'
  answer: 限制查询开始时间，减少旧事件干扰，使结果更接近刚刚重新触发的动作。
  extra: 复杂调查可使用明确日期时间，但仍应先记录复现时刻。
