  type: qa
  question: 已确认 SELinux policy 允许目标访问，能否直接宣布业务终态正确？
  answer: 不能。仍需验证应用配置、服务状态、监听、网络过滤和最终请求。
  extra: SELinux 允许只证明安全链中的一个局部状态。
