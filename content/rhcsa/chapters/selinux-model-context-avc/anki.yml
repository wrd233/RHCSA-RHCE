  question: SELinux user 与 Linux 登录用户是同一个身份字段吗？
  answer: 不是。Linux 用户参与 DAC；SELinux user 属于安全上下文并参与 MAC 身份映射。
  extra: 两者可有关联，但不能只凭用户名字符串互相推断。
