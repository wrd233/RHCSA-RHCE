  question: 看到管理员 Shell 为 `unconfined_t`，能否认为 SELinux 已关闭？
  answer: 不能。`unconfined_t` 是一个 domain；是否启用和当前模式应由 `getenforce` 或 `sestatus` 判断。
  extra: domain 与系统模式是独立维度。
