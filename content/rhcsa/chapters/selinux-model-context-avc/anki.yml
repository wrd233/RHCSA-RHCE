  type: qa
  question: '`ausearch -i` 与 `ausearch --raw` 的主要用途分别是什么？'
  answer: '`-i` 把部分字段解释为人类可读形式；`--raw` 保留原始记录供其他解析工具使用。'
  extra: 向 `audit2why` 传递时优先使用 raw 输出。
