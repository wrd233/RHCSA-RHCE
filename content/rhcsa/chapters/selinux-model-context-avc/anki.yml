- id: RHCSA-SELINUX-O01-QA-003
  type: qa
  question: '`setenforce 0` 改变什么，又不改变什么？'
  answer: 它把当前模式临时切到 Permissive，但不修改 `/etc/selinux/config` 中的持久模式。
  extra: 它也不能把 `Disabled` 的系统直接切回启用状态。
  source:
  - RH134
  - setenforce(8)
  - RHEL9-Using-SELinux-1.5
