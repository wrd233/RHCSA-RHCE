- id: RHCSA-28-D01-QA-005
  type: qa
  question: 一个可审计的 Permissive 诊断窗口至少应记录哪些内容？
  answer: 切换前模式、复现时间和动作、业务变化、新增 AVC、恢复 Enforcing 的时间，以及最终当前/持久模式。
  extra: 这样才能区分诊断变量与最终状态。
