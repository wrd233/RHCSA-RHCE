- id: RHCSA-SELINUX-O01-QA-006
  type: qa
  question: 题目要求 SELinux 当前和重启后都为 Enforcing，至少应分别验证哪两个状态？
  answer: 当前模式为 Enforcing；配置文件中的持久模式也为 Enforcing。
  extra: 可用 `sestatus` 同时观察两个维度，并用 `getenforce` 快速确认当前模式。
