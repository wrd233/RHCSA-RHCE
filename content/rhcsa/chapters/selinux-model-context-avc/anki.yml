- id: RHCSA-28-T01-QA-002
  type: qa
  question: 经典任务中，怎样取得 httpd 主 PID 并查看其 SELinux 上下文？
  answer: '```bash

    main_pid=$(systemctl show httpd.service -p MainPID --value)

    ps -Z -p "$main_pid"

    ```'
  extra: 若 MainPID 为 0，应先调查服务状态，不能继续假设进程存在。
