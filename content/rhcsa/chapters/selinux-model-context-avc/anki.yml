  disabled: false
  semantic_type: comparison
- id: RHCSA-SELINUX-O01-QA-004
  type: qa
  question: 服务在 `setenforce 0` 后恢复正常，能否认为 SELinux 问题已经修复？
  answer: 不能。这只说明 SELinux enforcement 参与了失败路径，仍需查看 AVC 并修正具体策略条件。
  extra: 最终要恢复题目要求的模式，并重新验证业务。
  source:
