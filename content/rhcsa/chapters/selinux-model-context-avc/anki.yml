- id: RHCSA-28-D01-QA-008
  type: qa
  question: 真实变更单中，SELinux 拒绝的最小证据包应包含哪些核心内容？
  answer: 复现时间、当前/持久模式、目标进程上下文、目标对象上下文、原始 Audit 事件、四元翻译、分类和下一步验证。
  extra: 避免只保存工具摘要而丢失原始 AVC。
