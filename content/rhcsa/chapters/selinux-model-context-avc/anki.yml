- id: RHCSA-SELINUX-K02-QA-002
  type: qa
  question: 查看近期 SELinux AVC 拒绝的核心命令是什么？
  answer: '```bash

    ausearch -m AVC,USER_AVC -ts recent -i

    ```'
  extra: 需要更完整时可加入 `SELINUX_ERR,USER_SELINUX_ERR`；无结果先重新触发并检查 Audit 链。
