- id: RHCSA-28-K01-QA-004
  type: qa
  question: '`chmod 777` 为什么不是 SELinux 拒绝的通用修复？'
  answer: 它只放宽 DAC 权限，不能改变 SELinux domain、type、class 与 permission 的策略决定。
  extra: 还会扩大普通权限范围，因此既可能无效也不安全。
