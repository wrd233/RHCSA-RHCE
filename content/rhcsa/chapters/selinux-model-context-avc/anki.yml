  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-28-O01-QA-004
  type: qa
  question: 为什么不应把 `SELINUX=disabled` 当作服务题的最终解法？
  answer: 它移除 SELinux 保护并使持久对象不被正常标记，今后重新启用还可能需要重新标记。
  extra: 应修正具体策略条件并保持题目要求的 Enforcing。
  source:
  - RHEL9-Using-SELinux-1.5
  - RHEL9-Using-SELinux-2.5
