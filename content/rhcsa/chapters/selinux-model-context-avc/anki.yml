  semantic_type: concept
- id: RHCSA-SELINUX-K01-QA-002
  type: qa
  question: 在 RHCSA 常见服务访问问题中，SELinux 安全上下文的哪个字段最需要优先关注？
  answer: '`type` 字段。'
  extra: 对进程而言 type 常称为 domain；对文件等对象而言，它描述策略用途。
  source:
