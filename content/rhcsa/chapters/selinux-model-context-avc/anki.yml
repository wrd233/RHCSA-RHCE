- id: RHCSA-SELINUX-K01-QA-004
  type: qa
  question: SELinux 安全上下文通常由哪四部分组成？
  answer: SELinux user、role、type 和 level/range。
  extra: RHCSA 服务题通常优先关注第三段 type，但不能把其他字段当作不存在。
