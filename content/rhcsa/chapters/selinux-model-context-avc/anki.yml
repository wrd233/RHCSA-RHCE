  question: 经典任务的 AVC 显示 `httpd_t`、`var_t`、`tclass=file`、`denied { open read }`。一句话结论是什么？
  answer: '`httpd_t` 对 `var_t:file` 请求 `open/read` 时被策略拒绝，问题应分类到文件上下文。'
