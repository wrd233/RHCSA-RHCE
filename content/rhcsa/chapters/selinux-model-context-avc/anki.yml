  question: Permissive 下页面成功且 AVC 显示 `httpd_t` 对 `var_t:file` 的 read 被拒绝，下一步应分类到哪里？
  answer: 持久文件上下文规则调查。
  extra: 本章先记录当前 type 和证据；第 29 章再建立规则并应用。
