- id: RHCSA-SELINUX-K02-QA-001
  type: qa
  question: Web 服务访问失败时，在深入 SELinux 前应先用证据确认哪些前置层？
  answer: 服务配置与状态、目标路径和普通权限、实际监听与请求路径，以及相关网络过滤层。
  extra: 各层回答不同问题，不能由“服务 active”一个结论代替。
