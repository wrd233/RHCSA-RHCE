- id: RHCSA-SELINUX-K04-QA-003
  type: qa
  question: SELinux 服务故障的通用证据推进骨架是什么？
  answer: 确认前置层 → 记录模式并重新触发 → 查 AVC → 识别 domain、type、class 和 permission → 分类标准入口 → 最小持久修复 → 恢复 Enforcing 并综合验证。
  extra: 已有可靠证据时可从中间切入，但不能跳过结论依赖的状态。
  source:
  - RH134
  - RHEL9-Using-SELinux-Chapter-5
  tags:
  - exam::rhcsa
  - chapter::selinux-model-context-avc
  - topic::evidence-first
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-SELINUX-EXTRA-QA-002
  type: qa
  question: '`Permissive` 与 `Disabled` 的关键区别是什么？'
  answer: Permissive 仍加载策略、维护标签并记录拒绝；Disabled 不加载策略，也不会正常维护持久对象标签。
  extra: 排错优先使用有限的 Permissive 诊断窗口，而不是 Disabled。
  source:
  - RHEL9-Using-SELinux-1.5
  tags:
  - exam::rhcsa
  - chapter::selinux-model-context-avc
  - topic::mode-state
