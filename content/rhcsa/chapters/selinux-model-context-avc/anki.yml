  type: qa
  question: 阅读一条 AVC 拒绝时，优先提炼哪三个核心对象和一个行为？
  answer: source domain、target type、object class，以及 denied permission。
  extra: 再用命令名、路径、PID、时间和事件序号关联业务动作。
