- id: RHCSA-SELINUX-K04-QA-002
  type: qa
  question: 为什么不应把 `audit2allow` 作为看到 AVC 后的第一修复手段？
  answer: 拒绝通常源于误标签或非标准目录、端口、行为未按已有策略配置；自动生成规则可能掩盖误配置并扩大权限。
  extra: 应先检查标准文件类型、端口类型、Boolean 和应用配置。
  source:
  - RHEL9-Using-SELinux-5.3
  - audit2allow(1)
  tags:
