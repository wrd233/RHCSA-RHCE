- id: RHCSA-28-D01-QA-003
  type: qa
  question: AVC 显示 `name_bind`、`tclass=tcp_socket`，为什么不应先改文件标签？
  answer: 拒绝对象是网络 socket 与端口绑定，不是文件/目录访问，应进入端口类型调查。
  extra: 根据 class 和 permission 选择配置入口。
