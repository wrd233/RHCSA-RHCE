- id: RHCSA-28-O03-QA-009
  type: qa
  question: '`audit2why` 建议可能需要允许规则时，下一步为什么仍要检查标准策略入口？'
  answer: 工具只分析现有拒绝；错误标签、端口或未启用的预置 Boolean 可能比新增 allow 规则更小、更正确。
  extra: 应先证明业务需求和标准入口不适用，才考虑自定义策略。
