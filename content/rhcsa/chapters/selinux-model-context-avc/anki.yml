  question: 经典任务中，当前为 Permissive、配置文件为 Enforcing。页面访问成功能证明什么？
  answer: 只能证明当前请求在未执行 SELinux 拒绝时可以继续；不能证明 Enforcing 下 policy 允许。
  extra: 还要收集 AVC 并恢复 Enforcing。
