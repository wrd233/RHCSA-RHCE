- id: RHCSA-28-T01-QA-006
  type: qa
  question: 经典任务的最终模式验收命令组是什么？
  answer: '```bash

    setenforce 1

    getenforce

    sestatus

    grep -E ''^[[:space:]]*SELINUX(=|TYPE=)'' /etc/selinux/config

    ```'
  extra: 目标是当前和持久均为 Enforcing；页面尚未修复应如实记录。
