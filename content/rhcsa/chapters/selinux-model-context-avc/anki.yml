- id: RHCSA-28-O03-QA-006
  type: qa
  question: '`ausearch` 没有结果时，第一轮应检查哪些条件？'
  answer: 是否重新触发、时间范围是否正确、`auditd` 是否运行，以及 Journal/内核消息是否有相关记录。
  extra: 只有这些检查后才考虑 dontaudit 等高级边界。
