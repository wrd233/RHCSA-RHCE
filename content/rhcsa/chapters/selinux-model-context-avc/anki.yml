- id: RHCSA-28-D01-QA-004
  type: qa
  question: 目标文件 type 看似正确，但业务需要 httpd 主动连接数据库，AVC 指向网络连接行为。应考虑哪类标准入口？
  answer: 检查策略是否提供与该业务语义匹配的 SELinux Boolean。
  extra: 不要盲目开启所有 httpd Boolean；完整操作归第 29 章。
