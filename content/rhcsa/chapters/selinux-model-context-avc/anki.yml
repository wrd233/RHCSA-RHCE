  question: 经典任务为什么禁止使用 `chcon`，即使它可能让页面暂时可访问？
  answer: 本任务只训练当前上下文和 AVC 证据；`chcon` 会改变当前标签且不能证明持久规则，容易污染诊断。
  extra: 持久修复在第 29 章完成。
