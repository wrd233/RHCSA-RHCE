- id: RHCSA-SELINUX-K01-QA-003
  type: qa
  question: '`httpd_t` 与 `httpd_sys_content_t` 分别描述什么？'
  answer: '`httpd_t` 是 httpd 进程域；`httpd_sys_content_t` 是适合由 Web 服务读取的内容对象类型。'
  extra: 策略还会结合对象类别和具体 permission 判断。
  source:
