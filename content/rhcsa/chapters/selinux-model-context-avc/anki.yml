- id: RHCSA-28-D01-QA-006
  type: qa
  question: 完成 AVC 分类后，为什么还要再次执行 `getenforce` 和 `sestatus`？
  answer: 确认诊断过程没有把系统遗留在 Permissive，并验证当前与持久模式都满足目标。
  extra: 模式恢复是独立验收项。
