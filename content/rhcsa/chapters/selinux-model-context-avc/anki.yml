  type: qa
  question: 为什么不建议第一轮直接用很多 PID、命令名和路径条件过度过滤 `ausearch`？
  answer: 命令名可能截断、PID 可能变化、路径信息可能位于配套记录，过度过滤会漏掉完整事件。
  extra: 先保留近期消息类型结果，再按事件序号缩小。
