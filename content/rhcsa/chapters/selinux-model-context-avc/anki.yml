- id: RHCSA-28-D01-QA-001
  type: qa
  question: 系统为 Enforcing，服务请求失败，但近期没有相关 AVC。下一条最有区分度的证据是什么？
  answer: 确认刚刚是否重新触发、查询时间范围和 `auditd` 状态，再查 setroubleshoot Journal 或内核消息。
  extra: 不要仅凭“无 AVC”立即关闭 SELinux或宣称 SELinux 无关。
