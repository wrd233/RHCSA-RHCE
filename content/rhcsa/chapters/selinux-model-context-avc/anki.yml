- id: RHCSA-28-K01-QA-001
  type: qa
  question: DAC、SELinux MAC 和应用自身授权分别回答什么问题？
  answer: DAC 判断 Linux 身份和传统权限；SELinux MAC 判断策略身份对目标类型/类别/行为是否允许；应用授权判断业务自身规则。
  extra: 三层都可能产生拒绝，不能互相替代。
  source:
  - RH134
  - selinux(8)
  - RHEL9-Using-SELinux-1.1
  tags:
