- id: RHCSA-28-O01-QA-001
  type: qa
  question: '`sestatus` 显示 `Current mode: permissive`、`Mode from config file: enforcing`，应怎样解读？'
  answer: 当前未执行 SELinux 拒绝，但配置文件计划下次按 Enforcing 启动。
  extra: 两个状态不一致，当前业务成功不能证明 Enforcing 下会成功。
  source:
  - sestatus(8)
  - RHEL9-Using-SELinux-2.1
  tags:
  - exam::rhcsa
  - chapter::selinux-model-context-avc
  - topic::mode-state
  - card::output
  - priority::P0
  model: RedHat-QA
  priority: P0
  disabled: false
  semantic_type: output
- id: RHCSA-28-O01-QA-002
  type: qa
  question: 系统为 `Disabled` 时，为什么 `setenforce 1` 不能直接启用 SELinux？
  answer: 因为没有加载 SELinux policy；`setenforce` 只在已启用状态下切换 Enforcing 与 Permissive。
  extra: 重新启用通常涉及持久配置、重启和可能的重新标记，属于启动恢复边界。
  source:
  - setenforce(8)
  - RHEL9-Using-SELinux-2.4
  tags:
  - exam::rhcsa
  - chapter::selinux-model-context-avc
  - topic::mode-state
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
  disabled: false
  semantic_type: boundary
- id: RHCSA-28-O01-QA-003
  type: qa
  question: Enforcing 与 Permissive 都会记录 AVC，它们的关键差异是什么？
  answer: Enforcing 执行不允许的拒绝；Permissive 记录本应发生的拒绝但允许操作继续。
  extra: Permissive 中可能出现更多后续 AVC，因为应用能继续执行。
  source:
  - RHEL9-Using-SELinux-1.5
  tags:
  - exam::rhcsa
  - chapter::selinux-model-context-avc
  - topic::mode-state
  - card::comparison
