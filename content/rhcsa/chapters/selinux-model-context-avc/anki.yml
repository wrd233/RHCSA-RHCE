  question: '`tclass=file` 与 `tclass=dir` 为什么不能忽略？'
  answer: 它们说明目标对象类别不同，允许集合和 permission 语义也可能不同。
  extra: 目录 `search` 与文件 `read` 是常见的两类独立拒绝。
