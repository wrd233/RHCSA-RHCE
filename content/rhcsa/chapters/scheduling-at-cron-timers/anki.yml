- id: RHCSA-15-O04-QA-007
  type: qa
  question: 为什么旧 cron 和新 timer 不应长期并行？
  answer: 可能造成重复执行、并发写入和负载峰值。
  extra: 验证窗口后应保留唯一调度入口。
  source:
