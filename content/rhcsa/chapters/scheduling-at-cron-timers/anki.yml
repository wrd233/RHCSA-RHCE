- id: RHCSA-15-O03-QA-012
  type: qa
  question: '`systemd-analyze verify` 无报错能证明业务脚本成功吗？'
  answer: 不能。它只做 unit 静态检查。
  extra: 手工启动 service 并检查 Result 与产物。
