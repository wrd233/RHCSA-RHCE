- id: RHCSA-15-O04-QA-004
  type: qa
  question: 使用 timer 选项调用 `systemd-run` 时，立即启动的是谁？
  answer: transient timer；service 到 timer 到期时才被触发。
  extra: 查询输出会给出两个 unit 名。
