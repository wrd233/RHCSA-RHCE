- id: RHCSA-15-K02-QA-001
  type: qa
  question: cron 中 `*/10` 表示“从任务创建时刻起每 10 分钟”吗？
  answer: 不是。它按该日历字段允许值的起点做步长匹配。
  extra: 需要从上次激活后计时可考虑 `OnUnitActiveSec=`。
