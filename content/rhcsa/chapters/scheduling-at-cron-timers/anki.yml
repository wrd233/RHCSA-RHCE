- id: RHCSA-15-O03-QA-013
  type: qa
  question: 为什么 timer active、service inactive 可能是正常状态？
  answer: timer 在等待；oneshot service 完成后会回到 inactive。
  extra: 应看最近 Result 和 LAST，而不是要求 service 持续 active。
