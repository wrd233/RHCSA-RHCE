- id: RHCSA-SERVICES-O04-QA-004
  type: qa
  question: 为什么 cron 命令应优先使用绝对路径并显式处理 stdout/stderr？
  answer: cron 的环境和交互 Shell 不同；绝对路径避免 PATH 歧义，显式重定向保留失败证据。
  extra: 命令静默退出不代表业务成功，仍需检查真实产物。
  source:
