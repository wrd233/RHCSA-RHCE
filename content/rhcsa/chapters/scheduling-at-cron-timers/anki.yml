- id: RHCSA-SERVICES-D01-QA-002
  type: qa
  question: 脚本在管理员终端手工成功，但由 cron 执行失败。下一条最有区分度的证据是什么？
  answer: 以目标用户在精简环境中直接运行同一绝对路径脚本，并保留 stderr 与退出码。
  extra: 例如使用 `sudo -u USER env -i HOME=... PATH=... SHELL=... /absolute/script`。
  source:
  - RH134 Ch.2
  - lecture.md#RHCSA-15-D01
  - cron(8)
