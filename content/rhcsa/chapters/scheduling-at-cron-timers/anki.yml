- id: RHCSA-15-O04-QA-009
  type: qa
  question: '`OnUnitActiveSec` 和 `OnUnitInactiveSec` 的关键区别是什么？'
  answer: 前者从目标 unit 上次激活计时；后者从上次变为 inactive 计时。
  extra: 任务运行时间较长时差异明显。
