- id: RHCSA-15-K01-QA-007
  type: qa
  question: timer 显示 `active (waiting)` 能证明同名 service 最近成功吗？
  answer: 不能。它只说明 timer 当前在等待触发。
  extra: 检查 service 的 `Result`、`ExecMainStatus`、journal 和产物。
  source:
