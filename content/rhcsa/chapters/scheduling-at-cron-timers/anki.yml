- id: RHCSA-15-K03-QA-004
  type: qa
  question: 为什么重复 timer 通常不搭配 `RemainAfterExit=yes` 的 oneshot service？
  answer: service 会在第一次完成后保持 active，后续 timer 到期不会再次启动它。
  extra: 周期脚本通常让 oneshot 完成后回到 inactive。
