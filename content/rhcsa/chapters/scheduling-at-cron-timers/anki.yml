  type: qa
  question: '`Persistent=true` 未立即补跑时，为什么先检查随机延迟？'
  answer: 补触发仍受 `RandomizedDelaySec=` 影响，可能尚在等待窗口内。
  extra: 还要确认是 OnCalendar timer。
