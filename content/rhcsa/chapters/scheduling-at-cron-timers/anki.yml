  type: qa
  question: 迁移完成后怎样检查是否还存在重复 cron 入口？
  answer: 搜索目标用户 crontab、`/etc/crontab`、`/etc/cron.d` 和只读 spool。
  extra: 同时用 `list-timers` 查 timer。
