- id: RHCSA-15-K01-QA-006
  type: qa
  question: '`crond.service` 为 active 能证明某条 cron job 成功吗？'
  answer: 不能。它只证明 cron daemon 当前运行。
  extra: 还要验证目标表、触发记录、执行输出和产物。
  source:
