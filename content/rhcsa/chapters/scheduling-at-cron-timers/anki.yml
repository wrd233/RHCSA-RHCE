- id: RHCSA-15-O03-QA-011
  type: qa
  question: '`systemd-analyze calendar` 成功能证明 timer 已加载吗？'
  answer: 不能。它只验证日历表达式。
  extra: 仍需 verify、daemon-reload、start/enable 和状态查询。
