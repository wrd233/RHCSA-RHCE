- id: RHCSA-15-D01-QA-007
  type: qa
  question: 脚本退出 0 但报告错误或缺失时，下一步是什么？
  answer: 检查脚本是否吞错、工作目录、目标路径、文件内容和更新时间。
  extra: systemd 或 cron 的“成功”不能代替业务验收。
