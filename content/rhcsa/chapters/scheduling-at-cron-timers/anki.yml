- id: RHCSA-15-D01-QA-006
  type: qa
  question: cron 有触发记录但命令失败时，应转向哪些证据？
  answer: 执行身份、环境、绝对路径、shebang、权限、SELinux、依赖和 stderr。
  extra: 这是执行层，而不是日历层。
