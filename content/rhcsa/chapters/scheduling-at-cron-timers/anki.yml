- id: RHCSA-15-D02-QA-002
  type: qa
  question: timer 为 waiting 但 NEXT 错误，下一步查什么？
  answer: 用 `systemd-analyze calendar` 核对表达式，并检查时区、随机延迟和精度窗口。
  extra: 不要先调查脚本业务逻辑。
