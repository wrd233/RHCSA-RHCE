- id: RHCSA-15-O04-QA-001
  type: qa
  question: 两分钟后临时运行命令的 systemd-run 骨架是什么？
  answer: '`systemd-run --unit=NAME --on-active=2min /absolute/command`。'
  extra: 会创建 transient timer 和 service。
