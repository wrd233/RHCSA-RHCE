- id: RHCSA-15-O04-QA-006
  type: qa
  question: 迁移 cron 到 timer 时，为什么不能先删除旧 cron？
  answer: 新 service/timer 可能尚未成功，先删除会造成任务中断。
  extra: 先验证新链路，再切换旧入口。
  source:
