- id: RHCSA-15-C01-QA-001
  type: qa
  question: 题目要求每周三 15:30 以 `monitor` 执行，且指定使用用户 crontab。核心条目是什么？
  answer: '`30 15 * * 3 /usr/local/libexec/web-health >> /var/log/web-health-cron.log 2>&1`。'
  extra: 在表头另设 SHELL、PATH、MAILTO；不要写用户字段。
