- id: RHCSA-15-O04-QA-002
  type: qa
  question: 创建 transient 日历 timer 使用什么选项？
  answer: '`--on-calendar="EXPRESSION"`。'
  extra: 它是 `OnCalendar=` 的命令行快捷方式。
