- id: RHCSA-SERVICES-O04-QA-006
  type: qa
  question: 计划任务定义已经存在，为什么仍不能宣布任务完成？
  answer: 定义存在不证明调度器运行、任务到点触发、命令成功退出或业务产物正确。
  extra: 至少分开验证定义、调度、执行和功能结果。
  source:
