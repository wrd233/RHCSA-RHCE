- id: RHCSA-SERVICES-O04-QA-002
  type: qa
  question: '`/etc/crontab` 或 `/etc/cron.d/*` 与用户 crontab 相比，多出的字段是什么？'
  answer: 在五个时间字段后多一个“执行用户”字段，然后才是命令。
  extra: 漏写用户会导致字段错位；把用户写进用户 crontab 会被当作命令正文。
