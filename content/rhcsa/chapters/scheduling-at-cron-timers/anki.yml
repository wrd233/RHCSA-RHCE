- id: RHCSA-15-O04-QA-005
  type: qa
  question: transient timer 能替代题目要求的重启后持久 timer 吗？
  answer: 不能。它没有持久 unit 文件，manager 或系统重启后不能按持久配置验收。
  extra: 应编写 `.service` 和 `.timer` 文件。
