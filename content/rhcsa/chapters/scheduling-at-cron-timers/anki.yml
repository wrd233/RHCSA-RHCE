- id: RHCSA-15-O04-QA-003
  type: qa
  question: 怎样为 transient timer 指定 `AccuracySec=1s`？
  answer: 增加 `--timer-property=AccuracySec=1s`。
  extra: timer 属性和 service 属性使用不同选项。
