- id: RHCSA-SERVICES-O04-QA-005
  type: qa
  question: 怎样提交、列出和删除一个 at 一次性任务？
  answer: 用 `at TIMESPEC` 提交，`atq` 列出，`atrm JOB_ID` 删除。
  extra: '`at -c JOB_ID` 可进一步审阅保存的脚本。'
  source:
  - RH134 Ch.2
  - at(1)
  - atd(8)
  - lecture.md#RHCSA-15-O01
