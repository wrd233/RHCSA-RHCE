  type: qa
  question: 任务要求关机错过后补执行，并统一查看退出状态。应优先考虑什么对象？
  answer: systemd `.timer` 与 `.service` 对。
  extra: 日历 timer 可配 `Persistent=true`，service 记录退出状态。
