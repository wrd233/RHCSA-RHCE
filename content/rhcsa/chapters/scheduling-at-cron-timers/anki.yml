- id: RHCSA-15-D01-QA-008
  type: qa
  question: 排错初期为什么不应把输出重定向到 `/dev/null`？
  answer: 它会删除最有价值的 stderr 和诊断证据。
  extra: 先保留日志，稳定后再决定噪声策略。
