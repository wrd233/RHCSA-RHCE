- id: RHCSA-15-K03-QA-003
  type: qa
  question: timer 到期时目标 service 已经 active，会自动启动第二个实例吗？
  answer: 不会；目标 unit 保持 active，不会因该次到期自动重启。
  extra: 长时间 active 的 service 需要单独设计并发语义。
