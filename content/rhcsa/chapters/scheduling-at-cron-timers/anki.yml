- id: RHCSA-15-K01-QA-005
  type: qa
  question: 计划任务的“定义状态”和“功能状态”分别回答什么？
  answer: 定义状态回答规则是否存在且正确；功能状态回答真实业务产物是否符合目标。
  extra: 两者之间还隔着调度、触发和执行状态。
