- id: RHCSA-15-K01-QA-008
  type: qa
  question: 为什么不应把 alias、SSH agent 或交互口令作为计划任务依赖？
  answer: 计划任务通常没有交互终端，也不会稳定继承登录会话状态。
  extra: 把依赖改为绝对路径、受控变量、非交互凭据和明确失败。
  source:
