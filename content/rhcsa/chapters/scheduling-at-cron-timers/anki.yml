- id: RHCSA-15-K03-QA-009
  type: qa
  question: '`Persistent=true` 对纯 `OnBootSec=` timer 有效吗？'
  answer: 没有该补跑效果；`Persistent=` 只影响 `OnCalendar=` timer。
  extra: 不要把它当作所有 timer 的通用补跑开关。
