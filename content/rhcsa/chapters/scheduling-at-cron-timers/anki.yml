- id: RHCSA-15-K03-QA-010
  type: qa
  question: 系统关机期间错过多个日历周期，`Persistent=true` 会逐次回放吗？
  answer: 不会，重新激活时最多补一次触发。
  extra: 补触发仍受随机延迟影响。
