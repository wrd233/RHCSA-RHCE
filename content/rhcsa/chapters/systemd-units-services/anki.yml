- id: RHCSA-12-K01-QA-007
  type: qa
  question: 某 oneshot unit 的 `MainPID=0`，能否仅据此判定 unit 失败？
  answer: 不能。应结合 `Type`、`ActiveState`、`SubState` 和 `Result`。
  extra: 一次性任务成功退出后可能没有长期 MainPID。
