- id: RHCSA-SERVICES-D01-QA-001
  type: qa
  question: 自定义 service 启动失败。第一轮应优先收集哪组 systemd 证据？
  answer: 先查看 `systemctl status UNIT --no-pager -l`，再用 `systemctl show UNIT -p LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,FragmentPath,DropInPaths`
    收缩原因。
  extra: 完整日志检索归日志章节，但 status 是可靠入口。
