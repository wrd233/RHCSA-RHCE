- id: RHCSA-12-K01-QA-001
  type: qa
  question: systemd 中的 unit、job 与进程分别是什么？
  answer: unit 是声明对象；job 是一次 start/stop 等管理事务；进程是 service 激活后产生的运行实例。
  extra: 一个 service 可以有多个进程，也可以在 oneshot 完成后没有长期进程。
  source:
  - systemd.unit(5)
  - systemd.service(5)
  tags:
