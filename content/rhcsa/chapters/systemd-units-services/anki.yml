- id: RHCSA-12-T01-QA-120
  type: qa
  question: 自定义 heartbeat service 从定义到验收的完整顺序是什么？
  answer: 创建账号/目录 → 写 unit → verify → daemon-reload → enable --now → 当前/持久/身份/功能验证。
