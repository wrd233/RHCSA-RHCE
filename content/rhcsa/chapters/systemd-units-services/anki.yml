- id: RHCSA-SERVICES-O01-QA-005
  type: qa
  question: unit 文件变化与应用自身配置文件变化，分别通常需要什么重新加载动作？
  answer: unit 文件变化需要让 systemd 重新读取定义；应用配置变化需要应用支持的 reload 或 restart。
  extra: '`daemon-reload` 不等于让应用重读 `/etc/<app>/...`。'
