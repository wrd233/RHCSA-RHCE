  type: qa
  question: 在 `/usr/lib/systemd/system` 中没有找到同名固定文件，能否判定 unit 不存在？
  answer: 不能。unit 可能来自 `/etc`、`/run`、generator、transient 定义或别名。
  extra: 用 `show FragmentPath/SourcePath` 和 `cat` 查实际来源。
