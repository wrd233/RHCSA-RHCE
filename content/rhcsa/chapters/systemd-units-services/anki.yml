- id: RHCSA-12-T02-QA-125
  type: qa
  question: 如何用实验区分 socket 激活与 Restart 重启？
  answer: stop service 后发连接观察 socket 激活；受控异常终止主进程且无连接，观察 Restart/NRestarts。
