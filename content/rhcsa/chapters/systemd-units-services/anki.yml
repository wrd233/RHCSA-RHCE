- id: RHCSA-SERVICES-O01-QA-003
  type: qa
  question: '`systemctl disable UNIT` 与 `systemctl mask UNIT` 的关键区别是什么？'
  answer: '`disable` 移除 enable 建立的持久启动链接；`mask` 阻止 unit 被手工、依赖或触发入口普通激活。'
  extra: mask 强度更高，不应作为普通“不开机启动”的替代。
  source:
  - RH124
  - systemctl(1)
  tags:
  - exam::rhcsa
  - chapter::systemd-units-services
