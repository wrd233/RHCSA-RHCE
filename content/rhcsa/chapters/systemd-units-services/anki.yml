- id: RHCSA-12-D01-QA-117
  type: qa
  question: 为什么不能把关闭 SELinux 作为 service permission denied 的默认答案？
  answer: 这会破坏安全模型并掩盖上下文或策略根因；应收集传统权限和 AVC 证据后做最小修复。
