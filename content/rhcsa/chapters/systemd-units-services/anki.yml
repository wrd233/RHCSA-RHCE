  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-12-K01-QA-002
  type: qa
  question: '`.service`、`.socket`、`.path`、`.timer` 和 `.target` 分别管理什么？'
  answer: 分别管理进程生命周期、socket 入口、路径事件、时间触发器和依赖集合。
  extra: timer 的时间表达式不在本章完整展开。
