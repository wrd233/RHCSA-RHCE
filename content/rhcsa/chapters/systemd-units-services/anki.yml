  semantic_type: comparison
- id: RHCSA-SERVICES-O01-QA-004
  type: qa
  question: 手工创建或修改了 `/etc/systemd/system/report-agent.service` 后，哪条命令让 systemd manager 重新读取 unit 定义？
  answer: '```bash

    systemctl daemon-reload

    ```'
  extra: '`daemon-reload` 不会自动重启服务。'
