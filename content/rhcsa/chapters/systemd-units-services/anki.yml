  question: '`Wants=` 与 `Requires=` 的核心差异是什么？'
  answer: 两者都会拉入需求对象；Requires 表达更强的生命周期需求，Wants 对依赖启动失败更宽松。
  extra: 仍需结合排序关系理解失败传播。
