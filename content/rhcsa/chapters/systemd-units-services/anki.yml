- id: RHCSA-12-D01-QA-109
  type: qa
  question: unit 文件已经创建，但 systemctl 仍 not-found，最常见的两个假设是什么？
  answer: 文件不在 unit 搜索路径，或 manager 尚未执行 daemon-reload。
