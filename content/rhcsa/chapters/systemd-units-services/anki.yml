- id: RHCSA-12-K01-QA-004
  type: qa
  question: 为什么在脚本和诊断记录中优先写完整的 `.service` 后缀？
  answer: 完整名称可以区分同名 service、socket、timer 等不同 unit，避免补全歧义。
  extra: 交互使用时省略 `.service` 常可自动补全。
