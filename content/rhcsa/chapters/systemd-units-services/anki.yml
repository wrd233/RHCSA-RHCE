- id: RHCSA-12-K02-QA-012
  type: qa
  question: '`active (exited)` 通常说明什么，不能说明什么？'
  answer: 说明 unit 保持 active 语义但没有长期运行主进程；不能据此证明存在正在运行的守护进程。
  extra: 常见于 oneshot + RemainAfterExit 或兼容脚本式 unit。
