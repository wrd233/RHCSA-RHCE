- id: RHCSA-12-T01-QA-122
  type: qa
  question: 为什么 `chmod 777 /var/lib/heartbeat-worker` 不是合格答案？
  answer: 它无差别放宽权限，违背最小授权；应按服务账号设置最小所有权和模式。
