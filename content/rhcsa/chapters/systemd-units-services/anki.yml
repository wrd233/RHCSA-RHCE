  semantic_type: comparison
- id: RHCSA-SERVICES-O01-QA-002
  type: qa
  question: '`chronyd.service` 当前未运行，题目要求现在启动并在系统重启后自动启动。应执行什么命令？'
  answer: '```bash

    systemctl enable --now chronyd.service

    ```'
  extra: 操作后仍分别检查 `systemctl is-active` 与 `systemctl is-enabled`。
  source:
  - RH124
  - systemctl(1)
