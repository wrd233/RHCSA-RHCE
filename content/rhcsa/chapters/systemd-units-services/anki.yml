- id: RHCSA-12-K02-QA-010
  type: qa
  question: '`LoadState` 与 `ActiveState` 分别回答什么？'
  answer: '`LoadState` 判断 unit 定义是否被找到并有效加载；`ActiveState` 判断当前通用生命周期。'
  extra: loaded 不代表 active。
