- id: RHCSA-SERVICES-D01-QA-003
  type: qa
  question: 一个 service 已 `enabled`，但当前为 `inactive`。为什么不能再次盲目执行 enable？
  answer: '`enabled` 已证明持久链接；当前 inactive 可能是未执行 start、启动失败、条件不满足、按需激活或目标尚未拉起。应调查当前层。'
