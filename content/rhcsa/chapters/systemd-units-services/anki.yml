- id: RHCSA-SERVICES-O01-QA-001
  type: qa
  question: 查看一个 systemd service 时，`active` 与 `enabled` 分别说明哪个状态维度？
  answer: '`active` 描述当前运行状态；`enabled` 描述持久启动配置。'
  extra: 两者必须分别验证。当前运行不代表系统重启后会自动启动。
  source:
  - RH124
  - systemctl(1)
  - systemd.unit(5)
