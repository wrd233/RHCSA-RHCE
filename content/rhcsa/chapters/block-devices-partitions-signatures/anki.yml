  type: qa
  question: '`fdisk` 创建固定大小分区时，为什么常接受默认起始扇区？'
  answer: 工具通常已根据设备拓扑选择对齐良好的起点。
  extra: 随后使用 `+SIZE` 指定大小并在写盘后验证。
