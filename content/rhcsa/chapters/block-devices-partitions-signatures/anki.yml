- id: RHCSA-22-O03-QA-003
  type: qa
  question: '`fdisk` 中 `w` 与 `q` 的区别是什么？'
  answer: '`w` 写入分区表并退出；`q` 放弃本次尚未写入的候选修改并退出。'
  extra: '`q` 不能撤销其他工具已经写入的变化。'
  source:
