  type: qa
  question: '`parted` 和 `fdisk -l` 都没有显示刚创建的分区，首先检查什么？'
  answer: 检查是否选错设备、命令失败，或交互式 `fdisk` 未执行 `w` 写盘。
  extra: 此时 `partprobe` 不能同步一个并不存在的新布局。
