- id: RHCSA-FILESYSTEMS-QA-002
  type: qa
  question: '`wipefs /dev/vdb` 与 `wipefs -a /dev/vdb` 的区别是什么？'
  answer: 前者列出可识别签名及偏移；后者删除可识别签名。
  extra: 调查时不得加 `-a`。`wipefs -a` 不是空盘检查，也不是安全擦除。
  source:
  - wipefs(8)
  - legacy::RHCSA-FILESYSTEMS
