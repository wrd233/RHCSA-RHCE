- id: RHCSA-22-K04-QA-009
  type: qa
  question: '`linux_raid_member` 出现时，下一步最有区分度的证据是什么？'
  answer: 检查 `/proc/mdstat` 和相应 RAID 管理信息，确认它是否属于活动阵列。
  extra: 未确认前不得清除签名。
