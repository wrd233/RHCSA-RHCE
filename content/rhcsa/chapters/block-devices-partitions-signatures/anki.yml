- id: RHCSA-FILESYSTEMS-QA-005
  type: qa
  question: 使用 `parted` 从 1 MiB 开始创建约 2 GiB 的 GPT 分区，命令骨架是什么？
  answer: '`parted -s <DISK> mkpart data 1MiB 2049MiB`'
  extra: 这里的 2049 MiB 是绝对终点；`mkpart` 不创建文件系统。
  source:
