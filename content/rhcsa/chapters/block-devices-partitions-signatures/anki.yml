- id: RHCSA-22-O03-QA-007
  type: qa
  question: 为什么 `fdisk` 最后一次 `p` 不能替代写盘后的验证？
  answer: 它显示当前交互候选布局；只有 `w` 后从外部重新读取，才能证明磁盘实际状态。
  extra: 使用 `fdisk -l`、`parted print` 和 `lsblk` 复核。
