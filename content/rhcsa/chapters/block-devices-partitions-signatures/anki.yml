- id: RHCSA-22-K02-QA-003
  type: qa
  question: MBR 的约 2 TiB 限制为什么要注明 512 字节逻辑扇区背景？
  answer: 该限制来自 32 位扇区地址与扇区大小的组合。
  extra: 不要把 2 TiB 脱离扇区大小解释为所有设备上的绝对上限。
