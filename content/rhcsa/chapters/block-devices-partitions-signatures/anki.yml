  question: 为什么不建议脚本依赖 `fdisk -l` 的固定空格和列位置？
  answer: 人类可读输出格式可能随 util-linux 版本、设备类型和本地化变化。
  extra: 脚本应使用更稳定的机器接口或显式字段工具。
