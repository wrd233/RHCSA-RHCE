  type: qa
  question: 检查目标设备是否被当前挂载，优先用什么证据？
  answer: 结合 `lsblk ... MOUNTPOINTS` 与 `findmnt --source <DEVICE>`。
  extra: 目录未出现在一个输出中仍不能排除 Swap 或其他上层使用。
