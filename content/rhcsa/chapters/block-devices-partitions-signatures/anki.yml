- id: RHCSA-22-K04-QA-007
  type: qa
  question: 在已获授权前，怎样预览 `wipefs -a` 会处理哪些签名？
  answer: 使用 `wipefs -n -a <DEVICE>` 进行 no-act 模拟。
  extra: 仍需确认设备身份、占用和上层归属。
