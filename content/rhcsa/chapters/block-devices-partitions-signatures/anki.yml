- id: RHCSA-22-K01-QA-010
  type: qa
  question: 目标系统不支持讲义中的某个 `lsblk` 列时，最稳妥的处理是什么？
  answer: 用 `lsblk --help` 查看本机支持的列，移除或替换不支持字段，并保留核心身份与拓扑字段。
  extra: 不要退回默认输出后按固定位置猜列。
