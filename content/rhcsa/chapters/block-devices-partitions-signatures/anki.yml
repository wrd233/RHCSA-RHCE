- id: RHCSA-22-K01-QA-001
  type: qa
  question: '`lsblk` 的 `TYPE=disk` 与 `TYPE=part` 分别说明什么？'
  answer: '`disk` 表示整块磁盘类块设备；`part` 表示由分区表描述并被内核识别的分区设备。'
  extra: 两者都可能承载签名；`part` 不等于已经有文件系统。
  source:
