- id: RHCSA-22-T02-QA-004
  type: qa
  question: 完成诊断后，报告应区分哪些状态？
  answer: 磁盘表状态、内核节点状态、udev 属性/链接状态、内容签名和当前占用状态。
  extra: 不要用“已解决”掩盖某一层仍未验证。
