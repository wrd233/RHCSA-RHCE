- id: RHCSA-22-O02-QA-007
  type: qa
  question: '`parted` 创建分区后，最小验证链是什么？'
  answer: '`parted <DISK> print` → `partprobe <DISK>` → `udevadm settle` → `lsblk`。'
  extra: 若磁盘表和内核视图不一致，进入同步诊断。
  source:
