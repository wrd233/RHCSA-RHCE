- id: RHCSA-FILESYSTEMS-QA-004
  type: qa
  question: 在已经确认可丢弃的新磁盘上建立 GPT 的 `parted` 命令骨架是什么？
  answer: '`parted -s <DISK> mklabel gpt`'
  extra: '`mklabel` 会替换分区布局。执行前必须重新确认设备身份、签名、占用和数据保留要求。'
  source:
