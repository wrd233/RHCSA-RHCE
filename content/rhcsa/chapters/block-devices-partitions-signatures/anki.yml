- id: RHCSA-22-K03-QA-008
  type: qa
  question: 为什么 MBR 的类型代码 `82` 不能作为 GPT 场景的通用答案？
  answer: MBR 使用十六进制类型代码，GPT 使用 GUID 类型和工具别名，表达体系不同。
  extra: 先确认分区表类型，再在本机工具中列出类型。
