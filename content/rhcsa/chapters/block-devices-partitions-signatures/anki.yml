- id: RHCSA-22-D01-QA-003
  type: qa
  question: 观察内核和 udev 设备事件，可使用什么？
  answer: '`udevadm monitor --kernel --udev --property`。'
  extra: 只在正常触发事件时观察，不为产生事件重复破坏性写入。
