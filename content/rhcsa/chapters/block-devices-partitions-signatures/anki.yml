- id: RHCSA-22-K03-QA-007
  type: qa
  question: 分区类型设置为 Swap 后，是否已经形成可启用的 Swap？
  answer: 没有。
  extra: 还需要 `mkswap` 写入 Swap 签名，并由第 24 章处理启用和持久性。
