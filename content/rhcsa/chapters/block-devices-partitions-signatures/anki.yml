- id: RHCSA-22-K02-QA-005
  type: qa
  question: GPT 的保护性 MBR 主要解决什么问题？
  answer: 让只理解 MBR 的旧工具看到磁盘已被占用，降低误判为空盘并覆盖的风险。
  extra: 它不把 GPT 磁盘转换成普通 MBR 磁盘。
