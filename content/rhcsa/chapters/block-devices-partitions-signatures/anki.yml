- id: RHCSA-22-K04-QA-003
  type: qa
  question: '`blkid <DEVICE>` 与 `blkid -p <DEVICE>` 的主要区别是什么？'
  answer: 普通模式适合读取常见属性；`-p` 对指定设备进行低层探测，更适合冲突或不确定签名调查。
  extra: 普通模式无输出不能证明空盘。
