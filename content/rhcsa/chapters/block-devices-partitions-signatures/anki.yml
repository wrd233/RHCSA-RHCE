- id: RHCSA-22-T01-QA-002
  type: qa
  question: 在 GPT 盘上创建 `data` 约 2 GiB 和 `future-lvm` 约 1 GiB 的 `parted` 骨架是什么？
  answer: '`mkpart data 1MiB 2049MiB`；`mkpart future-lvm 2049MiB 3073MiB`；随后 `set 2 lvm on`。'
  extra: 具体设备使用题目确认后的路径。
