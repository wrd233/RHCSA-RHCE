- id: RHCSA-22-T02-QA-003
  type: qa
  question: 诊断任务禁止格式化的原因是什么？
  answer: 格式化会写入新的文件系统签名，覆盖证据并可能破坏现有内容。
  extra: 本章目标是调查分区和签名，不是创建文件系统。
  source:
