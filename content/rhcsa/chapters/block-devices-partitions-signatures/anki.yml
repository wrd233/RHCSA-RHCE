- id: RHCSA-22-K03-QA-009
  type: qa
  question: '`parted mkpart` 中给出 `xfs` 是否会创建 XFS？'
  answer: 不会。
  extra: 它只提供分区用途/兼容提示；真正创建文件系统需要独立 `mkfs.xfs`，归第 23 章。
