- id: RHCSA-22-K04-QA-012
  type: qa
  question: '`/dev/disk/by-partuuid/` 链接在什么情况下通常会改变？'
  answer: 删除并重建分区、重建分区表或显式更改分区条目标识时。
  extra: 它稳定的是分区条目，不是文件系统内容。
