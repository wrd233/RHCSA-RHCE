- id: RHCSA-22-O04-QA-006
  type: qa
  question: '`partprobe` 报设备忙时，下一步是什么？'
  answer: 调查挂载、Swap、LVM、RAID、device-mapper 和 holders，确定哪一层阻止重读。
  extra: 不重复 `mklabel`，也不默认强制重启。
