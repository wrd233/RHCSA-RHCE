- id: RHCSA-22-K04-QA-004
  type: qa
  question: 怎样让 `blkid -p` 以便于逐行判断的形式输出？
  answer: '`blkid -p -o export <DEVICE>`。'
  extra: 输出字段依赖实际签名，不得编造 UUID。
