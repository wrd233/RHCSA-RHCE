- id: RHCSA-22-D01-QA-002
  type: qa
  question: 磁盘表有新分区、内核树没有时，下一条最有区分度的证据是什么？
  answer: 运行 `partprobe <DISK>` 并保留其返回，再重新检查 `lsblk`。
  extra: 不要重复 `mkpart`。
