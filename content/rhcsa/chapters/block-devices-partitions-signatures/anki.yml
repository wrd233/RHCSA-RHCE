- id: RHCSA-22-T01-QA-003
  type: qa
  question: 经典任务为何要求 `PARTUUID` 验收，而不要求文件系统 UUID？
  answer: 本章只创建分区条目，没有创建文件系统。
  extra: 文件系统 UUID 属于第 23 章。
