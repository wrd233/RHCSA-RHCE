- id: RHCSA-22-D03-QA-003
  type: qa
  question: '`parted` 与 `lsblk` 输出不一致时，为什么不能简单认定一个工具错误？'
  answer: 两者可能分别反映磁盘分区表和内核/udev 当前视图，读取层次不同。
  extra: 先同步内核并检查设备路径。
