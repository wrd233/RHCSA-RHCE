- id: RHCSA-22-T01-QA-001
  type: qa
  question: 经典任务要求在 `/dev/vdb` 创建 GPT 前，第一组命令应完成什么？
  answer: 确认设备身份，并记录现有分区表、签名和占用。
  extra: 不能从 `mklabel gpt` 开始。
