- id: RHCSA-22-K01-QA-003
  type: qa
  question: NVMe 的整盘和第 1 分区常见名称分别是什么？
  answer: 整盘如 `/dev/nvme0n1`；第 1 分区如 `/dev/nvme0n1p1`。
  extra: '`p` 用于分隔磁盘编号与分区编号。'
  source:
  - RH124-RHEL9-Ch15
  - lsblk(8)
  tags:
