- id: RHCSA-22-K04-QA-001
  type: qa
  question: 设备签名在存储识别中扮演什么角色？
  answer: 它是位于特定偏移的魔数和元数据，使工具能够识别文件系统、Swap、LVM、RAID 等内容。
  extra: 签名不是完整数据，但删除它可能使正常工具无法识别原内容。
