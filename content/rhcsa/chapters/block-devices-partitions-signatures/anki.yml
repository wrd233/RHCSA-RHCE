- id: RHCSA-22-K01-QA-004
  type: qa
  question: MMC 的整盘和第 2 分区常见名称分别是什么？
  answer: 整盘如 `/dev/mmcblk0`；第 2 分区如 `/dev/mmcblk0p2`。
  extra: 不要套用 `/dev/sda2` 的命名规则。
