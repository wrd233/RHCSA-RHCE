- id: RHCSA-FILESYSTEMS-QA-003
  type: qa
  question: 为什么 `lsblk` 中 `FSTYPE` 为空不能充分证明设备可以安全覆盖？
  answer: 设备仍可能包含分区表、未识别或冲突签名，也可能正被 Swap、LVM、RAID、device-mapper 或其他上层对象使用。
  extra: 继续检查 `parted`/`fdisk`、`blkid -p`、`wipefs`、挂载和上层归属。
  source:
  - lsblk(8)
  - blkid(8)
  - wipefs(8)
