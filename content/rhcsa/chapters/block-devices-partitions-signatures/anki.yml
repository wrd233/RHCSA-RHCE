  type: qa
  question: 修改分区类型前，怎样避免把 MBR 代码套到 GPT？
  answer: 先查看当前磁盘标签类型，再在 `fdisk` 提示中列出可用类型，按名称/别名或对应代码选择。
  extra: 写盘前用 `p` 核对。
