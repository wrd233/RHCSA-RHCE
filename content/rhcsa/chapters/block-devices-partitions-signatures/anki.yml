- id: RHCSA-22-K02-QA-002
  type: qa
  question: MBR 为什么常被描述为最多四个主分区？
  answer: 传统 MBR 分区表只有四个主要表项。
  extra: 需要更多分区时，可使用扩展分区容纳逻辑分区。
