- id: RHCSA-22-K04-QA-002
  type: qa
  question: 一个设备为什么可能同时存在多种签名？
  answer: 设备被重复用于不同用途时，新的元数据可能没有覆盖所有旧签名位置。
  extra: 需要判断当前有效对象与历史残留，不能直接全清。
