- id: RHCSA-22-O03-QA-001
  type: qa
  question: '`fdisk -l <DISK>` 与 `fdisk <DISK>` 的区别是什么？'
  answer: 前者只读列出布局；后者进入交互式编辑会话。
  extra: 进入交互后先用 `p` 打印候选布局。
