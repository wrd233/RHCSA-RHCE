- id: RHCSA-22-K04-QA-006
  type: qa
  question: '`wipefs -a <DEVICE>` 的风险是什么？'
  answer: 删除设备上所有可识别签名，可能破坏分区表、文件系统或其他元数据的访问入口。
  extra: 它不是安全擦除整盘数据，也不是调查命令。
