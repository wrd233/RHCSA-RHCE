- id: RHCSA-22-D03-QA-005
  type: qa
  question: 什么是本章最重要的停止条件？
  answer: 设备身份、已有内容、当前占用或授权范围中任一项无法由证据确认。
  extra: 停止比尝试 `--force` 或全量清签名更正确。
