- id: RHCSA-22-K02-QA-007
  type: qa
  question: '`PTUUID` 与 `PARTUUID` 的区别是什么？'
  answer: '`PTUUID` 标识整盘分区表；`PARTUUID` 标识分区表中的某个分区条目。'
  extra: 删除重建分区可能改变 `PARTUUID`；重建分区表通常也会改变 `PTUUID`。
