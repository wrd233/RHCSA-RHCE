- id: RHCSA-22-K03-QA-003
  type: qa
  question: MiB 与 MB 的区别是什么？
  answer: MiB 是 2^20 字节；MB 是 10^6 字节。
  extra: 题目对大小敏感时应显式使用要求的单位。
