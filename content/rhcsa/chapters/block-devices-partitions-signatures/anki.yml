- id: RHCSA-22-K01-QA-007
  type: qa
  question: 破坏性写入前，`MODEL`、`SERIAL`、`WWN` 三类字段的价值是什么？
  answer: 它们提供型号和设备级身份线索，可用于区分同名或同容量磁盘。
  extra: 虚拟磁盘可能缺少其中部分字段，缺失时要使用其他证据组合。
