- id: RHCSA-22-O02-QA-005
  type: qa
  question: 删除第 3 个分区条目的 `parted` 骨架是什么？
  answer: '`parted -s <DISK> rm 3`'
  extra: 执行前确认父磁盘、编号、挂载和上层归属。
