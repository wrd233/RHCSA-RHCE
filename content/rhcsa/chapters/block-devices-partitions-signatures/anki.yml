- id: RHCSA-22-K04-QA-008
  type: qa
  question: '`LVM2_member` 说明了什么，不能说明什么？'
  answer: 说明探测到 LVM PV 类签名；不能单独说明该 PV 当前属于哪个 VG、是否活动或是否可删除。
  extra: 继续使用 `pvs`/`vgs` 等上层证据。
