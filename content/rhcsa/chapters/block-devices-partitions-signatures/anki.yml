- id: RHCSA-22-O02-QA-006
  type: qa
  question: 为什么说 `parted` 与 `fdisk` 的提交模型不同？
  answer: '`parted` 的多数修改命令立即写入磁盘；交互式 `fdisk` 多数修改在 `w` 前仅为候选布局。'
  extra: 不能把 `fdisk q` 的撤销经验套到已执行的 `parted` 命令。
  source:
