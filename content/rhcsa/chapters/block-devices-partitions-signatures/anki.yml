- id: RHCSA-22-K03-QA-006
  type: qa
  question: 分区类型设置为 LVM 后，为什么 `pvs` 仍可能没有该分区？
  answer: 分区类型只修改分区表元数据；尚未执行 `pvcreate`。
  extra: LVM 生命周期归第 25 章。
  source:
