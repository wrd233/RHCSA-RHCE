- id: RHCSA-22-K01-QA-002
  type: qa
  question: 为什么 `/dev/sdb` 或 `/dev/vdb` 不能作为长期不变的业务身份？
  answer: 它们是当前探测顺序和驱动生成的枚举名，硬件、控制器或虚拟机配置变化后可能改变。
  extra: 破坏性操作前应重新核对容量、父子关系、序列号、WWN 和持久链接。
  source:
  - RH134-RHEL9-Ch5
  - util-linux-man-pages
  tags:
