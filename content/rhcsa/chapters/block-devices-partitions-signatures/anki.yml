- id: RHCSA-22-K01-QA-005
  type: qa
  question: '`lsblk` 的 `PKNAME` 字段回答什么问题？'
  answer: 它显示当前设备的父内核设备名。
  extra: 对分区和映射层，父子关系可帮助确认操作对象属于哪块磁盘。
