- id: RHCSA-22-K01-QA-006
  type: qa
  question: '`MAJ:MIN` 能替代设备序列号作为永久身份吗？'
  answer: 不能。它是当前内核分配的主次设备号，适合区分当前设备节点，不是跨重启或跨主机的永久硬件身份。
  extra: 可与路径和树形关系交叉检查。
