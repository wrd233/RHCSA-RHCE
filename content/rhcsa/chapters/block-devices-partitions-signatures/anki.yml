- id: RHCSA-22-O04-QA-005
  type: qa
  question: 怎样验证 udev 已为分区生成 `PARTUUID` 链接？
  answer: 查看 `ls -l /dev/disk/by-partuuid/`，并与 `lsblk ... PARTUUID` 对照。
  extra: 链接缺失时先检查分区是否有标识和事件是否完成。
