- id: RHCSA-22-T02-QA-002
  type: qa
  question: 诊断任务禁止重新 `mklabel` 的原因是什么？
  answer: 当前症状是视图不同步或占用，重建分区表会扩大为布局破坏。
  extra: 先证明磁盘表是否正确。
  source:
