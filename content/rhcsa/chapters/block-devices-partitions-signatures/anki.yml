- id: RHCSA-22-K02-QA-004
  type: qa
  question: GPT 为什么在磁盘末尾还保留备份元数据？
  answer: 用于在主 GPT 头或主分区条目数组损坏时提供冗余。
  extra: 本章不展开 GPT 修复，但删除或缩小磁盘时要意识到末尾存在备份结构。
