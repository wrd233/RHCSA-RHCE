  type: qa
  question: 为什么要分别对整盘和现有分区执行 `wipefs`/`blkid -p`？
  answer: 分区表签名位于整盘，而文件系统、LVM、RAID 等签名可能位于分区或整盘。
  extra: 只查一个层可能遗漏高风险内容。
