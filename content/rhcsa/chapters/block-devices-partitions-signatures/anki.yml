- id: RHCSA-22-T02-QA-001
  type: qa
  question: 诊断任务中 `parted print` 有分区而 `lsblk` 无节点，最小修复链是什么？
  answer: '`partprobe <DISK>` → `udevadm settle` → 重新 `lsblk`。'
  extra: 失败时进入占用和内核日志调查。
  source:
  - RH134-RHEL9-Ch5
