- id: RHCSA-22-K01-QA-008
  type: qa
  question: 两块磁盘容量相同，是否可以只凭大小选择目标盘？
  answer: 不可以。
  extra: 继续核对父子关系、型号、序列/WWN、控制器路径、现有布局和题目指定来源。
