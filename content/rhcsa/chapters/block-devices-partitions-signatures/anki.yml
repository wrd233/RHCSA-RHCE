  question: 在 GPT 磁盘上创建名为 `data`、范围 1MiB 到 2049MiB 的分区，命令是什么？
  answer: '`parted -s <DISK> mkpart data 1MiB 2049MiB`'
  extra: 创建后用 `parted print` 与 `lsblk` 验证。
