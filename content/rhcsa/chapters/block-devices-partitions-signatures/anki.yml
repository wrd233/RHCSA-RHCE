- id: RHCSA-22-O03-QA-002
  type: qa
  question: '`fdisk` 交互中的 `p`、`n`、`t`、`d` 分别做什么？'
  answer: 打印候选布局、新建分区、修改分区类型、删除候选分区条目。
  extra: 最终是否写盘由 `w` 决定。
