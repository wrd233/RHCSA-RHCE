- id: RHCSA-FILESYSTEMS-QA-006
  type: qa
  question: 分区表已经写入后，请求内核重读并等待设备事件，应使用什么？
  answer: '`partprobe <DISK>`，随后执行 `udevadm settle`。'
  extra: '`partprobe` 负责通知内核；`udevadm settle` 只等待已有事件完成。再用 `lsblk` 验证。'
  source:
