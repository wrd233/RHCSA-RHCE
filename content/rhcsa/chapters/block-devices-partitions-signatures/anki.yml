- id: RHCSA-22-O02-QA-004
  type: qa
  question: '`parted -s <DISK> set 2 lvm on` 改变什么？'
  answer: 把第 2 分区的用途类型/flag 设置为 LVM。
  extra: 不创建 LVM PV。
