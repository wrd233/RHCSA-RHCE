- id: RHCSA-22-K01-QA-011
  type: qa
  question: '`MOUNTPOINTS` 与 `MOUNTPOINT` 的输出差异应怎样理解？'
  answer: '`MOUNTPOINTS` 可展示一个设备的多个挂载点；`MOUNTPOINT` 通常只展示一个值。'
  extra: 写入前优先使用能暴露多挂载关系的视图。
