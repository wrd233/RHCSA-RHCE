- id: RHCSA-22-D03-QA-004
  type: qa
  question: 存储命令返回 0 能证明哪些内容？
  answer: 最多证明该命令按其接口成功执行。
  extra: 不能自动证明设备选对、边界正确、内核已同步或业务数据安全。
