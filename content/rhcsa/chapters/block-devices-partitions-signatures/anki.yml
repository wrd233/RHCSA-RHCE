- id: RHCSA-22-K03-QA-005
  type: qa
  question: 查看逻辑扇区、物理扇区和最优 I/O 大小，可用什么？
  answer: 例如 `lsblk -o NAME,LOG-SEC,PHY-SEC,MIN-IO,OPT-IO,ALIGNMENT`，并结合 `fdisk -l`。
  extra: 具体列是否可用以本机 `lsblk --help` 为准。
