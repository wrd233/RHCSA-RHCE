- id: RHCSA-22-T01-QA-004
  type: qa
  question: 创建分区后，如何证明没有越界创建文件系统或 PV？
  answer: 检查 `blkid -p`、`wipefs`、`lsblk FSTYPE` 和 `pvs`，确认没有非预期内容签名或 PV。
  extra: 分区类型为 LVM 不等于 PV。
