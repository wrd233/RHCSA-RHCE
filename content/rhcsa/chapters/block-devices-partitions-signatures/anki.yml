- id: RHCSA-22-K04-QA-010
  type: qa
  question: '`/dev/disk/by-id/` 主要稳定在哪个维度？'
  answer: 设备序列、WWN 或后端生成的设备标识。
  extra: 虚拟磁盘克隆、序列缺失或后端配置变化仍可能改变。
