- id: RHCSA-22-K03-QA-004
  type: qa
  question: 为什么常把第一个分区从 1 MiB 开始？
  answer: 1 MiB 起点通常能满足常见物理扇区和擦除块的对齐要求，并预留前部元数据空间。
  extra: 它是通用的安全默认，不是所有设备唯一正确的起点。
  source:
