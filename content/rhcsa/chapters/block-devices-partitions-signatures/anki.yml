- id: RHCSA-FILESYSTEMS-QA-001
  type: qa
  question: 写操作前，怎样显式查看块设备拓扑、类型、签名标识和挂载点？
  answer: '`lsblk -o NAME,PATH,SIZE,TYPE,PKNAME,FSTYPE,UUID,PARTUUID,MOUNTPOINTS`'
  extra: 实际调查可继续加入 `MAJ:MIN`、`MODEL`、`SERIAL`、`WWN`、`PTTYPE` 和 `PTUUID`。默认列不是稳定接口。
