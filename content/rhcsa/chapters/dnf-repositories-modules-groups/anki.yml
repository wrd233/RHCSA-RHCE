- id: RHCSA-17-QA-008
  type: qa
  question: repo section ID、`name` 和 `.repo` 文件名分别用于什么？
  answer: section ID 是命令行稳定标识；`name` 是显示名称；文件名只是配置载体。
  extra: ''
  source:
  - dnf.conf(5)
  tags:
