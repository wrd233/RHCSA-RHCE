- id: RHCSA-17-QA-009
  type: qa
  question: '`baseurl` 的正确目标是什么？'
  answer: 能够在其下找到 `repodata/repomd.xml` 的仓库内容根。
  extra: ''
  source:
  - dnf.conf(5)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::parameter
  - priority::P0
- id: RHCSA-17-QA-010
  type: qa
  question: '`baseurl`、`mirrorlist`、`metalink` 的核心区别是什么？'
  answer: '`baseurl` 直接列仓库根；`mirrorlist` 返回镜像 URL 列表；`metalink` 还可带镜像和完整性相关元数据。'
  extra: ''
  source:
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::comparison
  - priority::P1
- id: RHCSA-17-QA-011
  type: qa
  question: '`enabled=0` 后，如何只在当前命令临时启用 `testrepo`？'
  answer: '`dnf --enablerepo=testrepo <command>`'
  extra: 该选项不修改持久 repo 文件。
  source:
  - dnf(8)
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::parameter
  - priority::P0
- id: RHCSA-17-QA-012
  type: qa
  question: '`--enablerepo` 与 repo 文件中的 `enabled=1` 有什么状态边界？'
  answer: '`--enablerepo` 只覆盖当前命令；`enabled=1` 是持久默认状态。'
  extra: ''
  source:
  - dnf(8)
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::comparison
  - priority::P0
- id: RHCSA-17-QA-013
  type: qa
  question: 用 Shell here-document 写含 `$releasever` 的 repo 文件时，怎样防止 Shell 提前展开？
  answer: 使用单引号保护的结束标记，例如 `<<'EOF'`。
  extra: 让 `$releasever` 留给 DNF 解析。
  source:
  - bash(1)
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::syntax
  - priority::P0
- id: RHCSA-17-QA-014
  type: qa
  question: '`$releasever` 与 `$basearch` 在 repo URL 中分别表达什么？'
  answer: RHEL/DNF 识别的发行版本变量与基础架构变量。
  extra: 具体展开值应从目标系统读取，不硬编码猜测。
  source:
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::parameter
  - priority::P1
- id: RHCSA-17-QA-015
  type: qa
  question: '`gpgcheck=1` 与 `gpgkey=` 分别保证什么？'
  answer: '`gpgcheck=1` 要求包签名校验；`gpgkey` 提供可取得受信任公钥的位置。'
  extra: key 路径存在不代表一定匹配包签名。
  source:
  - dnf.conf(5)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::comparison
  - priority::P0
- id: RHCSA-17-QA-016
  type: qa
  question: TLS 校验成功与 GPG 包签名成功是否等价？
  answer: 不等价。TLS 验证传输通道/服务器身份；GPG 验证软件包签名者和内容完整性。
  extra: ''
  source:
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::comparison
  - priority::P0
- id: RHCSA-17-QA-017
  type: qa
  question: HTTPS 证书错误时，为什么不应默认设置 `sslverify=0`？
  answer: 这会移除 TLS 身份验证，掩盖时间、CA、主机名或服务器证书链问题。
  extra: ''
  source:
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::boundary
  - priority::P0
