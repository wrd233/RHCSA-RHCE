- id: RHCSA-17-QA-098
  type: qa
  question: 题目要求配置 BaseOS/AppStream 并安装 `httpd`，完整软件层验收顺序是什么？
  answer: repo 文件 → `repolist --all` → `makecache --refresh` → 两仓库代表包 `repoquery` → 事务预览/安装 → RPM 状态 → history。
  extra: 服务 active/enabled 和 HTTP 功能属于后续层。
  source:
  - RHCSA9-Mock
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
