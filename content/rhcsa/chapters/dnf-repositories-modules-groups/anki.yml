  - priority::P1
- id: RHCSA-17-QA-022
  type: qa
  question: 什么时候 `dnf clean metadata` 有价值，什么时候无效？
  answer: 本地缓存与新配置不一致时有价值；错误 URL、DNS、TLS 或服务端 404 时不能修复根因。
  extra: ''
  source:
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::boundary
  - priority::P0
- id: RHCSA-17-QA-023
  type: qa
  question: '`dnf clean metadata` 与 `dnf clean all` 有何范围差异？'
  answer: '`metadata` 只清元数据；`all` 清除更广的缓存。应按证据选择最小范围。'
  extra: ''
  source:
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::comparison
  - priority::P1
- id: RHCSA-17-QA-024
  type: qa
  question: 为什么要在 BaseOS 和 AppStream 仓库各查询一个代表包？
  answer: 分别证明两个仓库内容与题目预期相符，避免只验证 ID 可见而未验证内容。
  extra: ''
  source:
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::verification
  - priority::P0
- id: RHCSA-17-QA-025
  type: qa
  question: 指定仓库查询一个代表包成功，不能证明哪些内容？
  answer: 不能证明所有 RPM、依赖、包组、模块元数据和签名都完整。
