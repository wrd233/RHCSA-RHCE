  - priority::P0
- id: RHCSA-17-QA-099
  type: qa
  question: 仓库可见但 `repomd.xml` 404，最小修复流程是什么？
  answer: 读取完整 URL → 确认包含 `repodata` 的根 → 只修正 `baseurl` → `makecache --refresh` → 限定 repo 查询代表包。
  extra: ''
