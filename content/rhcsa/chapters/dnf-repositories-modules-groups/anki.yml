notes:
- id: RHCSA-PACKAGES-O01-QA-001
  type: qa
  question: repo 文件默认位于哪个目录？
  answer: '`/etc/yum.repos.d/*.repo`'
  extra: 每个仓库 section ID 应在已加载配置中唯一。
  source:
  - RH124
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::path
  - priority::P0
- id: RHCSA-PACKAGES-O01-QA-002
  type: qa
  question: repo 的 `baseurl`、`enabled`、`gpgcheck`、`gpgkey` 分别表达什么？
  answer: 仓库内容根、默认启用状态、包签名校验策略、可信公钥入口。
  extra: '`baseurl` 应指向包含 `repodata` 的仓库根；四个字段不能互相替代。'
  source:
  - RH124
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-definition
  - card::parameter
  - priority::P0
- id: RHCSA-PACKAGES-O01-QA-003
  type: qa
  question: '`dnf repolist --all` 能证明什么，不能证明什么？'
  answer: 能证明仓库配置被 DNF 识别及其 enabled/disabled 状态；不能充分证明 URL、元数据或包签名可用。
  extra: 真实刷新使用 `dnf makecache --refresh`。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::verification
  - priority::P0
- id: RHCSA-PACKAGES-O01-QA-004
  type: qa
  question: 强制重新检查并刷新启用仓库元数据的命令是什么？
  answer: '`dnf makecache --refresh`'
  extra: 它会暴露 DNS、TLS、HTTP、仓库根和元数据校验错误。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::command
  - priority::P0
- id: RHCSA-PACKAGES-O01-QA-005
  type: qa
  question: 限定从 `exam-baseos` 查询 `bash` 候选的命令骨架是什么？
  answer: '`dnf repoquery --repo exam-baseos bash`'
  extra: 这证明指定仓库提供该候选，不证明整个仓库或最终事务一定成功。
  source:
  - RH124
  - repoquery
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::command
  - priority::P0
- id: RHCSA-PACKAGES-O01-QA-006
  type: qa
  question: GPG 校验失败时，为什么不能直接设置 `gpgcheck=0`？
  answer: 这会移除要求的包签名安全属性，而不是修复错误 key、错误来源或损坏内容。
  extra: 应核对 `gpgkey`、签名者、仓库来源和完整错误。
  source:
  - RH124
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::gpg-diagnosis
  - card::boundary
  - priority::P0
- id: RHCSA-PACKAGES-O02-QA-001
  type: qa
  question: 从命令名 `semanage` 反查仓库中哪个包提供它，使用什么命令？
  answer: '`dnf provides ''*/semanage''`'
  extra: 通配模式应引用，避免 Shell 提前展开。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::package-query
  - card::command
  - priority::P0
- id: RHCSA-PACKAGES-O02-QA-003
  type: qa
  question: 为什么执行 `dnf remove` 前必须阅读 Transaction Summary？
  answer: 事务可能连带删除依赖或影响其他已完成的软件能力，实际影响不能由目标包名推断。
  extra: 摘要异常时应取消并调查依赖、组或模块状态。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::transactions
  - card::boundary
  - priority::P0
- id: RHCSA-PACKAGES-O02-QA-004
  type: qa
  question: 查看 DNF 事务列表和指定事务详情分别使用什么？
  answer: '`dnf history` 与 `dnf history info <ID>`。'
  extra: '`undo/rollback` 仍受当前仓库中旧版本可用性和后续依赖约束。'
  source:
  - RH124
  - RHEL9 DNF history documentation
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::history
  - card::command
  - priority::P1
- id: RHCSA-PACKAGES-O02-QA-005
  type: qa
  question: 为什么 DNF 事务成功不能证明 Web 服务题已经完成？
  answer: 事务只证明软件包层；仍需验证配置、服务当前/持久状态、监听和访问结果。
  extra: 不要把局部成功扩大为业务终态。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::transaction-boundary
  - card::verification
  - priority::P0
- id: RHCSA-PACKAGES-K02-QA-001
  type: qa
  question: 查看模块流与模块详情分别使用什么命令？
  answer: '`dnf module list` 与 `dnf module info <module>:<stream>`。'
  extra: 实际可用流和 profile 由当前 RHEL 9 仓库元数据决定。
  source:
  - RH124
  - RHEL9 modular content documentation
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::modules
  - card::command
  - priority::P0
- id: RHCSA-PACKAGES-K02-QA-002
  type: qa
  question: '`dnf module reset <module>` 会自动删除该模块已安装包吗？'
  answer: 通常不会；它重置显式流选择，不等于卸载软件内容。
  extra: 重置后应分别检查 module 状态和 RPM 已安装状态。
  source:
  - RHEL9 modular content documentation
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::modules
  - card::boundary
  - priority::P0
- id: RHCSA-PACKAGES-K02-QA-003
  type: qa
  question: 查询和安装软件包组的命令骨架是什么？
  answer: '`dnf group list/info` 与 `dnf group install <group-name-or-id>`。'
  extra: 组安装后仍需验证代表包和相关服务终态。
  source:
  - RH124
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::groups
  - card::command
  - priority::P0
- id: RHCSA-PACKAGES-D01-QA-001
  type: qa
  question: 下载 `repodata/repomd.xml` 返回 404，优先检查什么？
  answer: '`baseurl` 是否指向真正包含 `repodata` 的仓库根，以及变量是否被错误展开。'
  extra: 清理本地缓存不能修复错误 URL。
  source:
  - RH124
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::metadata-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-PACKAGES-D01-QA-002
  type: qa
  question: DNF 报依赖冲突或包被过滤，下一步应收集哪些证据？
  answer: 完整错误和事务摘要、`repoquery` 的依赖/提供关系、启用仓库、exclude 和 module 状态。
  extra: 先定位缺失或冲突对象，不先使用 `--allowerasing`。
  source:
  - RH124
  - dnf(8)
  - repoquery
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::dependency-diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-PACKAGES-D01-QA-003
  type: qa
  question: 为什么 `--allowerasing` 不是依赖冲突的第一尝试？
  answer: 它允许求解器删除冲突包，可能破坏其他任务；必须先理解将删除什么以及冲突来源。
  extra: 先查仓库、架构、版本流、exclude 和依赖缺口。
  source:
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::dependency-diagnosis
  - card::boundary
  - priority::P0
- id: RHCSA-PACKAGES-O01-CLOZE-001
  type: cloze
  text: repo 配置可见性用 {{c1::dnf repolist --all}}；真实刷新元数据用 {{c2::dnf makecache --refresh}}。
  extra: '`repolist` 不充分证明 URL 和元数据可用。'
  source:
  - RH124
  - dnf(8)
  tags:
