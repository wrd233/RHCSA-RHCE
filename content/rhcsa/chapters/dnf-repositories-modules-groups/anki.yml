- id: RHCSA-17-QA-020
  type: qa
  question: '`repolist --all` 显示仓库 enabled，但 `makecache --refresh` 失败，说明什么？'
  answer: 配置被识别，但传输、仓库根、TLS 或元数据层仍有问题。
  extra: ''
  source:
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
  - card::output
  - priority::P0
- id: RHCSA-17-QA-021
  type: qa
  question: '`dnf makecache --refresh` 中 `--refresh` 的目的是什么？'
  answer: 把元数据视为过期并重新检查/获取，而不是只依赖现有缓存。
  extra: ''
  source:
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-verification
