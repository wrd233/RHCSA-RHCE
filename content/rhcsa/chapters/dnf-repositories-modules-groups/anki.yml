- id: RHCSA-17-QA-085
  type: qa
  question: 为什么 `repomd.xml` 404 时 `dnf clean all` 不是修复？
  answer: 404 表示请求到达了不存在的服务器路径；删除客户端缓存不会创建正确路径。
