- id: RHCSA-17-QA-019
  type: qa
  question: 配置一个新仓库后，推荐的最小验证顺序是什么？
  answer: 读取 repo 文件 → `dnf repolist --all` → `dnf makecache --refresh` → `dnf repoquery --repo <id> <代表包>`。
  extra: ''
  source:
  - RH124
  - dnf(8)
  tags:
