- id: RHCSA-17-QA-001
  type: qa
  question: 仓库定义、仓库内容和 DNF 缓存分别是什么？
  answer: 定义是客户端 `.repo` section；内容是服务端或本地的 RPM 与 `repodata`；缓存是客户端保存的元数据/下载副本。
  extra: 修改一层不会自动修复另外两层。
  source:
  - RH124
  - dnf.conf(5)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::comparison
  - priority::P0
- id: RHCSA-17-QA-002
  type: qa
  question: 一个目录中只有 RPM 文件，为什么还不能称为可用 DNF 仓库？
  answer: DNF 还需要通过 `repodata/repomd.xml` 读取包和依赖元数据。
  extra: 普通目录可用 `createrepo_c` 生成基础元数据。
  source:
  - createrepo_c(8)
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::concept
  - priority::P0
- id: RHCSA-17-QA-003
  type: qa
  question: '`repodata/repomd.xml` 在仓库中承担什么角色？'
  answer: 它是仓库元数据入口，记录其他元数据文件的位置和校验信息。
  extra: 它不是 RPM 包本身。
  source:
  - dnf(8)
  - createrepo_c(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::concept
  - priority::P1
- id: RHCSA-17-QA-004
  type: qa
  question: '`repoquery` 有结果、依赖可解、事务已提交三者有什么区别？'
  answer: '`repoquery` 证明候选元数据可见；依赖可解证明求解器能生成计划；事务提交才改变已安装状态。'
  extra: 三者需分别取证。
  source:
  - dnf(8)
  - repoquery
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::comparison
  - priority::P0
- id: RHCSA-17-QA-005
  type: qa
  question: 仓库中存在某 RPM，但普通 DNF 查询无结果，至少有哪些候选过滤层？
  answer: 仓库启用范围、架构、exclude/include、priority、module filtering 和元数据缓存。
  extra: 不要仅凭服务端文件列表判断客户端候选。
  source:
  - dnf.conf(5)
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::verification
  - priority::P0
- id: RHCSA-17-QA-006
  type: qa
  question: 为什么“DNF 返回成功”不能直接写成“软件功能已完成”？
  answer: DNF 只覆盖软件事务；配置、服务、监听、安全策略和外部功能仍需各自验证。
  extra: ''
  source:
  - RH124
  tags:
  - exam::rhcsa
  - chapter::dnf-repositories-modules-groups
  - topic::repo-model
  - card::boundary
  - priority::P0
- id: RHCSA-17-CLOZE-007
  type: cloze
  text: DNF 证据链通常是：{{c1::仓库定义}} → {{c2::元数据}} → {{c3::候选与依赖求解}} → {{c4::事务}}。
  extra: 后续再交接到 RPM 已安装状态与应用功能。
