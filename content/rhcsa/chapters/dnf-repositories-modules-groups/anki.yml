- id: RHCSA-17-QA-100
  type: qa
  question: 元数据成功但安装报 GPG key 不匹配，最小修复流程是什么？
  answer: 检查 `gpgcheck/gpgkey` 和完整错误 → 核对发布者 key/来源 → 修正 key 或仓库 → 保持校验重新预览和安装。
  extra: ''
