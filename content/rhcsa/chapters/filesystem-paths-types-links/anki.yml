  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-04-K01-QA-007
  type: qa
  question: 在 RHEL 9 上看到 `/bin -> usr/bin`，说明了什么？
  answer: '`/bin` 是兼容符号链接，最终程序路径位于 `/usr/bin`。'
  extra: 应使用 `ls -ld /bin`、`readlink /bin` 和 `realpath -e /bin` 查询目标系统，而不是只背目录名。
  source:
  - RHEL9-filesystem-layout
  - RHCSA-Course-03
