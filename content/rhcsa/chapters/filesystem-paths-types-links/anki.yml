  - chapter::filesystem-paths-types-links
  - topic::path-resolution
  - card::command
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-04-K02-QA-009
  type: qa
  question: 规范化一个允许尚不存在分量的路径，`realpath` 使用哪个选项？
  answer: '`-m` 或 `--canonicalize-missing`。'
  extra: 它适合计划创建路径或分析失效目标文本，不证明对象已经存在。
  source:
