- id: RHCSA-04-D01-QA-009
  type: qa
  question: 相对链接看起来文本正确却指向错误位置，首先应从哪个目录推演？
  answer: 从符号链接所在目录，而不是当前 Shell 目录。
  extra: 可先取得链接父目录，再结合 `readlink` 的文本推演，最后用 `namei -l` 验证。
