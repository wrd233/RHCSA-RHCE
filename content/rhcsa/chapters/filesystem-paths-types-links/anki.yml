- id: RHCSA-04-K06-QA-001
  type: qa
  question: 创建符号链接的命令骨架是什么？
  answer: '`ln -s -- TARGET_TEXT LINK_NAME`'
  extra: TARGET_TEXT 会原样保存为链接内容，可以是相对或绝对路径。
