- id: RHCSA-FILES-K01-QA-005
  type: qa
  question: 删除符号链接目标后，链接本身会怎样？
  answer: 链接对象仍存在，但跟随它时目标路径无法解析，形成悬空链接。
  extra: '`readlink` 仍可显示其保存的路径文本。'
