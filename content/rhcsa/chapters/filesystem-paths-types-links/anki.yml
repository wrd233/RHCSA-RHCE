- id: RHCSA-04-O02-QA-004
  type: qa
  question: 安全替换一个已确认符号链接的命令链是什么？
  answer: '`ls -ld LINK; readlink LINK; test -L LINK && rm -- LINK && ln -s -- TARGET_TEXT LINK`'
  extra: 真实业务还应评估并发和原子切换；RHCSA 任务至少不能删除未知普通文件或目录。
