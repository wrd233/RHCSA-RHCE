- id: RHCSA-04-K04-QA-006
  type: qa
  question: 检查符号链接目标的内容格式，`file` 使用哪个关键选项？
  answer: '`-L` 或 `--dereference`。'
  extra: 不加 `-L` 时通常报告链接对象及其目标文本。
