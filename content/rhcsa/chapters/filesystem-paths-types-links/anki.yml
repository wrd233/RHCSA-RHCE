- id: RHCSA-04-K06-QA-009
  type: qa
  question: 删除指向目录的符号链接本身，应使用什么安全形式？
  answer: '`rm -- LINK_NAME`，不要给链接名称追加 `/`。'
  extra: 操作前用 `ls -ld` 和 `test -L` 确认它确实是符号链接。
