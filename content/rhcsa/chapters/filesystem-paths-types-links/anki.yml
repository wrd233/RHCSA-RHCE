- id: RHCSA-04-K04-QA-001
  type: qa
  question: '`ls -l` 首字符 `-`、`d`、`l` 分别表示什么？'
  answer: 普通文件、目录、符号链接。
  extra: 首字符表示对象类型，后续权限位属于第 08 章。
  source:
