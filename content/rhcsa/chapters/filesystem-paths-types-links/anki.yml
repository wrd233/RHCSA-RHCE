- id: RHCSA-04-D01-QA-001
  type: qa
  question: 符号链接访问失败时，推荐的第一组证据是什么？
  answer: '`ls -ld LINK` 与 `readlink LINK`。'
  extra: 先证明链接对象和原始目标文本，再进入完整路径解析。
