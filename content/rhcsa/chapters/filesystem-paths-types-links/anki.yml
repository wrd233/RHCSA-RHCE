- id: RHCSA-04-K02-QA-003
  type: qa
  question: 路径分量 `.` 与 `..` 分别表示什么？
  answer: '`.` 表示当前目录；`..` 表示父目录。'
  extra: 在根目录中继续解析 `..` 仍停留在根目录。
  source:
  - path_resolution(7)
  - RH124-RHEL9-Ch03
  tags:
