  type: qa
  question: 诊断路径时，`ls -ld` 能证明而 `namei -l` 不能替代的重点是什么？
  answer: '`ls -ld` 便于确认输入名称自身的类型和链接展示；`namei` 重点是完整分量链。'
  extra: 两者组合比单独使用更清楚。
