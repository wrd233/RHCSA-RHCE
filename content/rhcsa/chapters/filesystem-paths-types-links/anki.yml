  priority: P1
- id: RHCSA-04-O01-QA-002
  type: qa
  question: 只读取符号链接保存的原始目标文本，使用什么命令？
  answer: '`readlink -- LINK`'
  extra: 它不保证目标存在，也不规范化相对目标。
  source:
  - readlink(1)
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
