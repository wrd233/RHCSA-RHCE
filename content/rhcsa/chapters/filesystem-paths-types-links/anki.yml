- id: RHCSA-04-K05-QA-004
  type: qa
  question: 为什么两个硬链接名称显示相同所有者和权限？
  answer: 这些元数据保存在共享的同一个 inode 中。
  extra: 修改权限会影响通过所有硬链接名称访问该对象的结果；具体权限规则见第 08 章。
