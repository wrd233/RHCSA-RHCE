  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K02-QA-012
  type: qa
  question: 脚本中依赖相对路径时，最容易遗漏的运行状态是什么？
  answer: 当前工作目录。
  extra: 交互 Shell、cron、systemd 或其他调用者的工作目录可能不同；稳定任务应明确工作目录或使用绝对路径。
  source:
