- id: RHCSA-04-D01-QA-005
  type: qa
  question: 硬链接报告 `Invalid cross-device link` 时，为什么改用复制不能算同一答案？
  answer: 复制创建独立 inode 和独立数据对象，不满足硬链接“同一对象”的终态。
  extra: 应根据题目明确选择同文件系统位置、符号链接或复制。
