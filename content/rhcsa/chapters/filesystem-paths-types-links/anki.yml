- id: RHCSA-04-O01-QA-001
  type: qa
  question: '`stat LINK` 与 `stat -L LINK` 分别检查什么？'
  answer: 前者检查符号链接自身；后者跟随链接并检查目标对象。
  extra: 诊断时应明确需要哪一层，不能混用输出。
  source:
