- id: RHCSA-04-K01-QA-006
  type: qa
  question: '`/proc`、`/sys` 与 `/dev` 为什么不能简单理解为普通磁盘目录？'
  answer: 它们主要提供内核、设备和运行状态接口，其中大量对象由内核或设备管理机制动态生成。
  extra: 本章只识别对象性质；设备管理和内核调优在后续章节展开。
  source:
  - hier(7)
  - RHCSA-Course-03
  tags:
