- id: RHCSA-04-K04-QA-005
  type: qa
  question: '`stat` 与 `file` 的“类型”分别偏向什么？'
  answer: '`stat` 查看 inode 对象类型和元数据；`file` 根据内容、magic 等判断格式。'
  extra: 两者不能互相替代。
  source:
  - stat(1)
