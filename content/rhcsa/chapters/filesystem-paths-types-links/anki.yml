- id: RHCSA-04-O02-QA-001
  type: qa
  question: 创建链接前最小基线调查是什么？
  answer: 至少执行 `ls -ld -- TARGET LINK_NAME`，确认源对象和目的名称当前状态。
  extra: 目的名称已存在为目录时，`ln` 的落点语义可能与预期不同。
