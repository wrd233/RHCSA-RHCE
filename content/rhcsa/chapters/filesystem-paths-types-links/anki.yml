- id: RHCSA-04-K06-QA-003
  type: qa
  question: 符号链接为什么可以跨文件系统？
  answer: 它保存的是目标路径文本，不直接引用目标文件系统中的 inode。
  extra: 可创建不等于目标一定存在或可访问。
  source:
  - symlink(7)
