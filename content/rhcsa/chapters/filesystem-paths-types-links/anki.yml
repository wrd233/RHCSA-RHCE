- id: RHCSA-04-K05-QA-005
  type: qa
  question: 删除一个硬链接名称后，剩余名称为什么仍可读取数据？
  answer: 删除只移除了一个目录项并减少链接计数，inode 仍被其他名称引用。
  extra: 最后名称删除后还要考虑打开文件描述符。
