  priority: P1
- id: RHCSA-04-O01-QA-006
  type: qa
  question: '`namei -x` 主要增加哪类边界信息？'
  answer: 标记挂载点或文件系统边界。
  extra: 具体输出格式随 util-linux 版本而异，使用前查看目标系统帮助。
