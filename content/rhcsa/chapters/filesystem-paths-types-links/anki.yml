- id: RHCSA-04-O01-QA-003
  type: qa
  question: 在链接调查中，`readlink LINK` 与带规范化选项的 `readlink` / `realpath` 分别回答什么问题？
  answer: '`readlink LINK` 读取符号链接保存的原始目标文本；`readlink -f/-e/-m` 或 `realpath -e/-m` 按各自存在性规则规范化路径。'
  extra: '`-e` 要求所有分量存在；`-m` 允许分量缺失；`-f` 的存在性边界按 GNU coreutils 语义判断。规范化结果不能替代原始链接文本。'
  source:
  - readlink(1)
  - realpath(1)
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::path-tools
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-O01-QA-004
  type: qa
  question: '`realpath -e LINK` 失败而 `readlink LINK` 成功，最合理的初步判断是什么？'
  answer: 链接对象存在，但目标解析链中至少有一个分量缺失或错误。
  extra: 下一步使用 `namei -l LINK` 找第一处失败。
  source:
