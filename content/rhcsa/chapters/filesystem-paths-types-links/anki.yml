- id: RHCSA-04-K06-QA-007
  type: qa
  question: 悬空符号链接的 `readlink` 与 `realpath -e` 通常分别怎样？
  answer: '`readlink` 仍可输出目标文本；`realpath -e` 无法证明完整路径存在。'
  extra: 这正好区分“链接对象存在”和“目标链可解析”。
