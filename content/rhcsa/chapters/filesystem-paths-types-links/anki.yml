  priority: P1
- id: RHCSA-04-K01-QA-005
  type: qa
  question: '`/usr` 与 `/usr/local` 的管理边界是什么？'
  answer: '`/usr` 主要承载发行版提供的程序、库和共享数据；`/usr/local` 用于本地管理员安装的内容。'
  extra: 该边界便于避免本地内容与发行版包管理内容混杂。
  source:
  - hier(7)
  - RHCSA-Course-03
