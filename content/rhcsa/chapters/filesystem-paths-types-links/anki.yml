- id: RHCSA-04-K01-QA-002
  type: qa
  question: 系统和服务的主机特定配置通常放在哪个目录？
  answer: '`/etc`。'
  extra: 配置文件仍可能由软件包、管理员或工具生成；具体配置加载顺序属于相应服务章节。
  source:
  - hier(7)
  - RHCSA-Course-03
