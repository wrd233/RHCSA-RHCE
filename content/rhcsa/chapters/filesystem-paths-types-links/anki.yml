- id: RHCSA-04-K06-QA-010
  type: qa
  question: 为什么不能用 `cat LINK` 查看符号链接保存的原始文本？
  answer: '`cat` 通常跟随链接并读取目标内容；原始目标文本应使用 `readlink`。'
  extra: 目标是目录或失效时，`cat` 还会产生不同错误，不能替代链接取证。
