- id: RHCSA-04-D01-QA-006
  type: qa
  question: 路径逐层显示权限问题后，本章的正确边界是什么？
  answer: 记录出问题的路径分量并转到第 08 章分析目录穿越和权限，不默认执行 `chmod 777`。
  extra: '`namei -l` 在本章只是路径证据入口。'
