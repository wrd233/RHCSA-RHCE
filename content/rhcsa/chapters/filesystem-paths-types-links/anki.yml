- id: RHCSA-04-K06-QA-002
  type: qa
  question: 符号链接自身与目标对象的 inode 是否相同？
  answer: 不同。符号链接是拥有自己 inode 的独立对象。
  extra: '`stat LINK` 看链接自身，`stat -L LINK` 看目标。'
  source:
