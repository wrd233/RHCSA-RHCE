- id: RHCSA-04-O01-QA-007
  type: qa
  question: 命令参数中的 `--` 有什么路径安全价值？
  answer: 结束选项解析，使后续以 `-` 开头的名称按路径参数处理。
  extra: 它不能修复错误路径，只避免名称被误解释为选项。
  source:
