  priority: P0
- id: RHCSA-04-K01-QA-008
  type: qa
  question: 为什么不能把 `/tmp` 当作可靠的长期存储目录？
  answer: 它面向临时数据，内容可能被清理，生命周期不由业务文件自身保证。
  extra: 需要持久保存的数据应放入符合业务和系统约定的持久目录。
  source:
