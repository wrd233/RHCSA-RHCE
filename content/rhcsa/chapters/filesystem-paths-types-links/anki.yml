- id: RHCSA-04-K06-QA-004
  type: qa
  question: 符号链接能否指向目录或尚不存在的路径？
  answer: 都可以。它保存路径文本，创建时不要求目标已经存在。
  extra: 目标不存在时形成悬空链接。
  source:
  - symlink(7)
  - ln(1)
