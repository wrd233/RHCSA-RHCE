- id: RHCSA-04-D01-QA-010
  type: qa
  question: '`realpath -m` 产生一个规范路径，能否证明对象存在？'
  answer: 不能。`-m` 允许缺失分量，只做词法和链接相关的规范化。
  extra: 存在性验收使用 `realpath -e`、`stat` 或任务要求的功能检查。
