- id: RHCSA-04-D01-QA-002
  type: qa
  question: 诊断悬空或指错的链接，下一条最有区分度的路径证据是什么？
  answer: '`namei -l LINK`。'
  extra: 它能展示每一级路径和符号链接展开，定位第一处失败。
