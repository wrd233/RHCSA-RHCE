  model: RedHat-QA
  priority: P1
- id: RHCSA-04-O01-QA-005
  type: qa
  question: '`namei -l` 的核心诊断价值是什么？'
  answer: 逐层显示路径分量，并在遇到符号链接时展开目标链。
  extra: 它帮助定位第一处不存在、类型错误或链接循环的分量。
  source:
