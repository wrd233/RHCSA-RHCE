- id: RHCSA-04-T02-QA-002
  type: qa
  question: 删除源名称后，任务二中的硬链接和符号链接分别怎样？
  answer: 硬链接仍访问旧 inode；符号链接对象仍存在，但目标路径悬空。
  extra: 用 `stat` 验证硬链接，用 `readlink` 与 `realpath -e` 区分链接和目标。
  source:
  - Lecture-RHCSA-04-T02
