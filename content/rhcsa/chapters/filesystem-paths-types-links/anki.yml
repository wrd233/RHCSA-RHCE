- id: RHCSA-04-K05-QA-006
  type: qa
  question: 题目要求为目录建立链接时，为什么不应选择硬链接？
  answer: 普通目录硬链接会破坏树状结构并产生循环风险，常规工作流也会被系统拒绝。
  extra: 目录引用使用符号链接，并验证最终解析。
  source:
