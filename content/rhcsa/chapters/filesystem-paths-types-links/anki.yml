- id: RHCSA-04-K04-QA-007
  type: qa
  question: 为什么文件扩展名不能作为 Linux 对象类型的最终证据？
  answer: 扩展名只是名称的一部分，目录、链接和二进制文件都可以使用任意后缀。
  extra: 使用 `ls -ld`/`stat` 判断对象类型，使用 `file` 判断内容格式。
  source:
