- id: RHCSA-04-T01-QA-003
  type: qa
  question: 任务一修复后，证明链接原文和最终路径分别用什么？
  answer: '`readlink /srv/reporting/current` 与 `realpath -e /srv/reporting/current/bin/report`。'
