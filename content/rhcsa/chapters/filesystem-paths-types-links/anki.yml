- id: RHCSA-04-K06-QA-008
  type: qa
  question: 目标名称删除后又在同一路径创建新文件，符号链接会指向哪个对象？
  answer: 会按路径解析到新文件的 inode。
  extra: 符号链接绑定的是名称路径，不是旧 inode。
