- id: RHCSA-04-K04-QA-004
  type: qa
  question: 用 `stat` 只输出对象类型文本，格式字段是什么？
  answer: '`%F`。例如：`stat -c %F -- PATH`。'
  extra: 若 PATH 是符号链接，是否跟随由 `-L` 决定。
  source:
  - stat(1)
  - GNU-coreutils-manual
