  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-001
  type: qa
  question: 目录项在路径解析中保存什么核心映射？
  answer: 保存名称到所属文件系统 inode 的映射。
  extra: 路径解析会在每一级目录中查找下一个名称。
  source:
  - inode(7)
  - RHCSA-Course-16
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-002
  type: qa
  question: 普通文件名是否保存在该文件的 inode 中？
  answer: 不保存。文件名属于目录项，inode 保存对象元数据和数据引用。
  extra: 同一 inode 因而可以有多个硬链接名称。
  source:
  - inode(7)
  - RHCSA-Course-16
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-003
  type: qa
  question: inode 通常保存哪些高价值元数据？
  answer: 对象类型、模式位、UID/GID、大小、时间、链接计数以及数据位置等。
  extra: 具体内部布局由文件系统实现；本章不展开数据块寻址算法。
  source:
  - inode(7)
  - RHCSA-Course-16
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-004
  type: qa
  question: 判断两个路径是否为同一对象，为什么不能只比较 inode 数字？
  answer: inode 编号只在所属文件系统内唯一，还必须比较设备或文件系统标识。
  extra: 推荐比较 `stat` 的 `%d:%i`。
  source:
  - inode(7)
  - stat(1)
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
