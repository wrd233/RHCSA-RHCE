- id: RHCSA-04-D01-QA-003
  type: qa
  question: '`Not a directory` 通常提示路径链中的什么问题？'
  answer: 某个仍有后续分量的中间对象不是目录。
  extra: 使用 `namei -l` 找到第一处普通文件或错误链接目标。
