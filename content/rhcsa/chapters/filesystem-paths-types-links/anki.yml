  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K02-QA-008
  type: qa
  question: 要求路径的所有分量当前都存在，并输出规范绝对路径，使用什么命令骨架？
  answer: '`realpath -e -- PATH`'
  extra: '`-e` 适合验证现有路径；失败时继续用 `namei -l` 查第一处问题。'
  source:
  - realpath(1)
  tags:
