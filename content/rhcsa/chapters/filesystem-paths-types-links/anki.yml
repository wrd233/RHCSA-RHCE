- id: RHCSA-04-K04-QA-003
  type: qa
  question: '`ls -l` 首字符 `p` 与 `s` 分别表示什么？'
  answer: FIFO/命名管道与 socket。
  extra: 它们常用于进程间通信，不能按普通持久文件内容理解。
