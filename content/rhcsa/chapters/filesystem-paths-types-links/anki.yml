- id: RHCSA-04-K04-QA-002
  type: qa
  question: '`ls -l` 首字符 `b` 与 `c` 分别表示什么？'
  answer: 块设备与字符设备。
  extra: 设备节点是访问设备的文件系统接口，不等同于普通数据文件。
  source:
