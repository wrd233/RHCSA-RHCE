- id: RHCSA-04-O02-QA-003
  type: qa
  question: 为什么不把 `ln -sf` 作为替换链接的默认答案？
  answer: 它会直接覆盖或重建目的名称，容易隐藏已有对象类型和错误状态。
  extra: 先 `ls -ld`、`test -L`、`readlink`，确认后再最小删除并创建。
