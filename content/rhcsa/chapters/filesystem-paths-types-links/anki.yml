- id: RHCSA-04-K02-QA-001
  type: qa
  question: 绝对路径与相对路径的解析起点分别是什么？
  answer: 绝对路径从 `/` 开始；相对路径从进程当前工作目录开始。
  extra: 同一个相对路径在不同工作目录中可能指向不同对象。
  source:
  - path_resolution(7)
  - RH124-RHEL9-Ch03
  tags:
