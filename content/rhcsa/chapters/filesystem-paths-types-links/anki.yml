- id: RHCSA-04-O01-QA-008
  type: qa
  question: 需要同时输出设备、inode、链接计数、类型和名称，推荐什么 `stat` 骨架？
  answer: '`stat -c ''device=%d inode=%i links=%h type=%F name=%N'' -- PATH`'
  extra: 这是对象关系的稳定证据，比面向人的默认输出更适合比较。
