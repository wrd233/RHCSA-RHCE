- id: RHCSA-04-T02-QA-001
  type: qa
  question: 任务二中，硬链接与源名称的核心验收关系是什么？
  answer: 设备标识和 inode 相同，链接计数反映新增目录项。
  extra: 名称和路径位置可以不同。
