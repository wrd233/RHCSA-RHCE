  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-007
  type: qa
  question: 普通文件的硬链接计数表示什么？
  answer: 表示当前有多少目录项名称引用该 inode。
  extra: 打开文件描述符不是硬链接计数的一部分，但会影响最后名称删除后的生命周期。
  source:
  - inode(7)
  - unlink(2)
  tags:
