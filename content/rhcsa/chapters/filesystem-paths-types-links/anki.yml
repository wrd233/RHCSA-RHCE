- id: RHCSA-04-K02-QA-010
  type: qa
  question: 相对符号链接目标从哪里开始解释？
  answer: 从符号链接所在目录开始解释。
  extra: 不是从创建链接时的工作目录，也不是从调用者当前目录解释。
  source:
  - ln(1)
  - link(2)
  - symlink(7)
  - RH124-RHEL9-Ch03
  tags:
