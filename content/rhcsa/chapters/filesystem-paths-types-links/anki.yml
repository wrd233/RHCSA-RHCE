- id: RHCSA-04-D01-QA-004
  type: qa
  question: '`Too many levels of symbolic links` 最常见的假设是什么？'
  answer: 路径中存在直接或间接符号链接循环。
  extra: 保留现状，用 `readlink` 和 `namei -l` 展开链，而不是无差别删除目录。
