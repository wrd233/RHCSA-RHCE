- id: RHCSA-04-K01-QA-001
  type: qa
  question: Linux 普通路径的统一起点是什么？
  answer: '`/`。绝对路径从当前进程看到的根目录开始解析。'
  extra: 单根目录树可以接入多个文件系统；统一命名空间不代表所有目录都在同一文件系统。
  source:
  - hier(7)
  - RH124-RHEL9-Ch03
