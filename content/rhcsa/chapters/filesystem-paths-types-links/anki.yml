  question: 修复 `current` 前，为什么必须先执行 `ls -ld` 和 `test -L`？
  answer: 为了确认目的名称确实是允许替换的符号链接，避免删除普通文件或目录。
  extra: 无调查的 `ln -sf` 不符合最小修改原则。
