  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K02-QA-002
  type: qa
  question: 查看当前 Shell 工作目录使用什么命令？
  answer: '`pwd`。'
  extra: 调查相对路径前先记录 `pwd`，避免把当前目录假设成任务目录。
  source:
  - RH124-RHEL9-Ch03
