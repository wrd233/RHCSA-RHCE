  model: RedHat-QA
  priority: P2
- id: RHCSA-04-K05-QA-007
  type: qa
  question: 硬链接失败并报告跨设备错误时，下一条最有区分度的证据是什么？
  answer: 比较源文件和新名称父目录的 `stat -c 'device=%d mount=%m name=%N'`。
  extra: 设备或挂载点不同即不满足硬链接对象模型。
