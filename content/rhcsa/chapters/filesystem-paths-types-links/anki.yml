- id: RHCSA-04-D01-QA-007
  type: qa
  question: 名称已经删除但磁盘空间未释放，下一步应按什么假设链调查？
  answer: 先查其他硬链接和链接计数，再查已识别进程是否仍持有打开文件描述符。
  extra: 不要无调查终止进程；进程取证属于运行时章节。
