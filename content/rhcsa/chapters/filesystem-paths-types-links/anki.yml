- id: RHCSA-04-T01-QA-004
  type: qa
  question: 为什么 `readlink current` 输出正确仍不能单独验收任务一？
  answer: 它只证明保存的文本，不能证明目标分量存在，也不能证明剩余 `/bin/report` 可解析。
  extra: 还要使用 `namei -l`、`realpath -e` 和目标对象检查。
