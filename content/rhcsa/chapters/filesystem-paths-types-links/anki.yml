- id: RHCSA-04-O02-QA-008
  type: qa
  question: 链接相关命令的本地帮助入口有哪些？
  answer: '`man ln`、`man stat`、`man readlink`、`man realpath`、`man namei`。'
  extra: 需要确认目标系统参数时优先使用本机手册和 `--help`。
