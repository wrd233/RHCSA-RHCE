  model: RedHat-QA
  priority: P0
- id: RHCSA-04-K03-QA-005
  type: qa
  question: 用 `stat` 输出设备、inode 和链接计数的命令骨架是什么？
  answer: '`stat -c ''device=%d inode=%i links=%h name=%N'' -- PATH`'
  extra: '`%d` 与 `%i` 用于对象身份，`%h` 用于观察硬链接计数。'
  source:
  - stat(1)
  - GNU-coreutils-manual
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
  - card::command
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-04-K03-QA-006
  type: qa
  question: 同一文件系统内重命名普通文件时，inode 通常怎样变化？
  answer: 通常保持不变，主要变化是目录项中的名称或所在目录。
  extra: 跨文件系统移动通常需要复制并删除旧名称，不能沿用原 inode。
  source:
  - rename(2)
  - RHCSA-Course-16
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
