- id: RHCSA-04-K06-QA-005
  type: qa
  question: 绝对符号链接与相对符号链接的核心差异是什么？
  answer: 绝对目标从 `/` 解析；相对目标从链接所在目录解析。
  extra: 迁移整棵目录树时相对链接可能更便携，单独移动链接则可能失效。
  source:
