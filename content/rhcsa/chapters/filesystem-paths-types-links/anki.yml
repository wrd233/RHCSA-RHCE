- id: RHCSA-04-K06-QA-006
  type: qa
  question: 把相对符号链接本身移动到另一个目录，最需要重新验证什么？
  answer: 目标文本从新链接所在目录解释后是否仍到达预期对象。
  extra: 使用 `readlink` 保留原文，再用 `namei -l` 和 `realpath -e` 验证。
