- id: RHCSA-04-T02-QA-003
  type: qa
  question: 在原路径创建新文件后，任务二中的符号链接与硬链接分别指向什么？
  answer: 符号链接按名称解析到新 inode；硬链接继续引用旧 inode。
  extra: 这是路径绑定与 inode 绑定的核心差异。
  source:
