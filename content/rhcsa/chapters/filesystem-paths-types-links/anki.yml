  priority: P0
- id: RHCSA-FILES-K01-QA-003
  type: qa
  question: 硬链接的两个名称在 inode 上是什么关系？
  answer: 在同一文件系统中指向同一个 inode 和同一份数据。
  extra: '`stat` 应同时比较设备标识、inode 和链接计数。'
  source:
