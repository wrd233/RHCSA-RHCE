- id: RHCSA-04-T02-QA-004
  type: qa
  question: 任务二为什么要求 `stat -L report.soft`？
  answer: 为了跟随符号链接并观察它当前解析到的目标 inode。
  extra: '`stat report.soft` 只检查链接自身，不能证明目标对象身份。'
