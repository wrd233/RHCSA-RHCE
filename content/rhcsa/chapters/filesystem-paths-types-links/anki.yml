- id: RHCSA-04-K01-QA-003
  type: qa
  question: '`/var` 与 `/run` 的核心区别是什么？'
  answer: '`/var` 面向可变且通常需要持久保存的数据；`/run` 保存当前启动周期的运行时状态。'
  extra: 重启后 `/run` 内容通常重建，不能把它当作长期持久存储。
  source:
  - hier(7)
  - RHCSA-Course-03
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::fhs
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K01-QA-004
  type: qa
  question: '`/home` 与 `/root` 分别服务于谁？'
  answer: '`/home` 通常包含普通用户主目录；`/root` 是 root 用户的主目录。'
  extra: 用户实际主目录以账户数据库中的配置为准。
  source:
  - hier(7)
  - RHCSA-Course-03
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
