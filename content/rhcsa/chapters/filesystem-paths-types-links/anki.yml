- id: RHCSA-04-O02-QA-007
  type: qa
  question: '`rm LINK` 删除符号链接时会删除目标吗？'
  answer: 不会；它删除的是符号链接这个目录项。
  extra: 前提是不使用会改变路径语义的尾随 `/`，并且操作对象确实是链接名称。
