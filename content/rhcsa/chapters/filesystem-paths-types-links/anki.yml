  priority: P2
- id: RHCSA-04-K04-QA-008
  type: qa
  question: 查看目录自身而不是列出目录内容，`ls` 使用什么形式？
  answer: '`ls -ld -- DIRECTORY`'
  extra: '`-d` 把目录项本身作为输出对象。'
