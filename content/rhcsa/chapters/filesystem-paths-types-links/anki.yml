- id: RHCSA-04-D01-QA-008
  type: qa
  question: 为什么不能概括说“Linux 命令默认都会跟随符号链接”？
  answer: 中间分量通常需要解析，但最终分量是否跟随取决于具体命令和参数。
  extra: '`stat`/`stat -L`、`readlink`、`rm` 就体现了不同语义。'
