- id: RHCSA-FILES-K01-QA-004
  type: qa
  question: 硬链接为什么不能跨文件系统？
  answer: 目录项只能引用所属文件系统内部的 inode；另一个文件系统无法直接引用该 inode。
  extra: 跨文件系统需要按目标选择符号链接或复制。
