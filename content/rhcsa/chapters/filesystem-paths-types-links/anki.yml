- id: RHCSA-04-K05-QA-003
  type: qa
  question: 硬链接创建后，能从 inode 判断哪个名称是“原件”吗？
  answer: 不能。多个名称地位平等，均可用于访问同一对象。
  extra: “原文件”只是一种操作历史描述，不是 inode 状态。
  source:
