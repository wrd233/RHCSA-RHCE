  - chapter::filesystem-paths-types-links
  - topic::path-resolution
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K02-QA-011
  type: qa
  question: 路径中的中间符号链接怎样参与解析？
  answer: 链接的目标文本替换当前分量，然后与剩余路径继续解析。
  extra: 这解释了目录链接后还可以继续追加 `/bin/report` 等剩余分量。
  source:
  - path_resolution(7)
  - symlink(7)
  tags:
