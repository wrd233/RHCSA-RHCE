- id: RHCSA-FILES-K01-QA-002
  type: qa
  question: 逐层查看路径中每个分量及其类型和模式摘要，推荐什么命令？
  answer: '`namei -l PATH`'
  extra: 它比只看最终文件的 `ls -l` 更适合路径链排错；完整权限计算留到第 08 章。
  source:
