  priority: P0
- id: RHCSA-04-K02-QA-004
  type: qa
  question: 为什么普通文件路径末尾追加 `/` 可能报错？
  answer: 尾随 `/` 要求最终解析结果具有目录语义；普通文件不是目录。
  extra: 这类错误应检查最终分量类型，而不是删除尾随斜线后忽略对象要求。
  source:
  - path_resolution(7)
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::path-resolution
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K02-QA-005
  type: qa
  question: Linux 路径分量中不能包含哪两个特殊内容？
  answer: 斜线 `/` 不能作为分量内部字符；NUL 字符不能出现在路径名中。
  extra: 其他字符虽可能合法，但空白和控制字符会增加命令行处理风险。
  source:
  - path_resolution(7)
  - inode(7)
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::path-resolution
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-04-K02-QA-006
  type: qa
  question: '`~` 是内核路径解析中的特殊目录吗？'
  answer: 不是。`~` 通常由 Shell 在执行命令前展开为主目录路径。
  extra: 完整展开规则属于“Shell 解析、引用、展开与命令组合”章节。
  source:
  - bash(1)
  - Chapter-RHCSA-01
  tags:
  - exam::rhcsa
  - chapter::filesystem-paths-types-links
  - topic::path-resolution
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-04-K02-QA-007
  type: qa
  question: '`pwd` 与 `pwd -P` 的主要区别是什么？'
  answer: '`pwd` 通常保留逻辑路径；`pwd -P` 展开符号链接并显示物理路径。'
  extra: 两者分别服务于导航语境和真实落点调查。
  source:
