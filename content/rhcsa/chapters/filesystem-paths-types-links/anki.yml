  - chapter::filesystem-paths-types-links
  - topic::inode-dirent
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-04-K03-QA-008
  type: qa
  question: 最后一个硬链接名称删除后，文件一定立即回收吗？
  answer: 不一定；若仍有进程打开该文件，对象会保留到最后一个相关文件描述符关闭。
  extra: 名称消失和对象最终回收是两个状态。
  source:
