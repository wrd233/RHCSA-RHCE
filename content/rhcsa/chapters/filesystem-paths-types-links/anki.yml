- id: RHCSA-04-O02-QA-002
  type: qa
  question: '`ln` 的 `-T`/`--no-target-directory` 解决什么歧义？'
  answer: 把目的路径严格当作一个名称，而不是在其为目录时把新链接创建到目录内部。
  extra: 使用前查看目标 RHEL 9 的 `ln --help`；它不能替代操作前调查。
