- id: RHCSA-04-O02-QA-005
  type: qa
  question: 硬链接创建后的最小身份验收组合是什么？
  answer: 比较源和新名称的设备标识、inode 和链接计数。
  extra: 推荐：`stat -c '%d:%i %h %N' -- SOURCE HARD_LINK`。
