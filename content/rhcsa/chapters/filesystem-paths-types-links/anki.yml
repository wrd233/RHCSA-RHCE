- id: RHCSA-04-K05-QA-008
  type: qa
  question: 只比较两个路径的内容哈希，能否验收硬链接任务？
  answer: 不能。哈希只验收字节内容，硬链接必须证明同一文件系统和同一 inode。
  extra: 使用 `%d:%i`，并可检查 `%h`。
