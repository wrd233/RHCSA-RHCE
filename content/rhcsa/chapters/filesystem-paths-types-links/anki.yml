- id: RHCSA-04-O02-QA-006
  type: qa
  question: 符号链接创建后的分层验收组合是什么？
  answer: '`ls -ld` 看链接自身，`readlink` 看原文，`namei -l` 看链路，`realpath -e` 看最终现有路径，`stat -L` 看目标对象。'
  extra: 每层证据回答不同问题。
