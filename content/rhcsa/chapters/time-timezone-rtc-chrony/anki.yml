- id: RHCSA-14-O01-QA-001
  type: qa
  question: 怎样同时查看系统时钟的本地显示和 UTC 显示？
  answer: '```bash

    date ''+%F %T %z %Z''

    date -u ''+%F %T %z %Z''

    ```'
