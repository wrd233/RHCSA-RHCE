- id: RHCSA-14-O05-QA-003
  type: qa
  question: '`Frequency` 与 `Skew` 大致回答什么问题？'
  answer: '`Frequency` 是本机时钟快慢的长期估计；`Skew` 是该频率估计的不确定性。'
