- id: RHCSA-14-O01-QA-002
  type: qa
  question: '`timedatectl` 中 `NTP service: active` 能否证明系统已经成功同步？'
  answer: 不能。它只说明网络时间同步服务处于活动状态；还要检查 `chronyc sources -v` 和 `chronyc tracking`。
