  type: qa
  question: '`chronyd` active，但来源持续 `^?`。下一条最有区分度的证据链是什么？'
  answer: 配置加载 → 系统名称解析 → 路由与 UDP 123 往返 → 远端状态 → Reach/LastRx 样本 → 来源选择 → tracking。
