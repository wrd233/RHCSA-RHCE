- id: RHCSA-14-K01-QA-002
  type: qa
  question: 改变时区会改变同一时刻的 UTC 值吗？
  answer: 不会。它改变本地显示和按本地时间解释的日历行为，但同一绝对时刻不变。
  extra: ''
