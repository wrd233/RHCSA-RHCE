- id: RHCSA-SERVICES-O03-QA-003
  type: qa
  question: '`chronyc sources -v` 中 `^*`、`^+` 与 `^?` 分别表示什么？'
  answer: '`^*` 是当前选中来源；`^+` 是可接受并参与组合的候选来源；`^?` 表示该来源当前不可选择，可能不可达、未同步或样本不足。'
  extra: 看到 `^?` 应继续检查配置、DNS、UDP 123 往返、远端状态和样本。
  source:
  - chronyc(1)
  - 'RH124: 维护准确的时间'
