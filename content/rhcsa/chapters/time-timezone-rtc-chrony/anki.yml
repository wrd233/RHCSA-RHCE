- id: RHCSA-SERVICES-O03-QA-001
  type: qa
  question: 设置系统时区并确认本地时间与 UTC 的显示关系，推荐使用哪些命令？
  answer: '```bash

    timedatectl set-timezone AREA/CITY

    timedatectl

    date

    date -u

    ```'
  extra: 改变时区只改变本地显示和日历解释，不改变同一时刻的 UTC 值。
  source:
