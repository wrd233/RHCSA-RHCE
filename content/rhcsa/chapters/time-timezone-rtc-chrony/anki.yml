- id: RHCSA-14-O05-QA-002
  type: qa
  question: '`System time`、`Last offset` 与 `RMS offset` 为什么不能互相替代？'
  answer: 它们分别描述当前估计差异、最后一次更新偏差和长期均方根偏差，时间窗口不同。
  extra: ''
