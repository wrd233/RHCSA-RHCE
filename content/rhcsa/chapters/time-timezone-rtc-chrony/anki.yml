  type: qa
  question: 查询有效时区并把系统设置为 `Asia/Shanghai` 的命令骨架是什么？
  answer: '```bash

    timedatectl list-timezones | grep ''^Asia/Shanghai$''

    timedatectl set-timezone Asia/Shanghai

    timedatectl

