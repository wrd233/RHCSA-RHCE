- id: RHCSA-14-K01-QA-001
  type: qa
  question: 系统时钟、时区、RTC 与 NTP 分别解决什么问题？
  answer: 系统时钟提供运行中系统使用的当前墙上时刻；时区把 UTC 转换为本地显示和日历解释；RTC 在关机期间保存时间基准；NTP/chronyd 校准系统时钟。
  extra: ''
  source:
  - 'RH124: 维护准确的时间'
  - 'RHEL 9: Configuring time synchronization'
