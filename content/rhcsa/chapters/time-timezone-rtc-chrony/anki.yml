- id: RHCSA-SERVICES-O03-QA-002
  type: qa
  question: '`chronyc sources -v` 与 `chronyc tracking` 分别回答什么问题？'
  answer: '`sources -v` 以来源为中心，显示可达性、样本和选择状态；`tracking` 以本机时钟为中心，显示参考源、偏差、频率估计和 Leap status。'
  extra: 两者必须结合，不能只看服务 active。
  source:
  - 'RH124: 维护准确的时间'
