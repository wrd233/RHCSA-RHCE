  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-O06-QA-004
  type: qa
  question: 检查本机是否监听 TCP 22 的命令骨架是什么？
  answer: '`ss -lnt sport = :22`'
  extra: 监听存在不证明远端路径和 firewalld 正确。
  source:
