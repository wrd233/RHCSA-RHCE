  type: qa
  question: profile 中静态地址正确，但 `ip -br address` 仍显示旧地址。优先判断什么？
  answer: 新 profile 尚未激活，或另一 profile 仍在该 device 上活动。
  extra: 下一条证据是 `nmcli connection show --active` 和 `nmcli device status`。
