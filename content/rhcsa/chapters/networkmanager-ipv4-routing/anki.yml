- id: RHCSA-18-D01-QA-010
  type: qa
  question: '`nmcli connection down` 后 device 又连接，优先查看什么？'
  answer: 查看 active connection，确认是否自动激活了另一个候选 profile。
  extra: 若要让 device 保持断开，应评估后使用 device disconnect。
