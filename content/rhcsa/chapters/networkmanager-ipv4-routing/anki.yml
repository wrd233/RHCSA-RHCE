- id: RHCSA-NETWORK-K01-QA-001
  type: qa
  question: NetworkManager device 与 connection profile 的区别是什么？
  answer: device 是网卡等物理或虚拟接口；connection profile 是可持久保存并可激活到设备上的配置对象。
  extra: profile 名称、UUID 与接口名是不同身份维度。
  source:
  - RH124 Ch.12
  - nmcli(1)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::object-model
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-NETWORK-K01-QA-002
  type: qa
  question: 查看设备及其活动 connection 映射的命令是什么？
  answer: '`nmcli device status`'
  extra: 全部 profile 使用 `nmcli connection show`。
  source:
  - RH124 Ch.12
  - nmcli(1)
