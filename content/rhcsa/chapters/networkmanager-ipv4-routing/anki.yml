- id: RHCSA-NETWORK-K01-QA-006
  type: qa
  question: '`ping` 网关成功能否证明 DNS 和 TCP 服务正确？'
  answer: 不能。它最多证明对应路径允许了这次 ICMP 交互。
  extra: 名称解析、监听、防火墙和应用协议需要分别验证。
