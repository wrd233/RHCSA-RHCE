  type: qa
  question: 创建绑定 `enp1s0`、名为 `exam-static` 的以太网 profile 骨架是什么？
  answer: '```bash

    nmcli connection add type ethernet ifname enp1s0 con-name exam-static

    ```'
  extra: 创建 profile 不等于已经激活；继续设置目标 IPv4 属性。
