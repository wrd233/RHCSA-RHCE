  - chapter::networkmanager-ipv4-routing
  - topic::gateway-diagnosis
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-D01-QA-005
  type: qa
  question: '`ip route get 198.51.100.44` 走默认网关，但设计要求专用下一跳。最可能缺少什么？'
  answer: 更具体的持久静态路由，或该路由所在 profile 尚未激活。
  extra: 同时检查目的前缀是否写错。
  source:
