- id: RHCSA-18-K01-QA-008
  type: qa
  question: NetworkManager 与内核网络栈分别承担什么角色？
  answer: NetworkManager 管理并激活配置；内核维护当前接口、地址、路由并转发数据包。
  extra: 排错要交叉验证两侧。
