- id: RHCSA-18-O02-QA-003
  type: qa
  question: 设置 `office-lan` 默认网关为 `192.0.2.1` 的命令是什么？
  answer: '`nmcli connection modify office-lan ipv4.gateway 192.0.2.1`'
  extra: 激活后用 `ip route` 验证默认路由。
