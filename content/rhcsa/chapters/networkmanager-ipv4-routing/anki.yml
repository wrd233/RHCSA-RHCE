- id: RHCSA-18-O02-QA-005
  type: qa
  question: 设置 DNS search domain 的 profile 属性是什么？
  answer: '`ipv4.dns-search`'
  extra: 它影响未写完整域名时的搜索候选，但完整解析机制在第 19 章。
