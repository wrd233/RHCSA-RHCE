- id: RHCSA-18-O06-QA-001
  type: qa
  question: 验证静态 profile 时，为什么要显式查询 `connection.autoconnect`？
  answer: 因为当前活动不代表重连或启动时会自动选择该 profile。
  extra: 多 profile 时还要检查优先级和实际重连结果。
  source:
