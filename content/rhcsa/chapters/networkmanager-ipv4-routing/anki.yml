- id: RHCSA-18-W01-QA-001
  type: qa
  question: 通过 SSH 修改当前管理接口前，首要安全条件是什么？
  answer: 存在可用的控制台、BMC、云控制台或第二管理路径。
  extra: 网络切换可能在命令成功时立即中断 SSH。
