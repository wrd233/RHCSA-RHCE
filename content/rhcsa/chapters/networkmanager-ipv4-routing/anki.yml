- id: RHCSA-18-O06-QA-002
  type: qa
  question: profile 正确、活动映射正确后，下一层应验证什么？
  answer: 当前内核地址和前缀，再验证路由表与具体目的路径。
  extra: 不要直接跳到名称或应用测试。
  source:
