  type: qa
  question: '`connection.autoconnect-priority` 与 `ipv4.route-metric` 的区别是什么？'
  answer: 前者选择自动激活哪个 profile；后者影响活动连接产生的候选路由优先级。
  extra: 二者作用对象和阶段不同。
