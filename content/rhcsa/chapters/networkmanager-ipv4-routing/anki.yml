  priority: P1
- id: RHCSA-18-D01-QA-006
  type: qa
  question: 多条默认路由导致出口错误，下一条最有区分度的证据是什么？
  answer: 同时查看 `ip route show default` 和各 profile 的 `ipv4.route-metric`、`ipv4.never-default`。
  extra: 不要无调查删除备用连接。
