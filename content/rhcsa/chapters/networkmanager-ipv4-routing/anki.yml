- id: RHCSA-NETWORK-K01-QA-003
  type: qa
  question: 只查看已激活的 NetworkManager profile，使用什么命令？
  answer: '`nmcli connection show --active`'
  extra: 修改未激活 profile 不会自动改变当前内核地址和路由。
  source:
  - RH124 Ch.12
  - nmcli(1)
