  priority: P2
- id: RHCSA-18-W01-QA-003
  type: qa
  question: 工作变更基线至少应记录哪四类对象？
  answer: device/MAC、profile NAME/UUID、当前地址与路由、评分目的的 `route get` 结果。
  extra: 还应记录 DNS 输入和恢复 profile。
  source:
