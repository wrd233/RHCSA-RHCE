- id: RHCSA-18-O06-QA-003
  type: qa
  question: '`ip route get <DEST>` 结果正确后，为什么 `ping` 仍可能失败？'
  answer: 对端可能不回应 ICMP，也可能存在中间过滤、回程路由或远端故障。
  extra: 本地选路正确与端到端 ICMP 成功是不同结论。
  source:
