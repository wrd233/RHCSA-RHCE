- id: RHCSA-18-O04-QA-005
  type: qa
  question: '`ipv4.never-default yes` 表示什么？'
  answer: 该 profile 不应提供 IPv4 默认路由。
  extra: 它仍可拥有直连路由和特定静态路由。
