- id: RHCSA-18-O05-QA-007
  type: qa
  question: '`nmcli general reload` 与 `nmcli connection reload` 的主要区别是什么？'
  answer: 前者重载 NetworkManager 全局配置相关状态；后者专门重新读取连接 profile。
  extra: 手工修改 keyfile 时首选 connection reload。
