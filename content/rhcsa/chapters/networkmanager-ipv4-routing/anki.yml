- id: RHCSA-18-O01-QA-006
  type: qa
  question: 为什么网络变更基线要同时记录 `ip route` 和 `ip route get <DEST>`？
  answer: 前者记录全局路由表，后者记录评分目标的具体选路结果。
  extra: 修改后可以区分“表发生变化”和“目标路径确实改变”。
