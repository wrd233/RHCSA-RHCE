- id: RHCSA-18-O02-QA-006
  type: qa
  question: '`connection.autoconnect yes` 能否证明 profile 当前已经活动？'
  answer: 不能。它只允许 NetworkManager 在条件满足时自动激活该 profile。
  extra: 当前状态仍看 `connection show --active`。
