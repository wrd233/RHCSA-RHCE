- id: RHCSA-18-K01-QA-001
  type: qa
  question: '`nmcli connection show` 输出中的 `NAME`、`UUID`、`DEVICE` 分别表示什么？'
  answer: '`NAME` 是 profile 的连接 ID；`UUID` 是 profile 的稳定标识；`DEVICE` 是该 profile 当前激活到的设备。'
  extra: '`DEVICE` 为空通常表示 profile 未激活。'
  source:
  - RH124 Ch.12
  - nmcli(1)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::object-model
  - card::output
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-18-K01-QA-002
  type: qa
  question: 一个以太网 device 可以保存多个 connection profile 吗？同一时刻可以全部活动吗？
  answer: 可以保存多个；普通场景同一 device 同一时刻只使用一个主要活动 profile。
  extra: 多 profile 适用于不同网络环境或保留回退配置。
  source:
  - RH124 Ch.12
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::object-model
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-K01-QA-003
  type: qa
  question: profile 已存在，能否据此判断当前 device 已采用该配置？
  answer: 不能。还必须检查活动 connection 和当前内核地址、路由。
  extra: profile 存在只证明持久配置对象存在。
  source:
  - RH124 Ch.12
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::state-model
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-18-K01-QA-004
  type: qa
  question: '`nmcli device status` 显示 `connected` 能证明哪些事实，不能证明哪些事实？'
  answer: 能证明 NetworkManager 认为该 device 有活动连接；不能单独证明目标地址、路由、DNS 或业务功能正确。
  extra: 继续读取 profile、`ip address`、`ip route get` 和必要功能证据。
  source:
  - RH124 Ch.12
  - nmcli(1)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::state-model
  - card::output
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-18-K01-QA-005
  type: qa
  question: '`ip -br link` 中接口有 `UP`，但没有 `LOWER_UP`，通常先怀疑哪一层？'
  answer: 链路/carrier 层，而不是先修改 IPv4 地址。
  extra: 虚拟网卡未连接、网线或交换端口问题都可能造成无 carrier。
  source:
  - ip-link(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::link-state
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-K01-QA-006
  type: qa
  question: 为什么修改 profile 后仍要查询 `ip address` 和 `ip route`？
  answer: 因为 profile 描述持久意图，`ip` 命令才显示内核当前实际采用的地址和路由。
  extra: 重新激活前两者可能不一致。
  source:
  - RH124 Ch.12
  - ip-address(8)
  - ip-route(8)
  tags:
