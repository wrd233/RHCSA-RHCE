- id: RHCSA-18-D01-QA-001
  type: qa
  question: 目标 device 在 `nmcli device status` 中不存在，第一步应改 IP profile 吗？
  answer: 不应。先确认系统是否识别设备、接口名和虚拟/物理链路。
  extra: 设备不存在时，IPv4 profile 不是第一层问题。
  source:
  - RH124 Ch.12
  - ip-link(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::link-diagnosis
  - card::diagnosis
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-D01-QA-002
  type: qa
  question: 接口有 `UP` 但无 `LOWER_UP`，下一条最有区分度的证据是什么？
  answer: 检查物理或虚拟链路连接、MAC 对应关系和交换端口，而不是继续改路由。
  extra: 无 carrier 属于链路层症状。
  source:
  - ip-link(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::link-diagnosis
