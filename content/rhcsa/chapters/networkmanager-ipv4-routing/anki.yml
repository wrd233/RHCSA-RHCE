- id: RHCSA-18-O02-QA-001
  type: qa
  question: 把 DHCP profile 转为静态 IPv4 时，只设置 `ipv4.addresses` 是否足够？
  answer: 不够。还必须把 `ipv4.method` 改为 `manual`。
  extra: 否则可能继续使用动态 IPv4 配置或形成非目标混合状态。
  source:
