- id: RHCSA-18-T02-QA-003
  type: qa
  question: 添加持久静态路由后，最关键的两层验证是什么？
  answer: '`ip route` 确认条目存在；`ip route get <DEST>` 确认具体目的实际选择它。'
  extra: 两者之后再按需做 ICMP 或协议验证。
