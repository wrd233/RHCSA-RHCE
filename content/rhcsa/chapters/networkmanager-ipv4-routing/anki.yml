  priority: P0
- id: RHCSA-18-K02-QA-007
  type: qa
  question: '`ip route get 198.51.100.44` 输出中的 `via`、`dev`、`src` 分别表示什么？'
  answer: 下一跳、出口设备、建议源地址。
  extra: 这是本地选路结果，不证明远端一定回应。
  source:
