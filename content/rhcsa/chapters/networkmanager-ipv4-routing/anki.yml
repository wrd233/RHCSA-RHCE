- id: RHCSA-18-O06-QA-008
  type: qa
  question: 验证当前 DNS 输入和验证实际名称解析，分别属于哪两个章节层次？
  answer: 本章验证 `nmcli device show` 的 DNS server/search；第 19 章验证 NSS、hosts、DNS 查询和名称终态。
  extra: 避免把 DNS 相邻章节复制进来。
