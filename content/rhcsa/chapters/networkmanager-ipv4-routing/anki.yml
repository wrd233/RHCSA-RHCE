- id: RHCSA-18-T02-QA-001
  type: qa
  question: 到目标网络走错默认网关时，为什么不应修改本机地址？
  answer: 当前地址和直连网络已正确；问题证据指向缺少或未应用的更具体路由。
  extra: 最小修复应只改变静态路由。
