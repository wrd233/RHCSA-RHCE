- id: RHCSA-18-T02-QA-002
  type: qa
  question: 经典任务二为什么不能用 `ip route add` 作为最终答案？
  answer: 它只改变当前内核路由，通常不会在连接重激活或重启后保留。
  extra: 最终路由应写入 NetworkManager profile。
