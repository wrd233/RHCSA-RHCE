  model: RedHat-QA
  priority: P0
- id: RHCSA-18-W01-QA-002
  type: qa
  question: 为什么“重启 NetworkManager”不应成为普通 profile 变更的默认答案？
  answer: 影响范围过大，可能同时重置其他连接；应优先精确修改、reload 和激活目标 profile。
  extra: 最小修改降低业务风险。
  source:
  - nmcli(1)
  tags:
