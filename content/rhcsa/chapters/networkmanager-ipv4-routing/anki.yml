- id: RHCSA-18-W01-QA-004
  type: qa
  question: 为什么不应把命令退出码 0 扩大为网络终态正确？
  answer: 退出码只证明命令执行层；仍需验证持久 profile、当前内核状态、具体路径和必要功能。
  extra: 证据应按层推进。
