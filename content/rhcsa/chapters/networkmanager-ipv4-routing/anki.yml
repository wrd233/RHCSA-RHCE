- id: RHCSA-18-D01-QA-009
  type: qa
  question: 路由正确但 TCP 连接超时，能直接断定是 firewalld 吗？
  answer: 不能。还可能是远端无回程路由、中间过滤、目标未监听或应用问题。
  extra: 按监听、本机协议测试、防火墙、远端路径分层取证。
