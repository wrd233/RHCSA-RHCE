- id: RHCSA-18-D01-QA-007
  type: qa
  question: 数字 IP 可达但主机名失败时，本章的最小处理是什么？
  answer: 确认当前 DNS server/search 输入，然后转入第 19 章调查 NSS 与 DNS。
  extra: 不要继续改已经可用的地址和路由。
