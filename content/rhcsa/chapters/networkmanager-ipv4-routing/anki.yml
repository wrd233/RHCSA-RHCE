- id: RHCSA-18-K02-QA-001
  type: qa
  question: '`192.0.2.10/24` 中，地址和 `/24` 分别决定什么？'
  answer: 地址标识本机接口；`/24` 决定本机认为哪些目标属于直连网络。
  extra: 前缀错误会直接改变直连路由判断。
  source:
  - RH124 Ch.12
  - ip-address(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::ipv4-prefix
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-K02-QA-002
  type: qa
  question: 接口配置 `192.0.2.10/24` 后，通常会产生怎样的直连路由？
  answer: '`192.0.2.0/24 dev <IFACE> ... src 192.0.2.10`。'
  extra: 普通任务无需再手工添加同一条直连路由。
  source:
  - RH124 Ch.12
  - ip-route(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::connected-route
  - card::output
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-18-K02-QA-003
  type: qa
  question: 默认路由 `default via 192.0.2.1 dev enp1s0` 表示什么？
  answer: 没有更具体路由匹配的 IPv4 目的，经下一跳 `192.0.2.1` 从 `enp1s0` 发送。
  extra: '`default` 等价于目的前缀 `0.0.0.0/0`。'
  source:
  - RH124 Ch.12
  - ip-route(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::default-route
  - card::output
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-18-K02-QA-004
  type: qa
  question: 普通静态配置中，默认网关为什么通常必须位于接口的直连网络？
  answer: 主机需要先在本地链路上到达并解析该下一跳，才能把非直连流量交给它。
  extra: 复杂 on-link 路由等例外不属于本章。
  source:
  - RH124 Ch.12
  - ip-route(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::gateway
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-18-K02-QA-005
  type: qa
  question: 同时存在默认路由和 `198.51.100.0/24` 静态路由时，访问 `198.51.100.44` 选择哪一条？
  answer: 选择 `/24` 静态路由，因为最长前缀匹配优先于 `/0` 默认路由。
  extra: metric 通常在相同目的前缀的候选之间进一步比较。
  source:
  - ip-route(8)
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::route-selection
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-K02-QA-006
  type: qa
  question: route metric 数值较低通常表示什么？
  answer: 在其他条件相当的候选路由中优先级更高。
  extra: metric 不是带宽、时延或健康度测试结果。
  source:
  - RH124 Ch.12
  - ip-route(8)
  tags:
  - exam::rhcsa
