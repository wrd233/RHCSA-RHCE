- id: RHCSA-18-T01-QA-001
  type: qa
  question: 现有活动 DHCP profile 必须改为静态且不得重建时，操作主线是什么？
  answer: 确认活动对象 → `method manual` 与完整属性 → 读取 profile → `con up` → 分层验证。
  extra: 不删除旧 profile，不直接改 `/etc/resolv.conf`。
