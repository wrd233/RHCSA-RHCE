- id: RHCSA-18-O02-QA-009
  type: qa
  question: 静态 IPv4 任务没有要求改变 IPv6 时，应怎样处理？
  answer: 保留现有 IPv6 属性，不为了简化命令而随意禁用。
  extra: 最小修改可以降低故障面和越界风险。
