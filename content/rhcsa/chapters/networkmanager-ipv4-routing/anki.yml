  type: qa
  question: 查看某 profile 的接口绑定、autoconnect 与 IPv4 属性，应使用什么命令骨架？
  answer: '```bash

    nmcli -f connection.interface-name,connection.autoconnect,ipv4.method,ipv4.addresses,ipv4.gateway connection show <CON>

    ```'
  extra: 精确字段输出比在完整长输出中搜索更适合验收。
