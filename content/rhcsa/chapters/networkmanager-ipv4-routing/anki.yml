- id: RHCSA-18-K02-QA-008
  type: qa
  question: '`ip route` 中存在正确静态路由，是否还需要 `ip route get <DEST>`？'
  answer: 需要。前者证明路由表有条目，后者证明具体目的实际匹配了预期路径。
  extra: 两层证据不能互相替代。
