- id: RHCSA-18-T01-QA-002
  type: qa
  question: 经典任务一中，为什么设置两个目标 DNS 时选择替换而不是 `+ipv4.dns`？
  answer: 目标要求最终列表只有指定值；追加可能保留旧 DHCP 或历史 DNS。
  extra: 先把目标终态翻译成列表操作语义。
