- id: RHCSA-18-O06-QA-005
  type: qa
  question: '`ss -lntup` 能证明什么，不能证明什么？'
  answer: 能证明本机当前监听 socket；不能证明远端可达、防火墙放行或应用认证成功。
  extra: 完整服务访问链属于第 21 章。
