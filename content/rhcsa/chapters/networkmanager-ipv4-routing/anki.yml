- id: RHCSA-18-O01-QA-005
  type: qa
  question: 查看当前 device 获得的 DNS server 和搜索域，使用什么命令骨架？
  answer: '`nmcli -f IP4.DNS,IP4.DOMAIN device show <IFACE>`'
  extra: 它验证连接输入，不替代第 19 章的实际名称解析。
  source:
