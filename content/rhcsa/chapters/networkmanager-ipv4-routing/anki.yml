  type: qa
  question: '`nmcli connection down <CON>` 与 `nmcli device disconnect <IFACE>` 的关键区别是什么？'
  answer: 前者停用指定 connection，device 仍可能激活其他 profile；后者让 device 保持断开，直到手工连接。
  extra: 两者远程执行都可能断线。
