- id: RHCSA-NETWORK-O01-QA-006
  type: qa
  question: 静态网络配置的最小验收层次是什么？
  answer: profile 属性 → 活动映射 → 当前地址 → 路由与具体选路 → DNS 输入 → 必要功能。
  extra: autoconnect 和重启后状态应作为持久性单独验证。
