  priority: P2
- id: RHCSA-18-O06-QA-007
  type: qa
  question: 一条 `nmcli connection up` 成功消息能否替代 `ip route get`？
  answer: 不能。前者是操作结果，后者才验证具体目的的内核选路。
  extra: 操作成功和终态正确必须分开。
