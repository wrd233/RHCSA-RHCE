  model: RedHat-QA
  priority: P1
- id: RHCSA-18-D01-QA-003
  type: qa
  question: profile 已改为新地址，但当前 device 仍使用旧地址，诊断链是什么？
  answer: 查 active profile → 激活正确 profile → 再查 `ip address` 和 `ip route`。
  extra: 最小修复是应用正确对象，不是重新创建所有配置。
  source:
  - RH124 Ch.12
  tags:
  - exam::rhcsa
  - chapter::networkmanager-ipv4-routing
  - topic::state-mismatch
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-18-D01-QA-004
  type: qa
  question: 有目标地址但网关不可达，为什么应先检查前缀？
  answer: 前缀决定本机是否把网关视为直连下一跳；前缀错误会使邻居和选路判断错误。
  extra: 随后再调查链路、邻居和对端。
  source:
  - ip-address(8)
  - ip-route(8)
  tags:
