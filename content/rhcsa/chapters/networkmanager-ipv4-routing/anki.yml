  priority: P2
- id: RHCSA-18-O02-QA-002
  type: qa
  question: 把 `office-lan` 设置为 `192.0.2.10/24` 的命令骨架是什么？
  answer: '```bash

    nmcli connection modify office-lan ipv4.method manual ipv4.addresses 192.0.2.10/24

    ```'
  extra: 随后按题目设置网关、DNS 和 autoconnect。
