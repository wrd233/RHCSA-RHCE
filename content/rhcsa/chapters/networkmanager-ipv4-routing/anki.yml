- id: RHCSA-18-O02-QA-008
  type: qa
  question: 题目只要求修改现有活动 profile，为什么不应默认先删除再重建？
  answer: 删除可能丢失未要求改变的属性、稳定 UUID 和回退能力，并可能立即断网。
  extra: 先精确修改评分对象，除非题目明确要求清理。
