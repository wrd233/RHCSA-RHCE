  - chapter::networkmanager-ipv4-routing
  - topic::state-model
  - card::verification
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-18-K01-QA-007
  type: qa
  question: 脚本中遇到同名 connection profile 时，应优先使用什么标识避免歧义？
  answer: profile UUID。
  extra: 手工考试环境通常先确认名称唯一；UUID 更适合稳定引用。
  source:
