- id: RHCSA-NETWORK-K01-QA-004
  type: qa
  question: 持久 profile 与当前内核地址分别用什么查询？
  answer: '`nmcli connection show <CON>` 查询 profile；`ip -br address` 查询当前内核地址。'
  extra: 两组证据可能因 profile 尚未激活而不同。
  source:
