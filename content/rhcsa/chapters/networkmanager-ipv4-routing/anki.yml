- id: RHCSA-18-O02-QA-004
  type: qa
  question: 将两个 DNS server 设置为 profile 的最终列表，命令骨架是什么？
  answer: '`nmcli connection modify <CON> ipv4.dns "192.0.2.53 192.0.2.54"`'
  extra: 不带 `+` 表示替换整个列表；空格列表应整体引用。
