  priority: P2
- id: RHCSA-18-O06-QA-006
  type: qa
  question: 静态配置后的重启持久性为什么不能由 `connection.autoconnect yes` 单独证明？
  answer: 可能有其他候选 profile、设备条件或激活失败；必须在真实重连/重启后观察实际活动和内核状态。
  extra: 本章只记录待执行 live-test。
