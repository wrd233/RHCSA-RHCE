chapter_id: RHCSA-NETWORK
deck: RedHat::RHCSA-RHEL9
note_types: [RedHat-QA, RedHat-Cloze]
notes:
  - id: RHCSA-NETWORK-K01-QA-001
    type: qa
    question: NetworkManager device 与 connection 的区别是什么？
    answer: device 是网卡等设备；connection 是可持久并可激活到设备的配置 profile。
    extra: profile 名称不一定等于接口名。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::comparison, priority::P0]
  - id: RHCSA-NETWORK-K01-QA-002
    type: qa
    question: 查看设备及其活动 connection 的命令是什么？
    answer: '`nmcli device status`'
    extra: 所有 profile 用 `nmcli connection show`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-K01-QA-003
    type: qa
    question: 只查看已激活 NetworkManager profile，使用什么？
    answer: '`nmcli connection show --active`'
    extra: 修改未激活 profile 不会立即改变内核状态。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-K01-QA-004
    type: qa
    question: 持久 profile 与当前内核地址分别用什么查询？
    answer: '`nmcli con show <CON>` 与 `ip -br address`。'
    extra: 两组证据可能因尚未激活而不同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P0]
  - id: RHCSA-NETWORK-K01-QA-005
    type: qa
    question: 查看内核为特定目的选择的出口、源地址和下一跳，使用什么？
    answer: '`ip route get <DEST>`'
    extra: 比只看完整路由表更直接回答路径选择。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-K01-QA-006
    type: qa
    question: ping 网关成功能否证明 DNS 和 TCP 服务正确？
    answer: 不能；只证明对应路径允许这次 ICMP 交互。
    extra: 解析、监听和应用协议分别验证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P0]
  - id: RHCSA-NETWORK-O01-QA-001
    type: qa
    question: 静态 IPv4 profile 的关键 method 值是什么？
    answer: '`ipv4.method manual`'
    extra: 还要设置地址/前缀、网关和 DNS。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::parameter, priority::P0]
  - id: RHCSA-NETWORK-O01-QA-002
    type: qa
    question: 创建绑定 enp1s0、名为 exam-static 的以太网 profile 骨架是什么？
    answer: '`nmcli con add type ethernet ifname enp1s0 con-name exam-static ...`'
    extra: 继续指定 IPv4 目标状态。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O01-QA-003
    type: qa
    question: 激活 `exam-static` profile 的命令是什么？
    answer: '`nmcli connection up exam-static`'
    extra: 远程操作前必须评估断连风险。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O01-QA-004
    type: qa
    question: '`nmcli con mod` 修改多值属性时，前缀 `+` 与 `-` 表示什么？'
    answer: 追加一个值；删除指定值。
    extra: 不带前缀通常替换整个属性。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::parameter, priority::P1]
  - id: RHCSA-NETWORK-O01-QA-005
    type: qa
    question: profile 中静态地址正确但 `ip -br a` 仍是旧地址，优先判断什么？
    answer: 新 profile 尚未激活到设备，或另一 profile 仍在活动。
    extra: 查看 `nmcli con show --active`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::diagnosis, priority::P0]
  - id: RHCSA-NETWORK-O01-QA-006
    type: qa
    question: 静态网络配置的最小验收层次是什么？
    answer: profile 属性 → 当前地址 → 路由 → DNS → 必要连通功能。
    extra: autoconnect 另证持久性。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::process, priority::P0]
  - id: RHCSA-NETWORK-O02-QA-001
    type: qa
    question: 设置静态主机名的命令骨架是什么？
    answer: '`hostnamectl set-hostname <FQDN>`'
    extra: 不会自动发布 DNS 记录。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O02-QA-002
    type: qa
    question: '`/etc/hosts` 条目的典型字段顺序是什么？'
    answer: IP 地址、规范主机名、可选别名。
    extra: 写入前检查同名或同地址冲突。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::syntax, priority::P0]
  - id: RHCSA-NETWORK-O02-QA-003
    type: qa
    question: 验证应用常用的系统名称解析入口，首选什么？
    answer: '`getent hosts <NAME>`'
    extra: 它按 NSS 配置工作，可包含 hosts 与 DNS。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O02-QA-004
    type: qa
    question: '`dig` 成功与 `getent hosts` 成功证明的是同一件事吗？'
    answer: 不是；dig 直接查 DNS，getent 走系统 NSS 解析路径。
    extra: '`/etc/hosts` 可影响后者而不影响前者。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::comparison, priority::P1]
  - id: RHCSA-NETWORK-O03-QA-001
    type: qa
    question: SSH 密钥对中，哪一部分可以安装到远端？
    answer: 公钥 `.pub`；私钥保留在客户端并严格保护。
    extra: 不向远端复制私钥。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::concept, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-002
    type: qa
    question: 生成 ed25519 密钥对的命令骨架是什么？
    answer: '`ssh-keygen -t ed25519 -f <PRIVATE_KEY_PATH>`'
    extra: 会同时生成对应 `.pub` 文件。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-003
    type: qa
    question: 把指定公钥安装到远端 alice 账号的命令骨架是什么？
    answer: '`ssh-copy-id -i <KEY>.pub alice@<HOST>`'
    extra: 通常需要一次已有认证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-004
    type: qa
    question: 修改 sshd 配置后，重载前必须运行什么？
    answer: '`sshd -t`'
    extra: 在密钥验证前不要关闭现有认证路径。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-005
    type: qa
    question: SSH 公钥认证失败的双端证据入口是什么？
    answer: 客户端 `ssh -v`，服务端 `journalctl -u sshd`。
    extra: 再查用户、路径权限和 SELinux 标签。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::diagnosis, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-006
    type: qa
    question: known_hosts 报主机密钥变化时，应先做什么？
    answer: 通过可信渠道核对服务端指纹。
    extra: 确认合法变化后才用 `ssh-keygen -R` 移除旧记录。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::diagnosis, priority::P0]
  - id: RHCSA-NETWORK-O03-QA-007
    type: qa
    question: SSH 登录成功后，如何证明实际远端身份与主机？
    answer: 在远端运行 `id` 与 `hostname`。
    extra: 连接退出 0 仍需确认目标对象。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P1]
  - id: RHCSA-NETWORK-O04-QA-001
    type: qa
    question: 查看 firewalld 当前活动 zone 与接口归属，使用什么？
    answer: '`firewall-cmd --get-active-zones`'
    extra: 规则必须添加到实际处理流量的 zone。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-002
    type: qa
    question: firewalld service 与 port 规则的区别是什么？
    answer: service 是命名的端口/协议集合；port 直接写 `PORT/PROTOCOL`。
    extra: 有准确 service 定义时优先使用。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::comparison, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-003
    type: qa
    question: 当前立即允许 public zone 的 HTTP，命令是什么？
    answer: '`firewall-cmd --zone=public --add-service=http`'
    extra: 这是 runtime 修改。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-004
    type: qa
    question: 持久允许 public zone 的 TCP 8080，命令是什么？
    answer: '`firewall-cmd --zone=public --add-port=8080/tcp --permanent`'
    extra: 不立即改变 runtime。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::command, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-005
    type: qa
    question: 不带与带 `--permanent` 的 firewalld 修改分别作用哪里？
    answer: runtime 当前规则；持久配置。
    extra: 两层都要分别查询。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::comparison, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-006
    type: qa
    question: '`firewall-cmd --reload` 对 runtime 有什么影响？'
    answer: 用持久配置重建 runtime，未持久的运行时变化会丢失。
    extra: reload 前先理解其他 runtime-only 规则。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::diagnosis, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-007
    type: qa
    question: 分别查询 public zone HTTP 的 runtime 与 permanent 状态，使用什么？
    answer: '`--query-service=http`，持久查询再加 `--permanent`。'
    extra: 两条查询都应显式指定 zone。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P0]
  - id: RHCSA-NETWORK-O04-QA-008
    type: qa
    question: 防火墙已允许 80/tcp，能否证明 httpd 正在监听？
    answer: 不能；防火墙只允许流量，不创建监听。
    extra: 使用 `ss -lntp` 和协议请求验证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::verification, priority::P0]
  - id: RHCSA-NETWORK-D01-QA-001
    type: qa
    question: 数字 IP 可达但主机名失败，优先检查哪一层？
    answer: 系统名称解析层：NSS、DNS server/search 和 hosts 冲突。
    extra: 不应继续改地址或路由。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::diagnosis, priority::P0]
  - id: RHCSA-NETWORK-D01-QA-002
    type: qa
    question: 服务 active 但远端访问失败的证据推进骨架是什么？
    answer: 监听 → 本机协议请求 → zone/runtime/permanent → 远端请求 → SELinux。
    extra: 拒绝与超时只是线索，不是绝对根因。
    source: [RH124, RH134]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::process, priority::P0]
  - id: RHCSA-NETWORK-C01-QA-001
    type: qa
    question: 静态网络、SSH、HTTP 综合任务的验收骨架是什么？
    answer: profile/当前网络/DNS → SSH 远端身份 → 服务状态/监听 → 正确 zone 双态 → 外部 HTTP。
    extra: 每层单独取证。
    source: [RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::process, priority::P0, task::network-service]
  - id: RHCSA-NETWORK-K01-CLOZE-001
    type: cloze
    text: NetworkManager 的 {{c1::device}} 是设备，{{c2::connection}} 是可持久激活的配置 profile。
    extra: 名称不必相同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::cloze, priority::P0]
  - id: RHCSA-NETWORK-O04-CLOZE-001
    type: cloze
    text: firewalld 不带 `--permanent` 修改{{c1::runtime}}；带该参数修改{{c2::持久配置}}。
    extra: reload 用持久配置重建 runtime。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::cloze, priority::P0]
  - id: RHCSA-NETWORK-O03-CLOZE-001
    type: cloze
    text: SSH 密钥认证：客户端保留{{c1::私钥}}，远端 `authorized_keys` 保存{{c2::公钥}}。
    extra: 私钥不得分发。
    source: [RH124]
    tags: [exam::rhcsa, chapter::network-ssh-firewall, card::cloze, priority::P0]
