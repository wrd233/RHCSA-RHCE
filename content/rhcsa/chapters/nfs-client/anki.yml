- id: RHCSA-26-T01-QA-002
  type: qa
  question: 配置持久 NFS 挂载时，推荐的完整操作顺序是什么？
  answer: 基线调查 → 临时挂载 → 读回状态 → 写 fstab → 静态核对 → 卸载重建 → 目标身份功能测试。
  extra: 每步只改变必要对象。
