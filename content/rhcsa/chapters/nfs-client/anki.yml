  priority: P1
- id: RHCSA-26-D03-QA-002
  type: qa
  question: 为什么不把 `soft` 作为所有 NFS 挂载的默认“防卡死”选项？
  answer: 重试耗尽后它会向应用返回 I/O 错误，可能带来部分失败或数据完整性风险。
  extra: 只有在应用容错和数据语义评估后才考虑。
  source:
