- id: RHCSA-26-D03-QA-001
  type: qa
  question: NFS hard 挂载在服务器暂时失联时，文件操作通常怎样表现？
  answer: 请求超时后继续重试，调用进程可能长时间等待服务器恢复。
  extra: 这优先保护请求完成，但会影响可用性和排错体验。
  source:
