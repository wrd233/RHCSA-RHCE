- id: RHCSA-26-K03-QA-003
  type: qa
  question: 挂载前本地挂载点的 owner/mode 与挂载后看到的根目录权限分别来自哪里？
  answer: 挂载前来自客户端本地目录；挂载后看到的根目录权限来自远端文件系统。
  extra: 本地父目录仍需允许用户沿路径到达挂载点。
