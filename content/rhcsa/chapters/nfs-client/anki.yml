- id: RHCSA-26-K02-QA-004
  type: qa
  question: 需要检查 NFSv3 服务器通过 rpcbind 注册了哪些 RPC 程序时，可用什么命令？
  answer: '`rpcinfo -p <SERVER>`'
  extra: 它主要帮助调查 v3/RPC 链路，不证明 export 授权或文件权限。
