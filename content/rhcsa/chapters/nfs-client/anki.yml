  priority: P0
- id: RHCSA-NFS-QA-002
  type: qa
  question: 要确认路径 `/srv/project` 当前实际来自哪个挂载源，应优先使用什么？
  answer: '`findmnt -T /srv/project`'
  extra: 目录存在不代表它当前是独立挂载点；可用 `-o SOURCE,TARGET,FSTYPE,OPTIONS` 定制证据。
