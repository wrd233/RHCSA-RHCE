  model: RedHat-QA
  priority: P0
- id: RHCSA-NFS-QA-004
  type: qa
  question: NFS 持久挂载在 `/etc/fstab` 中的源字段骨架是什么？
  answer: '`<SERVER>:/<EXPORT-PATH>`'
  extra: 源字段后还需要本地挂载点、类型 `nfs`、选项和最后两个数字字段。
