- id: RHCSA-26-D02-QA-003
  type: qa
  question: 用户主 GID 与目录组不同，但他应通过附加组写入。下一条证据是什么？
  answer: 用 `id <USER>` 确认附加组，并用 `getent group <GROUP>` 核对组成员和 GID。
  extra: 只看 `/etc/passwd` 的主 GID 会漏掉附加组。
