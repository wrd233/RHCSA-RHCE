- id: RHCSA-26-K02-QA-005
  type: qa
  question: 未明确版本的普通 NFS 挂载，是否必须先写 `vers=4.2`？
  answer: 不必须。客户端可以协商；只有题目要求、兼容性控制或诊断时才固定版本。
  extra: 实际结果用 `nfsstat -m` 读取。
