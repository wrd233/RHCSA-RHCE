- id: RHCSA-NFS-QA-005
  type: qa
  question: NFS fstab 条目中的 `_netdev` 表达什么？
  answer: 该挂载依赖网络，应按远程文件系统处理相关顺序。
  extra: 它不保证 DNS、服务器或 export 一定可用，也不替代功能验证。
