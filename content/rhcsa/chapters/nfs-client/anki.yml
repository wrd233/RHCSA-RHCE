  priority: P1
- id: RHCSA-26-K01-QA-001
  type: qa
  question: NFS 任务中，export、远端源和本地挂载点分别是什么？
  answer: export 是服务端授权目录；远端源是客户端引用的 `server:/path`；挂载点是接入该远端文件系统的本地目录。
  extra: 三者路径可能不同，不能互相替代。
  source:
  - RH134 RHEL 9, Ch.7, pp.196-198
  - mount.nfs(8)
  - nfs(5)
  tags:
  - exam::rhcsa
  - chapter::nfs-client
  - topic::object-model
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-26-K01-QA-002
  type: qa
  question: 把 NFS 挂载到一个原本非空的本地目录时，原内容是否被删除？
  answer: 不会。原内容在挂载期间被遮蔽，卸载后重新可见。
  extra: 该通用挂载机制主归属 RHCSA-24；本章只用于解释 NFS 现象。
  source:
  - mount(8)
  - RHCSA-24 lecture
  tags:
