- id: RHCSA-NFS-QA-012
  type: qa
  question: NFS 挂载报 `access denied by server` 时，客户端对挂载点执行 `chmod 777` 能修复吗？
  answer: 通常不能。应核对远端源路径、export 允许的客户端范围、读写模式和 `sec=`。
  extra: 该报错表明服务端拒绝了请求，修复应落在源路径或服务端 export 策略层。
  source:
  - nfs(5)
  - mount.nfs(8)
  - RHCSA-26 lecture
