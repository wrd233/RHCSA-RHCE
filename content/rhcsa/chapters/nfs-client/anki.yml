  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-NFS-QA-013
  type: qa
  question: NFS 当前挂载成功能否证明系统重启后仍会挂载？
  answer: 不能。当前挂载和持久声明是不同状态维度。
  extra: 还要核对 fstab，并通过卸载后按配置重建；真实重启属于更高层验证。
  source:
  - RH134 RHEL 9, Ch.7, p.197
