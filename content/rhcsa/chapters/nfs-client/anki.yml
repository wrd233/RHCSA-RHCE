  priority: P1
- id: RHCSA-26-D01-QA-003
  type: qa
  question: NFS 连接“被拒绝”和“超时”通常分别提示什么方向？
  answer: 被拒绝通常说明目标主动拒绝或无监听；超时更可能涉及过滤、路由、服务无响应或丢包。
  extra: 仍需结合版本和服务端证据，不能单凭一句错误定论。
