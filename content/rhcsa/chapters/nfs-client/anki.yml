  type: qa
  question: 客户端 root 创建的 NFS 文件显示为匿名数值 UID/GID，最可能说明什么？
  answer: 服务端对该 export 应用了 `root_squash` 或等价的 root 匿名映射。
  extra: 先确认这是否符合安全设计，不要立即启用 `no_root_squash`。
