- id: RHCSA-26-D01-QA-001
  type: qa
  question: NFS `mount` 失败时，为什么应先保留完整原始错误？
  answer: 名称失败、无路由、超时、连接拒绝和服务端拒绝分别指向不同层。
  extra: 错误文本决定下一条最有区分度的证据。
  source:
