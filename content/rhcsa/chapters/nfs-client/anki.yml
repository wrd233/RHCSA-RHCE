- id: RHCSA-NFS-QA-001
  type: qa
  question: 在需要查询传统 NFS MOUNT 服务公布的 export 列表时，常用什么命令？
  answer: '`showmount -e <SERVER>`'
  extra: NFSv4-only 服务器可能不提供 MOUNT 服务；无结果不能直接证明没有 NFSv4 export。
  source:
