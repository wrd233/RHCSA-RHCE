- id: RHCSA-26-O03-QA-004
  type: qa
  question: NFS fstab 中添加 `_netdev` 后，是否等于远端不可用时启动一定不等待？
  answer: 不等于。`_netdev` 主要表达网络依赖和远程挂载排序。
  extra: 失败处理仍受网络、systemd、NFS 重试和其他选项影响。
  source:
