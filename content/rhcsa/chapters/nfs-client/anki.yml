- id: RHCSA-26-D02-QA-004
  type: qa
  question: NFS 权限问题中，为什么不应先执行 `chmod 777`？
  answer: 它扩大所有身份权限，掩盖 UID/GID、组、export 读写模式或 root 映射的真正原因。
  extra: 应做最小权限修复并以目标用户复验。
