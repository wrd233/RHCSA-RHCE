- id: RHCSA-26-D02-QA-002
  type: qa
  question: 要避免用户名映射掩盖问题，怎样查看 NFS 目录的数值属主？
  answer: '`ls -ldn <PATH>` 或 `stat -c "uid=%u gid=%g ..." <PATH>`'
  extra: 与 `id` 和服务端数值身份比较。
