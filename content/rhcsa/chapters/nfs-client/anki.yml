- id: RHCSA-26-K03-QA-001
  type: qa
  question: 常见 `sec=sys` NFS 访问中，服务端权限判断主要依据什么身份信息？
  answer: 客户端请求携带的数值 UID、主 GID 和附加组。
  extra: 用户名主要是显示和目录服务映射层；数值不一致会造成权限异常。
