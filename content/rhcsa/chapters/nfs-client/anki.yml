- id: RHCSA-26-K03-QA-002
  type: qa
  question: 两端都显示用户 `project1`，但 NFS 文件权限异常。下一条最有区分度的证据是什么？
  answer: 比较两端 `project1` 的数值 UID、GID 和附加组，并用 `ls -ln` 查看文件数值属主。
  extra: 同名不等于同一数值身份。
