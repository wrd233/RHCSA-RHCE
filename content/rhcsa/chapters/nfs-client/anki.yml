- id: RHCSA-26-O03-QA-003
  type: qa
  question: '`findmnt --verify` 与卸载后 `mount -a` 分别证明什么？'
  answer: 前者检查 fstab 解析和可核对问题；后者证明配置能够实际建立当前挂载。
  extra: 二者都不能证明目标用户读写成功。
