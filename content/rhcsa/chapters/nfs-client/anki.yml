  question: '`showmount -e` 成功、`findmnt` 有结果、fstab 有条目和用户能写，分别证明哪个状态层？'
  answer: 依次证明传统 export 信息可查询、当前挂载存在、持久声明存在、指定身份功能成功。
  extra: 这些证据不能互相替代。
