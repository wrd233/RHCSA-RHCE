- id: RHCSA-NFS-QA-003
  type: qa
  question: NFS export 的 `root_squash` 核心效果是什么？
  answer: 把来自客户端 UID/GID 0 的请求映射为服务端匿名身份。
  extra: 它防止客户端 root 自动获得共享上的服务端 root 权限；不要默认用 `no_root_squash` 修复写入失败。
  source:
  - RHEL 9 Configuring and using network file services
  - exports(5)
  - id(1)
  - getent(1)
