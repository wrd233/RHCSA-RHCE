- id: RHCSA-26-K02-QA-003
  type: qa
  question: '`showmount -e server` 超时，已知服务器是 NFSv4-only。能否据此断定没有 export？'
  answer: 不能。`showmount` 依赖传统 MOUNT 服务，v4-only 服务器可能不提供。
  extra: 继续检查名称、TCP 2049、已知 v4 路径和实际 `mount` 报错。
  source:
