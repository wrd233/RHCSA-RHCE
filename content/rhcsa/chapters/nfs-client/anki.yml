- id: RHCSA-26-K02-QA-002
  type: qa
  question: NFSv3 与 NFSv4 在客户端调查入口上的关键区别是什么？
  answer: v3 通常还要调查 rpcbind、MOUNT 和辅助 RPC；v4 主路径更集中，常通过 TCP 2049 访问。
  extra: 具体端口和服务端配置仍应读取真实证据。
  source:
