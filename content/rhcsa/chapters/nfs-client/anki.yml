- id: RHCSA-26-O03-QA-005
  type: qa
  question: 手工挂载正确，但 `mount /srv/project` 按 fstab 失败。优先比较什么？
  answer: 比较 fstab 的源、目标、类型和选项，并运行 `findmnt --verify --verbose`。
  extra: 手工命令成功不能证明持久条目没有拼写或字段错误。
