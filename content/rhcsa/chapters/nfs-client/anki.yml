- id: RHCSA-NFS-QA-006
  type: qa
  question: 怎样证明一个 NFS fstab 条目能够独立建立挂载？
  answer: 静态核对后卸载当前挂载，通过 `mount /挂载点` 或 `mount -a` 重建，再用 `findmnt` 核对。
  extra: 最后仍要按目标用户进行读写测试。
  source:
  - RH134 RHEL 9, Ch.7, p.197
