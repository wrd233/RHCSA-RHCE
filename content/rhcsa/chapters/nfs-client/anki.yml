  priority: P1
- id: RHCSA-26-D03-QA-004
  type: qa
  question: 远端 NFS 不可用时的推荐恢复顺序是什么？
  answer: 确认当前源 → 恢复名称/网络/NFS 服务 → 正常停止使用者 → 普通卸载或重建 → 数据与应用复验。
  extra: 强制或 lazy 卸载只作已评估风险的应急分支。
