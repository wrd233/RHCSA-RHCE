  priority: P1
- id: RHCSA-26-D01-QA-002
  type: qa
  question: 服务器可以解析并能到达，但 `mount` 报 `access denied by server`。下一步调查什么？
  answer: 远端路径、export 允许的客户端地址/网段、`ro/rw`、`sec=` 以及服务端是否加载最新配置。
  extra: 不要把它归因于本地挂载点 mode。
