- id: RHCSA-26-T01-QA-001
  type: qa
  question: 题目要求持久挂载 NFS 并验证业务用户可写。完成 `mount` 后还缺哪些关键验收？
  answer: 读取当前源/版本；写入并静态核对 fstab；卸载后按配置重建；用业务用户执行真实写入。
  extra: 不要用 root 成功或命令退出码代替终态。
