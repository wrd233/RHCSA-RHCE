  priority: P2
- id: RHCSA-26-D03-QA-003
  type: qa
  question: NFS 服务器失联，访问进程处于不可中断 I/O 等待。反复 `kill -9` 是否可靠？
  answer: 不可靠。D 状态任务通常要等内核 I/O 条件变化；应优先恢复网络或服务器。
  extra: 不要再运行会访问同一挂载点的大范围命令。
