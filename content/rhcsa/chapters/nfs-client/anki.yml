- id: RHCSA-26-D01-QA-004
  type: qa
  question: 确认 TCP 2049 可连接，能否证明 NFSv3 完整可用？
  answer: 不能。v3 还可能依赖 rpcbind、MOUNT 和其他辅助 RPC 服务。
  extra: 按服务端真实注册和防火墙配置调查。
