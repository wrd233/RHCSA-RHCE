- id: RHCSA-NFS-QA-018
  type: qa
  question: NFS 客户端综合任务的推荐验收层次是什么？
  answer: 名称/路由 → 协议与远端源 → 当前挂载 → 持久重建 → 目标身份功能。
  extra: 每一层使用独立证据，不能用局部成功代替终态。
  source:
  - nfs(5)
  - mount.nfs(8)
  - RHCSA-26 lecture
