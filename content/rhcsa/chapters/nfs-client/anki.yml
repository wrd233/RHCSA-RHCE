  question: 手工建立 NFS 挂载前的最小调查顺序是什么？
  answer: 检查 `nfs-utils` → 解析服务器 → 检查已有挂载 → 确认远端源/版本边界 → 创建挂载点。
  extra: 先建立基线，避免叠加挂载或覆盖已有配置。
