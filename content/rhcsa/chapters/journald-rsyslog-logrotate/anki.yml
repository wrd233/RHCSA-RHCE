- id: RHCSA-13-O06-QA-003
  model: RedHat-QA
  type: qa
  question: 远端 TCP forwarding 为什么常配置 action queue？
  answer: 远端暂时不可用时，队列可缓冲消息并降低对本地日志处理的阻塞。
  extra: 队列容量、持久化和丢弃策略仍需单独设计。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  tags:
