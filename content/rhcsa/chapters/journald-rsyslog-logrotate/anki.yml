  - chapter::journald-rsyslog-logrotate
  - topic::journal-query
  - card::boundary
  - priority::P1
- id: RHCSA-13-O01-QA-008
  model: RedHat-QA
  type: qa
  question: journal 字段匹配中，同一字段多个值和不同字段分别怎样组合？
  answer: 同一字段多个值通常形成 OR；不同字段之间形成 AND。显式 `+` 可连接两组表达式形成 OR。
  extra: 复杂表达式应先分别验证每个分支。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
