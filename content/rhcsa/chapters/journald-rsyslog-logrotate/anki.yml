- id: RHCSA-13-O01-QA-004
  model: RedHat-QA
  type: qa
  question: 查看某 unit 最近 10 分钟的日志，命令骨架是什么？
  answer: '```bash

    journalctl -u <UNIT> --since "-10 min" --no-pager

    ```'
  extra: 第一轮通常不急于加入 priority 过滤。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
