- id: RHCSA-13-O04-QA-003
  model: RedHat-QA
  type: qa
  question: '`logger -i` 与 `logger -s` 分别做什么？'
  answer: '`-i` 在消息中带上 logger PID；`-s` 同时把消息写到标准错误。'
  extra: 二者都不证明 rsyslog action 成功。
  source:
  - logger(1)
  - RH124 Ch.11
