- id: RHCSA-13-O03-QA-001
  model: RedHat-QA
  type: qa
  question: '`Storage=volatile` 与 `Storage=persistent` 的核心区别是什么？'
  answer: '`volatile` 只使用 `/run/log/journal`，重启后丢失；`persistent` 尝试使用 `/var/log/journal` 保存跨重启记录。'
  extra: 持久目录不可用时仍需检查实际回退状态。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
