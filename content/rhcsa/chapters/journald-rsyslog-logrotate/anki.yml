- id: RHCSA-13-O03-QA-010
  model: RedHat-QA
  type: qa
  question: '`--vacuum-time`、`--vacuum-size` 和 `--vacuum-files` 分别按什么清理？'
  answer: 分别按归档记录年龄、总归档大小和归档文件数量清理。
  extra: 执行前应确认审计与故障调查要求。
