- id: RHCSA-13-O04-QA-005
  model: RedHat-QA
  type: qa
  question: 为什么测试消息正文应包含唯一 ID？
  answer: 避免历史同名消息或其他管理员测试被误认为本次结果，并可跨 journal、本地文件和远端追踪。
  extra: 每次修复后应生成新的 ID。
  source:
  - logger(1)
  - RH124 Ch.11
  tags:
