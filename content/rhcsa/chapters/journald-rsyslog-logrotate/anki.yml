- id: RHCSA-13-O03-QA-006
  model: RedHat-QA
  type: qa
  question: '`MaxRetentionSec=` 能保证日志一定保留到该时间吗？'
  answer: 不能。它是最长保留时间边界，容量和可用空间限制可能让记录更早被清理。
  extra: 保留策略需要同时考虑时间和空间。
  source:
