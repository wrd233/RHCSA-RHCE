- id: RHCSA-13-O06-QA-001
  model: RedHat-QA
  type: qa
  question: 传统 rsyslog 转发 action 中 `@` 与 `@@` 分别代表什么？
  answer: '`@` 使用 UDP，`@@` 使用 TCP。'
  extra: 两者都需要接收端最终验收。
  source:
  - rsyslog.conf(5)
