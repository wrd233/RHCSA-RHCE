- id: RHCSA-13-O01-QA-003
  model: RedHat-QA
  type: qa
  question: 只看当前 boot 的内核 warning 及更严重消息，命令是什么？
  answer: '```bash

    journalctl -k -b -p warning --no-pager

    ```'
  extra: '`-k` 选内核消息，`-b` 限当前启动。'
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
