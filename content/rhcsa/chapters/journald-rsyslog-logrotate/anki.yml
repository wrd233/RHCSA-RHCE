- id: RHCSA-13-O06-QA-006
  model: RedHat-QA
  type: qa
  question: 本章为什么不把 TLS、证书和完整磁盘队列作为 RHCSA 最小答案？
  answer: 这些属于生产级可靠与安全扩展，需要更多对象和验证；本章只建立远端转发入口和证据链。
  extra: 不能在未配置时声称传输已加密或可靠。
