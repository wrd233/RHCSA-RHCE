- id: RHCSA-13-O05-QA-008
  model: RedHat-QA
  type: qa
  question: 为什么写入自定义文件后消息仍可能出现在 `/var/log/messages`？
  answer: rsyslog 通常继续处理后续规则，同一消息可以命中多个 action。
  extra: 只有明确 stop 逻辑才阻止后续处理。
