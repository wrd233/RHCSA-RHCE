- id: RHCSA-13-O03-QA-004
  model: RedHat-QA
  type: qa
  question: 在支持的 systemd 版本上，怎样查看 journald 主配置与 drop-in 的合并结果？
  answer: '```bash

    systemd-analyze cat-config systemd/journald.conf

    ```'
  extra: 若目标版本不支持，则直接检查各配置来源。
