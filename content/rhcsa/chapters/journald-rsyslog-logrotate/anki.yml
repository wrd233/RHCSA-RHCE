- id: RHCSA-13-D01-QA-001
  model: RedHat-QA
  type: qa
  question: journal 有测试消息、目标文件没有时，最小调查链是什么？
  answer: '`rsyslogd -N1`→检查 selector 与 include→检查 rsyslog 服务日志→检查路径权限/SELinux→修复后生成新 TEST_ID。'
  extra: 不要用旧测试消息验收新配置。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-13-D01-QA-002
  model: RedHat-QA
  type: qa
  question: 只能看到当前 boot 时，最小调查链是什么？
  answer: '`--list-boots`→有效 `Storage=`→`/var/log/journal`→`--disk-usage`→容量/保留配置→权限。'
  extra: 修改持久化不能恢复已丢失历史。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-13-D01-QA-003
  model: RedHat-QA
  type: qa
  question: 已生成轮转归档，但新活动文件不增长时，优先假设什么？
  answer: 写入进程仍持有旧 inode；检查并执行应用支持的 reopen/reload，再发送新 TEST_ID。
  extra: 不要仅靠重建空文件。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-13-D01-QA-004
  model: RedHat-QA
  type: qa
  question: journal 占用过高时，为什么应先调查异常日志速率？
  answer: 如果某服务持续产生日志，仅 vacuum 会暂时释放空间，根因仍会快速填满磁盘。
  extra: 应同时检查来源、保留和容量边界。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P1
- id: RHCSA-13-D01-QA-005
  model: RedHat-QA
  type: qa
  question: 本章本地路由经典任务的验收矩阵是什么？
  answer: 静态语法→唯一事件进入 journal→同一事件进入文件→权限正确→轮转决策→真实测试轮转→轮转后新事件进入新活动文件。
  extra: 任何单一 active 状态都不足。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::classic-task
  - card::process
  - priority::P0
- id: RHCSA-13-D01-QA-006
  model: RedHat-QA
  type: qa
  question: persistent journal 经典任务中，当前阶段与重启后分别验证什么？
  answer: 当前验证有效配置、唯一事件和磁盘占用；重启后验证 `--list-boots` 和 `-b -1` 中的重启前事件。
  extra: 无 live 重启时必须标记未执行。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
