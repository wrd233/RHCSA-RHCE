- id: RHCSA-13-O03-QA-007
  model: RedHat-QA
  type: qa
  question: 启用持久存储并重启 journald 后，哪个命令请求把运行时记录刷新到持久存储？
  answer: '```bash

    journalctl --flush

    ```'
  extra: 它不能恢复重启前已经丢失的记录。
