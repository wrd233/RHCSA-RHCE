  model: RedHat-QA
  type: qa
  question: '`MESSAGE` 与 `_SYSTEMD_UNIT` 分别是什么性质的字段？'
  answer: '`MESSAGE` 是消息正文，通常由客户端提供；`_SYSTEMD_UNIT` 是 journal 侧补充的可信归属字段。'
  extra: 审计身份应优先结合下划线可信字段。
  source:
  - systemd.journal-fields(7)
