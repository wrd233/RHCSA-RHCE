- id: RHCSA-13-O05-QA-001
  model: RedHat-QA
  type: qa
  question: 传统 rsyslog 本地文件规则的基本骨架是什么？
  answer: '```text

    facility.priority    /path/to/logfile

    ```'
  extra: 左侧选择消息，右侧执行文件写入 action。
  source:
  - rsyslog.conf(5)
