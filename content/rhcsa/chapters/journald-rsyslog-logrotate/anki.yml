- id: RHCSA-13-O05-QA-002
  model: RedHat-QA
  type: qa
  question: '`local0.notice` 与 `local0.=notice` 有什么区别？'
  answer: 前者匹配 notice 以及更严重的 local0 消息；后者只匹配恰好 notice。
  extra: 普通 selector priority 是阈值语义。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
