- id: RHCSA-13-O07-QA-001
  model: RedHat-QA
  type: qa
  question: logrotate 是常驻写日志服务吗？
  answer: 不是。它在被 timer 或其他调度入口调用时读取配置和状态，判断并执行轮转。
  extra: 文件写入由应用或 rsyslog 完成。
