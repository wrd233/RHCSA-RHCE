- id: RHCSA-13-O07-QA-003
  model: RedHat-QA
  type: qa
  question: logrotate 状态文件解决什么问题？
  answer: 记录上次轮转时间，使 daily、weekly、monthly 等条件能够跨多次调用判断。
  extra: 默认状态路径应在目标 RHEL 9 环境确认。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-state
  - card::concept
  - priority::P0
- id: RHCSA-13-O07-QA-004
  model: RedHat-QA
  type: qa
  question: '`size`、`minsize` 与 `maxsize` 的核心区别是什么？'
  answer: '`size` 按大小独立触发；`minsize` 要同时满足时间和最小大小；`maxsize` 可在时间尚未到时因过大提前轮转。'
  extra: 与时间选项组合时应读 man page 和 debug 结果。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-policy
  - card::comparison
  - priority::P0
- id: RHCSA-13-O07-QA-005
  model: RedHat-QA
  type: qa
  question: '`rotate 7` 表示什么？'
  answer: 最多保留七个旧轮转版本，超过后删除更旧版本。
  extra: 它不表示保留七天，实际时间取决于轮转频率。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-policy
  - card::parameter
  - priority::P0
- id: RHCSA-13-O07-QA-006
  model: RedHat-QA
  type: qa
  question: '`compress` 与 `delaycompress` 的关系是什么？'
  answer: '`compress` 压缩旧日志；`delaycompress` 把最近一次归档的压缩推迟到下一轮。'
  extra: 后者常用于写入进程可能短暂继续访问上一个文件的情况。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-policy
  - card::comparison
  - priority::P1
- id: RHCSA-13-O07-QA-007
  model: RedHat-QA
  type: qa
  question: '`missingok` 与 `notifempty` 分别避免什么？'
  answer: '`missingok` 允许日志文件缺失；`notifempty` 避免轮转空文件。'
  extra: 它们不会修复路径或写入问题。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-policy
  - card::parameter
  - priority::P0
- id: RHCSA-13-O07-QA-008
  model: RedHat-QA
  type: qa
  question: '`create 0640 root root` 在什么时候做什么？'
  answer: 轮转后、执行 postrotate 前创建新的同名活动文件，并设置模式、所有者和组。
  extra: 权限必须匹配实际写入进程。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-policy
  - card::parameter
  - priority::P0
- id: RHCSA-13-O07-QA-009
  model: RedHat-QA
  type: qa
  question: '`logrotate -d` 与 `logrotate -f` 有什么根本区别？'
  answer: '`-d` 只输出调试决策，不修改文件或状态；`-f` 强制执行真实轮转。'
  extra: '`-f` 只能在明确测试对象上谨慎使用。'
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-testing
  - card::comparison
  - priority::P0
- id: RHCSA-13-O07-QA-010
  model: RedHat-QA
  type: qa
  question: 怎样用独立状态文件强制测试一个自包含的 logrotate 片段？
  answer: '```bash

    logrotate -s /tmp/test.status -f /etc/logrotate.d/<NAME>

    ```'
  extra: 该命令会真实改变目标文件；片段必须自包含。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-testing
  - card::command
  - priority::P1
- id: RHCSA-13-O07-QA-011
  model: RedHat-QA
  type: qa
  question: 文件很大但 logrotate 显示“不需要轮转”，下一步最有区分度的证据是什么？
  answer: 运行 `logrotate -d /etc/logrotate.conf`，检查目标是否匹配、时间/大小组合和状态文件中的上次轮转时间。
  extra: 不要先无条件 `-f`。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-13-O07-QA-012
  model: RedHat-QA
  type: qa
  question: 为什么 rename/create 轮转后写入进程可能仍写旧归档？
  answer: 进程仍持有指向旧 inode 的打开文件描述符；目录项改名不会自动改变该描述符。
  extra: 需要应用支持的 reopen/reload。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-reopen
  - card::concept
  - priority::P0
- id: RHCSA-13-O07-QA-013
  model: RedHat-QA
  type: qa
  question: '`copytruncate` 的主要风险是什么？'
  answer: 复制与截断之间存在很小的时间窗口，期间写入的日志可能丢失。
  extra: 它是无法让应用 reopen 时的兼容方案，不是默认首选。
  source:
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-reopen
  - card::boundary
  - priority::P0
- id: RHCSA-13-O07-QA-014
  model: RedHat-QA
  type: qa
  question: 怎样证明轮转后写入者已经切换到新活动文件？
  answer: 轮转后生成新的唯一 TEST_ID，并确认它进入新的同名活动文件，而不是旧归档。
  extra: 只看到 `.1` 或 `.gz` 不足以证明。
  source:
  - logrotate(8)
  - RH124 Ch.11
  - logger(1)
  - RH124 Ch.11
  tags:
