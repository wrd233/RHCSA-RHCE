- id: RHCSA-13-O04-QA-001
  model: RedHat-QA
  type: qa
  question: '`logger -p local0.notice` 中 `-p` 设置什么？'
  answer: 设置 syslog facility 和 severity。
  extra: 它不指定目标文件，目标由 rsyslog 规则决定。
  source:
