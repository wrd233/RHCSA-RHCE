- id: RHCSA-13-O04-QA-004
  model: RedHat-QA
  type: qa
  question: 从文件逐行发送 syslog 测试消息，命令骨架是什么？
  answer: '```bash

    logger -f <FILE> -p local1.notice -t batch-test

    ```'
  extra: 发送前确认文件中没有敏感内容。
  source:
  - logger(1)
