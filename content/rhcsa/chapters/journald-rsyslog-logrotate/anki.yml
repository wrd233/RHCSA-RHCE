- id: RHCSA-SERVICES-O02-QA-001
  model: RedHat-QA
  type: qa
  question: 只查看当前 boot 中 `sshd.service` 的 journal 记录，命令骨架是什么？
  answer: '```bash

    journalctl -u sshd.service -b --no-pager

    ```'
  extra: '`-u` 选择 unit，`-b` 把范围限定为当前启动。'
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::journal-query
  - card::command
  - priority::P0
- id: RHCSA-SERVICES-O02-QA-002
  model: RedHat-QA
  type: qa
  question: 系统已经保留多个 boot。查看上一次启动中 `sshd.service` 的日志，命令是什么？
  answer: '```bash

    journalctl -u sshd.service -b -1 --no-pager

    ```'
  extra: 先用 `journalctl --list-boots` 确认上一次 boot 确实可查询。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::journal-query
  - card::command
  - priority::P0
- id: RHCSA-SERVICES-O02-QA-003
  model: RedHat-QA
  type: qa
  question: '`journalctl -b -1` 没有结果，能否直接断定上一次启动没有发生任何事件？'
  answer: 不能。还可能是 journal 未持久保存、旧 boot 已被清理，或当前用户读取权限不足。
  extra: 下一步先查看 `--list-boots`、有效 `Storage=`、持久目录和磁盘占用。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::journal-persistence
  - card::boundary
  - priority::P0
- id: RHCSA-SERVICES-O02-QA-004
  model: RedHat-QA
  type: qa
  question: 修改 `/etc/rsyslog.d/*.conf` 后，应用配置前应先运行什么静态检查？
  answer: '```bash

    rsyslogd -N1

    ```'
  extra: 它证明配置可解析，不证明 selector 命中、文件可写或远端可达。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::rsyslog-local
  - card::verification
  - priority::P0
- id: RHCSA-SERVICES-O02-QA-005
  model: RedHat-QA
  type: qa
  question: 为验证 `local0.notice` 路由，怎样生成带唯一标识的测试事件？
  answer: '```bash

    TEST_ID="rhcsa13-$(date +%s)"

    logger -p local0.notice -t exam-audit "$TEST_ID"

    ```'
  extra: 唯一正文避免把历史消息误判为本次结果。
  source:
  - logger(1)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::logger-testing
  - card::command
  - priority::P0
- id: RHCSA-SERVICES-O02-QA-006
  model: RedHat-QA
  type: qa
  question: 使用 `journalctl --since` 查不到已知事件时，第一步应怎样调整调查？
  answer: 先放宽或移除时间条件，确认 boot、tag/unit 与当前时间时区，再逐步重新增加过滤条件。
  extra: 不要立即断定事件不存在，也不要直接修改时间同步配置。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::diagnosis
  - card::diagnosis
  - priority::P0
- id: RHCSA-13-K01-QA-001
  model: RedHat-QA
  type: qa
  question: journald 与 rsyslog 的核心职责分别是什么？
  answer: journald 负责从多种来源收集并保存结构化 journal；rsyslog 负责根据规则筛选消息并执行写文件、转发等 action。
  extra: 两者可以同时参与同一条消息的处理链。
  source:
  - RHEL 9 Configuring basic system settings Ch.6
  - systemd-journald.service(8)
  - rsyslog official documentation
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-13-K01-QA-002
  model: RedHat-QA
  type: qa
  question: journal 与 `/var/log/*.log` 文本文件有什么关键区别？
  answer: journal 是带索引和字段的结构化存储，由 journald 管理；普通文本日志由应用或 rsyslog 写入，通常由 logrotate 管理生命周期。
  extra: 一条消息可能同时存在于两侧，也可能只存在一侧。
  source:
  - systemd.journal-fields(7)
  - journalctl(1)
  - RH124 Ch.11
  - logrotate(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-13-K01-QA-003
  model: RedHat-QA
  type: qa
  question: '`journalctl` 中没有目标消息，是否能证明系统没有任何相关日志？'
  answer: 不能。应用可能直接写自己的文本日志，消息也可能已被清理、属于其他 boot，或被过滤条件排除。
  extra: 下一步应确认应用日志路径、boot、时间、字段和保留状态。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::object-model
  - card::boundary
  - priority::P0
- id: RHCSA-13-K01-QA-004
  model: RedHat-QA
  type: qa
  question: “当前可读”“跨重启持久”“仍被保留”分别是什么状态？
  answer: 当前可读说明记录仍在当前 journal；跨重启持久说明记录写入持久存储；仍被保留说明尚未被容量、时间或 vacuum 策略删除。
  extra: 三个状态必须分别验证。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::state-model
  - card::comparison
  - priority::P0
- id: RHCSA-13-K01-QA-005
  model: RedHat-QA
  type: qa
  question: syslog facility 与 severity 分别表示什么？
  answer: facility 表示消息类别或子系统；severity 表示严重级别。rsyslog selector 通常用两者共同选择消息。
  extra: '`local0` 到 `local7` 常用于自定义应用路由。'
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::facility-severity
  - card::concept
  - priority::P1
- id: RHCSA-13-K01-QA-006
  model: RedHat-QA
  type: qa
  question: syslog severity 数字与严重程度是什么关系？
  answer: 数字越小越严重：`emerg(0)` 最严重，`debug(7)` 最不严重。
  extra: 普通 selector 中 `notice` 通常还匹配比 notice 更严重的级别。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
  tags:
  - exam::rhcsa
  - chapter::journald-rsyslog-logrotate
  - topic::facility-severity
  - card::concept
  - priority::P0
- id: RHCSA-13-K01-CLOZE-001
  model: RedHat-Cloze
  type: cloze
  text: journal 由 {{c1::journald}} 管理自身轮转和 vacuum；普通文本日志通常由 {{c2::logrotate}} 管理轮转与保留。
  extra: 两者作用对象不同。
  source:
