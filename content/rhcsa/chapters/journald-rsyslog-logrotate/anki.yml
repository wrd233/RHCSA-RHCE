- id: RHCSA-13-O05-QA-009
  model: RedHat-QA
  type: qa
  question: 自定义日志路径因 SELinux 拒绝写入时，默认修复是否应关闭 SELinux？
  answer: 不应。应确认 AVC、路径标签和策略，使用正确文件上下文或规则。
  extra: 完整 SELinux 文件规则归第 29 章。
