- id: RHCSA-13-O03-QA-002
  model: RedHat-QA
  type: qa
  question: '`Storage=auto` 的有效结果由什么决定？'
  answer: 是否存在并可使用持久 journal 目录；可用时持久，否则使用运行时存储。
  extra: 不能只读到 `auto` 就断言一定持久或一定易失。
  source:
  - journald.conf(5)
  - systemd-journald.service(8)
  - RH124 Ch.11
