- id: RHCSA-13-O05-QA-004
  model: RedHat-QA
  type: qa
  question: 自定义 rsyslog 规则通常放在哪里？
  answer: '`/etc/rsyslog.d/*.conf`，主入口是 `/etc/rsyslog.conf`。'
  extra: 确认主配置确实 include 该目录。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
