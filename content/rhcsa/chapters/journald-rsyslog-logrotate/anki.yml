  - priority::P0
- id: RHCSA-13-O04-QA-006
  model: RedHat-QA
  type: qa
  question: '`logger` 返回成功能证明什么，不能证明什么？'
  answer: 只能证明本地发送调用没有立即失败；不能证明 selector 命中、目标文件写入或远端接收。
  extra: 最终证据必须在目标层。
  source:
  - logger(1)
  - RH124 Ch.11
  - rsyslog.conf(5)
  - rsyslog official documentation
