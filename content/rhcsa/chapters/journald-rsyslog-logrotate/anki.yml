  - priority::P0
- id: RHCSA-13-O03-QA-003
  model: RedHat-QA
  type: qa
  question: 管理员为 journald 建立持久化 drop-in 的推荐路径是什么？
  answer: '`/etc/systemd/journald.conf.d/*.conf`，例如 `/etc/systemd/journald.conf.d/60-persistent.conf`。'
  extra: 避免直接修改 `/usr/lib` 下的 vendor 配置。
  source:
