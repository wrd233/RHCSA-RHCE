- id: RHCSA-13-O06-QA-005
  model: RedHat-QA
  type: qa
  question: 远端转发的最终验收证据是什么？
  answer: 接收端 journal 或目标文件中出现与客户端生成完全相同的唯一 TEST_ID。
  extra: 客户端 journal 和服务状态只是中间证据。
  source:
