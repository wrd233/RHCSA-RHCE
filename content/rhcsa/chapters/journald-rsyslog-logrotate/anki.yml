- id: RHCSA-13-O02-QA-003
  model: RedHat-QA
  type: qa
  question: '`_BOOT_ID` 字段的主要用途是什么？'
  answer: 标识一条记录属于哪次系统启动，可用于跨 boot 查询和关联。
  extra: boot ID 与 `--list-boots` 输出对应。
  source:
  - systemd.journal-fields(7)
  - journalctl(1)
  - RH124 Ch.11
  tags:
