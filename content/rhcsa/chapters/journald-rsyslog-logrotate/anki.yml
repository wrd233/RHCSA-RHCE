  - topic::classic-task
  - card::process
  - priority::P0
- id: RHCSA-13-D01-QA-007
  model: RedHat-QA
  type: qa
  question: 日志查询或服务命令执行成功，是否等于业务终态正确？
  answer: 不等于。还需验证目标事件、文件/远端 action、轮转后写入和业务功能。
  extra: 证据必须与题目终态逐项对应。
