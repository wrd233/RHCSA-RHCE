- id: RHCSA-13-O05-QA-003
  model: RedHat-QA
  type: qa
  question: 传统 selector 中 `cron.none` 常用于什么？
  answer: 从一个组合 selector 的目标中排除 cron facility 消息。
  extra: 应结合整行规则阅读，不能单独作为 action。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
