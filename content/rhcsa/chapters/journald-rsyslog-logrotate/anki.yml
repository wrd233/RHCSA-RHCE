  - priority::P0
- id: RHCSA-13-O05-QA-006
  model: RedHat-QA
  type: qa
  question: 本地 rsyslog 路由最小动态验证链是什么？
  answer: 写唯一事件；确认 journal 中出现；确认目标文件出现同一 ID；检查文件权限。
  extra: journal 有而文件无时进入 rsyslog 层。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
