- id: RHCSA-13-O03-QA-008
  model: RedHat-QA
  type: qa
  question: 怎样严格证明 journal 已跨重启持久？
  answer: 重启前写入唯一事件；安全重启后用 `journalctl --list-boots` 确认历史 boot，并用 `journalctl -b -1 -t <TAG>` 找到该事件。
  extra: 当前 boot 中能查询到事件不等于跨重启验证完成。
