- id: RHCSA-13-O04-QA-002
  model: RedHat-QA
  type: qa
  question: '`logger -t exam-audit` 的作用是什么？'
  answer: 把 `SYSLOG_IDENTIFIER`/tag 设置为 `exam-audit`，便于 journal 和文本日志检索。
  extra: tag 不是进程可信身份。
  source:
