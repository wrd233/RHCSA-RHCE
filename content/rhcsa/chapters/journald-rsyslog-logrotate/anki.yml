- id: RHCSA-13-O06-QA-002
  model: RedHat-QA
  type: qa
  question: TCP 514 连接成功能否证明远端日志已落盘？
  answer: 不能。它只证明部分网络和监听条件；接收规则、解析和文件 action 仍可能失败。
  extra: 最终按同一 TEST_ID 在接收端验证。
  source:
