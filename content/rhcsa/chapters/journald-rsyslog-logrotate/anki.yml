- id: RHCSA-13-O01-QA-006
  model: RedHat-QA
  type: qa
  question: '`journalctl -t exam-audit` 按哪个字段过滤？'
  answer: 按 `SYSLOG_IDENTIFIER=exam-audit` 过滤。
  extra: '`logger -t exam-audit` 可生成对应标识。'
  source:
  - RH124 Ch.11
  - journalctl(1)
