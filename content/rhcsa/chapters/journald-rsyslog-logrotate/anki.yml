- id: RHCSA-13-O02-QA-007
  model: RedHat-QA
  type: qa
  question: 发现一条记录具有 `_SYSTEMD_UNIT=app.service`，能否据此证明应用功能正常？
  answer: 不能。它只证明记录的 unit 归属；还需验证监听、请求、数据或其他业务终态。
  extra: 日志证据不能替代外部功能验证。
