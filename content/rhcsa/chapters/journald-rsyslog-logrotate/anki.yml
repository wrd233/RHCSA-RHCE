  - chapter::journald-rsyslog-logrotate
  - topic::logrotate-reopen
  - card::verification
  - priority::P0
- id: RHCSA-13-O07-QA-015
  model: RedHat-QA
  type: qa
  question: logrotate 配置正确但从未自动执行，应检查哪些入口？
  answer: 检查 `logrotate.timer`、`logrotate.service` 的调用记录和调度状态。
  extra: timer 完整机制归第 15 章。
  source:
