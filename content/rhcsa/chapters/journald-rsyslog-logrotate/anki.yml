  - chapter::journald-rsyslog-logrotate
  - topic::journal-fields
  - card::comparison
  - priority::P1
- id: RHCSA-13-O02-QA-005
  model: RedHat-QA
  type: qa
  question: '`-o verbose` 与 `-o cat` 适合什么场景？'
  answer: '`verbose` 用于发现全部字段；`cat` 只输出消息正文，适合提取文本但会丢失时间和来源上下文。'
  extra: 不要用 `cat` 输出做完整审计证据。
  source:
