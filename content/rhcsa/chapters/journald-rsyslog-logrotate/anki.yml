- id: RHCSA-13-O01-QA-002
  model: RedHat-QA
  type: qa
  question: '`journalctl -b` 与 `journalctl -b -1` 分别选择什么？'
  answer: '`-b` 选择当前 boot；`-b -1` 选择上一次仍可查询的 boot。'
  extra: 没有 `-1` 结果时应先查看 `--list-boots`。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
