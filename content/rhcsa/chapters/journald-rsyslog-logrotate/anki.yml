  model: RedHat-QA
  type: qa
  question: 枚举 journal 中出现过的 `SYSLOG_IDENTIFIER` 值，命令是什么？
  answer: '```bash

    journalctl -F SYSLOG_IDENTIFIER

    ```'
  extra: '`-F` 可用于确认真实字段值，避免凭空猜测。'
