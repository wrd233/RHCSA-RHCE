- id: RHCSA-13-O01-QA-005
  model: RedHat-QA
  type: qa
  question: '`journalctl -u <UNIT>` 与 `_SYSTEMD_UNIT=<UNIT>` 的关系是什么？'
  answer: '`-u` 是按 unit 选择的便捷接口；直接字段匹配允许与其他字段组合并精确表达查询。'
  extra: 并非所有记录都一定具有 `_SYSTEMD_UNIT`。
  source:
