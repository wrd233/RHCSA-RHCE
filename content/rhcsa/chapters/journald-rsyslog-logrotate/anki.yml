- id: RHCSA-13-O01-QA-010
  model: RedHat-QA
  type: qa
  question: '`-n`、`-r` 和 `-f` 分别改变什么？'
  answer: '`-n` 限制最近条数；`-r` 让最新记录在前；`-f` 持续跟随新记录。'
  extra: 它们主要影响结果范围或呈现，不改变底层 journal。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
