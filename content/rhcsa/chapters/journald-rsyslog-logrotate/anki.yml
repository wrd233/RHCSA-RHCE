- id: RHCSA-13-O01-QA-007
  model: RedHat-QA
  type: qa
  question: 为什么不应长期只用 `_PID=<PID>` 识别一次历史故障？
  answer: PID 会在进程退出后复用。应结合 boot、unit、时间、UID 和可执行文件确认身份。
  extra: 短时间重现问题时 PID 仍可作为一个过滤维度。
  source:
  - systemd.journal-fields(7)
  - journalctl(1)
  - RH124 Ch.11
  tags:
