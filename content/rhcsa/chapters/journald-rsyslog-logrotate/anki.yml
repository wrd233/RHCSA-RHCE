  - priority::P1
- id: RHCSA-13-O02-QA-006
  model: RedHat-QA
  type: qa
  question: 需要把 journal 交给程序解析时，优先选择哪类输出？
  answer: 使用 `-o json` 或 `-o json-pretty` 等结构化输出，并由下游正确解析。
  extra: 不要依赖默认短格式的空格切分。
  source:
