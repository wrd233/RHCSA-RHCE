  - chapter::journald-rsyslog-logrotate
  - topic::journal-query
  - card::syntax
  - priority::P1
- id: RHCSA-13-O01-QA-009
  model: RedHat-QA
  type: qa
  question: '`journalctl -p warning` 的范围是什么？'
  answer: 选择 warning 以及更严重的级别，即 severity 数字 0 到 4。
  extra: 它不是只选择恰好 warning。
  source:
  - RH124 Ch.11
  - journalctl(1)
  - RHEL 9 Configuring basic system settings Ch.6
  tags:
