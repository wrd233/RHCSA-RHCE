- id: RHCSA-13-O05-QA-005
  model: RedHat-QA
  type: qa
  question: '`rsyslogd -N1` 通过后，能否断定目标文件会收到消息？'
  answer: 不能。它只检查配置可解析；还需验证规则加载、selector 命中、路径权限和 action 结果。
  extra: 用唯一 `logger` 事件完成动态验证。
  source:
  - rsyslog.conf(5)
  - rsyslog official documentation
  - RH124 Ch.11
