- id: RHCSA-13-O03-QA-009
  model: RedHat-QA
  type: qa
  question: 查看 journal 当前磁盘占用，命令是什么？
  answer: '```bash

    journalctl --disk-usage

    ```'
  extra: 它显示当前活动和归档 journal 的占用，不解释保留是否合理。
