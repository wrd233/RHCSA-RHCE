- id: RHCSA-13-O01-QA-001
  model: RedHat-QA
  type: qa
  question: 列出当前 journal 中可查询的所有启动轮次，命令是什么？
  answer: '```bash

    journalctl --list-boots

    ```'
  extra: 输出包含 boot 序号、boot ID 和时间范围。
