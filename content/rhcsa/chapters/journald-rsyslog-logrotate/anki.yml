  - chapter::journald-rsyslog-logrotate
  - topic::journal-query
  - card::comparison
  - priority::P1
- id: RHCSA-13-O01-QA-011
  model: RedHat-QA
  type: qa
  question: 一个组合了 boot、unit、PID、priority 和时间的查询为空，下一步最稳妥的做法是什么？
  answer: 按相反顺序逐个移除最窄条件，确认每个单独条件能否匹配，再重建查询。
  extra: 继续叠加条件会进一步隐藏证据。
