- id: RHCSA-13-O03-QA-005
  model: RedHat-QA
  type: qa
  question: '`SystemMaxUse=` 与 `RuntimeMaxUse=` 分别限制什么？'
  answer: '`SystemMaxUse` 限制持久 journal 使用量；`RuntimeMaxUse` 限制运行时 journal 使用量。'
  extra: 不要把其中一个当作两种存储的共同上限。
  source:
