- id: RHCSA-13-O07-QA-002
  model: RedHat-QA
  type: qa
  question: logrotate 的主配置和常见片段目录是什么？
  answer: 主配置是 `/etc/logrotate.conf`，片段通常位于 `/etc/logrotate.d/`。
  extra: 全局配置通常 include 片段目录。
  source:
  - logrotate(8)
  - RH124 Ch.11
