  - priority::P0
- id: RHCSA-13-O05-QA-007
  model: RedHat-QA
  type: qa
  question: journal 有 TEST_ID，但目标文件没有。下一条最有区分度的证据是什么？
  answer: 先运行 `rsyslogd -N1` 并检查 selector 的 facility/severity 与配置文件是否被 include。
  extra: 随后再查 rsyslog 服务日志、路径权限和 SELinux。
