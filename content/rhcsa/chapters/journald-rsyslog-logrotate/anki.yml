  - topic::journal-fields
  - card::concept
  - priority::P1
- id: RHCSA-13-O02-QA-004
  model: RedHat-QA
  type: qa
  question: '`SYSLOG_IDENTIFIER`、`_COMM` 和 `_EXE` 分别回答什么？'
  answer: '`SYSLOG_IDENTIFIER` 是客户端标识；`_COMM` 是短命令名；`_EXE` 是可执行文件路径。'
  extra: 三者可能不同，调查时不要把 tag 当作唯一进程身份。
  source:
  - systemd.journal-fields(7)
  - journalctl(1)
  - RH124 Ch.11
  tags:
