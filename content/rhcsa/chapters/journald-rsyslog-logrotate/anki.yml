- id: RHCSA-13-O03-QA-011
  model: RedHat-QA
  type: qa
  question: 为什么不能把 vacuum 当作磁盘紧张时的默认第一步？
  answer: vacuum 会删除历史证据。应先确认占用来源、保留要求和异常日志速率，再做最小清理。
  extra: 排障或审计期间尤其要避免无条件删除。
