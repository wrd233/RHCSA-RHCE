  - chapter::journald-rsyslog-logrotate
  - topic::rsyslog-remote
  - card::concept
  - priority::P1
- id: RHCSA-13-O06-QA-004
  model: RedHat-QA
  type: qa
  question: 远端日志不见了，应按什么层次调查？
  answer: 客户端事件→客户端规则→名称解析→协议/端口→网络/防火墙→服务端监听→接收规则→最终落盘。
  extra: 每层选择一条可区分的证据，不要只重启服务。
