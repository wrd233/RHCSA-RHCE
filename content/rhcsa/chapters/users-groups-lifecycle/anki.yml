- id: RHCSA-USERS-O03-QA-001
  type: qa
  question: '`chage -M`、`-m`、`-W`、`-E` 分别设置什么？'
  answer: 口令最大期限、最小期限、到期前警告天数、账号到期日期。
  extra: '`-I` 是口令过期后的失效天数；`-d 0` 常用于强制下次登录修改口令。'
