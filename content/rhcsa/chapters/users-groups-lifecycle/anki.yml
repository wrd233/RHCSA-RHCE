- id: RHCSA-07-K01-QA-006
  type: qa
  question: '`getent passwd alice` 有结果，是否一定能用 `usermod alice` 修改？'
  answer: 不一定；`getent` 可能返回远程身份源，而 `usermod` 管理本地账号数据库。
  extra: 先确认账号来源，再选择管理工具。
