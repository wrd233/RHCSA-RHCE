- id: RHCSA-USERS-K01-QA-003
  type: qa
  question: 通过系统名称服务查询账号和组，推荐什么命令？
  answer: '`getent passwd NAME` 与 `getent group NAME`。'
  extra: 它们遵循 NSS 配置，比只 grep 本地文件更符合系统解析语义。
  source:
