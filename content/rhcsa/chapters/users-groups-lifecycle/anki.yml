  priority: P1
  disabled: false
  semantic_type: comparison
- id: RHCSA-07-K01-QA-002
  type: qa
  question: 删除账号后为什么旧文件可能只显示数字所有者？
  answer: 文件仍保存原 UID，但名称服务已没有该 UID 对应的用户名。
  extra: 这类文件应先审计，不要直接删除。
  source:
