- id: RHCSA-07-K01-QA-003
  type: qa
  question: UID 与同名用户私有组的 GID 必须相同吗？
  answer: 不必须；UID 和 GID 属于独立的数字命名空间。
  extra: RHEL 常让二者相同只是默认约定，不是机制要求。
  source:
