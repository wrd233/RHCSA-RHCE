- id: RHCSA-USERS-K01-QA-006
  type: qa
  question: 管理员已把用户加入新组，但其当前 Shell 的 `id` 看不到，原因是什么？
  answer: 进程在会话建立时取得组凭据，现有 Shell 不会自动刷新。
  extra: 比较 `id USER` 与用户会话内的 `id`，再重新登录或创建新会话。
