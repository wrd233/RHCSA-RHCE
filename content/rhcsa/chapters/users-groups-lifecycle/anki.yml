- id: RHCSA-07-K01-QA-004
  type: qa
  question: 一个用户可有多少主组和附加组？
  answer: 恰好一个主组，零个或多个附加组。
  extra: 主组来自 passwd 主 GID，附加组通常由 group 成员关系表达。
