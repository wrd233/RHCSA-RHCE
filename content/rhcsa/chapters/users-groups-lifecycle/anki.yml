- id: RHCSA-USERS-K01-QA-002
  type: qa
  question: 为什么 `/etc/group` 某组成员列表为空，仍可能有用户属于该组？
  answer: 用户可以通过 `/etc/passwd` 中的主 GID 把该组作为主组。
  extra: 使用 `id USER` 汇总主组和附加组，不要只看组成员字段。
  source:
