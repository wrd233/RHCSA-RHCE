- id: RHCSA-07-K01-QA-001
  type: qa
  question: 用户名和 UID 的核心区别是什么？
  answer: 用户名是便于人使用的名称；UID 是系统识别本地用户的数字身份。
  extra: 文件保存数字 UID，账号改名通常不改变文件所有权。
  source:
  - RH124-RHEL9-Ch6
  tags:
