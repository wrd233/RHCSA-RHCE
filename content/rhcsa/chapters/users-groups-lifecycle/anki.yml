- id: RHCSA-USERS-O03-QA-004
  type: qa
  question: '`/sbin/nologin` 的主要作用边界是什么？'
  answer: 阻止正常交互式登录 Shell；不能笼统等同于完全禁用账号。
  extra: 服务仍可按该 UID 运行，特定协议是否受影响取决于其认证和会话方式。
