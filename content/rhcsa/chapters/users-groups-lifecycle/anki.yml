- id: RHCSA-USERS-K01-QA-001
  type: qa
  question: '`/etc/passwd`、`/etc/shadow`、`/etc/group` 分别保存什么核心信息？'
  answer: 账号公开属性；受保护的口令与期限；组定义、GID 与显式成员。
  extra: '`/etc/gshadow` 还保存受保护的组口令、管理员和成员字段。'
  source:
