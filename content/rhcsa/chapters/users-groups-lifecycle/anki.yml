  type: qa
  question: '`id alice` 与 alice 当前 Shell 中运行 `id` 的证据差异是什么？'
  answer: '`id alice` 查询名称服务计算出的身份；会话内 `id` 显示该进程实际持有的凭据。'
  extra: 组变更后，两者可能暂时不同。
