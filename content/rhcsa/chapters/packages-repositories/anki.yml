chapter_id: RHCSA-PACKAGES
deck: RedHat::RHCSA-RHEL9
note_types: [RedHat-QA, RedHat-Cloze]
notes:
  - id: RHCSA-PACKAGES-K01-QA-001
    type: qa
    question: RPM 与 DNF 的核心职责区别是什么？
    answer: RPM 管已安装包和本地包操作；DNF 使用仓库解析依赖并执行事务。
    extra: DNF 最终仍调用 RPM 层安装。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::comparison, priority::P0]
  - id: RHCSA-PACKAGES-K01-QA-002
    type: qa
    question: 查询本机是否已安装 `httpd`，使用什么？
    answer: '`rpm -q httpd`'
    extra: 仓库可用包查询属于 DNF 范围。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-K01-QA-003
    type: qa
    question: 列出已安装包 `httpd` 的文件，使用什么？
    answer: '`rpm -ql httpd`'
    extra: 未安装包可用 `dnf repoquery -l`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-K01-QA-004
    type: qa
    question: 从现有路径 `/usr/sbin/httpd` 反查所属已安装包，使用什么？
    answer: '`rpm -qf /usr/sbin/httpd`'
    extra: 文件不存在时改用 `dnf provides` 查仓库。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-K01-QA-005
    type: qa
    question: '`rpm -V <PACKAGE>` 无输出通常说明什么？'
    answer: 可验证的已安装文件属性与包元数据没有差异。
    extra: 有输出是调查线索，不等于恶意修改。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::output, priority::P1]
  - id: RHCSA-PACKAGES-K01-QA-006
    type: qa
    question: 安装本地 RPM 且需要仓库解析依赖，推荐什么骨架？
    answer: '`dnf install ./package.rpm`'
    extra: 不使用 `rpm --nodeps` 绕过依赖。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-O01-QA-001
    type: qa
    question: repo 文件位于哪个目录？
    answer: '`/etc/yum.repos.d/*.repo`'
    extra: 每个 section ID 应唯一。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-O01-QA-002
    type: qa
    question: repo 的 `baseurl`、`enabled`、`gpgcheck`、`gpgkey` 分别表达什么？
    answer: 仓库根位置、启用状态、包签名校验、可信公钥入口。
    extra: baseurl 应指向包含 repodata 的根。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::parameter, priority::P0]
  - id: RHCSA-PACKAGES-O01-QA-003
    type: qa
    question: '`dnf repolist --all` 能证明什么，不能证明什么？'
    answer: 能证明配置被解析和启用状态；不能充分证明远端元数据可达。
    extra: 真实刷新用 `makecache --refresh`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::verification, priority::P0]
  - id: RHCSA-PACKAGES-O01-QA-004
    type: qa
    question: 强制刷新启用仓库元数据的命令是什么？
    answer: '`dnf makecache --refresh`'
    extra: 它会暴露 URL、网络和 repodata 错误。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-O01-QA-005
    type: qa
    question: 限定从 `exam-baseos` 查询 bash 包，命令骨架是什么？
    answer: '`dnf repoquery --repo exam-baseos bash`'
    extra: 证明目标仓库提供该包。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::verification, priority::P1]
  - id: RHCSA-PACKAGES-O01-QA-006
    type: qa
    question: GPG 校验失败时，为什么不能直接设置 `gpgcheck=0`？
    answer: 这会移除题目要求的签名安全属性，而不是修复 key、时间或来源。
    extra: 先核对可信 key 和包来源。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, priority::P0]
  - id: RHCSA-PACKAGES-O02-QA-001
    type: qa
    question: 从命令名 `semanage` 反查提供包，使用什么？
    answer: '`dnf provides ''*/semanage''`'
    extra: 模式应引用以防 Shell 展开。
    source: [RH124, RH134]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-O02-QA-002
    type: qa
    question: '`dnf install` 返回成功后，最少还要验证哪些包层对象？'
    answer: RPM 安装记录、关键文件归属、配置和 systemd unit。
    extra: 再继续验证服务状态与功能。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::verification, priority::P0]
  - id: RHCSA-PACKAGES-O02-QA-003
    type: qa
    question: 为什么执行 `dnf remove` 前必须阅读 Transaction Summary？
    answer: 事务可能连带删除不再需要的依赖或影响其他软件。
    extra: 不以包名猜实际影响集合。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, priority::P0]
  - id: RHCSA-PACKAGES-O02-QA-004
    type: qa
    question: 查看 DNF 事务列表和指定事务详情分别用什么？
    answer: '`dnf history` 与 `dnf history info <ID>`。'
    extra: undo 仍受当前仓库版本可用性约束。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P1]
  - id: RHCSA-PACKAGES-O02-QA-005
    type: qa
    question: 为什么 DNF 事务成功不能证明 Web 服务题完成？
    answer: 事务只证明包层；还需配置、active/enabled、监听和访问。
    extra: 包安装不会自动保证服务终态。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::verification, priority::P0]
  - id: RHCSA-PACKAGES-K02-QA-001
    type: qa
    question: 查看 AppStream 模块流与模块详情分别用什么？
    answer: '`dnf module list` 与 `dnf module info <MODULE>`。'
    extra: 可用流由当前 RHEL 9 仓库决定。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P1]
  - id: RHCSA-PACKAGES-K02-QA-002
    type: qa
    question: '`dnf module reset` 会自动删除该模块已安装包吗？'
    answer: 不会；它重置流选择，不等于卸载内容。
    extra: 改流前检查已安装状态和依赖影响。
    source: [RHEL9-DNF]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, priority::P1]
  - id: RHCSA-PACKAGES-K02-QA-003
    type: qa
    question: 查询和安装软件包组的骨架是什么？
    answer: '`dnf group list/info` 与 `dnf group install ''<GROUP>''`。'
    extra: 安装组后仍要验证各目标服务。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P1]
  - id: RHCSA-PACKAGES-O03-QA-001
    type: qa
    question: 设置静态主机名的命令是什么？
    answer: '`hostnamectl set-hostname <FQDN>`'
    extra: 不会自动创建 DNS 或 hosts 记录。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P0]
  - id: RHCSA-PACKAGES-O03-QA-002
    type: qa
    question: 验证主机名本身与名称解析分别用什么？
    answer: '`hostnamectl status` 与 `getent hosts <FQDN>`。'
    extra: 两个对象独立。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::verification, priority::P0]
  - id: RHCSA-PACKAGES-O03-QA-003
    type: qa
    question: '`systemctl isolate` 与 `set-default` 的核心区别是什么？'
    answer: isolate 当前切换 target；set-default 设置下次启动默认 target。
    extra: isolate 可能停止当前服务或会话。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::comparison, priority::P0]
  - id: RHCSA-PACKAGES-O03-QA-004
    type: qa
    question: 查看 tuned 推荐 profile 与当前 profile 分别用什么？
    answer: '`tuned-adm recommend` 与 `tuned-adm active`。'
    extra: 推荐值不等于已应用值。
    source: [RH124, RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::packages-repositories, card::command, priority::P1]
  - id: RHCSA-PACKAGES-D01-QA-001
    type: qa
    question: 下载 `repodata/repomd.xml` 返回 404，优先检查什么？
    answer: baseurl 是否指向包含 repodata 的仓库根，以及变量展开。
    extra: 清缓存不会修复错误 URL。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, priority::P0]
  - id: RHCSA-PACKAGES-D01-QA-002
    type: qa
    question: DNF 报依赖冲突或包被过滤，下一步证据是什么？
    answer: 完整错误、`repoquery` 依赖/反向依赖、仓库和 module 状态。
    extra: 不先使用 `--allowerasing`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, priority::P0]
  - id: RHCSA-PACKAGES-D01-QA-003
    type: qa
    question: 为什么 `--allowerasing` 不是依赖冲突的第一尝试？
    answer: 它可能删除冲突包并影响其他任务，必须先理解事务摘要。
    extra: 先定位仓库、架构、版本流或依赖缺口。
    source: [DNF]
    tags: [exam::rhcsa, chapter::packages-repositories, card::diagnosis, coverage::extra]
  - id: RHCSA-PACKAGES-C01-QA-001
    type: qa
    question: 指定仓库安装服务的完整验收骨架是什么？
    answer: repo 解析/刷新 → 来源查询 → DNF 事务 → RPM/文件/unit → 配置语法 → 服务状态/功能。
    extra: 每层使用对应证据。
    source: [RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::packages-repositories, card::process, priority::P0, task::repository-service]
  - id: RHCSA-PACKAGES-K01-CLOZE-001
    type: cloze
    text: 已安装文件反查包用 `{{c1::rpm -qf}}`；尚不存在的命令反查仓库包用 `{{c2::dnf provides}}`。
    extra: 两者查询对象不同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::cloze, priority::P0]
  - id: RHCSA-PACKAGES-O01-CLOZE-001
    type: cloze
    text: repo 配置可见性用 `{{c1::dnf repolist --all}}`；真实刷新元数据用 `{{c2::dnf makecache --refresh}}`。
    extra: repolist 不充分证明 URL 可达。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::cloze, priority::P0]
  - id: RHCSA-PACKAGES-O03-CLOZE-001
    type: cloze
    text: 当前切换 target 用 `systemctl {{c1::isolate}}`；设置启动默认值用 `systemctl {{c2::set-default}}`。
    extra: 两者风险与作用时点不同。
    source: [RH124]
    tags: [exam::rhcsa, chapter::packages-repositories, card::cloze, priority::P0]
