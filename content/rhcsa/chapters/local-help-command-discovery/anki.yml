- id: RHCSA-03-D01-QA-013
  type: qa
  question: 把本章方法迁移到真实工单时，至少应保留哪些证据？
  answer: 原始症状、`type/command` 结果、帮助主题与 section、RPM/DNF 查询、版本边界和后续功能验证入口。
  extra: 使其他人能复核判断路径。
