  model: RedHat-QA
  priority: P1
- id: RHCSA-03-D01-QA-010
  type: qa
  question: 经典任务中，`dnf provides` 命中后怎样才算合格记录？
  answer: 记录候选包、架构、仓库和匹配路径，并明确“未证明已安装”。
  extra: 不要求写死版本或唯一包名。
  source:
  - dnf(8)
