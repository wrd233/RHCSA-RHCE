  - task::local-evidence
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-03-D01-QA-011
  type: qa
  question: 经典任务中，怎样证明打开的是 `/etc/passwd` 文件格式页？
  answer: 使用 `man 5 passwd`，并从页面识别文件字段、`FILES` 与 `SEE ALSO`。
  extra: 只写 `man passwd` 不足以消歧。
