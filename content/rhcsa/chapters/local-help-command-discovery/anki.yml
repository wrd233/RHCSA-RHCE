  - card::verification
  - priority::P0
  model: RedHat-QA
  priority: P0
- id: RHCSA-03-D01-QA-009
  type: qa
  question: 经典任务中，调查 `test`、`cd`、`passwd(5)`、`chage`、`semanage` 的顺序反映了什么模型？
  answer: 命令对象 → 帮助入口 → man section → 功能发现 → 本地包所有权 → 仓库提供能力。
  extra: 每一步使用不同证据源。
  source:
