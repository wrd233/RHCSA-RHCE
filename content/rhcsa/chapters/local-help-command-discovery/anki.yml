- id: RHCSA-03-K01-QA-001
  type: qa
  question: 命令行中出现一个名称时，为什么不能直接假定它对应磁盘上的可执行文件？
  answer: 因为当前 Bash 还可能把它解释为 alias、function 或 builtin。
  extra: 先用 `type` 或 `command -V` 确认对象，再选择帮助和软件查询入口。
  source:
  - bash(1)
  - RH124-Ch4
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-002
  type: qa
  question: Shell alias 的本质是什么？
  answer: 它是在 Shell 解析阶段对命令名称进行的文本替换。
  extra: alias 通常只属于当前 Shell 环境，可能由启动文件定义。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-003
  type: qa
  question: Shell function 与外部脚本的核心差异是什么？
  answer: function 定义保存在当前 Shell 中并由 Shell 执行；外部脚本是文件系统中的文件，通过路径查找和执行。
  extra: 两者可能同名，`type` 能区分当前优先对象。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-004
  type: qa
  question: Bash builtin 为什么不一定有独立的可执行文件路径？
  answer: 因为 builtin 由 Bash 进程内部实现，不需要从磁盘启动同名程序。
  extra: builtin 的首选帮助入口是 `help <NAME>`。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-005
  type: qa
  question: “当前 Shell 会执行什么”“文件在哪里”“文件属于哪个包”分别应优先查什么？
  answer: 依次使用 `type`/`command`、路径工具作为线索、`rpm -qf <PATH>`。
  extra: 仓库中谁能提供该路径还要单独使用 `dnf provides`。
  source:
  - bash(1)
  - rpm(8)
  - dnf(8)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-006
  type: qa
  question: 在 man page 中找到一个参数，能否证明对应系统任务已经完成？
  answer: 不能。它只提供操作语义依据，仍需对目标对象执行状态和功能验证。
  extra: 帮助证据、命令退出状态和业务终态是不同层。
  source:
  - RH124-Ch4
  - man(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-03-K01-QA-007
  type: qa
  question: 本地 RPM 数据库与 DNF 仓库元数据分别描述什么？
  answer: RPM 数据库描述本机已安装包及其文件记录；DNF 元数据描述当前可见软件源中的候选包和提供能力。
  extra: 两者结果可以不同且同时正确。
  source:
  - rpm(8)
  - dnf(8)
  - RH124-Ch14
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-008
  type: qa
  question: 为什么同一命令名在不同用户或不同终端中的 `type` 结果可能不同？
  answer: alias、function、`PATH`、启动文件和 Shell 会话状态可能不同。
  extra: 记录结果时应保留用户与 Shell 环境。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-03-K01-QA-009
  type: qa
  question: 外部命令路径缓存会影响哪一层状态？
  answer: 它影响当前 Bash 对外部命令路径的复用，不改变 RPM 数据库或 DNF 仓库元数据。
  extra: 确认是缓存问题后可用 `hash -r` 清理当前 Shell 缓存。
  source:
  - bash(1)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::concept
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-010
  type: qa
  question: 一个文件由 RPM 包拥有，能否证明当前短名称一定调用该文件？
  answer: 不能。同名 alias、function、builtin 或更靠前的 `PATH` 路径可能改变解析结果。
  extra: Shell 层和包所有权层必须分别查询。
  source:
  - bash(1)
  - rpm(8)
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-03-K01-QA-011
  type: qa
  question: “命令存在”和“命令能完成目标功能”有什么区别？
  answer: 前者只说明名称可解析或文件存在；后者还依赖参数、配置、权限、服务和目标状态。
  extra: 不要把 `command -v` 成功当作业务验收。
  source:
  - bash(1)
  - RH124-Ch4
  tags:
  - exam::rhcsa
  - chapter::local-help-command-discovery
  - topic::command-objects
  - card::comparison
  - priority::P1
  model: RedHat-QA
  priority: P1
- id: RHCSA-03-K01-QA-012
  type: qa
  question: 面对陌生命令时，本章推荐的最小调查顺序是什么？
  answer: 先用 `type`/`command` 确认对象，再选择本地帮助；拿到路径后查 RPM 所有权，缺失路径再查 DNF 提供者。
  extra: 每一步只声明当前证据实际证明的结论。
  source:
