- id: RHCSA-03-D01-QA-007
  type: qa
  question: 为什么互联网搜索不能作为本章第一证据？
  answer: 它可能对应不同发行版、版本或软件源，而本地帮助与数据库直接描述当前环境。
  extra: 本地资料不足时再使用官方在线文档补充。
  source:
  - RH124-Ch4
  tags:
