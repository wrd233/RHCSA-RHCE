  priority: P1
- id: RHCSA-03-O02-QA-008
  type: qa
  question: Info 浏览中 `n`、`p`、`u` 分别表示什么？
  answer: 下一个节点、上一个节点、上一级节点。
  extra: '`Enter` 跟随菜单项，`q` 退出。'
  source:
