- id: RHCSA-03-D01-QA-006
  type: qa
  question: 同名 alias 遮蔽外部命令时，为什么不应把删除 alias 作为默认修复？
  answer: alias 可能是有意的用户环境配置；应先确认任务要求调用哪个对象。
  extra: 可用 `type -a` 观察外部候选。
  source:
