  question: '`apropos` 与 `dnf search` 的对象有什么不同？'
  answer: '`apropos` 搜本地手册主题索引；`dnf search` 搜软件包名称和描述元数据。'
  extra: 已有明确缺失路径时优先用 `dnf provides`。
