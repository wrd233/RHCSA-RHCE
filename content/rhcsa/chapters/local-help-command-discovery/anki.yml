  priority: P1
- id: RHCSA-03-O02-QA-010
  type: qa
  question: '`info <TOPIC>` 没有文档，能否证明命令不存在？'
  answer: 不能。可能只是 Info 文档未安装；仍应检查 `type`、`--help` 和 `man`。
  extra: 帮助源可用性与命令可用性是不同状态。
  source:
