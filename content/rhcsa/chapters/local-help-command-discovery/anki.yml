  priority: P0
- id: RHCSA-03-O02-QA-007
  type: qa
  question: man page 与 Info 文档的主要组织差异是什么？
  answer: man page 通常按单页和标准标题组织；Info 以节点、菜单和交叉引用组织长文档。
  extra: 本地是否存在某个 Info 主题需实际查询。
  source:
