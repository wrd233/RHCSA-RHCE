- id: RHCSA-03-O05-QA-003
  type: qa
  question: '`rpm -qf <PATH>` 能证明什么，不能证明什么？'
  answer: 能证明本机 RPM 数据库记录的已安装包所有权；不能证明文件当前存在、内容未被修改、仓库唯一提供者或当前 Shell 一定调用它。
  extra: 需要按问题进入其他证据层。
