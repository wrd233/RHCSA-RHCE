  priority: P2
- id: RHCSA-03-O02-QA-011
  type: qa
  question: 已知命令名称时，推荐的本地帮助路由是什么？
  answer: 先 `type`；builtin 用 `help`，外部命令先看 `--help`，完整细节进 `man`，需要节点式长文档时看 `info`。
  extra: alias/function 先读展开或定义。
  source:
