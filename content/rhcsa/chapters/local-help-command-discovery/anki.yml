  priority: P2
- id: RHCSA-03-O02-QA-013
  type: qa
  question: 找到正确帮助页后，至少还应记录哪两类信息再执行命令？
  answer: 作用对象与关键参数/文件路径；并预先定义操作后的验证入口。
  extra: 避免只记命令字符串。
