- id: RHCSA-03-D01-QA-012
  type: qa
  question: 只看到某命令退出状态为 0，能否宣布经典任务全部完成？
  answer: 不能。还要检查每个评分对象的证据层和限制条件。
  extra: 命令成功不等于调查结论完整。
