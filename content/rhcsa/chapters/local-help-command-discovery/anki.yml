  priority: P1
- id: RHCSA-03-O02-QA-012
  type: qa
  question: 为什么本地帮助应成为考试环境中的第一证据？
  answer: 它不依赖互联网，并且通常与当前系统安装版本和对象直接对应。
  extra: 在线文档可作补充，但不能覆盖当前主机证据。
  source:
