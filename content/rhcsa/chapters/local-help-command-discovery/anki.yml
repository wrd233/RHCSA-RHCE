  - card::boundary
  - priority::P2
  model: RedHat-QA
  priority: P2
- id: RHCSA-03-D01-QA-008
  type: qa
  question: 调查记录为什么要写“该证据不能证明什么”？
  answer: 这样可以防止把局部查询扩大为安装、持久性或业务终态结论。
  extra: 也是后续选择下一条证据的依据。
  source:
