- id: RHCSA-03-O03-QA-012
  type: qa
  question: man page 的 `FILES` 主要回答什么？
  answer: 列出与主题相关的配置、数据、缓存或运行时路径。
  extra: 列出不等于每个文件当前都存在或被实际读取。
