- id: RHCSA-03-O02-QA-009
  type: qa
  question: 命令可以执行，但 `man <NAME>` 查不到；第一步应检查什么？
  answer: 先用 `type <NAME>` 确认它是否是 Bash builtin、function、alias 或外部命令。
  extra: builtin 应转向 `help`。
  source:
  - bash(1)
  - man(1)
