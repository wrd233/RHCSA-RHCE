- id: RHCSA-03-O05-QA-002
  type: qa
  question: '`rpm -qf <PATH>` 中 `-q` 与 `-f` 分别表示什么？'
  answer: '`-q` 进入查询模式；`-f` 按文件路径查询拥有它的已安装包。'
  extra: 本章不使用低级 RPM 强制安装。
