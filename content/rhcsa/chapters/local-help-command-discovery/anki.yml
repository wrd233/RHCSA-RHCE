  type: qa
  question: 查询本机 `/usr/bin/chage` 由哪个已安装包拥有，命令是什么？
  answer: '```bash

    rpm -qf /usr/bin/chage

    ```'
  extra: 结果是本地 RPM 数据库的所有权记录；它本身不证明该文件当前仍存在。
