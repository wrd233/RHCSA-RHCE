  type: qa
  question: '`apropos` 无结果时，为什么不能直接断定系统没有相关命令？'
  answer: 可能是关键词过窄、主题名不同、man page 未安装、目标是 builtin，或 man 索引缺失。
  extra: 应先验证已知 man page 和索引状态。
