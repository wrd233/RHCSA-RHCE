- id: RHCSA-27-W01-QA-002
  type: qa
  question: 为什么监控脚本不应高频访问所有 autofs key？
  answer: 持续访问会保持载荷活跃，破坏空闲卸载行为并增加远端负载。
  extra: 选择代表 key 和合理周期。
