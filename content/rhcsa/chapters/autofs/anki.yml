- id: RHCSA-27-K02-QA-010
  type: qa
  question: master 为 `/projects /etc/auto.projects` 时，子 map 第一字段写成 `/projects/alpha` 有什么问题？
  answer: 它把 direct 的完整路径形式误用于 indirect map；请求 key `alpha` 无法匹配。
  extra: 应改为 `alpha`。
  source:
