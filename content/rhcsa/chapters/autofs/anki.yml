- id: RHCSA-27-K03-QA-005
  type: qa
  question: '`automount -m` 能显示 wildcard 规则，能否证明任意用户目录都存在于远端？'
  answer: 不能。规则只描述替换，远端目录仍需在触发时验证。
  extra: 不存在的 key 可能产生失败查找。
