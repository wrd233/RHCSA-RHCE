  - chapter::autofs
  - topic::object-model
  - card::concept
  - priority::P0
- id: RHCSA-NFS-QA-008
  type: qa
  question: 展开 autofs 当前有效映射的命令是什么？
  answer: '`automount -m`'
  extra: 它证明配置可读取和展开，不证明远端已经挂载或可读写。
  source:
  - automount(8)
  - autofs(8)
  - RHEL9-Managing-File-Systems-Ch19
