- id: RHCSA-27-T02-QA-001
  type: qa
  question: indirect master 为 `/projects`，map key 错写 `/projects/alpha`，最小修复是什么？
  answer: 把 key 改为 `alpha`，再展开、reload、精确触发和核对源。
  extra: 不需要修改远端 NFS。
