- id: RHCSA-27-W01-QA-001
  type: qa
  question: 生产环境修改 autofs 前，建议保存哪些基线证据？
  answer: '`automount -m`、服务状态、当前 autofs 触发层和当前 NFS 载荷。'
  extra: 用于比较文件内容与 daemon 有效状态。
