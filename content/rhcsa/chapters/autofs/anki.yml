  type: qa
  question: '`automount -m` 已显示正确规则，但触发失败，下一步应优先检查哪类证据？'
  answer: 精确访问的错误、`findmnt` 当前关系和 `journalctl -u autofs -b`。
  extra: 随后按错误判断是 key、远端源还是权限层。
