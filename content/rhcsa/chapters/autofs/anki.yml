- id: RHCSA-27-O01-QA-008
  type: qa
  question: 配置 autofs 家目录时，为什么不应把普通 `mount -t nfs` 留作最终状态？
  answer: 因为它建立的是手工当前挂载，不证明访问触发和空闲卸载。
  extra: 临时挂载只能用于独立诊断，完成后应卸载。
  source:
