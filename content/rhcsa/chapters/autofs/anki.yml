- id: RHCSA-27-K02-QA-008
  type: qa
  question: 需要在 `/projects` 下按 `alpha`、`beta` 管理一组共享，优先选择哪类 map？
  answer: indirect map。
  extra: master point 为 `/projects`，子 map key 为 `alpha`、`beta`。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
