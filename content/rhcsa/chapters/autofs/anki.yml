  - priority::P0
- id: RHCSA-NFS-QA-010
  type: qa
  question: autofs 触发前，`findmnt` 中没有 `/shares/docs` 的 NFS 载荷，是否一定表示失败？
  answer: 不一定。按需挂载可能尚未被精确访问触发。
  extra: 先执行 `stat /shares/docs`，再用 `findmnt -T /shares/docs` 核对。
  source:
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::trigger-state
  - card::diagnosis
  - priority::P0
- id: RHCSA-NFS-QA-011
  type: qa
  question: autofs wildcard map 中 `*` 与 `&` 通常怎样配合？
  answer: '`*` 匹配请求 key，`&` 在 location 中代入该 key。'
  extra: 常用于本地与远端末级目录同名的用户家目录。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::wildcard
  - card::parameter
  - priority::P0
- id: RHCSA-NFS-QA-015
  type: qa
  question: 修改 autofs map 后的推荐验证链是什么？
  answer: '`automount -m` → reload autofs → 精确访问 key → `findmnt` 核对源 → 目标身份功能 → journal。'
  extra: 不要只看服务 active。
  source:
  - RHCSA9-Mock
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::verification-chain
  - card::process
  - priority::P0
- id: RHCSA-NFS-QA-016
  type: qa
  question: 固定 NFS 挂载与 autofs 的核心生命周期区别是什么？
  answer: 固定挂载通常由 fstab 在启动或 `mount -a` 时建立；autofs 在访问时按需挂载并可空闲卸载。
  extra: 按题目要求选择；systemd automount 不作为本章主线替代。
  source:
  - RHEL9-Managing-File-Systems-Ch18
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::lifecycle-choice
  - card::comparison
  - priority::P0
- id: RHCSA-27-K01-QA-001
  type: qa
  question: autofs 的子 map 一行主要描述哪三个对象？
  answer: key、挂载选项和 location。
  extra: 基本骨架是 `key -options location`。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::object-model
  - card::concept
  - priority::P0
- id: RHCSA-27-K01-QA-002
  type: qa
  question: autofs 触发文件系统与远端 NFS 载荷分别承担什么作用？
  answer: 触发层拦截路径访问并发起挂载；NFS 载荷提供实际远端文件内容。
  extra: 看到 `findmnt -t autofs` 不等于已经看到目标 NFS。
  source:
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::object-model
  - card::comparison
  - priority::P0
- id: RHCSA-27-K01-QA-003
  type: qa
  question: '`automount -m` 成功与 `autofs.service` active 分别证明什么？'
  answer: 前者证明 map 可读取和展开；后者证明 daemon 当前运行。
  extra: 两者都不能单独证明目标 key 可触发或用户可读写。
  source:
  - automount(8)
  - autofs(8)
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::state-model
  - card::comparison
  - priority::P0
- id: RHCSA-27-K01-QA-004
  type: qa
  question: 本地目录已经存在，能否据此证明 autofs 载荷已经挂载？
  answer: 不能。它可能只是普通目录或 autofs 触发入口。
  extra: 用 `findmnt` 核对当前文件系统来源。
  source:
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::state-model
  - card::boundary
  - priority::P0
- id: RHCSA-27-K01-QA-005
  type: qa
  question: autofs 中 idle 与 busy 的区别是什么？
  answer: idle 表示载荷没有活动引用，可在超时后尝试卸载；busy 表示仍被进程使用。
  extra: 当前工作目录、打开文件和后台扫描都可能保持 busy。
  source:
  - automount(8)
  - autofs(8)
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::state-model
  - card::concept
  - priority::P1
- id: RHCSA-27-K01-QA-006
  type: qa
  question: 怎样证明载荷超时卸载后 autofs 仍然可用？
  answer: 确认 NFS 载荷消失后，再次精确访问 key，并用 `findmnt` 确认正确源重新出现。
  extra: 只看到卸载不能证明再触发能力。
  source:
  - automount(8)
  - autofs(8)
  - RHEL9-Managing-File-Systems-Ch19
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::state-model
  - card::verification
  - priority::P0
- id: RHCSA-27-K01-QA-007
  type: qa
  question: '`systemctl is-active autofs` 返回 active，能否宣布自动挂载任务完成？'
  answer: 不能。还要验证 map、触发层、精确 key、当前源和目标身份功能。
  extra: active 只是 daemon 层证据。
  source:
  - RHCSA9-Mock
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
