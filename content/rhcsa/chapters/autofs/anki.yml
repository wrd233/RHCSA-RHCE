- id: RHCSA-27-O01-QA-001
  type: qa
  question: 在 RHEL 9 客户端配置 NFS autofs，通常需要安装哪些包？
  answer: '`autofs` 和 `nfs-utils`。'
  extra: '`autofs` 提供 automounter；`nfs-utils` 提供 NFS 客户端能力。'
  source:
