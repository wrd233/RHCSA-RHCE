- id: RHCSA-NFS-QA-007
  type: qa
  question: autofs master map 的职责是什么？
  answer: 把 indirect map 的父挂载点或 direct map 标记 `/-` 关联到子 map。
  extra: 具体 key、选项和远端位置由子 map 定义。
  source:
