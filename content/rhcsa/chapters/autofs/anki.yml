- id: RHCSA-27-K02-QA-001
  type: qa
  question: master map entry 的基本语法骨架是什么？
  answer: '`mount-point  map-name  options`'
  extra: options 可省略；direct map 的 mount-point 使用 `/-`。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
