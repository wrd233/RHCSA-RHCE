  type: qa
  question: 按用户 key 自动挂载任务的最终验收顺序是什么？
  answer: 配置展开 → active/enabled → 触发层 → 精确触发 → 当前源 → 用户读写 → 超时 → 再触发。
  extra: 不要省略用户身份和再触发。
