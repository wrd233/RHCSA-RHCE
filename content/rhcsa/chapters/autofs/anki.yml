  - priority::P0
- id: RHCSA-27-K02-QA-002
  type: qa
  question: 子 map entry 的基本语法骨架是什么？
  answer: '`key  -options  location`'
  extra: 选项字段位于 key 与 location 之间。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::map-syntax
  - card::syntax
  - priority::P0
- id: RHCSA-27-K02-QA-003
  type: qa
  question: 子 map 中 `-fstype=nfs,rw` 表达什么？
  answer: 指定载荷文件系统类型为 NFS，并请求读写挂载。
  extra: 实际写权限仍受远端导出和文件所有权控制。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::map-syntax
  - card::parameter
  - priority::P0
- id: RHCSA-27-K02-QA-004
  type: qa
  question: autofs map 中 NFS location 的常见格式是什么？
  answer: '`<HOST>:/<EXPORT_PATH>`'
  extra: 例如 `serverb:/rhome/remoteuser0`。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::map-syntax
  - card::syntax
  - priority::P0
- id: RHCSA-27-K02-QA-005
  type: qa
  question: indirect map 与 direct map 的 key 有什么区别？
  answer: indirect key 是 master point 下的相对目录组件；direct key 是完整绝对路径。
  extra: direct map 在 master 中关联 `/-`。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::path-model
  - card::comparison
  - priority::P0
- id: RHCSA-27-K02-QA-006
  type: qa
  question: direct map 在 master map 中使用什么 mount-point 标记？
  answer: '`/-`'
  extra: 它不是实际访问目录，实际绝对路径写在 direct 子 map key 中。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::path-model
