- id: RHCSA-27-K02-QA-009
  type: qa
  question: 在 `/etc/auto.master.d/` 中创建本地 master 片段时，课程常用什么文件后缀？
  answer: '`.autofs`'
  extra: 例如 `/etc/auto.master.d/rhome.autofs`；最终仍以 `automount -m` 为准。
  source:
