- id: RHCSA-27-O01-QA-004
  type: qa
  question: 首次启动并设置 autofs 开机启用的命令是什么？
  answer: '`systemctl enable --now autofs.service`'
  extra: 操作后分别检查 active 与 enabled。
  source:
