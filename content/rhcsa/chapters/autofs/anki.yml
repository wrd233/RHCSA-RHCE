- id: RHCSA-27-O01-QA-007
  type: qa
  question: 为什么最终读写测试要以 `remoteuser0` 身份执行？
  answer: 因为 root 的访问结果不能证明题目用户具有所需权限。
  extra: 远端 UID/GID 与导出策略会影响普通用户。
  source:
  - RHCSA9-Mock
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
