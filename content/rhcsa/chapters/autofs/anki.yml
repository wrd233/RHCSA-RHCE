- id: RHCSA-27-T01-QA-003
  type: qa
  question: 考试题要求 autofs 时，把相同 NFS 写入 `/etc/fstab` 是否等价？
  answer: 不等价。fstab 不证明按 key 触发和空闲卸载。
  extra: 生命周期是评分对象的一部分。
