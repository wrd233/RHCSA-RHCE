  - priority::P0
- id: RHCSA-27-K02-QA-007
  type: qa
  question: 需要按需挂载 `/srv/docs` 和 `/opt/catalog` 两个分散路径，优先选择哪类 map？
  answer: direct map。
  extra: master 使用 `/-`，子 map 分别列出两个完整路径。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
