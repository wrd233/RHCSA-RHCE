  question: 超过 timeout 后载荷仍存在，下一步优先检查什么？
  answer: 检查 Shell 当前目录、打开文件和其他活动引用，确认载荷是否 busy。
  extra: 可使用 `fuser -vm <PATH>` 辅助调查。
