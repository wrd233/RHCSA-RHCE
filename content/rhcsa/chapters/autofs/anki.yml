- id: RHCSA-27-O01-QA-006
  type: qa
  question: 触发后怎样核对 `/rhome/remoteuser0` 当前来自哪个源？
  answer: '`findmnt -T /rhome/remoteuser0`'
  extra: 核对 TARGET、SOURCE、FSTYPE 与 OPTIONS。
  source:
  - RHCSA9-Mock
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
