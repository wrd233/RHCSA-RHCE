- id: RHCSA-27-O01-QA-003
  type: qa
  question: 将 key `remoteuser0` 映射到 `serverb:/rhome/remoteuser0` 的子 map 行是什么？
  answer: '`remoteuser0  -fstype=nfs,rw  serverb:/rhome/remoteuser0`'
  extra: 这是具体 key 形式。
  source:
