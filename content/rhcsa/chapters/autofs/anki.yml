  - priority::P0
- id: RHCSA-NFS-QA-009
  type: qa
  question: indirect map 的父挂载点为 `/shares`，key 为 `docs`，最终本地路径是什么？
  answer: '`/shares/docs`'
  extra: indirect key 是父目录下的相对目录名。
  source:
  - auto.master(5)
  - autofs(5)
  - RH134-RHEL9
  tags:
  - exam::rhcsa
  - chapter::autofs
  - topic::path-model
