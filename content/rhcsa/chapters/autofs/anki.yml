- id: RHCSA-27-O01-QA-002
  type: qa
  question: 将 `/rhome` 关联到 `/etc/auto.rhome`，timeout 为 60 秒的 master entry 是什么？
  answer: '`/rhome  /etc/auto.rhome  --timeout=60`'
  extra: 可放入 `/etc/auto.master.d/rhome.autofs`。
  source:
