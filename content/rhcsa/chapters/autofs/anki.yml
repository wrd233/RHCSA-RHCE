- id: RHCSA-27-W01-QA-003
  type: qa
  question: 查询 master map、子 map 和 daemon 语义的主要帮助入口是什么？
  answer: '`man 5 auto.master`、`man 5 autofs`、`man 8 automount`、`man 8 autofs`。'
  extra: 分别覆盖入口、map 格式、daemon 参数和服务控制。
