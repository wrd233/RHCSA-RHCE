- id: RHCSA-27-O01-QA-005
  type: qa
  question: 配置写入后，精确触发 `/rhome/remoteuser0` 可使用什么命令？
  answer: '`stat /rhome/remoteuser0`'
  extra: 也可使用 `ls -ld` 或进入该精确路径。
  source:
  - RH134-RHEL9
  - RHEL9-Managing-File-Systems-Ch19
