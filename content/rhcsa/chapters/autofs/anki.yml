  type: qa
  question: '`systemctl reload autofs` 与 `restart autofs` 的影响区别是什么？'
  answer: reload 重新比较并读取配置，尽量保留运行状态；restart 停止并重新启动服务，影响更强。
  extra: 优先用能完成目标的较小操作。
