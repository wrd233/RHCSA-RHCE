chapter_id: RHCSA-SHELL
deck: RedHat::RHCSA-RHEL9
note_types: [RedHat-QA, RedHat-Cloze]
notes:
  - id: RHCSA-SHELL-K01-QA-001
    type: qa
    question: 单引号与双引号对变量展开的区别是什么？
    answer: 单引号保留字面文本；双引号允许变量和命令替换。
    extra: 双引号同时抑制分词和文件名展开。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::comparison, priority::P0]
  - id: RHCSA-SHELL-K01-QA-002
    type: qa
    question: 为什么路径变量通常写成 `"$path"`？
    answer: 防止空格分词和通配字符再次展开，保持一个参数。
    extra: 未引用变量可能改变参数数量。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::parameter, priority::P0]
  - id: RHCSA-SHELL-K01-QA-003
    type: qa
    question: 捕获 `date +%F` 输出到变量 `today` 的推荐写法是什么？
    answer: '`today=$(date +%F)`'
    extra: '`$(...)` 比反引号更易嵌套和阅读。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-K01-QA-004
    type: qa
    question: '`$?` 保存什么？什么时候读取才有意义？'
    answer: 上一条前台命令的退出状态；必须在其他命令覆盖它之前读取。
    extra: 0 通常只表示该命令按自身定义成功。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::output, priority::P0]
  - id: RHCSA-SHELL-K01-QA-005
    type: qa
    question: '`cmd1 && cmd2` 与 `cmd1 || cmd2` 的执行条件是什么？'
    answer: '`&&` 在前者成功时继续；`||` 在前者失败时继续。'
    extra: 分号则无条件继续。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::comparison, priority::P0]
  - id: RHCSA-SHELL-O01-QA-001
    type: qa
    question: stdout、stderr 对应的文件描述符是什么？
    answer: stdout 是 1，stderr 是 2。
    extra: stdin 是 0。
    source: [RHCSA-Course-05]
    tags: [exam::rhcsa, chapter::shell-help, card::concept, priority::P0]
  - id: RHCSA-SHELL-O01-QA-002
    type: qa
    question: 覆盖 stdout 与追加 stdout 分别使用什么？
    answer: '`>` 覆盖，`>>` 追加。'
    extra: '`>` 会在命令读取输入前截断目标文件。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::parameter, priority::P0]
  - id: RHCSA-SHELL-O01-QA-003
    type: qa
    question: 把 stderr 单独覆盖写入 `/tmp/errors` 的语法是什么？
    answer: '`2> /tmp/errors`'
    extra: 追加错误使用 `2>>`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O01-QA-004
    type: qa
    question: 把 stdout 与 stderr 都写入同一文件的典型顺序是什么？
    answer: '`command >file 2>&1`'
    extra: 先改变 stdout，再让 stderr 复制该目标。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O01-QA-005
    type: qa
    question: 为什么 `command 2>&1 >file` 通常不会把两个通道都写入文件？
    answer: stderr 先复制了当时的 stdout（终端），之后只有 stdout 改到文件。
    extra: 重定向从左到右处理。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::diagnosis, priority::P0]
  - id: RHCSA-SHELL-O01-QA-006
    type: qa
    question: 管道 `a | b` 默认传递 `a` 的哪个通道？
    answer: stdout。
    extra: stderr 默认仍指向原目标。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::concept, priority::P0]
  - id: RHCSA-SHELL-O01-QA-007
    type: qa
    question: 在管道中同时保存数据并继续传给下一命令，使用什么工具？
    answer: '`tee`；追加写入使用 `tee -a`。'
    extra: 它从 stdin 读取并复制到文件和 stdout。
    source: [RHCSA-Course-05]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O01-QA-008
    type: qa
    question: Bash 中怎样查看管道各环节的退出状态？
    answer: '`PIPESTATUS` 数组。'
    extra: 默认 `$?` 只反映最后一个命令；脚本可考虑 `pipefail`。
    source: [Bash-Manual]
    tags: [exam::rhcsa, chapter::shell-help, card::output, coverage::extra]
  - id: RHCSA-SHELL-O02-QA-001
    type: qa
    question: 判断名称是 alias、内建、函数还是外部命令，首选什么？
    answer: '`type <NAME>`；查看全部入口可用 `type -a <NAME>`。'
    extra: '`which` 不能完整解释 Shell 语义。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O02-QA-002
    type: qa
    question: 查看 Bash 内建 `test` 的帮助，使用什么命令？
    answer: '`help test`'
    extra: 外部命令通常使用 `--help` 和 `man`。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P1]
  - id: RHCSA-SHELL-O02-QA-003
    type: qa
    question: '`man 5 crontab` 中的 5 表示什么？'
    answer: 手册的文件格式与约定章节。
    extra: '`man crontab` 可能默认打开命令章节。'
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::parameter, priority::P1]
  - id: RHCSA-SHELL-O02-QA-004
    type: qa
    question: 不知道命令名，只知道功能描述时使用什么本地入口？
    answer: '`apropos <KEYWORDS>` 或 `man -k <KEYWORDS>`。'
    extra: 搜索依赖 man 数据库索引。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O02-QA-005
    type: qa
    question: 反查哪个包提供 `semanage` 的命令是什么？
    answer: '`dnf provides ''*/semanage''`'
    extra: 先排除拼写和 PATH 问题。
    source: [RH124, RH134]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0]
  - id: RHCSA-SHELL-O02-QA-006
    type: qa
    question: '`dnf provides` 查询成功后，还不能证明什么？'
    answer: 不能证明包已安装或命令现在可执行。
    extra: 安装后用 `type` 或 `rpm -qf` 验证。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::verification, priority::P1]
  - id: RHCSA-SHELL-D01-QA-001
    type: qa
    question: '`grep` 没有输出时，为什么不能立即断言“无匹配”？'
    answer: 输入可能不可读或上游失败；应查看退出状态与 stderr。
    extra: 空输出只是现象。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::diagnosis, priority::P0]
  - id: RHCSA-SHELL-D01-QA-002
    type: qa
    question: 为什么 `sort file > file` 可能清空文件？
    answer: Shell 在 `sort` 读取前就截断重定向目标。
    extra: 写临时文件，验证后再替换。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::diagnosis, priority::P0]
  - id: RHCSA-SHELL-D01-QA-003
    type: qa
    question: 出现 `command not found` 时的调查顺序是什么？
    answer: 检查拼写 → `type -a`/PATH → 绝对路径 → `dnf provides`。
    extra: 不要先猜包安装。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::process, priority::P0]
  - id: RHCSA-SHELL-C01-QA-001
    type: qa
    question: 创建 bzip2 压缩 tar 归档的选项组合是什么？
    answer: '`tar -cjf <ARCHIVE.tar.bz2> <PATHS...>`'
    extra: '`-c` 创建，`-j` bzip2，`-f` 指定文件。'
    source: [RH124, RHCSA9-Mock]
    tags: [exam::rhcsa, chapter::shell-help, card::command, priority::P0, task::archive]
  - id: RHCSA-SHELL-C01-QA-002
    type: qa
    question: 让 tar 从路径列表文件读取成员，使用哪个参数？
    answer: '`-T <LIST_FILE>`'
    extra: 路径中的换行等边界需与列表生成方式一致。
    source: [tar-manual]
    tags: [exam::rhcsa, chapter::shell-help, card::parameter, priority::P1, task::archive]
  - id: RHCSA-SHELL-C01-QA-003
    type: qa
    question: 查看 bzip2 tar 归档成员但不解包，命令骨架是什么？
    answer: '`tar -tjf <ARCHIVE.tar.bz2>`'
    extra: 用于验证成员内容。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::verification, priority::P0, task::archive]
  - id: RHCSA-SHELL-K01-CLOZE-001
    type: cloze
    text: 命令替换使用 `{{c1::$(command)}}`；上一命令退出状态使用 `{{c2::$?}}`。
    extra: 两者分别处理输出文本和状态码。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::cloze, priority::P0]
  - id: RHCSA-SHELL-O01-CLOZE-001
    type: cloze
    text: 同时覆盖保存 stdout 与 stderr：`command {{c1::>file}} {{c2::2>&1}}`。
    extra: 重定向按从左到右处理。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::cloze, priority::P0]
  - id: RHCSA-SHELL-O02-CLOZE-001
    type: cloze
    text: 已知命令查完整手册用 `{{c1::man}}`；按功能描述搜索命令用 `{{c2::apropos}}`。
    extra: 命令缺失时再用 dnf provides 反查包。
    source: [RH124]
    tags: [exam::rhcsa, chapter::shell-help, card::cloze, priority::P0]
