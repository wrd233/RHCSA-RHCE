- id: RHCSA-08-K01-QA-001
  type: qa
  question: 传统权限检查使用用户名字符串还是进程凭据？
  answer: 使用访问进程的有效 UID、有效 GID 和附加组等凭据。
  extra: 名称只是 UID/GID 的可读映射。
