- id: RHCSA-08-K01-QA-003
  type: qa
  question: 文件为 `-r--rw---- alice project data`，alice 也属于 project。alice 能写吗？
  answer: 不能。alice 命中 owner，只使用 `r--`。
  extra: group 的 `rw-` 不会与 owner 相加。
