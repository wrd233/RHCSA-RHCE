- id: RHCSA-USERS-K02-QA-002
  type: qa
  question: 删除一个文件主要取决于文件自身写权限还是父目录权限？
  answer: 主要取决于父目录的写与执行权限。
  extra: sticky 位可能继续限制删除者身份；文件自身 `w` 主要控制内容修改。
