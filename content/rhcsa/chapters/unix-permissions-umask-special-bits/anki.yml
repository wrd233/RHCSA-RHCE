- id: RHCSA-USERS-O01-QA-001
  type: qa
  question: setgid 协作目录中，新文件 group 正确但组员仍不能写，优先检查什么？
  answer: 检查创建进程的 `umask`；若目录存在 default ACL，再转入 ACL 继承与 mask。
  extra: setgid 只负责 group 继承。
