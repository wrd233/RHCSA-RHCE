- id: RHCSA-USERS-K02-QA-005
  type: qa
  question: 只在当前 shell 执行 `umask 0027` 能否证明持久策略已配置？
  answer: 不能。它只改变当前 shell 及其后代。
  extra: 持久配置后应建立新登录会话，再创建文件和目录样本验证。
