- id: RHCSA-USERS-O01-QA-002
  type: qa
  question: 怎样用 bob 的实际身份测试其能否向项目文件追加内容？
  answer: '`sudo -u bob sh -c ''echo test >> /srv/project/file''`'
  extra: 实际写入比只看 mode 更能暴露身份、路径和文件权限问题。
