- id: RHCSA-USERS-K02-QA-006
  type: qa
  question: 目录 setgid 位解决什么问题？
  answer: 让目录中新建对象继承该目录的 group。
  extra: 它不自动保证 group write，也不回溯修改已有对象。
  source:
