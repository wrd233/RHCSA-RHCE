- id: RHCSA-08-K01-QA-002
  type: qa
  question: 判断某用户对文件的传统权限时，owner/group/other 的选择顺序是什么？
  answer: 有效 UID 命中 owner 就用 owner；否则有效 GID或附加组命中文件 group 就用 group；否则用 other。
  extra: 命中某一类后不会因权限不足而回退。
