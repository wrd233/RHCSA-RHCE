- id: RHCSA-USERS-K02-QA-007
  type: qa
  question: 把 `/srv/project` 配为 owner/group 可完全访问、other 无权限，且新对象继承 group，应设置什么模式？
  answer: '`chmod 2770 /srv/project`'
  extra: 前导 `2` 是 setgid；还需设置正确 group，并验证创建者 umask。
  source:
