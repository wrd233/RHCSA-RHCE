- id: RHCSA-08-K02-QA-006
  type: qa
  question: 读取 `/a/b/c.txt` 时，传统权限至少要满足怎样的路径条件？
  answer: 对 `/`、`/a`、`/a/b` 均有 search (`x`)，并对 `c.txt` 有读取权限。
  extra: 任一级父目录缺 `x` 都会阻断。
