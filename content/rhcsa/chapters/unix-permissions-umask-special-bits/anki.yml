- id: RHCSA-USERS-K02-QA-008
  type: qa
  question: 目录 sticky 位的核心效果是什么？
  answer: 在公共可写目录中限制删除/改名，通常只允许文件 owner、目录 owner 或特权主体操作。
  extra: 典型公共临时目录模式为 `1777`；sticky 不控制文件内容读取。
  source:
