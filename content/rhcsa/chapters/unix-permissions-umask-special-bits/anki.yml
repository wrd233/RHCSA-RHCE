- id: RHCSA-USERS-D01-QA-001
  type: qa
  question: '`Permission denied` 的推荐分层调查顺序是什么？'
  answer: 目标进程 `id` → 父路径 `namei -l` → 对象 `stat` → 判断选中的 owner/group/other → 最小修复 → 实际用户重试；DAC 正确后再看 ACL 和 SELinux。
  extra: 不要从 `chmod 777` 开始。
  source:
  - RH124 Ch.7
  - repository users-permissions@39e873d
  tags:
  - exam::rhcsa
  - chapter::unix-permissions-umask-special-bits
  - topic::permission-denied
  - card::process
  - priority::P1
  model: RedHat-QA
  priority: P1
  disabled: false
  semantic_type: process
- id: RHCSA-USERS-C01-QA-001
  type: qa
  question: 不用 ACL 建立团队协作目录时，关键配置与验证骨架是什么？
  answer: 目录目标 group → `2770` setgid → 创建者使用允许组写的 umask → 用户 A 创建 → 用户 B 修改 → 非成员负向测试。
  extra: 每一层分别解决 group 继承、创建 mode 和真实功能。
