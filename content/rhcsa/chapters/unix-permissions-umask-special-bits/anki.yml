- id: RHCSA-USERS-K02-QA-003
  type: qa
  question: 用户既是文件 owner 又属于文件 group 时，权限会相加吗？
  answer: 不会。匹配 owner 后只使用 owner 权限类，不再借用 group 或 other。
  extra: owner、group、other 三类只选择一类。
  source:
