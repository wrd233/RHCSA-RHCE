  type: qa
  question: '`id alice` 与在 alice 当前登录 shell 中执行 `id` 分别证明什么？'
  answer: 前者查询账号应有身份；后者显示当前进程实际携带的身份。
  extra: 组成员刚变更时，两者可能暂时不同。
