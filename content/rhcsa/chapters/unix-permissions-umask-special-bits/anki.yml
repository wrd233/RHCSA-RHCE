- id: RHCSA-USERS-K02-QA-004
  type: qa
  question: '`umask` 为 `0027`，程序按常见模式创建普通文件和目录时，结果是什么？'
  answer: 普通文件通常为 `0640`，目录通常为 `0750`。
  extra: 计算是请求模式按位清除 mask；程序可以主动请求更窄权限。
  source:
