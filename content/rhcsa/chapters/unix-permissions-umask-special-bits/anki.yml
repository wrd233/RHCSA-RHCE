- id: RHCSA-USERS-K02-QA-001
  type: qa
  question: 目录的 `r`、`w`、`x` 分别控制什么？
  answer: '`r` 枚举目录项名称；`w` 修改目录项（创建、删除、改名）；`x` 搜索/穿越并访问已知名称。'
  extra: 目录修改通常需要 `w+x`；这与普通文件的 `rwx` 语义不同。
  source:
  - RH124 Ch.7
  - repository users-permissions@39e873d
