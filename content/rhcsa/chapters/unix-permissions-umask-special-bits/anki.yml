  type: qa
  question: 文件是只读 `0444`，用户仍能删除它，最合理的传统权限解释是什么？
  answer: 用户对父目录具有 `w+x`，删除的是目录项。
  extra: 文件自身 `w` 不是删除的主要控制点。
