  type: qa
  question: 为什么不能用 root 成功读取文件来证明普通用户权限正确？
  answer: 特权进程可以绕过许多普通 DAC 检查，root 成功不是普通用户功能证据。
  extra: 必须以题目指定用户重试原始动作。
