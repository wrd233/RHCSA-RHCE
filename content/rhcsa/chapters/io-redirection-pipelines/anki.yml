- id: RHCSA-02-O03-QA-004
  type: qa
  question: 管道终端有数据但 `evidence.log` 缺失，下一条最有区分度的证据是什么？
  answer: 立即检查 tee 对应的 `PIPESTATUS` 位置，并核对目标路径、权限和空间。
  extra: 不要因 tee 是辅助命令而忽略其独立失败。
