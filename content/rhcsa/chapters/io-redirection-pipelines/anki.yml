- id: RHCSA-02-O04-QA-007
  type: qa
  question: 结果文件存在且 `$?` 为 0，但怀疑中间阶段失败，下一步应怎样取证？
  answer: 在可重现条件下重新运行，结束后立即复制 `PIPESTATUS`；需要可靠汇总时在受控范围启用 pipefail。
  extra: 已有文件无法反推出过去未保存的逐阶段退出值。
