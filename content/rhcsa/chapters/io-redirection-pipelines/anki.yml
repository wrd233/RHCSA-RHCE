- id: RHCSA-02-O03-QA-005
  type: qa
  question: 为什么“文件中有 payload”不能证明整条管道成功？
  answer: 它只证明这些可见字节已经到达 `tee` 所在位置，并至少被写入该文件；不能证明 `tee` 已完整处理全部输入，也不能证明上游、中间或下游阶段成功。
  extra: 还应立即保存各阶段状态，并按任务需要核对文件是否完整。
