  type: qa
  question: 为什么目标文件打开失败时，命令主体可能根本没有运行？
  answer: 因为 Shell 通常在启动命令前先处理重定向；若无法建立目标 FD，执行不会进入正常命令主体。
  extra: 排错时应区分 Shell 的重定向错误与程序自身错误。
