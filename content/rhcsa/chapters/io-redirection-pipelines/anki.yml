- id: RHCSA-02-O03-QA-003
  type: qa
  question: '`A | tee before.log | B | tee after.log` 中两个文件的取证位置有何不同？'
  answer: before.log 记录 B 前的数据；after.log 记录 B 的 stdout。
  extra: 比较内容可判断数据变化，但仍要检查阶段状态。
