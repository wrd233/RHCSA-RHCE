- id: RHCSA-02-O03-QA-001
  type: qa
  question: '`tee -a evidence.log` 中 `-a` 的作用是什么？'
  answer: 以追加方式写入文件，而不是覆盖既有内容。
  extra: 它不改变 tee 继续向 stdout 写数据的行为。
