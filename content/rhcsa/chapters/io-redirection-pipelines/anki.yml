- id: RHCSA-02-K03-QA-005
  type: qa
  question: 普通 `|` 与 Bash `|&` 的通道差异是什么？
  answer: '`|` 只连接 stdout；`|&` 在 Bash 中把 stdout 和 stderr 一起连接到下一阶段，等价于 `2>&1 |` 的简写。'
  extra: 首选显式写法训练 FD 模型。
