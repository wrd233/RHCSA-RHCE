  type: qa
  question: 交互式 Bash 中，stdin、stdout、stderr 对应哪些文件描述符？
  answer: '`stdin`、`stdout`、`stderr` 分别对应文件描述符 `0`、`1`、`2`。'
  extra: 描述符编号是进程访问端点的入口，不等同于键盘或屏幕本身。
