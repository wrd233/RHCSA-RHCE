- id: RHCSA-02-O04-QA-003
  type: qa
  question: 怎样在不先运行其他验证命令的情况下，同时保存管道 `$?` 和 `PIPESTATUS`？
  answer: '```bash

    pipeline_rc=$? stage_rc=("${PIPESTATUS[@]}")

    ```'
  extra: 两者在同一个赋值命令展开，随后再用 printf 展示。
