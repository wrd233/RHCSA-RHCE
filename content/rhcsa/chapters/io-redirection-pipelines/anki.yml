- id: RHCSA-02-O04-QA-002
  type: qa
  question: 三阶段管道结束后，`${PIPESTATUS[@]}` 的数组位置如何对应？
  answer: 按管道从左到右对应阶段 1、阶段 2、阶段 3。
  extra: 数组属于 Bash，必须在后续简单命令更新前复制。
