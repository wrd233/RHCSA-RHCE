- id: RHCSA-SHELL-D01-QA-002
  type: qa
  question: 执行 `cat data.txt > data.txt` 后文件变空，最直接的机制是什么？
  answer: Shell 在 `cat` 读取前先以覆盖方式打开并截断同一个目标文件，所以命令随后读到的已是空文件。
  extra: 应写入不同路径，验证后再进行受控替换，不能把普通重定向当作安全原地编辑。
