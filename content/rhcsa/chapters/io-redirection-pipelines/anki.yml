- id: RHCSA-02-K01-QA-001
  type: qa
  question: 为什么不能把 stdout 简单定义为“屏幕”？
  answer: stdout 是 FD 1 对应的数据通道；它可以连接终端、文件、管道或其他端点。
  extra: 屏幕只是交互式 Shell 中常见的继承端点。
