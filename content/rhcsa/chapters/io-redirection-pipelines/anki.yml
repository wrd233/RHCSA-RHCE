- id: RHCSA-SHELL-O01-QA-008
  type: qa
  question: Bash 中 `$?` 与 `${PIPESTATUS[@]}` 对一条管道分别回答什么？
  answer: '`$?` 是整条管道的单一汇总状态；`${PIPESTATUS[@]}` 按从左到右保存各阶段状态。'
  extra: 状态数组会被后续简单命令更新，必须立即复制。
