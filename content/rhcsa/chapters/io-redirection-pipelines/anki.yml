- id: RHCSA-SHELL-O01-QA-004
  type: qa
  question: 把 stdout 和 stderr 都覆盖写入 `all.log`，优先展示文件描述符关系的写法是什么？
  answer: '```bash

    command > all.log 2>&1

    ```'
