- id: RHCSA-02-K01-QA-002
  type: qa
  question: stderr 有文字是否必然说明命令退出状态非零？
  answer: 不必然。stderr 是数据通道，退出状态是数值结果，程序可以写 stderr 后仍返回 0。
  extra: 反过来，命令也可以没有错误文字却返回非零。
