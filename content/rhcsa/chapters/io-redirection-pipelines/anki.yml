- id: RHCSA-SHELL-O01-QA-006
  type: qa
  question: 普通 `A | B` 默认连接哪两个通道？
  answer: 把 `A` 的 stdout（FD 1）连接到 `B` 的 stdin（FD 0）。
  extra: stderr 默认旁路，不会自动进入管道。
