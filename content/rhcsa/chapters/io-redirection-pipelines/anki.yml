- id: RHCSA-SHELL-O01-QA-005
  type: qa
  question: '`command >all.log 2>&1` 与 `command 2>&1 >all.log` 为什么不同？'
  answer: '重定向从左到右应用。


    `command >all.log 2>&1`：


    1. `>all.log`：FD 1 → `all.log`；FD 2 仍指向原端点。

    2. `2>&1`：FD 2 复制 FD 1 当前端点，因此 FD 1、FD 2 都指向 `all.log`。


    `command 2>&1 >all.log`：


    1. `2>&1`：FD 2 复制原 FD 1（交互式场景通常是终端）。

    2. `>all.log`：随后只把 FD 1 改向 `all.log`，FD 2 仍保留原终端端点。'
  extra: FD 复制捕获的是执行到该位置时的端点；之后改变 FD 1，不会让已经复制的 FD 2 自动追随。
  source:
  - RH124 Ch.5 pp.112-118
  - bash(1) Redirections
