  type: qa
  question: 将 stdout 写入文件时，`>` 与 `>>` 的区别是什么？
  answer: '`>` 以覆盖方式打开目标；`>>` 在文件末尾追加。目标不存在时两者都可尝试创建。'
  extra: 覆盖打开可能在目标命令真正运行前截断已有文件。
