- id: RHCSA-02-K01-QA-003
  type: qa
  question: '`cat input.txt` 与 `cat < input.txt` 的输入对象有何不同？'
  answer: 前者由 `cat` 根据参数打开文件；后者由 Shell 先把 FD 0 指向文件，`cat` 从 stdin 读取。
  extra: 两者可得到相同内容，但对象关系和错误来源不同。
