- id: RHCSA-02-O03-QA-002
  type: qa
  question: '`A | tee before.log | B` 中，before.log 能证明什么？'
  answer: 证明数据到达 tee 所在位置，即 B 处理前的流被记录。
  extra: 不能单独证明 A、tee、B 都成功，也不能证明 B 的输出正确。
