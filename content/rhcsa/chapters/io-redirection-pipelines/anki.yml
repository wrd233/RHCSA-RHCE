  type: qa
  question: '`2>&1` 中的 `&1` 表示什么？'
  answer: 表示文件描述符 1，而不是名为 `1` 的文件。整个语法让 FD 2 复制 FD 1 当前端点。
  extra: 复制发生后，之后再改变 FD 1 不会自动追随。
