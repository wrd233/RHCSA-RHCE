[project]
name = "rhel9-exam-notes"
version = "1.0.0"
description = "RHEL 9 RHCSA/RHCE lecture and Anki build toolchain"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "bleach>=6.2,<7",
  "genanki>=0.13,<0.14",
  "jinja2>=3.1,<4",
  "jsonschema>=4,<5",
  "markdown>=3.8,<4",
  "pypdf>=6,<7",
  "pytest>=8,<9",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false
